; tail -f follows a log file live as new lines arrive (Ctrl+C stops). less lets you scroll and search large files without loading them all.","s":["view"],"hi":["view"],"a":"Reading a whole register, only the first page, only today's last entries, or standing next to it watching new entries being written."},{"t":"Sort, compare and identify","d":"sort orders lines (-n numbers, -r reverse, -k2 by column 2, -t, comma separator, -u unique). diff -u old new shows exactly what changed. file looks at the content to report the real type, so a PDF renamed to .txt is still reported as PDF. echo text > file writes; >> appends.","s":["cmp2"],"hi":["cmp2"],"ins":[["sort -t, -k3 -n marks.csv",[["Does","sorts a CSV by the 3rd column, numerically"],["Use","rank students by marks"]]],["diff -u v1.conf v2.conf",[["Does","lines starting - removed, + added"],["Use","what changed in a config file"]]],["file report.txt",[["Output","report.txt: PDF document, version 1.7"],["Use","do not trust extensions"]]],["echo \"x\" >> log.txt",[["Does","adds a line at the end"],["Danger","> instead of >> replaces the whole file"]]]]},{"t":"touch and ls variations","d":"touch file creates an empty file or refreshes the time stamp of an existing one. ls -l long listing, -a include hidden files, -h human sizes, -t newest first, -R recursive.","s":["touch"],"hi":["touch"]}],"analogy":{"intro":"Managing a school record room.","map":[["Instruction leaflet","man page"],["Building a new cupboard inside a new room","mkdir -p"],["Numbering stamp: file1 to file100","Brace expansion {1..100}"],["Photocopying a register","cp"],["Moving a register to another shelf or relabelling it","mv"],["Shredding (no recovery!)","rm"],["Removing only empty shelves","rmdir"],["Spotting the difference between two versions","diff"]]},"cmp":{"head":["Command","What it does"],"rows":[["man ls / ls --help / whatis ls","manual / quick help / one line"],["mkdir -p a/b/c","create nested folders"],["touch f{1..100}","create 100 files"],["cp -r src/ dst/","copy a folder"],["cp -i a b / cp -p a b","ask before overwrite / keep attributes"],["mv old new","rename or move"],["rm -i f / rm -r dir","delete with prompt / folder tree"],["rmdir dir","delete an empty folder"],["cat / head -n 5 / tail -n 5","whole / first / last lines"],["tail -f /var/log/syslog","follow a log live"],["sort -t, -k3 -n f.csv","sort CSV by column 3 numerically"],["diff -u a b","show changes"],["file *","real file types"],["ls -lhtR","long, human sizes, newest first, recursive"]]},"usecase":"<p><b>Data engineer:</b> creates a folder per day with mkdir -p /data/raw/2026/10/{01..31} and checks the newest arrivals with ls -lt | head.</p><p><b>System administrator:</b> runs tail -f /var/log/nginx/access.log while a user reproduces a problem, then diff -u to compare a broken config with the backup.</p><p><b>Lab coordinator:</b> generates test files for a practical exam with one brace-expansion command instead of 100 clicks.</p>","terms":[["man page","Built-in manual for a command."],["mkdir -p","Create a folder and any missing parents."],["touch","Create an empty file or update its time stamp."],["Brace expansion","{1..100} or {a,b,c} expanded into words by the shell."],["cp / mv / rm","Copy / move or rename / remove."],["rmdir","Remove an empty directory."],["cat / head / tail","Print all / start / end of a file."],["tail -f","Follow a file as it grows."],["sort","Sort lines."],["diff","Show differences between files."],["file","Detect a file's real type from its content."]],"myths":[["Deleted files go to a recycle bin","rm deletes immediately on the command line."],["touch is only for creating files","It also updates time stamps of existing files."],["The extension decides the file type","Linux looks at content; file shows the real type."]],"quiz":[{"q":"Create dbda/test and 100 files inside in one line:","o":["mkdir dbda/test; touch file1-100","mkdir -p dbda/test && touch dbda/test/file{1..100}","touch -r dbda/test/file100","mkdir -p dbda/test/file{1..100}"],"a":1,"why":"mkdir -p builds the path; brace expansion makes 100 names. (The last option makes 100 folders, not files.)"},{"q":"Which removes only an empty folder?","o":["rm -r","rmdir","rm -f","del"],"a":1,"why":"rmdir refuses to delete a folder with contents."},{"q":"Watch new lines being added to a log:","o":["cat -f","head -f","tail -f","less -n"],"a":2,"why":"tail -f follows the file."}]},{"part":1,"title":"Finding things: grep, find and locate","lead":"Search inside files with grep, search the directory tree with find, or ask a ready-made index with locate.","scene":[{"id":"zg","type":"zone","x":20,"y":25,"w":240,"h":435,"k":"plain","l":"grep: search INSIDE files"},{"id":"log","type":"box","x":35,"y":55,"w":210,"h":110,"k":"note","l":"app.log","s":"INFO start|ERROR disk full|INFO retry|error: timeout"},{"id":"gq","type":"box","x":35,"y":180,"w":210,"h":60,"k":"vm","l":"grep -i error app.log","s":"case-insensitive"},{"id":"gr","type":"box","x":35,"y":255,"w":210,"h":70,"k":"store","l":"2 matching lines","s":"ERROR disk full|error: timeout"},{"id":"gopt","type":"box","x":35,"y":340,"w":210,"h":110,"k":"note","l":"Useful options","s":"-n line numbers  -c count|-v invert   -w whole word|-r recursive  -l file names|-E regex: \"warn\\|err\""},{"id":"zf","type":"zone","x":280,"y":25,"w":240,"h":435,"k":"plain","l":"find: walk the tree NOW"},{"id":"fq","type":"box","x":295,"y":55,"w":210,"h":75,"k":"vm","l":"find /dbda -name \"*.csv\"","s":"checks every folder|live, always current"},{"id":"fd1","type":"box","x":295,"y":145,"w":100,"h":45,"k":"store","l":"/dbda","s":""},{"id":"fd2","type":"box","x":405,"y":145,"w":100,"h":45,"k":"store","l":"test/","s":""},{"id":"fd3","type":"box","x":295,"y":205,"w":100,"h":45,"k":"store","l":"reports/","s":""},{"id":"fd4","type":"box","x":405,"y":205,"w":100,"h":45,"k":"ghost","l":"a.csv","s":""},{"id":"fopt","type":"box","x":295,"y":265,"w":210,"h":185,"k":"note","l":"Tests and actions","s":"-type f / -type d|-size +100M   -mtime -7|-user asha   -perm 777|-empty   -iname \"*.CSV\"|-exec rm {} \\;|-delete (careful!)"},{"id":"zl","type":"zone","x":540,"y":25,"w":240,"h":435,"k":"plain","l":"locate: ask the index"},{"id":"lq","type":"box","x":555,"y":55,"w":210,"h":60,"k":"vm","l":"locate bashrc","s":"instant answer"},{"id":"db","type":"box","x":555,"y":135,"w":210,"h":80,"k":"db","l":"📇 file-name database","s":"built by updatedb|(daily, via cron/timer)"},{"id":"lres","type":"box","x":555,"y":235,"w":210,"h":70,"k":"store","l":"/etc/bash.bashrc","s":"/home/asha/.bashrc"},{"id":"stale","type":"box","x":555,"y":320,"w":210,"h":130,"k":"sec","l":"Catch","s":"files created after the|last updatedb are|missing; deleted files|may still be listed.|Run: sudo updatedb"}],"steps":[{"t":"Three tools, three questions","d":"grep answers \"which lines contain this text?\". find answers \"which files match these conditions?\". locate answers \"where is a file with this name?\" using a pre-built index. Choosing the right one saves minutes on big servers.","s":["zg","zf","zl"],"a":"grep is reading every page of a book for a word; find is walking every shelf of the library; locate is checking the library catalogue card."},{"t":"grep searches inside files","d":"grep -i error app.log prints every line containing \"error\" in any case. Add -n for line numbers, -c to count, -v to show lines that do NOT match, -r to search a whole folder, -l to list only file names.","s":["log","gq","gr"],"hi":["gq"],"p":[{"v":["log","gq","gr"],"c":"data","l":"2 lines","d":0,"x":false}],"dp":"grep uses regular expressions: ^ start of line, $ end of line, . any character, [0-9] a digit. grep -E \"warn|error\" matches either word. Put patterns in quotes so the shell does not interpret | or *."},{"t":"grep options in practice","d":"The options combine: grep -rin \"password\" /etc 2>/dev/null searches every file under /etc, ignoring case, with line numbers, hiding permission errors.","s":["gopt"],"hi":["gopt"],"ins":[["grep -c ERROR app.log",[["Output","1"],["Meaning","number of matching lines"]]],["grep -v INFO app.log",[["Output","ERROR disk full / error: timeout"],["Meaning","everything except INFO lines"]]],["grep -rl \"8080\" /etc",[["Output","file names only"],["Meaning","which config files mention port 8080"]]],["ps aux | grep nginx",[["Meaning","grep filters output of another command"]]]]},{"t":"find walks the tree, live","d":"find /dbda -name \"*.csv\" visits every folder under /dbda right now and prints matching paths. Because it reads the disk, the answer is always current, but on a huge tree it takes time.","s":["fq","fd1","fd2","fd3","fd4"],"hi":["fq"],"p":[{"v":["fq","fd1","fd2","fd3","fd4"],"c":"req","l":"visit each","d":0,"x":false}],"set":{"fd4":{"k":"store","s":"match"}}},{"t":"find by size, age, owner, permission, then act","d":"Tests combine with AND by default: find /var/log -type f -size +100M -mtime +30 finds big, old log files. -exec runs a command on each result; {} is replaced by the file name. -delete removes matches: always run without it first to see what would go.","s":["fopt"],"hi":["fopt"],"dp":"-exec cmd {} \\; runs the command once per file; -exec cmd {} + passes many files at once (much faster). find / -perm -4000 -type f lists SUID programs, a standard security audit. 2>/dev/null hides \"Permission denied\" noise when searching as a normal user."},{"t":"locate asks a database","d":"locate bashrc answers instantly because it only looks up a list of all file names, built by updatedb, usually once a day. Install it with sudo apt install plocate.","s":["lq","db","lres"],"hi":["db"],"p":[{"v":["lq","db","lres"],"c":"res","l":"instant","d":0,"x":false}]},{"t":"The catch: the index can be stale","d":"A file created ten minutes ago will not appear until updatedb runs again; a deleted file may still be listed. Run sudo updatedb when you need a fresh index, or use find when you need the truth right now.","s":["stale"],"hi":["stale"]}],"analogy":{"intro":"Looking for information in a library.","map":[["Reading every page for a word","grep"],["Walking every shelf checking books by size and date","find"],["Library catalogue cards","locate database"],["Catalogue updated every night","updatedb"],["New book not yet in the catalogue","Stale locate result"],["\"Remove every damaged book you find\"","find … -exec / -delete"]]},"cmp":{"head":["Command","What it does"],"rows":[["grep -i \"error\" app.log","lines with error, any case"],["grep -n / -c / -v / -w","line numbers / count / invert / whole word"],["grep -rl \"8080\" /etc","files that mention 8080"],["grep -E \"warn|err\" app.log","either pattern"],["find /dbda -name \"*.csv\"","files by name"],["find . -type d -empty","empty folders"],["find /var -size +100M","files over 100 MB"],["find /dbda -mtime -1","changed in the last 24 h"],["find . -name \"*.tmp\" -exec rm {} +","delete matches"],["locate bashrc","instant name search"],["sudo updatedb","refresh locate index"],["which python3 / type ls","where a command lives"]]},"usecase":"<p><b>Support engineer:</b> grep -c \"ERROR\" app.log*, then grep -B2 -A2 on the busiest file, to find what happened around each failure.</p><p><b>System administrator:</b> disk full at night: find / -xdev -size +1G 2>/dev/null finds the culprit in minutes; a cron job runs find /tmp -mtime +7 -delete.</p><p><b>Security audit:</b> find / -perm -4000 lists SUID programs and find /home -perm -o+w finds world-writable files.</p>","terms":[["grep","Prints lines matching a pattern."],["Regular expression","Pattern language: ^ $ . * [0-9]."],["find","Searches the directory tree by conditions."],["-exec","find action that runs a command on each result."],["-mtime","Modification time in days."],["locate / plocate","Searches a database of file names."],["updatedb","Rebuilds the locate database."],["2>/dev/null","Discard error messages."]],"myths":[["locate is always correct","It is only as fresh as the last updatedb."],["find searches file contents","find matches names and properties; grep searches contents."],["grep only searches files","It filters the output of any command through a pipe."]],"quiz":[{"q":"Count lines containing ERROR in app.log:","o":["grep -n ERROR app.log","grep -c ERROR app.log","find -c ERROR","wc ERROR app.log"],"a":1,"why":"-c counts matching lines."},{"q":"You created a file 2 minutes ago but locate cannot see it. Why?","o":["Permissions","The database has not been updated","locate only finds folders","Wrong shell"],"a":1,"why":"Run sudo updatedb."},{"q":"Files over 100 MB under /var:","o":["grep -size 100M /var","find /var -size +100M","locate -s 100M","ls -S /var"],"a":1,"why":"find with -size."}]},{"part":1,"title":"Compression and archives: gzip, zip and tar","lead":"Bundle many files into one, squeeze them smaller, and unpack them again: the daily work of backups, downloads and data transfer.","scene":[{"id":"f1","type":"box","x":20,"y":40,"w":120,"h":45,"k":"store","l":"marks.csv","s":"40 KB"},{"id":"f2","type":"box","x":20,"y":95,"w":120,"h":45,"k":"store","l":"attend.csv","s":"30 KB"},{"id":"f3","type":"box","x":20,"y":150,"w":120,"h":45,"k":"store","l":"notes/","s":"20 KB"},{"id":"tar","type":"box","x":180,"y":80,"w":150,"h":80,"k":"vm","l":"tar -cf","s":"bundle only|no compression"},{"id":"tarf","type":"box","x":370,"y":80,"w":150,"h":80,"k":"note","l":"backup.tar","s":"one file, 90 KB"},{"id":"gz","type":"box","x":560,"y":80,"w":220,"h":80,"k":"my","l":"gzip backup.tar","s":"squeeze → backup.tar.gz|about 18 KB for text"},{"id":"one","type":"box","x":180,"y":200,"w":600,"h":70,"k":"net","l":"One step: tar -czf backup.tar.gz marks.csv attend.csv notes/","s":"c create · z gzip · f file name (always last before the name) · v verbose"},{"id":"ext","type":"box","x":20,"y":290,"w":370,"h":90,"k":"store","l":"Unpack","s":"tar -tzf backup.tar.gz   (list only)|tar -xzf backup.tar.gz -C /restore"},{"id":"gzc","type":"box","x":410,"y":290,"w":370,"h":90,"k":"note","l":"gzip on its own","s":"gzip big.log → big.log.gz (original gone)|gunzip big.log.gz   zcat   gzip -k (keep)"},{"id":"zip","type":"box","x":20,"y":395,"w":370,"h":65,"k":"vm","l":"zip -r notes.zip notes/","s":"unzip -l (list)   unzip notes.zip -d out/"},{"id":"cmpz","type":"box","x":410,"y":395,"w":370,"h":65,"k":"sec","l":"Which one?","s":"tar.gz: Linux backups · zip: share with Windows"}],"steps":[{"t":"The problem: many files, slow transfer","d":"A project folder has hundreds of files. Copying them one by one over the network is slow, and text data such as CSV and logs is very compressible. Two separate jobs are needed: bundling (archiving) and squeezing (compression).","s":["f1","f2","f3"],"a":"Moving house: first pack items into one box (archive), then vacuum-seal it to take less space (compress)."},{"t":"tar bundles files into one","d":"tar (tape archive) joins files and folders into one .tar file, keeping folder structure, permissions and owners. tar -cf backup.tar marks.csv attend.csv notes/ creates it. A .tar file is not smaller: it is just one box.","s":["tar","tarf"],"hi":["tar"],"p":[{"v":["f1","tar","tarf"],"c":"data","l":"","d":0,"x":false},{"v":["f2","tar","tarf"],"c":"data","l":"","d":0.4,"x":false},{"v":["f3","tar","tarf"],"c":"data","l":"bundle","d":0.8,"x":false}]},{"t":"gzip squeezes one file","d":"gzip backup.tar replaces it with backup.tar.gz, often 70 to 90 per cent smaller for text. gzip works on single files only, which is why it is paired with tar. gunzip (or gzip -d) restores it.","s":["gz"],"hi":["gz"],"p":[{"v":["tarf","gz"],"c":"req","l":"gzip","d":0,"x":false}],"dp":"Compressors trade speed for size: gzip is fast and everywhere; bzip2 (.bz2, tar -j) is smaller but slower; xz (.xz, tar -J) is smallest and slowest; zstd (.zst) is fast and small and increasingly common. Already-compressed files (JPG, MP4, ZIP) barely shrink."},{"t":"Both in one command","d":"In practice you do both at once: tar -czf backup.tar.gz marks.csv attend.csv notes/. c = create, z = gzip, f = file name, v = list files as they are added. f must come last because the next word is the archive name.","s":["one"],"hi":["one"],"ins":[["tar -czvf b.tar.gz dir",[["c","create"],["z","compress with gzip"],["v","show each file"],["f","next word is the archive name"]]],["tar -tzf b.tar.gz",[["t","list contents without extracting"]]],["tar -xzf b.tar.gz -C /restore",[["x","extract"],["-C","into this folder"]]],["tar -cjf / -cJf",[["j","bzip2 (.tar.bz2)"],["J","xz (.tar.xz)"]]]]},{"t":"Unpack and inspect","d":"Always list an unknown archive first with tar -tzf, so you know where its files will land. Extract with tar -xzf name.tar.gz, adding -C folder to choose the destination. Modern tar detects the compression type automatically when extracting.","s":["ext"],"hi":["ext"],"p":[{"v":["one","ext"],"c":"res","l":"extract","d":0,"x":false}]},{"t":"gzip on its own, and zip","d":"gzip big.log compresses one file in place (add -k to keep the original); zcat and zgrep read .gz files without unpacking. zip -r notes.zip notes/ archives and compresses in one format that Windows opens natively; unzip -l lists, unzip -d chooses the folder.","s":["gzc","zip","cmpz"],"hi":["cmpz"],"dp":"Log rotation uses gzip: /var/log/syslog.2.gz is yesterday's compressed log. zgrep \"error\" /var/log/syslog.*.gz searches them all without unpacking. tar keeps Linux permissions and owners; zip does not keep them fully, which matters for scripts and backups."}],"analogy":{"intro":"Moving house.","map":[["Packing many items into one box","tar (archive)"],["Vacuum-sealing a bag","gzip (compression)"],["Packed and sealed box",".tar.gz"],["Reading the box label before opening","tar -tzf"],["Unpacking into a chosen room","tar -xzf … -C dir"],["A box type every removal company accepts","zip (works on Windows)"]]},"cmp":{"head":["Command","What it does"],"rows":[["tar -cf a.tar dir/","archive, no compression"],["tar -czf a.tar.gz dir/","archive + gzip"],["tar -cjf a.tar.bz2 / -cJf a.tar.xz","bzip2 / xz"],["tar -tzf a.tar.gz","list contents"],["tar -xzf a.tar.gz -C /restore","extract to a folder"],["tar -xzf a.tar.gz path/in/archive","extract one file"],["gzip f / gzip -k f / gunzip f.gz","compress / keep original / decompress"],["zcat f.gz / zgrep x f.gz","read / search without unpacking"],["zip -r a.zip dir/","zip a folder"],["unzip -l a.zip / unzip a.zip -d out/","list / extract"],["du -sh dir a.tar.gz","compare sizes"]]},"usecase":"<p><b>System administrator:</b> nightly backup: tar -czf /backup/etc-$(date +%F).tar.gz /etc, keeping 30 days of archives.</p><p><b>Data engineer:</b> receives sales_2026.csv.gz from a partner, checks it with zcat | head, and loads it without ever unpacking it to disk.</p><p><b>Developer:</b> downloads a release such as spark-3.5.1-bin-hadoop3.tgz and unpacks it into /opt with tar -xzf … -C /opt.</p>","terms":[["Archive","One file containing many files and folders."],["Compression","Encoding data to use fewer bytes."],["tar","Tape archiver; bundles files."],["gzip / gunzip","Compress / decompress single files (.gz)."],["bzip2 / xz / zstd","Other compressors with different speed and size."],[".tar.gz / .tgz","gzip-compressed tar archive."],["zip / unzip","Archive + compression format common on Windows."],["zcat / zgrep","Read / search compressed files directly."]],"myths":[["tar compresses files","Only with -z, -j or -J; plain tar just bundles."],["gzip can compress a folder","gzip handles single files; use tar -czf for folders."],["Compressing a JPG or ZIP again saves space","Already-compressed data barely shrinks."]],"quiz":[{"q":"Create a gzip-compressed archive of the folder notes:","o":["gzip notes","tar -czf notes.tar.gz notes","tar -xzf notes","zip notes"],"a":1,"why":"c create, z gzip, f file."},{"q":"See what is inside a.tar.gz without extracting:","o":["tar -xzf a.tar.gz","tar -tzf a.tar.gz","gunzip a.tar.gz","cat a.tar.gz"],"a":1,"why":"t lists."},{"q":"Best format to send files to a Windows user:","o":[".tar.xz",".zip",".gz",".bz2"],"a":1,"why":"Windows opens zip natively."}]},{"part":1,"title":"Processes and users online: who, whoami, ps and kill","lead":"Every running program is a process with a number. See who is logged in, find what is running, and stop programs politely or by force.","scene":[{"id":"who","type":"box","x":20,"y":25,"w":240,"h":95,"k":"user","l":"who / whoami / w","s":"whoami → asha|who → everyone logged in|w → who + what they run"},{"id":"p1","type":"box","x":300,"y":25,"w":140,"h":60,"k":"srv","l":"systemd","s":"PID 1"},{"id":"p2","type":"box","x":300,"y":110,"w":140,"h":60,"k":"net","l":"sshd","s":"PID 812"},{"id":"p3","type":"box","x":300,"y":195,"w":140,"h":60,"k":"user","l":"bash","s":"PID 2310"},{"id":"p4","type":"box","x":300,"y":280,"w":140,"h":60,"k":"my","l":"python3 job.py","s":"PID 2455"},{"id":"pl1","type":"line","a":"p1","b":"p2"},{"id":"pl2","type":"line","a":"p2","b":"p3"},{"id":"pl3","type":"line","a":"p3","b":"p4"},{"id":"ps","type":"box","x":480,"y":25,"w":300,"h":115,"k":"note","l":"ps: snapshot of processes","s":"ps          (this terminal)|ps aux      (all, BSD style)|ps -ef      (all, with parent PID)|ps -ef --forest  (as a tree)"},{"id":"top","type":"box","x":480,"y":155,"w":300,"h":60,"k":"vm","l":"top / htop","s":"live view, sorted by CPU"},{"id":"sig","type":"box","x":480,"y":230,"w":300,"h":175,"k":"sec","l":"Signals (kill sends one)","s":"15 TERM: please stop (default)|9 KILL: stop now, no cleanup|2 INT: Ctrl+C|1 HUP: reload configuration|19 STOP / 18 CONT: pause / resume"},{"id":"kcmd","type":"box","x":20,"y":140,"w":240,"h":120,"k":"sec","l":"Stop a process","s":"kill 2455      (TERM)|kill -9 2455   (KILL)|pkill -f job.py   (by name)|killall python3"},{"id":"perm","type":"box","x":20,"y":280,"w":240,"h":125,"k":"note","l":"Who may kill?","s":"you: your own processes|root: any process|kill -0 PID tests if a|process exists"},{"id":"state","type":"box","x":20,"y":420,"w":760,"h":40,"k":"store","l":"Process states","s":"R running · S sleeping · D disk wait · T stopped · Z zombie (finished, parent has not collected it)"}],"steps":[{"t":"Who am I, and who else is here?","d":"whoami prints your username. who lists everyone logged in, with their terminal and login time. w adds what each person is running and the system load. id shows your UID and groups.","s":["who"],"hi":["who"],"a":"Checking the staffroom attendance board: your own name, everyone present, and what each is working on."},{"t":"A process is a running program","d":"Each running program gets a Process ID (PID). systemd is PID 1; every other process has a parent. When you log in over SSH, sshd starts your bash, and bash starts each command you type.","s":["p1","p2","p3","p4","pl1","pl2","pl3"],"hi":["p4"],"p":[{"v":["p1","p2","p3","p4"],"c":"req","l":"starts","d":0,"x":false}],"dp":"Every process has a PPID (parent PID). echo $$ prints your shell's PID; echo $PPID its parent. /proc/2455/ is a folder with live information about PID 2455: its command line, open files and memory."},{"t":"ps: a snapshot","d":"ps alone shows only your terminal's processes. ps aux shows every process with its owner, CPU and memory use. ps -ef shows the parent PID; --forest draws the family tree. Combine with grep: ps aux | grep python.","s":["ps"],"hi":["ps"],"ins":[["USER",[["Meaning","who owns the process"]]],["PID",[["Meaning","process ID: use it with kill"]]],["%CPU %MEM",[["Meaning","share of CPU and memory now"]]],["STAT",[["Meaning","state: R running, S sleeping, Z zombie"]]],["COMMAND",[["Meaning","the program and its arguments"]]]]},{"t":"top: a live view","d":"top refreshes every few seconds, busiest first. Press M to sort by memory, P by CPU, k to kill, q to quit. htop is a friendlier version with colours and mouse support (sudo apt install htop).","s":["top"],"hi":["top"]},{"t":"Stopping a process: signals","d":"kill does not kill: it sends a signal. The default, TERM (15), politely asks the program to finish and clean up. KILL (9) stops it immediately with no cleanup, so use it only when TERM does not work. Ctrl+C sends INT (2) to the program in your terminal.","s":["sig","kcmd"],"hi":["sig"],"p":[{"v":["kcmd","p4"],"c":"bad","l":"kill -15","d":0,"x":false},{"v":["kcmd","p4"],"c":"bad","l":"kill -9","d":2,"x":true}],"dp":"Order of politeness: kill PID, wait a few seconds, then kill -9 PID. pkill -f job.py matches the full command line; killall python3 stops every process with that exact name, which can include other people's work if you are root. kill -HUP is often used to make services reload their configuration without stopping."},{"t":"Who may stop what","d":"A normal user can signal only their own processes; root can signal any. States tell you what a process is doing: R running, S sleeping (waiting for input), D waiting for disk, T stopped, Z zombie (already finished; harmless unless thousands pile up).","s":["perm","state"],"hi":["perm"]}],"analogy":{"intro":"A busy school office.","map":[["Your name badge","whoami"],["Attendance board of everyone present","who / w"],["A task in progress with a ticket number","Process and PID"],["The teacher who assigned the task","Parent process (PPID)"],["Snapshot of all ongoing tasks","ps aux"],["Live wall display","top"],["\"Please wrap up your work\"","kill (TERM)"],["Security escorts someone out immediately","kill -9 (KILL)"]]},"cmp":{"head":["Command","What it does"],"rows":[["whoami / id","your name / UID and groups"],["who / w / users","who is logged in"],["ps / ps aux / ps -ef","your / all processes"],["ps -ef --forest","process tree"],["ps aux | grep nginx","find a process"],["pgrep -a python","PIDs and commands by name"],["top / htop","live view"],["kill PID / kill -9 PID","terminate / force kill"],["pkill -f \"job.py\" / killall name","by pattern / by name"],["kill -l","list all signals"],["echo $$","PID of this shell"],["uptime / free -h","load / memory"]]},"usecase":"<p><b>System administrator:</b> the server is slow: top shows one python process at 100% CPU; ps -ef --forest shows which user and cron job started it; kill PID stops it politely.</p><p><b>Data engineer:</b> a Spark job hangs; pgrep -af spark finds it, kill sends TERM so it can release cluster resources, kill -9 only if that fails.</p><p><b>Lab coordinator:</b> w shows which students are still logged in on the lab server before a maintenance reboot.</p>","terms":[["Process","A running instance of a program."],["PID / PPID","Process ID / parent process ID."],["ps","Snapshot of processes."],["top / htop","Live process monitor."],["Signal","Message sent to a process: TERM, KILL, HUP, INT."],["kill","Send a signal to a process by PID."],["pkill / killall","Send signals by name or pattern."],["Zombie","Finished process whose parent has not read its exit status."],["Load average","Average number of processes waiting for CPU."]],"myths":[["kill always kills","It sends a signal; the default TERM can be handled or ignored."],["kill -9 is the normal way","It prevents cleanup; try TERM first."],["Zombies use lots of memory","They hold only an entry in the process table."]],"quiz":[{"q":"Default signal sent by kill PID:","o":["KILL (9)","TERM (15)","HUP (1)","INT (2)"],"a":1,"why":"TERM asks the program to stop cleanly."},{"q":"Show all processes with their parent PID:","o":["ps","ps -ef","who","whoami"],"a":1,"why":"-ef includes PPID."},{"q":"Which shows logged-in users and what they are running?","o":["whoami","w","id","ps"],"a":1,"why":"w shows users and their current command."}]},{"part":1,"title":"make and the Makefile: rebuild only what changed","lead":"make reads a recipe file and rebuilds only the parts whose inputs changed. It builds C programs, but also reports, data pipelines and documentation.","scene":[{"id":"mf","type":"box","x":20,"y":25,"w":340,"h":200,"k":"note","l":"Makefile","s":"report.pdf: clean.csv chart.png|\tpandoc report.md -o report.pdf|clean.csv: raw.csv clean.py|\tpython3 clean.py|chart.png: clean.csv plot.py|\tpython3 plot.py|(each command line starts with a TAB)"},{"id":"raw","type":"box","x":400,"y":25,"w":120,"h":55,"k":"store","l":"raw.csv","s":"09:00"},{"id":"cpy","type":"box","x":400,"y":110,"w":120,"h":55,"k":"my","l":"clean.py","s":"09:00"},{"id":"ppy","type":"box","x":650,"y":110,"w":130,"h":55,"k":"my","l":"plot.py","s":"09:00"},{"id":"cln","type":"box","x":400,"y":195,"w":120,"h":55,"k":"vm","l":"clean.csv","s":"09:05"},{"id":"chr","type":"box","x":650,"y":195,"w":130,"h":55,"k":"vm","l":"chart.png","s":"09:06"},{"id":"rep","type":"box","x":525,"y":290,"w":140,"h":60,"k":"srv","l":"report.pdf","s":"09:07"},{"id":"d1","type":"line","a":"raw","b":"cln"},{"id":"d2","type":"line","a":"cpy","b":"cln"},{"id":"d3","type":"line","a":"cln","b":"chr"},{"id":"d4","type":"line","a":"ppy","b":"chr"},{"id":"d5","type":"line","a":"cln","b":"rep"},{"id":"d6","type":"line","a":"chr","b":"rep"},{"id":"rule","type":"box","x":20,"y":245,"w":340,"h":105,"k":"net","l":"A rule","s":"target: dependencies|<TAB> recipe (commands)|rebuild target if any|dependency is NEWER"},{"id":"use","type":"box","x":20,"y":370,"w":760,"h":90,"k":"note","l":"Commands","s":"make (first target)   make chart.png   make -n (show, do not run)|make clean (custom target: rm -f *.pdf *.png)   make -j4 (4 jobs in parallel)|C example: hello: hello.c  →  gcc -o hello hello.c"}],"steps":[{"t":"The problem: rebuilding everything is slow","d":"A report depends on a cleaned CSV and a chart; the chart depends on the cleaned CSV. Re-running every step after every small change wastes time, but forgetting a step gives wrong results.","s":["raw","cpy","ppy","cln","chr","rep","d1","d2","d3","d4","d5","d6"],"a":"A school magazine: if only the sports page changes, you reprint the sports page and the final booklet, not every article."},{"t":"A Makefile lists rules","d":"Each rule says: target, colon, the files it depends on, then the commands that build it on the next lines. Those command lines MUST start with a Tab character, not spaces.","s":["mf","rule"],"hi":["mf","rule"],"dp":"\"Makefile:3: *** missing separator. Stop.\" almost always means spaces instead of a Tab. In vim, :set list shows Tabs as ^I."},{"t":"make compares time stamps","d":"make looks at modification times. A target is rebuilt only if it is missing or any dependency is newer than it. That is the whole trick, and it is why touch is useful with make.","hi":["cln","chr","rep"],"ins":[["clean.csv (09:05)",[["Depends on","raw.csv 09:00, clean.py 09:00"],["Decision","up to date: skip"]]],["chart.png (09:06)",[["Depends on","clean.csv 09:05, plot.py 09:00"],["Decision","up to date: skip"]]],["report.pdf (09:07)",[["Depends on","clean.csv, chart.png"],["Decision","up to date: \"make: Nothing to be done\""]]]]},{"t":"Edit one script, rebuild only its chain","d":"You fix plot.py at 10:00. make sees plot.py is newer than chart.png, so it rebuilds chart.png, then report.pdf because chart.png is now newer. clean.csv is untouched: no time wasted.","set":{"ppy":{"k":"sec","s":"edited 10:00"},"chr":{"k":"my","s":"rebuilt 10:00"},"rep":{"k":"my","s":"rebuilt 10:01"}},"p":[{"v":["ppy","chr","rep"],"c":"req","l":"rebuild","d":0,"x":false}]},{"t":"Useful commands","d":"make builds the first target; make chart.png builds one target. make -n shows what would run without running it. A \"clean\" target conventionally deletes generated files. make -j4 runs independent steps in parallel.","s":["use"],"hi":["use"],"dp":"Targets that are not files, such as clean or test, should be declared .PHONY: clean test, so a file accidentally named \"clean\" does not stop the rule from running. Variables keep Makefiles short: CC=gcc, CFLAGS=-Wall, then $(CC) $(CFLAGS) -o hello hello.c."}],"analogy":{"intro":"Printing a school magazine.","map":[["List of pages and what each depends on","Makefile"],["Final booklet","Target"],["Articles and photos it needs","Dependencies"],["Instructions to lay out a page","Recipe"],["Reprint only pages whose material changed","Time-stamp comparison"],["\"Show me the plan, don't print yet\"","make -n"],["Several printers working at once","make -j"]]},"cmp":{"head":["Command / syntax","Meaning"],"rows":[["target: dep1 dep2","rule header"],["<TAB>command","recipe line (Tab!)"],["make","build the first target"],["make chart.png","build one target"],["make -n","dry run"],["make -B","rebuild everything"],["make -j4","parallel jobs"],[".PHONY: clean","target that is not a file"],["CC=gcc / $(CC)","variables"],["touch raw.csv; make","force downstream rebuild"]]},"usecase":"<p><b>Developer:</b> make compiles a C project of 500 files and recompiles only the 3 files you changed, saving minutes per build.</p><p><b>Data engineer:</b> a Makefile chains download → clean → aggregate → report; rerunning after new raw data rebuilds only affected steps.</p><p><b>DevOps engineer:</b> many repositories have make test, make build and make deploy as a standard entry point that CI pipelines call.</p>","terms":[["make","Tool that rebuilds targets whose dependencies changed."],["Makefile","File of rules make reads."],["Target","File (or name) to build."],["Dependency (prerequisite)","File a target needs."],["Recipe","Commands that build a target; lines start with Tab."],[".PHONY","Target that is not a real file."],["Dry run (make -n)","Show commands without running them."]],"myths":[["make is only for C programs","It works for any file-producing workflow."],["Spaces and Tabs are the same in a Makefile","Recipe lines must start with a Tab."],["make reruns every step","It reruns only out-of-date targets."]],"quiz":[{"q":"When does make rebuild a target?","o":["Always","When the target is missing or a dependency is newer","Only with sudo","Once a day"],"a":1,"why":"It compares modification times."},{"q":"\"missing separator\" error usually means:","o":["No Makefile","Spaces instead of a Tab before a command","Wrong compiler","Disk full"],"a":1,"why":"Recipe lines need a Tab."},{"q":"Show what make would do without doing it:","o":["make -j","make -n","make clean","make -B"],"a":1,"why":"-n is a dry run."}]},{"part":2,"title":"Users: /etc/passwd, /etc/shadow, root and sudo","lead":"Linux knows people by numbers. Where those numbers live, and how normal users safely borrow root powers.","scene":[{"id":"pw","type":"box","x":20,"y":30,"w":760,"h":70,"k":"note","l":"/etc/passwd: one line per user, readable by everyone","s":"asha:x:1001:1001:Asha Teacher:/home/asha:/bin/bash"},{"id":"f1","type":"box","x":20,"y":120,"w":104,"h":70,"k":"user","l":"asha","s":"username"},{"id":"f2","type":"box","x":129,"y":120,"w":104,"h":70,"k":"sec","l":"x","s":"password is in|/etc/shadow"},{"id":"f3","type":"box","x":238,"y":120,"w":104,"h":70,"k":"vm","l":"1001","s":"UID"},{"id":"f4","type":"box","x":347,"y":120,"w":104,"h":70,"k":"vm","l":"1001","s":"primary GID"},{"id":"f5","type":"box","x":456,"y":120,"w":104,"h":70,"k":"note","l":"Asha T.","s":"comment"},{"id":"f6","type":"box","x":565,"y":120,"w":104,"h":70,"k":"store","l":"/home/asha","s":"home folder"},{"id":"f7","type":"box","x":674,"y":120,"w":106,"h":70,"k":"net","l":"/bin/bash","s":"login shell"},{"id":"sh","type":"box","x":20,"y":215,"w":370,"h":85,"k":"sec","l":"/etc/shadow (root only)","s":"asha:$y$j9T$…hash…:20000:0:99999:7:::|hashed password + password-ageing rules"},{"id":"uid","type":"box","x":410,"y":215,"w":370,"h":85,"k":"note","l":"UID ranges","s":"0 = root (all powers)|1-999 = system / service users|1000+ = real people"},{"id":"root","type":"box","x":20,"y":320,"w":180,"h":60,"k":"sec","l":"👑 root","s":"UID 0"},{"id":"u","type":"box","x":220,"y":320,"w":180,"h":60,"k":"user","l":"👩 asha","s":"UID 1001"},{"id":"svc","type":"box","x":420,"y":320,"w":180,"h":60,"k":"vm","l":"⚙️ www-data","s":"service user, no login"},{"id":"sudo","type":"box","x":620,"y":320,"w":160,"h":60,"k":"net","l":"sudo","s":"borrow root, logged"},{"id":"cmds","type":"box","x":20,"y":400,"w":760,"h":60,"k":"note","l":"Commands","s":"useradd -m -s /bin/bash asha   passwd asha   usermod   userdel -r   id asha"}],"steps":[{"t":"Every user is a line in /etc/passwd","d":"When asha is created, a line is added to /etc/passwd. Everyone can read this file, because programs need to translate numbers to names, for example when ls -l shows owners.","s":["pw"],"a":"The school staff register on the notice board: names and staff numbers, but no keys."},{"t":"Seven fields, separated by colons","d":"Username, password placeholder, UID (user ID), primary GID (group ID), comment, home folder and login shell. The kernel only cares about the numbers.","s":["f1","f2","f3","f4","f5","f6","f7"],"hi":["f3","f4"],"dp":"Files store the owner as a UID number, not a name. If a user is deleted and their files remain, ls -l shows a bare number like 1007. If a new user later gets UID 1007, they silently become the owner of those old files: a real security risk when cleaning up accounts."},{"t":"Passwords live in /etc/shadow","d":"Password hashes are in /etc/shadow, readable only by root. The x in /etc/passwd just says \"look in shadow\". Shadow also stores ageing rules: last change, minimum and maximum age, warning days.","s":["sh"],"hi":["sh"],"dp":"The hash prefix shows the algorithm: $6$ is SHA-512, $y$ is yescrypt (default on recent Debian, Ubuntu and Fedora). An ! or * in the hash field means password login is disabled for that account. Check ageing with chage -l asha."},{"t":"Kinds of users","d":"root (UID 0) can do almost anything. System users (UID below 1000) run services such as the web server, usually with no login shell. Real people get UIDs from 1000 upward.","s":["uid","root","u","svc"],"hi":["root"],"a":"Principal with the master key; caretaker staff who only operate machines; teachers with their own keys."},{"t":"sudo: borrow root carefully","d":"Logging in as root is risky. Users in the sudo (Ubuntu) or wheel (Red Hat) group can run single commands as root with sudo, using their own password. Every sudo command is logged.","s":["sudo"],"p":[{"v":["u","sudo","root"],"c":"req","l":"sudo apt update","d":0,"x":false}],"dp":"Rules live in /etc/sudoers and /etc/sudoers.d/. Always edit with visudo, which checks syntax: a broken sudoers file can lock everyone out of sudo. su - switches to another user completely (needs that user's password); sudo -i gives a root shell using your own password."},{"t":"Managing users","d":"useradd -m -s /bin/bash asha creates the user, her home folder and sets bash. passwd asha sets a password. usermod changes things later. userdel -r asha removes the user and her home folder. id asha shows UID, GID and groups.","s":["cmds"],"hi":["cmds"]}],"analogy":{"intro":"The school staff register.","map":[["Staff register on the notice board","/etc/passwd"],["Staff number","UID"],["Locked file of signatures","/etc/shadow"],["Principal with master key","root"],["Caretaker who operates the boiler only","System user"],["Asking the office for the master key for one task, signed in a book","sudo"]]},"cmp":{"head":["Command","What it does"],"rows":[["sudo useradd -m -s /bin/bash asha","create user with home folder and bash"],["sudo adduser asha","interactive version (Debian/Ubuntu)"],["sudo passwd asha","set or change password"],["sudo usermod -c \"Asha T.\" asha","change user details"],["sudo usermod -L asha / -U","lock / unlock account"],["sudo userdel -r asha","delete user and home folder"],["id asha, whoami, who","identity and who is logged in"],["getent passwd asha","look up user (also LDAP etc.)"],["sudo chage -l asha","password ageing"],["sudo -i, su - asha","root shell / become asha"]]},"usecase":"<p><b>System administrator:</b> creates accounts for new staff, disables leavers with usermod -L before deleting, and audits who has sudo.</p><p><b>Developer:</b> runs apps as a dedicated service user (UID below 1000, no shell) so a hacked app cannot become root.</p><p><b>Data / DevOps engineer:</b> container images set a non-root USER, and CI jobs use separate service accounts.</p>","terms":[["User","An identity the system uses to own files and run programs."],["UID","Numeric user ID; what the kernel actually uses."],["GID","Numeric group ID."],["/etc/passwd","User database readable by all."],["/etc/shadow","Password hashes and ageing; root only."],["root","Superuser, UID 0."],["System user","Account for a service, usually no login."],["sudo","Run a command as another user (usually root), logged."],["sudoers","Rules for who may use sudo; edit with visudo."],["Login shell","Program started when the user logs in."],["nologin","Shell that refuses interactive login (/usr/sbin/nologin)."]],"myths":[["Usernames are stored in files' ownership","Only the UID number is stored."],["/etc/passwd contains passwords","Today it contains only x; hashes are in /etc/shadow."],["Work as root to avoid permission errors","It removes all safety nets. Use sudo for single commands."]],"quiz":[{"q":"Which field in /etc/passwd is the UID?","o":["First","Third","Fifth","Seventh"],"a":1,"why":"name:x:UID:GID:comment:home:shell."},{"q":"Who can read /etc/shadow?","o":["Everyone","Only root","The user only","Group members"],"a":1,"why":"It holds password hashes."},{"q":"Safest way to run one admin command?","o":["Log in as root","sudo command","chmod 777 /","Share root password"],"a":1,"why":"sudo is scoped and logged."}]},{"part":2,"title":"Groups: creating \"nursery\" and adding users","lead":"Groups let you give access to a team at once. The one flag that can silently remove people from groups.","scene":[{"id":"m1","type":"line","a":"asha","b":"nur"},{"id":"m2","type":"line","a":"meena","b":"nur"},{"id":"m3","type":"line","a":"ravi","b":"acc"},{"id":"m4","type":"line","a":"asha","b":"tea"},{"id":"m5","type":"line","a":"meena","b":"tea"},{"id":"m6","type":"line","a":"priya","b":"tea"},{"id":"grpf","type":"box","x":20,"y":30,"w":760,"h":70,"k":"note","l":"/etc/group","s":"nursery:x:1050:asha,meena     accounts:x:1051:ravi     teachers:x:1052:asha,meena,priya"},{"id":"asha","type":"box","x":20,"y":130,"w":150,"h":55,"k":"user","l":"👩 asha","s":""},{"id":"meena","type":"box","x":20,"y":200,"w":150,"h":55,"k":"user","l":"👩 meena","s":""},{"id":"ravi","type":"box","x":20,"y":270,"w":150,"h":55,"k":"user","l":"👨 ravi","s":""},{"id":"priya","type":"box","x":20,"y":340,"w":150,"h":55,"k":"user","l":"👩‍💼 priya","s":""},{"id":"nur","type":"box","x":330,"y":130,"w":200,"h":70,"k":"vm","l":"🧸 nursery","s":"GID 1050"},{"id":"acc","type":"box","x":330,"y":220,"w":200,"h":70,"k":"vm","l":"💰 accounts","s":"GID 1051"},{"id":"tea","type":"box","x":330,"y":310,"w":200,"h":70,"k":"vm","l":"📚 teachers","s":"GID 1052"},{"id":"prim","type":"box","x":570,"y":130,"w":210,"h":110,"k":"note","l":"Primary group","s":"one per user (in /etc/passwd)|new files get this group|often same name as the user"},{"id":"supp","type":"box","x":570,"y":255,"w":210,"h":110,"k":"note","l":"Supplementary groups","s":"extra memberships|listed in /etc/group|give extra access"},{"id":"warn","type":"box","x":20,"y":410,"w":760,"h":50,"k":"sec","l":"⚠️ usermod -G nursery asha REPLACES her other groups. Always use -aG (append).","s":""}],"steps":[{"t":"Create the group","d":"The school wants one folder that only nursery teachers can use. First, create a group: sudo groupadd nursery. Linux gives it a GID, for example 1050.","s":["asha","meena","ravi","priya","nur"],"hi":["nur"],"a":"Creating a new staffroom called \"Nursery\" with its own door key."},{"t":"Add users to it","d":"sudo usermod -aG nursery asha adds asha to nursery. -a means append, -G means supplementary groups. gpasswd -a meena nursery does the same for meena.","s":["m1","m2"],"p":[{"v":["asha","nur"],"c":"req","l":"usermod -aG nursery asha","d":0,"x":false},{"v":["meena","nur"],"c":"req","l":"gpasswd -a meena nursery","d":1.4,"x":false}]},{"t":"Users can be in many groups","d":"asha is in nursery and teachers; ravi is in accounts; priya is in teachers. Access adds up: asha can use anything opened to nursery or teachers.","s":["acc","tea","m3","m4","m5","m6"]},{"t":"Primary versus supplementary","d":"Each user has exactly one primary group, stored in /etc/passwd (often a private group with the same name, e.g. asha). Files asha creates belong to her primary group. Supplementary groups, listed in /etc/group, give extra access.","s":["prim","supp"],"hi":["prim","supp"],"dp":"User private groups: most distributions give every user a personal group of the same name as their primary group. That is why umask 002 is safe for normal files: the \"group\" is just you, unless you deliberately share a folder."},{"t":"Where it is stored","d":"/etc/group lists each group, its GID and its supplementary members. /etc/gshadow holds group passwords and administrators (rarely used).","s":["grpf"],"hi":["grpf"]},{"t":"The dangerous mistake","d":"sudo usermod -G nursery asha (without -a) sets asha's supplementary groups to ONLY nursery, silently removing her from teachers and even from sudo. Always type -aG.","s":["warn"],"set":{"asha":{"k":"down","s":"lost teachers, sudo!"}},"p":[{"v":["asha","tea"],"c":"bad","l":"removed","d":0,"x":true}]},{"t":"New groups need a new login","d":"Group membership is read when a session starts. After usermod, asha must log out and in again (or run newgrp nursery, or su - asha) before id shows the new group. This catches everyone at least once.","set":{"asha":{"k":"user","s":""}},"dp":"Running processes keep the group list they started with. Services such as a web server must be restarted to pick up new group membership. Check a live process with: grep Groups /proc/<PID>/status."}],"analogy":{"intro":"Staffrooms in a school.","map":[["Staffroom with its own key","Group"],["Your home classroom","Primary group"],["Extra staffrooms you may enter","Supplementary groups"],["Staffroom register","/etc/group"],["Handing over a new key, effective from tomorrow morning","Need to log in again"],["Replacing all your keys with one by mistake","usermod -G without -a"]]},"cmp":{"head":["Command","What it does"],"rows":[["sudo groupadd nursery","create group"],["sudo usermod -aG nursery asha","add asha to nursery (append!)"],["sudo gpasswd -a meena nursery","add member (alternative)"],["sudo gpasswd -d meena nursery","remove member"],["sudo usermod -g nursery asha","change PRIMARY group"],["groups asha, id asha","list memberships"],["getent group nursery","show group and members"],["newgrp nursery","start a shell with that group"],["sudo groupdel nursery","delete group"],["sudo groupmod -n kg nursery","rename group"]]},"usecase":"<p><b>System administrator:</b> one group per team folder (nursery, accounts); joining or leaving the team is one command.</p><p><b>Developer:</b> adds themselves to the docker group to run containers without sudo (which effectively grants root-level power, so only on dev machines).</p><p><b>Data / DevOps engineer:</b> a deploy group can write to /srv/app while the app runs as a service user that can only read.</p>","terms":[["Group","Named set of users sharing permissions."],["GID","Numeric group ID."],["Primary group","The group in /etc/passwd; given to new files."],["Supplementary group","Additional groups listed in /etc/group."],["/etc/group","Group database."],["/etc/gshadow","Group passwords and administrators."],["User private group","Personal group with the same name as the user."],["groupadd / groupdel / groupmod","Create, delete, modify groups."],["usermod -aG","Append supplementary groups."],["gpasswd","Add or remove group members."],["newgrp","Start a shell with a different current group."]],"myths":[["usermod -G adds a group","Without -a it replaces all supplementary groups."],["Group changes apply instantly","Only to new login sessions."]],"quiz":[{"q":"Add asha to nursery without removing other groups:","o":["usermod -G nursery asha","usermod -aG nursery asha","groupadd asha nursery","chgrp nursery asha"],"a":1,"why":"-a appends."},{"q":"asha was added to nursery but id still does not show it. Why?","o":["The group is broken","She needs a new login session","She needs chmod","UID conflict"],"a":1,"why":"Groups are read at login."},{"q":"Where are supplementary members listed?","o":["/etc/passwd","/etc/group","/etc/shadow","/home"],"a":1,"why":"/etc/group holds member lists."}]},{"part":3,"title":"Reading ls -l and how the kernel checks access","lead":"Ten characters decide who can do what. The rule \"first match wins\" surprises almost everyone.","scene":[{"id":"ls","type":"box","x":20,"y":20,"w":760,"h":60,"k":"note","l":"$ ls -l /school/nursery/attendance.xlsx","s":"-rw-r-----  1  asha  nursery  4096  Oct 1 09:30  attendance.xlsx"},{"id":"zt","type":"zone","x":20,"y":95,"w":60,"h":95,"k":"plain","l":"type"},{"id":"zu","type":"zone","x":85,"y":95,"w":165,"h":95,"k":"plain","l":"owner (u)"},{"id":"zg","type":"zone","x":255,"y":95,"w":165,"h":95,"k":"plain","l":"group (g)"},{"id":"zo","type":"zone","x":425,"y":95,"w":165,"h":95,"k":"plain","l":"others (o)"},{"id":"t","type":"box","x":28,"y":125,"w":44,"h":55,"k":"store","l":"-","s":""},{"id":"ur","type":"box","x":92,"y":125,"w":48,"h":55,"k":"vm","l":"r","s":""},{"id":"uw","type":"box","x":145,"y":125,"w":48,"h":55,"k":"vm","l":"w","s":""},{"id":"ux","type":"box","x":198,"y":125,"w":48,"h":55,"k":"ghost","l":"-","s":""},{"id":"gr","type":"box","x":262,"y":125,"w":48,"h":55,"k":"vm","l":"r","s":""},{"id":"gw","type":"box","x":315,"y":125,"w":48,"h":55,"k":"ghost","l":"-","s":""},{"id":"gx","type":"box","x":368,"y":125,"w":48,"h":55,"k":"ghost","l":"-","s":""},{"id":"or","type":"box","x":432,"y":125,"w":48,"h":55,"k":"ghost","l":"-","s":""},{"id":"ow","type":"box","x":485,"y":125,"w":48,"h":55,"k":"ghost","l":"-","s":""},{"id":"ox","type":"box","x":538,"y":125,"w":48,"h":55,"k":"ghost","l":"-","s":""},{"id":"lc","type":"box","x":600,"y":100,"w":180,"h":40,"k":"note","l":"1 = link count","s":""},{"id":"own","type":"box","x":600,"y":145,"w":85,"h":45,"k":"user","l":"asha","s":"owner"},{"id":"grp","type":"box","x":690,"y":145,"w":90,"h":45,"k":"vm","l":"nursery","s":"group"},{"id":"who","type":"box","x":20,"y":215,"w":180,"h":70,"k":"user","l":"Who is asking?","s":"UID and groups"},{"id":"c1","type":"box","x":230,"y":215,"w":170,"h":70,"k":"note","l":"1. Are you the owner?","s":"yes → owner bits only"},{"id":"c2","type":"box","x":420,"y":215,"w":170,"h":70,"k":"note","l":"2. In the group?","s":"yes → group bits only"},{"id":"c3","type":"box","x":610,"y":215,"w":170,"h":70,"k":"note","l":"3. Otherwise","s":"others bits"},{"id":"asha","type":"box","x":20,"y":310,"w":180,"h":55,"k":"user","l":"👩 asha (owner)","s":""},{"id":"meena","type":"box","x":220,"y":310,"w":180,"h":55,"k":"user","l":"👩 meena (nursery)","s":""},{"id":"ravi","type":"box","x":420,"y":310,"w":180,"h":55,"k":"user","l":"👨 ravi (accounts)","s":""},{"id":"rootu","type":"box","x":620,"y":310,"w":160,"h":55,"k":"sec","l":"👑 root","s":""},{"id":"rule","type":"box","x":20,"y":385,"w":760,"h":75,"k":"sec","l":"First match wins","s":"if you are the owner, ONLY the owner bits apply, even if group or others bits are more generous.|root skips read/write checks (execute needs at least one x bit)."}],"steps":[{"t":"The long listing","d":"ls -l shows the permission string, link count, owner, group, size, modification time and name. Use the inspector to read each field.","s":["ls"],"ins":[["-rw-r-----",[["First char","- regular file, d directory, l symbolic link, c/b device"],["Next 9","rwx for owner, group, others"]]],["1",[["Link count","number of hard links (names) pointing to this inode"]]],["asha nursery",[["Owner","user who owns the file (stored as UID)"],["Group","group of the file (stored as GID)"]]],["4096",[["Size","in bytes; use ls -lh for KB/MB"]]],["Oct 1 09:30",[["Time","last modification (mtime)"]]]]},{"t":"Three classes, three permissions","d":"The nine characters are three sets: owner (u), group (g), others (o). Each set has r (read), w (write), x (execute), or - when missing. Here: owner rw-, group r--, others ---.","s":["zt","zu","zg","zo","t","ur","uw","ux","gr","gw","gx","or","ow","ox"],"hi":["ur","uw","gr"],"a":"A cupboard with three locks: one key for the teacher who owns it, one for her staffroom, one for everybody else."},{"t":"Owner and group of the file","d":"Every file has exactly one owner and one group. Here: owner asha, group nursery.","s":["lc","own","grp"],"hi":["own","grp"]},{"t":"How the kernel decides","d":"When someone opens the file, the kernel checks in order: are you the owner? If not, is any of your groups the file's group? If not, you are \"others\". It uses only the first set that matches.","s":["who","c1","c2","c3"],"p":[{"v":["who","c1","c2","c3"],"c":"req","l":"check in order","d":0,"x":false}],"dp":"With ACLs, named-user and named-group entries are checked between steps 1 and 3, limited by the ACL mask (module 9)."},{"t":"Four people, four results","d":"asha matches owner: read and write. meena is in nursery: read only. ravi is neither: others: nothing. root bypasses read and write checks.","s":["asha","meena","ravi","rootu"],"p":[{"v":["asha","c1"],"c":"res","l":"rw ✓","d":0,"x":false},{"v":["meena","c2"],"c":"res","l":"r ✓","d":0.8,"x":false},{"v":["ravi","c3"],"c":"bad","l":"denied","d":1.6,"x":true},{"v":["rootu","ls@b"],"c":"res","l":"root: allowed","d":2.4,"x":false}]},{"t":"First match wins, really","d":"Surprising case: a file with mode ---rwx--- owned by asha in group nursery. asha is in nursery, but she is the owner, so owner bits (none) apply. She is denied, while meena gets full access.","s":["rule"],"hi":["rule","c1"],"a":"Your own cupboard lock is jammed. Even though your staffroom key would open it, the lock checks your owner key first and stops there."}],"analogy":{"intro":"A cupboard with three different locks.","map":[["Teacher who owns the cupboard","Owner (u)"],["Her staffroom colleagues","Group (g)"],["Everyone else in school","Others (o)"],["Look, change, use","r, w, x"],["Guard checks owner first, then staffroom, then everyone else","Permission check order"],["Principal with a master key","root"]]},"cmp":{"head":["Symbol","Meaning"],"rows":[["- d l","regular file, directory, symbolic link"],["c b","character / block device"],["p s","named pipe / socket"],["r w x","read, write, execute"],["-","permission absent"],["s / S, t / T","special bits (module 8)"],["+ at the end","ACL present (module 9)"],[". at the end","SELinux security context"]]},"usecase":"<p><b>System administrator:</b> reads ls -l to explain why a user is denied, without guessing.</p><p><b>Developer:</b> sees that a script lacks x for the deploy user, or that a config file is world-readable (others r) when it holds passwords.</p><p><b>Data / DevOps engineer:</b> checks permissions of mounted volumes inside containers where UIDs differ from the host.</p>","terms":[["Permission string","The 10-character mode shown by ls -l."],["Owner (u)","The user who owns the file."],["Group (g)","The group of the file."],["Others (o)","Everyone not owner and not in the group."],["Mode","The permission bits of a file."],["Link count","Number of hard links to the inode."],["mtime","Last modification time."],["First-match rule","Only the first matching class (owner → group → others) is used."]],"myths":[["Permissions add up across owner, group and others","Only the first matching class applies."],["root is checked like everyone else","root bypasses read/write checks."]],"quiz":[{"q":"In -rwxr-x---, what can group members do?","o":["Read, write, execute","Read and execute","Nothing","Write only"],"a":1,"why":"Group set is r-x."},{"q":"A file is ----rw---- owned by asha, group nursery. asha is also in nursery. Can she read it?","o":["Yes, via group","No, owner bits apply and they are empty","Only with sudo... no, yes","Yes, permissions add up"],"a":1,"why":"First match wins: she is the owner."},{"q":"The first character d means:","o":["Deleted","Directory","Device","Default"],"a":1,"why":"d = directory."}]},{"part":3,"title":"What r, w and x mean on files versus directories","lead":"The same letters mean different things on folders. Most real-world \"Permission denied\" puzzles live here.","scene":[{"id":"fz","type":"zone","x":20,"y":30,"w":370,"h":270,"k":"plain","l":"On a FILE"},{"id":"fr","type":"box","x":40,"y":70,"w":330,"h":62,"k":"vm","l":"r = read","s":"view or copy the contents (cat, open)"},{"id":"fw","type":"box","x":40,"y":145,"w":330,"h":62,"k":"vm","l":"w = write","s":"change the contents (not delete!)"},{"id":"fx","type":"box","x":40,"y":220,"w":330,"h":62,"k":"vm","l":"x = execute","s":"run it as a program or script"},{"id":"dz","type":"zone","x":410,"y":30,"w":370,"h":270,"k":"plain","l":"On a DIRECTORY"},{"id":"dr","type":"box","x":430,"y":70,"w":330,"h":62,"k":"store","l":"r = list","s":"see the names inside (ls)"},{"id":"dw","type":"box","x":430,"y":145,"w":330,"h":62,"k":"store","l":"w = change entries","s":"create, delete, rename inside (needs x too)"},{"id":"dx","type":"box","x":430,"y":220,"w":330,"h":62,"k":"store","l":"x = enter / pass through","s":"cd into it, reach files inside"},{"id":"p1","type":"box","x":20,"y":320,"w":140,"h":55,"k":"store","l":"/","s":"x needed"},{"id":"p2","type":"box","x":180,"y":320,"w":140,"h":55,"k":"store","l":"school/","s":"x needed"},{"id":"p3","type":"box","x":340,"y":320,"w":140,"h":55,"k":"store","l":"nursery/","s":"x needed"},{"id":"p4","type":"box","x":500,"y":320,"w":140,"h":55,"k":"note","l":"notes.txt","s":"r needed"},{"id":"del","type":"box","x":20,"y":395,"w":760,"h":65,"k":"sec","l":"Deleting a file is a DIRECTORY operation","s":"you need w + x on the folder; the file's own permissions do not matter (unless the sticky bit is set)"}],"steps":[{"t":"On files: what you would expect","d":"r lets you read the contents, w lets you change them, x lets you run the file as a program or script.","s":["fz","fr","fw","fx"],"hi":["fr","fw","fx"]},{"t":"On directories: different meanings","d":"A directory is a list of names. r lets you list the names. w lets you add, remove or rename entries. x lets you enter the directory and reach anything inside it.","s":["dz","dr","dw","dx"],"hi":["dr","dw","dx"],"a":"A room: r = look through the window at the labels, x = walk in through the door, w = put things in or take them out."},{"t":"x without r, r without x","d":"With x but no r you can open a file if you know its exact name, but ls shows nothing. With r but no x, ls shows names but you cannot open anything or see details (ls -l shows question marks).","hi":["dr","dx"],"dp":"\"x only\" directories are used for drop boxes and for home directories in some setups: others can reach a known file such as ~/public_html but cannot browse."},{"t":"Every folder on the path needs x","d":"To open /school/nursery/notes.txt you need x on /, on /school and on /school/nursery, plus r on the file. One missing x anywhere on the path and you are denied, even if the file itself is world-readable.","s":["p1","p2","p3","p4"],"p":[{"v":["p1","p2","p3","p4"],"c":"req","l":"x → x → x → r","d":0,"x":false}],"dp":"namei -l /school/nursery/notes.txt shows permissions of every component of the path at once. It is the fastest way to find the missing x."},{"t":"Deleting is about the folder","d":"To delete or rename a file, you need w and x on the directory containing it. A read-only file (r--r--r--) in a folder you can write to can still be deleted (rm will just ask to confirm). That is why shared folders need care and the sticky bit exists.","s":["del"],"hi":["del","dw"]}],"analogy":{"intro":"Rooms and cupboards.","map":[["Reading a document","r on file"],["Editing a document","w on file"],["Running a machine","x on file"],["Looking through a room window at labels","r on directory"],["Walking in through the door","x on directory"],["Putting cupboards in or removing them","w on directory"],["Every door on the corridor must open","x on every folder in the path"]]},"cmp":{"head":["Need to…","Required permission"],"rows":[["cat file","r on file + x on all parent folders"],["edit file contents","w on file + x on folders"],["run ./script.sh","x (and r for scripts) on file"],["ls folder","r on folder (+x for details)"],["cd folder","x on folder"],["create / delete / rename in folder","w + x on folder"],["check whole path","namei -l /path/to/file"]]},"usecase":"<p><b>System administrator:</b> a web server shows 403 Forbidden because /home/asha lacks x for others, even though the HTML file is readable.</p><p><b>Developer:</b> a teammate deleted a \"read-only\" file: the folder was group-writable.</p><p><b>Data / DevOps engineer:</b> a data drop folder with mode 730 lets the group upload but not list other uploads.</p>","terms":[["Directory r","List entry names."],["Directory w","Create, delete, rename entries (with x)."],["Directory x","Enter and access entries (search permission)."],["Path traversal","Passing through each folder; needs x on each."],["namei","Shows permissions along a path."],["Search permission","Another name for x on a directory."]],"myths":[["A read-only file cannot be deleted","Deletion depends on the directory's w + x."],["r on a folder lets you open its files","You also need x on the folder."]],"quiz":[{"q":"You can ls a folder but cannot cd into it. Missing:","o":["r","w","x","s"],"a":2,"why":"x is needed to enter."},{"q":"To delete a file you need:","o":["w on the file","w and x on the containing folder","x on the file","root only"],"a":1,"why":"Deletion edits the directory."},{"q":"File is -rw-r--r--, but others get Permission denied. Most likely:","o":["File is corrupt","A parent folder lacks x for others","Wrong umask","Inode full"],"a":1,"why":"Every folder on the path needs x."}]},{"part":3,"title":"chmod: symbolic and octal","lead":"Two ways to change permissions: letters for small edits, numbers to set everything at once.","scene":[{"id":"oct","type":"box","x":20,"y":30,"w":760,"h":60,"k":"note","l":"Octal: r = 4, w = 2, x = 1. Add them for each class.","s":""},{"id":"u7","type":"box","x":60,"y":115,"w":200,"h":90,"k":"vm","l":"owner: 7","s":"r + w + x = 4 + 2 + 1"},{"id":"g5","type":"box","x":300,"y":115,"w":200,"h":90,"k":"vm","l":"group: 5","s":"r + x = 4 + 1"},{"id":"o0","type":"box","x":540,"y":115,"w":200,"h":90,"k":"ghost","l":"others: 0","s":"nothing"},{"id":"res","type":"box","x":60,"y":225,"w":680,"h":60,"k":"store","l":"chmod 750 report.sh  →  rwxr-x---","s":""},{"id":"sym","type":"box","x":20,"y":305,"w":370,"h":155,"k":"net","l":"Symbolic","s":"chmod u+x script.sh     owner gets x|chmod g-w notes.txt      group loses w|chmod o= notes.txt       others: nothing|chmod a+r poster.pdf     everyone gets r"},{"id":"com","type":"box","x":410,"y":305,"w":370,"h":155,"k":"note","l":"Common modes","s":"644  rw-r--r--   normal files|755  rwxr-xr-x   scripts, folders|600  rw-------   private (SSH keys)|770  rwxrwx---   team folders"}],"steps":[{"t":"Octal digits","d":"Each permission has a value: r = 4, w = 2, x = 1. Add the values you want for each class to get one digit per class.","s":["oct"],"a":"A three-digit locker code, one digit per audience."},{"t":"Owner gets 7","d":"4 + 2 + 1 = 7: read, write, execute.","s":["u7"],"hi":["u7"]},{"t":"Group 5, others 0","d":"Group: 4 + 1 = 5 (read and execute). Others: 0 (nothing).","s":["g5","o0"],"hi":["g5","o0"]},{"t":"The result","d":"chmod 750 report.sh gives rwxr-x---. Octal sets all nine bits at once, replacing whatever was there.","s":["res"],"p":[{"v":["u7","res"],"c":"data","l":"","d":0,"x":false},{"v":["g5","res"],"c":"data","l":"","d":0.3,"x":false},{"v":["o0","res"],"c":"data","l":"","d":0.6,"x":false}],"dp":"A fourth leading digit sets special bits: chmod 2770 folder adds SGID. Try the calculator tab: tick boxes and watch the octal and symbolic forms change together."},{"t":"Symbolic: change only what you mention","d":"Who (u, g, o, a), an operator (+ add, - remove, = set exactly) and permissions. chmod u+x adds x for the owner and leaves everything else alone. Combine with commas: chmod u=rwx,g=rx,o= file.","s":["sym"],"hi":["sym"]},{"t":"Common patterns","d":"644 for ordinary files, 755 for scripts and folders, 600 for secrets such as SSH private keys (ssh refuses keys that others can read), 770 for team folders. Never use 777 as a fix.","s":["com"],"hi":["com"],"dp":"chmod -R applies to a whole tree, but chmod -R 755 would make every file executable. Use capital X: chmod -R u=rwX,g=rX,o= folder gives x only to directories (and files that already had x). Or use find: find dir -type d -exec chmod 750 {} + ; find dir -type f -exec chmod 640 {} +"}],"analogy":{"intro":"Locker codes.","map":[["4 = look, 2 = change, 1 = use","r, w, x values"],["One digit per audience","Owner, group, others"],["Resetting the whole code","Octal chmod"],["Turning one dial only","Symbolic chmod"],["Leaving every locker open","chmod 777 (do not)"]]},"cmp":{"head":["Command","Result"],"rows":[["chmod 644 file","rw-r--r--"],["chmod 755 script.sh","rwxr-xr-x"],["chmod 600 ~/.ssh/id_ed25519","rw------- (required by ssh)"],["chmod 770 /school/nursery","rwxrwx---"],["chmod u+x run.sh","add execute for owner"],["chmod go-rwx secret.txt","remove all for group and others"],["chmod -R u=rwX,g=rX,o= dir","x only on folders"],["stat -c \"%a %A %n\" file","show octal and symbolic"]]},"usecase":"<p><b>System administrator:</b> sets 640 on config files containing passwords, readable by the service group only.</p><p><b>Developer:</b> chmod +x deploy.sh after cloning; git tracks the executable bit.</p><p><b>Data / DevOps engineer:</b> SSH keys and cloud credential files must be 600 or tools refuse to use them.</p>","terms":[["chmod","Change mode (permission bits)."],["Octal mode","Numeric form, e.g. 750."],["Symbolic mode","Letter form, e.g. u+x,g-w."],["u g o a","Owner, group, others, all."],["+ - =","Add, remove, set exactly."],["-R","Recursive."],["X (capital)","Execute only for directories or files already executable."],["777","Everyone can do everything; almost always wrong."]],"myths":[["chmod 777 fixes permission problems","It hides the real cause and opens the file to everyone."],["chmod -R 755 is safe for websites","It makes every file executable; use X or find."]],"tryit":"chmod","quiz":[{"q":"rwxr-x--- in octal is:","o":["755","750","740","770"],"a":1,"why":"7, 5, 0."},{"q":"Add execute for the owner only, keep everything else:","o":["chmod 100 file","chmod u+x file","chmod 777 file","chmod +r file"],"a":1,"why":"Symbolic changes only what is named."},{"q":"An SSH private key should be:","o":["644","600","755","777"],"a":1,"why":"Only the owner may read it."}]},{"part":3,"title":"chown and chgrp: changing owner and group","lead":"Who may give a file away, and how to hand a whole folder to a team.","scene":[{"id":"root","type":"box","x":20,"y":40,"w":180,"h":60,"k":"sec","l":"👑 root","s":""},{"id":"f","type":"box","x":290,"y":30,"w":230,"h":90,"k":"store","l":"📄 timetable.pdf","s":"owner: root|group: root"},{"id":"asha","type":"box","x":600,"y":40,"w":180,"h":60,"k":"user","l":"👩 asha","s":"member of nursery"},{"id":"c1","type":"box","x":20,"y":150,"w":370,"h":70,"k":"net","l":"sudo chown asha timetable.pdf","s":"change owner (root only)"},{"id":"c2","type":"box","x":410,"y":150,"w":370,"h":70,"k":"net","l":"chgrp nursery timetable.pdf","s":"owner may set a group she belongs to"},{"id":"c3","type":"box","x":20,"y":240,"w":370,"h":70,"k":"net","l":"sudo chown asha:nursery file","s":"owner and group together"},{"id":"c4","type":"box","x":410,"y":240,"w":370,"h":70,"k":"net","l":"sudo chown -R root:nursery /school/nursery","s":"whole folder tree"},{"id":"why","type":"box","x":20,"y":330,"w":760,"h":130,"k":"note","l":"Why only root can give files away","s":"otherwise users could dodge disk quotas or plant files in others' names|ownership is stored as UID/GID numbers in the inode|deleted user → ls -l shows a bare number like 1007"}],"steps":[{"t":"The file belongs to root","d":"root created timetable.pdf, so the owner and group are root. asha cannot edit it.","s":["root","f","asha"]},{"t":"chown changes the owner","d":"sudo chown asha timetable.pdf makes asha the owner. Only root can change a file's owner.","s":["c1"],"set":{"f":{"s":"owner: asha|group: root"}},"p":[{"v":["root","f"],"c":"req","l":"chown asha","d":0,"x":false}]},{"t":"chgrp changes the group","d":"asha now owns the file and is a member of nursery, so she can run chgrp nursery timetable.pdf herself. Owners can only choose groups they belong to.","s":["c2"],"set":{"f":{"s":"owner: asha|group: nursery"}},"p":[{"v":["asha","f"],"c":"req","l":"chgrp nursery","d":0,"x":false}]},{"t":"Both at once, and whole trees","d":"chown user:group sets both. chown -R applies to a folder and everything inside: the usual way to hand a project folder to a team.","s":["c3","c4"],"hi":["c3","c4"],"dp":"chown :nursery file (empty user part) changes only the group, like chgrp. chown --reference=other file copies another file's owner and group. Be careful with chown -R on paths like / or /home: one typo can break a system."},{"t":"Users cannot give files away","d":"asha tries chown ravi timetable.pdf: denied. If users could give away files, they could escape disk quotas or make it look as if someone else created a file.","s":["why"],"p":[{"v":["asha","f"],"c":"bad","l":"chown ravi: denied","d":0,"x":true}],"a":"You cannot sign a cupboard over to another teacher yourself; the principal must update the register."}],"analogy":{"intro":"The asset register.","map":[["Principal updating the register","sudo chown"],["Teacher labelling her cupboard for her staffroom","chgrp to own group"],["Handing an entire room to a department","chown -R user:group folder"],["Asset tag with staff number","UID/GID stored in the inode"]]},"cmp":{"head":["Command","What it does"],"rows":[["sudo chown asha file","owner → asha"],["chgrp nursery file","group → nursery (owner, if member)"],["sudo chown asha:nursery file","both"],["sudo chown :nursery file","group only"],["sudo chown -R root:nursery /school/nursery","recursive"],["sudo chown --reference=a b","copy owner/group from a"],["find / -nouser 2>/dev/null","files whose owner no longer exists"]]},"usecase":"<p><b>System administrator:</b> after copying data as root, chown -R gives it back to the right user; otherwise the user cannot edit \"their\" files.</p><p><b>Developer:</b> web content is chown -R deploy:www-data so the deploy user writes and the web server reads.</p><p><b>Data / DevOps engineer:</b> container volumes need chown to the container's UID (e.g. 1000) or the app cannot write.</p>","terms":[["chown","Change owner (and optionally group)."],["chgrp","Change group."],["-R","Recursive."],["Orphaned file","File owned by a UID that no longer exists."],["Disk quota","Limit on space per user or group."]],"myths":[["Owners can chown their files to anyone","Only root can change the owner."],["chown changes permissions","It changes who owns; chmod changes the bits."]],"quiz":[{"q":"Who can change a file's owner?","o":["The owner","Group members","root","Anyone with w"],"a":2,"why":"chown to another user requires root."},{"q":"Set owner asha and group nursery in one command:","o":["chown asha nursery file","chown asha:nursery file","chgrp asha:nursery file","chmod asha:nursery file"],"a":1,"why":"user:group syntax."},{"q":"ls -l shows 1007 instead of a name. Why?","o":["File is corrupt","The user with UID 1007 was deleted","Wrong umask","It is a link"],"a":1,"why":"No name maps to that UID."}]},{"part":3,"title":"umask: default permissions for new files","lead":"Why new files come out as 644 or 664, and how to change the default.","scene":[{"id":"base","type":"box","x":20,"y":30,"w":370,"h":90,"k":"note","l":"Starting point","s":"new file: 666 rw-rw-rw- (never x)|new directory: 777 rwxrwxrwx"},{"id":"mask","type":"box","x":410,"y":30,"w":370,"h":90,"k":"sec","l":"umask 022","s":"bits to REMOVE|0 keep, 2 remove w, 7 remove all"},{"id":"rf","type":"box","x":20,"y":150,"w":370,"h":90,"k":"store","l":"New file: 644","s":"rw-r--r--"},{"id":"rd","type":"box","x":410,"y":150,"w":370,"h":90,"k":"store","l":"New directory: 755","s":"rwxr-xr-x"},{"id":"tab","type":"box","x":20,"y":265,"w":760,"h":110,"k":"note","l":"Common umasks","s":"022 → files 644, dirs 755   (default on many systems)|002 → files 664, dirs 775   (team sharing with private groups)|077 → files 600, dirs 700   (private)"},{"id":"set","type":"box","x":20,"y":390,"w":760,"h":70,"k":"net","l":"Set it","s":"umask 002 (this shell only)   ~/.bashrc for you   /etc/login.defs or /etc/profile for everyone"}],"steps":[{"t":"Programs ask for generous permissions","d":"When a program creates a file it usually requests 666 (rw for everyone). Directories request 777. Plain files never get x automatically.","s":["base"],"hi":["base"]},{"t":"umask removes bits","d":"The umask lists bits to take away. With umask 022: owner loses nothing (0), group and others lose w (2).","s":["mask"],"hi":["mask"],"a":"The school's standard lock policy: every new cupboard comes with the staffroom-write and everyone-write locks already engaged."},{"t":"The result","d":"666 minus the masked bits = 644 for files; 777 → 755 for folders. Check your current value with umask (or umask -S for letters).","s":["rf","rd"],"p":[{"v":["base","mask","rf"],"c":"req","l":"file","d":0,"x":false},{"v":["base","mask","rd"],"c":"req","l":"folder","d":1,"x":false}]},{"t":"Not really subtraction","d":"The mask removes bits; it does not subtract digits. 666 with umask 033 gives 644, not 633, because x was never there to remove. Use the calculator tab to check any value.","hi":["mask"],"dp":"Exact rule: result = requested AND (NOT umask). Only bits present in the request can survive. Also, umask cannot add permissions: to make a script executable you still need chmod +x."},{"t":"Choosing a umask","d":"022 keeps others from writing. 002 suits teams where each user has a private primary group and shares through SGID folders. 077 makes everything private.","s":["tab"],"hi":["tab"]},{"t":"Where it is set","d":"umask in a shell affects only that shell and its children. Put it in ~/.bashrc for yourself, or set UMASK in /etc/login.defs or /etc/profile system-wide. Services (systemd) have their own UMask= setting.","s":["set"],"hi":["set"]}],"analogy":{"intro":"Default lock settings on new cupboards.","map":[["Cupboard delivered with every lock open","Requested 666 / 777"],["School policy engaging some locks on delivery","umask"],["Final state when it reaches the room","Resulting permissions"],["Policy cannot add a feature the cupboard lacks","umask cannot add x"]]},"cmp":{"head":["umask","Files / Directories"],"rows":[["022","644 / 755"],["002","664 / 775"],["027","640 / 750"],["077","600 / 700"],["umask","show current (octal)"],["umask -S","show as letters (u=rwx,g=rx,o=rx)"],["umask 027","set for this shell"]]},"usecase":"<p><b>System administrator:</b> sets umask 027 on servers so new files are never readable by others.</p><p><b>Developer:</b> a service writes logs that colleagues cannot read; its systemd UMask= was 077.</p><p><b>Data / DevOps engineer:</b> a shared data folder works only when everyone uses umask 002 plus an SGID folder.</p>","terms":[["umask","Mask of permission bits removed from new files and folders."],["Default request","666 for files, 777 for directories (typical)."],["umask -S","Symbolic display."],["/etc/login.defs","System defaults including UMASK."],["UMask= (systemd)","umask for a service."]],"myths":[["umask is subtraction","It removes bits; 666 with 033 gives 644."],["umask can make new files executable","It can only remove bits."]],"tryit":"umask","quiz":[{"q":"umask 022: a new file gets:","o":["755","644","622","600"],"a":1,"why":"666 without group/others write."},{"q":"umask 077: a new folder gets:","o":["700","600","770","755"],"a":0,"why":"777 minus all group/others bits."},{"q":"umask 033, new file:","o":["633","644","600","744"],"a":1,"why":"Bits are removed, not digits subtracted."}]},{"part":4,"title":"Special bits: SUID, SGID and sticky","lead":"Three extra bits that solve real problems: changing your own password, shared team folders, and a safe /tmp.","scene":[{"id":"suid","type":"box","x":20,"y":30,"w":250,"h":140,"k":"sec","l":"SUID (4)","s":"-rwsr-xr-x /usr/bin/passwd|runs with the FILE OWNER's|rights (root), so it can|update /etc/shadow"},{"id":"sgid","type":"box","x":285,"y":30,"w":250,"h":140,"k":"vm","l":"SGID (2) on a folder","s":"drwxrws--- /school/nursery|new files inherit the|folder's group: nursery"},{"id":"stk","type":"box","x":550,"y":30,"w":230,"h":140,"k":"note","l":"Sticky (1)","s":"drwxrwxrwt /tmp|only a file's owner can|delete or rename it"},{"id":"asha","type":"box","x":20,"y":195,"w":150,"h":55,"k":"user","l":"👩 asha","s":""},{"id":"pw","type":"box","x":200,"y":195,"w":170,"h":55,"k":"vm","l":"passwd program","s":""},{"id":"sh","type":"box","x":400,"y":195,"w":170,"h":55,"k":"sec","l":"/etc/shadow","s":"root only"},{"id":"nf","type":"box","x":20,"y":275,"w":370,"h":70,"k":"store","l":"asha creates plan.docx in /school/nursery","s":"group: nursery (not asha), so meena can open it"},{"id":"tmp","type":"box","x":410,"y":275,"w":370,"h":70,"k":"note","l":"ravi tries rm /tmp/asha_notes.txt","s":"denied by the sticky bit"},{"id":"caps","type":"box","x":20,"y":365,"w":760,"h":95,"k":"note","l":"Writing them","s":"chmod u+s file / 4755   chmod g+s dir / 2770   chmod +t dir / 1777|lowercase s / t = bit + x present;  capital S / T = bit set but x missing (usually a mistake)"}],"steps":[{"t":"SUID: run as the file's owner","d":"Normal programs run with your own rights. A program with SUID runs with the rights of the file's owner. passwd is owned by root and has SUID, so asha can update her own entry in /etc/shadow, which she could never edit directly.","s":["suid","asha","pw","sh"],"p":[{"v":["asha","pw","sh"],"c":"req","l":"runs as root","d":0,"x":false}],"a":"A sealed form the office stamps for you: you cannot open the register, but the form is processed with office authority.","dp":"Linux ignores SUID on shell scripts for security; it only works on compiled programs. Every SUID-root program is a potential privilege-escalation target, so audit them: find / -perm -4000 -type f 2>/dev/null."},{"t":"SGID on a folder: team files stay in the team","d":"Normally a new file gets its creator's primary group (asha). With SGID on /school/nursery, every new file inside gets the folder's group, nursery, so meena can open it. New subfolders inherit SGID too.","s":["sgid","nf"],"p":[{"v":["asha","nf"],"c":"req","l":"create plan.docx","d":0,"x":false}],"a":"Every document placed in the nursery staffroom tray is automatically stamped \"Nursery\".","dp":"SGID on an executable file (rare today) makes it run with the file's group. The classic team-folder recipe: chown root:nursery dir; chmod 2770 dir; users with umask 002."},{"t":"Sticky bit: shared but safe","d":"/tmp is writable by everyone (777). Without protection, anyone could delete anyone else's files there. The sticky bit means only a file's owner (or the folder owner, or root) can delete or rename it.","s":["stk","tmp"],"p":[{"v":["tmp","stk"],"c":"bad","l":"rm denied","d":0,"x":true}],"a":"A shared notice board: anyone may pin a notice, but only its author may take it down."},{"t":"Setting and reading them","d":"Symbolic: u+s, g+s, +t. Octal: a fourth leading digit, 4 SUID, 2 SGID, 1 sticky: chmod 2770, chmod 1777. In ls -l they replace the x position: s or t when x is also set, S or T when x is missing.","s":["caps"],"hi":["caps"]}],"analogy":{"intro":"Office stamps and notice boards.","map":[["Form processed with office authority","SUID"],["Tray that stamps \"Nursery\" on everything put in","SGID folder"],["Notice board where only the author removes a notice","Sticky bit"],["Stamp present but door locked","Capital S / T"]]},"cmp":{"head":["Command / sign","Meaning"],"rows":[["chmod u+s prog / 4755","SUID"],["chmod g+s dir / 2770","SGID (group inheritance)"],["
