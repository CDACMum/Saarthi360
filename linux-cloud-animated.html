chmod +t dir / 1777","sticky bit"],["ls -ld /tmp","drwxrwxrwt"],["-rwsr-xr-x","SUID with x"],["-rwSr--r--","SUID without x (mistake)"],["find / -perm -4000 -type f","list SUID programs"],["find / -perm -2000 -type d","list SGID folders"]]},"usecase":"<p><b>System administrator:</b> builds team folders with SGID 2770 so files stay group-owned, and audits SUID binaries after a security alert.</p><p><b>Developer:</b> a shared build folder uses SGID so artefacts from different developers remain usable by the CI group.</p><p><b>Data / DevOps engineer:</b> shared upload folders use sticky bit so one pipeline cannot delete another's files.</p>","terms":[["SUID","Set-user-ID: program runs with the file owner's privileges."],["SGID","Set-group-ID: on folders, new files inherit the folder group."],["Sticky bit","On folders, only the owner may delete or rename their files."],["Privilege escalation","Gaining higher rights than intended."],["Special bits octal","4 SUID, 2 SGID, 1 sticky, as a leading digit."]],"myths":[["SUID works on shell scripts","Linux ignores it on scripts."],["Sticky bit keeps files in memory","That was an old Unix meaning; today it protects deletion in folders."]],"quiz":[{"q":"Why can normal users change their password?","o":["shadow is world-writable","passwd has SUID root","sudo is automatic","ACLs"],"a":1,"why":"SUID runs passwd as root."},{"q":"Files created in a team folder should get the team group. Use:","o":["Sticky bit","SGID on the folder","SUID","umask 777"],"a":1,"why":"SGID gives group inheritance."},{"q":"drwxrwxrwt means:","o":["SUID","SGID","Sticky bit with x for others","Broken permissions"],"a":2,"why":"t in the others x position."}]},{"part":4,"title":"ACLs: permissions beyond owner, group and others","lead":"When one owner and one group are not enough: give named users and groups their own rights.","scene":[{"id":"f","type":"box","x":20,"y":40,"w":250,"h":120,"k":"store","l":"📄 fees.xlsx","s":"owner ravi (rw)|group accounts (r)|others (none)"},{"id":"need","type":"box","x":300,"y":40,"w":480,"h":60,"k":"note","l":"Problem: priya and the nursery team also need read","s":""},{"id":"acl","type":"box","x":300,"y":115,"w":480,"h":140,"k":"vm","l":"ACL entries (getfacl fees.xlsx)","s":"user::rw-|user:priya:r--          (named user)|group::r--|group:nursery:r--       (named group)|mask::r--|other::---"},{"id":"lsp","type":"box","x":20,"y":180,"w":250,"h":75,"k":"note","l":"ls -l shows a +","s":"-rw-r-----+ 1 ravi accounts"},{"id":"mask","type":"box","x":20,"y":275,"w":370,"h":95,"k":"sec","l":"The mask","s":"upper limit for named users, named groups|and the owning group: effective = entry AND mask"},{"id":"def","type":"box","x":410,"y":275,"w":370,"h":95,"k":"net","l":"Default ACLs on folders","s":"setfacl -d -m g:nursery:rwx dir|new files inside inherit the entries"},{"id":"cmd","type":"box","x":20,"y":390,"w":760,"h":70,"k":"note","l":"Commands","s":"setfacl -m u:priya:r file   setfacl -x u:priya file   setfacl -b file   getfacl file"}],"steps":[{"t":"Three slots are not enough","d":"fees.xlsx belongs to ravi and group accounts. The principal (not in accounts) and the nursery team need read access. Adding them to accounts would expose everything else accounts can see.","s":["f","need"],"a":"A cupboard with only three locks, but four different people need different access."},{"t":"Add named entries","d":"setfacl -m u:priya:r fees.xlsx adds a rule for user priya. setfacl -m g:nursery:r fees.xlsx adds one for group nursery. getfacl shows the full list.","s":["acl"],"p":[{"v":["need","acl"],"c":"req","l":"setfacl -m u:priya:r","d":0,"x":false},{"v":["acl","f"],"c":"data","l":"","d":1.6,"x":false}]},{"t":"The + sign","d":"ls -l shows a + after the permission string when extra ACL entries exist. Always check getfacl when you see it: the nine characters no longer tell the whole story.","s":["lsp"],"hi":["lsp"]},{"t":"The mask limits extra entries","d":"The mask is a ceiling for named users, named groups and the owning group. If mask is r--, an entry granting rwx is effectively only r--. getfacl shows \"#effective:\" when the mask cuts something.","s":["mask"],"hi":["mask","acl"],"dp":"On a file with ACLs, the group bits shown by ls -l are the mask, not the owning group. So chmod g-w on that file lowers the mask and can silently remove write access from every named user and group. Recalculate with setfacl -m m::rwx if needed."},{"t":"Default ACLs for folders","d":"A default ACL on a folder (setfacl -d -m …) is copied to new files and folders created inside. Combined with SGID, this keeps a shared folder consistent forever.","s":["def"],"hi":["def"]},{"t":"Managing ACLs","d":"-m modifies or adds, -x removes one entry, -b removes all extended entries, -R applies recursively. ext4 and XFS support ACLs by default. cp -a and tar --acls preserve them; some tools do not.","s":["cmd"],"hi":["cmd"]}],"analogy":{"intro":"Special named permission slips.","map":[["Standard three locks","Owner, group, others"],["Named slip \"Priya may read\"","user:priya:r"],["Named slip for a whole staffroom","group:nursery:r"],["Office rule: no slip may exceed read","ACL mask"],["Slips pre-attached to every new cupboard in the room","Default ACL"],["+ sticker on the cupboard","ACL present"]]},"cmp":{"head":["Command","What it does"],"rows":[["getfacl file","show all ACL entries"],["setfacl -m u:priya:r file","give user priya read"],["setfacl -m g:nursery:rx dir","give group nursery read + enter"],["setfacl -x u:priya file","remove priya's entry"],["setfacl -b file","remove all extended entries"],["setfacl -d -m g:nursery:rwx dir","default ACL for new files"],["setfacl -R -m g:nursery:rX dir","recursive, X only on folders"],["setfacl -m m::rwx file","set the mask"]]},"usecase":"<p><b>System administrator:</b> gives an auditor read access to a finance folder for a month without changing groups, then removes it with setfacl -x.</p><p><b>Developer:</b> lets the web server user read one app folder owned by the developer via u:www-data:rx.</p><p><b>Data / DevOps engineer:</b> default ACLs on a landing folder ensure every file dropped by any pipeline is readable by the analytics group.</p>","terms":[["ACL","Access control list: extra named permission entries."],["Named user / named group entry","Rules for specific users or groups."],["Mask","Maximum rights for named entries and the owning group."],["Effective permissions","Entry rights after applying the mask."],["Default ACL","Inherited by new files in a directory."],["getfacl / setfacl","Read / change ACLs."],["Extended attributes","Where ACLs are stored on the filesystem."]],"myths":[["ls -l shows everything","With a +, check getfacl."],["chmod and ACLs are independent","chmod on group bits changes the ACL mask."]],"quiz":[{"q":"Give only user priya read access without changing groups:","o":["chmod o+r","setfacl -m u:priya:r file","chown priya","usermod -aG accounts priya"],"a":1,"why":"Named user ACL entry."},{"q":"An entry says rwx but mask is r--. Effective:","o":["rwx","r--","---","rw-"],"a":1,"why":"Effective = entry AND mask."},{"q":"New files in a folder should automatically get an ACL:","o":["Default ACL (-d)","Sticky bit","SUID","umask 777"],"a":0,"why":"Default ACLs are inherited."}]},{"part":4,"title":"ACL lab: the Stooges file","lead":"Session 2 lab, solved and explained: Larry and Curly get rwx, Moe gets nothing, every other stooges member gets rw. It works only because of the order in which ACL entries are checked.","scene":[{"id":"larry","type":"box","x":20,"y":30,"w":150,"h":60,"k":"user","l":"👨 larry","s":"in stooges"},{"id":"curly","type":"box","x":20,"y":105,"w":150,"h":60,"k":"user","l":"👨‍🦲 curly","s":"in stooges"},{"id":"moe","type":"box","x":20,"y":180,"w":150,"h":60,"k":"user","l":"💇 moe","s":"in stooges"},{"id":"shemp","type":"box","x":20,"y":255,"w":150,"h":60,"k":"user","l":"🧔 shemp","s":"in stooges"},{"id":"ravi","type":"box","x":20,"y":330,"w":150,"h":60,"k":"user","l":"👨 ravi","s":"not a stooge"},{"id":"acl","type":"box","x":200,"y":30,"w":260,"h":285,"k":"note","l":"getfacl /tmp/acl_file","s":"# owner: root  group: root|user::rw-|user:larry:rwx|user:curly:rwx|user:moe:---|group::---|group:stooges:rw-|mask::rwx|other::---"},{"id":"o1","type":"box","x":490,"y":30,"w":290,"h":62,"k":"vm","l":"1. Owner?","s":"root only"},{"id":"o2","type":"box","x":490,"y":102,"w":290,"h":62,"k":"sec","l":"2. Named user entry?","s":"larry, curly, moe: STOP here"},{"id":"o3","type":"box","x":490,"y":174,"w":290,"h":62,"k":"store","l":"3. Group entries (with mask)","s":"owning group, stooges"},{"id":"o4","type":"box","x":490,"y":246,"w":290,"h":62,"k":"ghost","l":"4. Others","s":"everyone else: ---"},{"id":"r1","type":"box","x":200,"y":335,"w":180,"h":55,"k":"store","l":"larry, curly: rwx","s":""},{"id":"r2","type":"box","x":395,"y":335,"w":180,"h":55,"k":"sec","l":"moe: denied","s":""},{"id":"r3","type":"box","x":590,"y":335,"w":190,"h":55,"k":"store","l":"shemp: rw-","s":""},{"id":"cmd","type":"box","x":20,"y":405,"w":760,"h":55,"k":"net","l":"One command does it","s":"sudo setfacl -m u:larry:rwx,u:curly:rwx,u:moe:---,g:stooges:rw-,g::---,o::--- /tmp/acl_file"}],"steps":[{"t":"The requirement","d":"Create /tmp/acl_file. Larry and Curly: read, write and execute. Moe: no access at all. Every other member of group stooges: read and write. Normal owner-group-others bits cannot express this, because Moe is himself a member of stooges.","s":["larry","curly","moe","shemp","ravi"],"a":"A cupboard rule: \"Larry and Curly may use everything, the rest of the team may read and write, but Moe may not even open it, although he is on the team.\""},{"t":"Prepare users, group and file","d":"Create group stooges and users larry, curly, moe and shemp, all members of stooges. As root, create the empty file /tmp/acl_file. Its owner and group are root.","s":["o1"],"hi":["o1"],"dp":"/tmp has the sticky bit (drwxrwxrwt): anyone can create files there, but only the owner can delete or rename them. So the stooges can change the file's contents if the ACL allows, but cannot delete root's file."},{"t":"Add the ACL entries","d":"One setfacl command adds named entries for larry, curly and moe, a named group entry for stooges, and removes access for the owning group (root) and others. getfacl shows the result. ls -l now shows a + after the permissions.","s":["acl","cmd"],"hi":["acl","cmd"],"p":[{"v":["cmd","acl"],"c":"req","l":"setfacl -m …","d":0,"x":false}]},{"t":"Order of checks: why Moe is blocked","d":"The kernel checks ACL entries in a fixed order: owner, then named users, then all group entries, then others. The first matching category decides. Moe matches the named-user entry user:moe:--- in step 2, so the group entry is never considered.","s":["o2","o3","o4"],"hi":["o2"],"ins":[["larry",[["Step 1 owner?","no"],["Step 2 named user?","yes: user:larry:rwx"],["Mask rwx","effective rwx → allowed"]]],["moe",[["Step 1 owner?","no"],["Step 2 named user?","yes: user:moe:---"],["Result","denied; group entries are never checked"]]],["shemp",[["Step 2 named user?","no"],["Step 3 group?","member of stooges: group:stooges:rw-"],["Result","rw- (no x)"]]],["ravi",[["Steps 2 and 3","no named entry, not in any listed group"],["Step 4 other","---: denied"]]]]},{"t":"Test every person","d":"larry and curly can write and run the file. moe gets \"Permission denied\" for reading, writing and running. shemp can read and write but not execute. ravi is an \"other\" and is denied.","s":["r1","r2","r3"],"p":[{"v":["larry","o2","r1"],"c":"res","l":"rwx ✓","d":0,"x":false},{"v":["moe","o2","r2"],"c":"bad","l":"---","d":1,"x":true},{"v":["shemp","o3","r3"],"c":"res","l":"rw ✓","d":2,"x":false},{"v":["ravi","o4"],"c":"bad","l":"denied","d":3,"x":true}]},{"t":"Watch the mask","d":"The mask is the ceiling for named entries and groups. setfacl set it to rwx automatically (the union of the entries). If someone later runs chmod g-x /tmp/acl_file, the mask drops to rw- and larry and curly silently lose execute. getfacl then shows #effective:rw-.","hi":["acl"],"set":{"acl":{"s":"# owner: root  group: root|user::rw-|user:larry:rwx  #effective:rw-|user:curly:rwx  #effective:rw-|user:moe:---|group::---|group:stooges:rw-|mask::rw-   ← after chmod g-x|other::---"}},"dp":"Restore it with sudo setfacl -m m::rwx /tmp/acl_file. Rule of thumb: on files with ACLs, change group permissions with setfacl, not chmod."}],"analogy":{"intro":"A team cupboard with a guard reading a list.","map":[["Guard checks: owner, then named people, then teams, then everyone else","ACL evaluation order"],["\"Moe: no entry\" written by name","user:moe:---"],["\"Stooges team: read and write\"","group:stooges:rw-"],["\"Larry and Curly: full use\"","named user entries rwx"],["Maximum allowed by the office for any slip","mask"],["Moe's team badge does not help him","Named user entry is checked before groups"]]},"cmp":{"head":["Command","What it does"],"rows":[["sudo groupadd stooges","create the group"],["sudo useradd -m -G stooges larry","user in stooges"],["sudo touch /tmp/acl_file","create the file"],["sudo setfacl -m u:larry:rwx,u:curly:rwx /tmp/acl_file","named users rwx"],["sudo setfacl -m u:moe:--- /tmp/acl_file","block moe explicitly"],["sudo setfacl -m g:stooges:rw-,g::---,o::--- /tmp/acl_file","team rw, nobody else"],["getfacl /tmp/acl_file","show entries and mask"],["sudo -u moe cat /tmp/acl_file","test as moe"],["sudo setfacl -b /tmp/acl_file","remove all ACL entries"],["sudo chown larry /tmp/acl_file","change owner (chown)"],["sudo chgrp stooges /tmp/acl_file","change group (chgrp)"]]},"usecase":"<p><b>System administrator:</b> a project folder is shared with the whole data team, but one contractor whose engagement ended must lose access today, without removing him from the team group that other systems rely on: setfacl -m u:contractor:--- on the folder.</p><p><b>Auditor access:</b> named user entries give an auditor read-only access to finance files for a month without joining any group.</p><p><b>Exam cell:</b> question papers are readable by the exam team but explicitly blocked for a staff member who is also a candidate's relative.</p>","terms":[["Named user entry","ACL rule for one specific user, e.g. user:moe:---."],["Named group entry","ACL rule for a specific group, e.g. group:stooges:rw-."],["ACL evaluation order","Owner → named users → groups → others."],["Mask","Upper limit for named users and all group entries."],["#effective","getfacl note when the mask reduces an entry."],["Sticky bit on /tmp","Only owners can delete their files."],["chown / chgrp","Change owner / change group of a file."]],"myths":[["Group membership always grants group rights","A named-user entry for that person is checked first and wins."],["A --- entry means \"no rule\"","It means \"explicitly no access\" for that user."],["chmod and setfacl never interfere","chmod on group bits changes the mask."]],"quiz":[{"q":"Moe is in stooges (rw-) but has user:moe:---. Result?","o":["rw-","---, denied","rwx","Depends on umask"],"a":1,"why":"Named user entries are checked before group entries."},{"q":"What can shemp (only in stooges) do with the file?","o":["rwx","rw-","r--","nothing"],"a":1,"why":"group:stooges:rw- applies."},{"q":"After chmod g-x the mask is rw-. Larry's effective rights:","o":["rwx","rw-","---","r-x"],"a":1,"why":"Effective = entry AND mask."}]},{"part":5,"title":"Inodes: where file information really lives","lead":"A file name is just a label. The real file is an inode, a numbered record holding everything except the name.","scene":[{"id":"dir","type":"box","x":20,"y":40,"w":300,"h":160,"k":"note","l":"📁 Directory /school/nursery","s":"a table of names → inode numbers|attendance.xlsx  →  131073|plan.docx        →  131080|notes.txt        →  131095"},{"id":"ino","type":"box","x":360,"y":40,"w":420,"h":230,"k":"store","l":"Inode 131073","s":"type: regular file|permissions: rw-r-----|owner UID 1001, group GID 1050|size: 4096 bytes|times: atime, mtime, ctime|link count: 1|pointers to data blocks"},{"id":"blk","type":"box","x":360,"y":290,"w":420,"h":60,"k":"db","l":"Data blocks","s":"the actual bytes of the spreadsheet"},{"id":"name","type":"box","x":20,"y":215,"w":300,"h":65,"k":"sec","l":"NOT in the inode","s":"the file name!"},{"id":"cmd","type":"box","x":20,"y":370,"w":760,"h":90,"k":"note","l":"Commands","s":"ls -i (inode numbers)   stat file (full inode)   df -i (inodes used / free)|a disk can be \"full\" while space remains, if inodes run out (millions of tiny files)"}],"steps":[{"t":"A directory is a lookup table","d":"A directory is a special file that maps names to inode numbers. That is all it stores.","s":["dir"],"a":"The library shelf list: \"Ramayana → catalogue card 131073\"."},{"t":"The inode holds the facts","d":"Opening attendance.xlsx: the kernel finds its inode number in the directory, then reads inode 131073: type, permissions, owner UID, group GID, size, timestamps, link count and where the data blocks are.","s":["ino"],"p":[{"v":["dir","ino"],"c":"req","l":"look up 131073","d":0,"x":false}],"ins":[["Identity",[["Inode number","131073 (unique within this filesystem)"],["Type","regular file"]]],["Access",[["Mode","0640 rw-r-----"],["Owner","UID 1001 (asha)"],["Group","GID 1050 (nursery)"]]],["Times",[["atime","last read"],["mtime","contents last modified"],["ctime","inode (metadata) last changed; NOT creation time"]]],["Storage",[["Size","4096 bytes"],["Links","1"],["Blocks","pointers or extents to the data"]]]],"a":"The catalogue card: who owns the book, who may borrow it, when it was last changed, and which shelf holds the pages."},{"t":"Data lives in blocks","d":"The inode points to data blocks on disk where the actual contents are stored.","s":["blk"],"p":[{"v":["ino","blk"],"c":"data","l":"read contents","d":0,"x":false}]},{"t":"The name is not in the inode","d":"The inode does not know its own name. That is why one file can have several names (hard links, next module), and why renaming within the same filesystem is instant: only the directory entry changes.","s":["name"],"hi":["name","dir"],"dp":"mv inside one filesystem rewrites a directory entry; the inode and data do not move, even for a 50 GB file. mv across filesystems must copy the data and delete the original. Permissions are on the inode, so every name for the same inode shares the same permissions."},{"t":"Inspecting and running out","d":"ls -i shows inode numbers, stat shows the whole inode, df -i shows inodes used and free. Each filesystem has a fixed number of inodes on ext4; millions of tiny files (cache, mail queues) can exhaust them while gigabytes are still free: \"No space left on device\".","s":["cmd"],"hi":["cmd"]}],"analogy":{"intro":"A library catalogue.","map":[["Shelf list: title → card number","Directory"],["Catalogue card","Inode"],["Card number","Inode number"],["Pages on the shelf","Data blocks"],["Running out of blank cards while shelves are empty","Inode exhaustion"]]},"cmp":{"head":["Command","What it shows"],"rows":[["ls -i","inode numbers"],["stat file","full inode: mode, owner, size, times, links"],["stat -c \"%i %h %U %G %a\" file","selected fields"],["df -i","inode usage per filesystem"],["find / -xdev -inum 131073","names pointing to an inode"],["touch file","update times (creates if missing)"]]},"usecase":"<p><b>System administrator:</b> a mail server says \"No space left\" with 40% disk free; df -i shows 100% inodes used by spool files.</p><p><b>Developer:</b> understands why renaming a huge file is instant but moving it to another disk takes minutes.</p><p><b>Data / DevOps engineer:</b> small-file explosions in data pipelines can exhaust inodes; batch them into larger files.</p>","terms":[["Inode","Record holding a file's metadata and data location, not its name."],["Inode number","Identifier of an inode within one filesystem."],["Directory entry","Name → inode number mapping."],["Data block","Disk unit holding file contents."],["atime / mtime / ctime","Access, modification, metadata-change times."],["stat","Command showing inode details."],["Inode exhaustion","No free inodes left although space remains."]],"myths":[["ctime is creation time","It is change time of the inode metadata."],["The file name is stored with the data","Names live only in directories."]],"quiz":[{"q":"Which is NOT stored in the inode?","o":["Owner UID","Permissions","File name","Size"],"a":2,"why":"Names are in directory entries."},{"q":"\"No space left on device\" but df -h shows free space. Check:","o":["df -i","chmod","umask","id"],"a":0,"why":"Inodes may be exhausted."},{"q":"Why is mv of a 50 GB file within the same filesystem instant?","o":["Compression","Only the directory entry changes","It uses the network","Caching"],"a":1,"why":"The inode and data stay where they are."}]},{"part":5,"title":"Hard links and soft (symbolic) links","lead":"Two different kinds of shortcuts. One is a second name for the same inode; the other is a note pointing to a path.","scene":[{"id":"d1","type":"box","x":20,"y":40,"w":220,"h":60,"k":"note","l":"report.txt","s":"→ inode 2001"},{"id":"d2","type":"box","x":20,"y":120,"w":220,"h":60,"k":"note","l":"report_hard.txt","s":"→ inode 2001"},{"id":"ino","type":"box","x":300,"y":60,"w":200,"h":110,"k":"store","l":"Inode 2001","s":"link count: 1"},{"id":"dat","type":"box","x":560,"y":60,"w":220,"h":110,"k":"db","l":"Data","s":"\"Term 1 marks…\""},{"id":"s1","type":"box","x":20,"y":220,"w":220,"h":60,"k":"net","l":"report_link","s":"symlink → inode 2050"},{"id":"sino","type":"box","x":300,"y":220,"w":200,"h":60,"k":"store","l":"Inode 2050","s":"type: link, stores a PATH"},{"id":"path","type":"box","x":560,"y":220,"w":220,"h":60,"k":"note","l":"\"report.txt\"","s":"just a text path"},{"id":"cmp","type":"box","x":20,"y":310,"w":760,"h":150,"k":"note","l":"Hard link versus soft link","s":"Hard: another name for the SAME inode   same inode number   survives deleting the original|      cannot cross filesystems   cannot link directories|Soft: small file holding a path   own inode   breaks if the target is deleted or moved|      can cross filesystems   can point to directories   ls -l shows l and ->"}],"steps":[{"t":"One file, one name","d":"report.txt points to inode 2001, which holds the data. Link count is 1.","s":["d1","ino","dat"],"p":[{"v":["d1","ino","dat"],"c":"req","l":"open","d":0,"x":false}]},{"t":"Hard link: a second name","d":"ln report.txt report_hard.txt adds another directory entry pointing to the same inode 2001. Link count becomes 2. Both names are equal: neither is the \"original\". Same permissions, same data.","s":["d2"],"set":{"ino":{"s":"link count: 2"}},"p":[{"v":["d2","ino"],"c":"req","l":"same inode","d":0,"x":false}],"a":"Two entries in the library shelf list pointing to the same catalogue card."},{"t":"Delete one name, data survives","d":"rm report.txt removes one name and decreases the link count to 1. report_hard.txt still works perfectly. Data is freed only when the link count reaches 0 and no program has the file open.","set":{"d1":{"k":"ghost","s":"rm report.txt"},"ino":{"s":"link count: 1"}},"p":[{"v":["d2","ino","dat"],"c":"res","l":"still works","d":0,"x":false}],"dp":"rm really means \"unlink\": it removes a directory entry. A large log deleted while a service still holds it open keeps using disk space until the service restarts. Find such files with: lsof +L1."},{"t":"Soft link: a note with a path","d":"ln -s report.txt report_link creates a new small file (its own inode, type l) that contains the path \"report.txt\". Opening it makes the kernel follow the path to the real file.","s":["s1","sino","path"],"set":{"d1":{"k":"note","s":"→ inode 2001"},"ino":{"s":"link count: 2"}},"p":[{"v":["s1","sino","path","d1","ino"],"c":"req","l":"follow path","d":0,"x":false}],"a":"A sticky note saying \"see shelf 4, Ramayana\". It is not the book."},{"t":"Delete the target: dangling link","d":"If report.txt is deleted or moved, the soft link still contains \"report.txt\" but nothing is there. It becomes a broken (dangling) link. The hard link would have kept working.","set":{"d1":{"k":"ghost","s":"deleted"}},"p":[{"v":["s1","sino","path"],"c":"bad","l":"No such file","d":0,"x":true}],"dp":"Relative symlinks are resolved from the link's own folder, not from where you run the command. ln -s ../data/file link is relative; ln -s /srv/data/file link is absolute. Symlinks always show lrwxrwxrwx; the target's permissions are what count."},{"t":"Choosing between them","d":"Use soft links for convenience shortcuts, pointing to folders, across disks, and version switching (current → release-42). Hard links are for special cases such as backup tools that store unchanged files once.","s":["cmp"],"hi":["cmp"],"set":{"d1":{"k":"note","s":"→ inode 2001"}}}],"analogy":{"intro":"Library catalogue entries and sticky notes.","map":[["Second shelf-list entry pointing to the same card","Hard link"],["Card shows how many entries point to it","Link count"],["Removing one entry; the book stays","rm one hard link"],["Sticky note \"see shelf 4\"","Soft link"],["Note pointing to an empty shelf","Dangling symlink"]]},"cmp":{"head":["Command","What it does"],"rows":[["ln target hardlink","create hard link"],["ln -s target symlink","create soft link"],["ls -li","inode numbers and link counts"],["readlink -f link","show final resolved path"],["find . -xtype l","find broken symlinks"],["ln -sfn release-43 current","switch a symlink atomically-ish"],["unlink name","remove one name (like rm)"]]},"usecase":"<p><b>System administrator:</b> /etc/nginx/sites-enabled contains symlinks to files in sites-available; enable a site by linking, disable by removing the link.</p><p><b>Developer:</b> deploys to /srv/app/releases/43 and points /srv/app/current at it; rollback is changing one symlink.</p><p><b>Data / DevOps engineer:</b> a \"latest\" symlink always points to today's data folder; snapshot backup tools use hard links to keep unchanged files once.</p>","terms":[["Hard link","Additional directory entry for an existing inode."],["Soft / symbolic link","Special file containing a path to another file."],["Link count","Number of hard links to an inode."],["Dangling link","Symlink whose target does not exist."],["unlink","Remove a directory entry."],["readlink","Show where a symlink points."],["Relative / absolute symlink","Path resolved from the link's folder / from /."]],"myths":[["Deleting the original breaks hard links","Hard links are equal names; data survives."],["A symlink copies the file","It only stores a path."],["You can hard-link folders","Not allowed for users; use symlinks."]],"quiz":[{"q":"Hard link and original have:","o":["Different inode numbers","The same inode number","Different permissions","Different data"],"a":1,"why":"Same inode, two names."},{"q":"Target deleted. Which still opens the data?","o":["Soft link","Hard link","Both","Neither"],"a":1,"why":"Hard links keep the inode alive."},{"q":"Link to a folder on another disk:","o":["Hard link","Soft link","chmod","chown"],"a":1,"why":"Only symlinks cross filesystems and point to directories."}]},{"part":5,"title":"Mounting and unmounting: attaching storage","lead":"Linux has one tree. A disk, a USB stick or a network share appears only when it is mounted on a folder, and must be unmounted before removal.","scene":[{"id":"sda","type":"box","x":20,"y":30,"w":200,"h":95,"k":"srv","l":"💽 /dev/sda (disk)","s":"sda1 → /boot/efi|sda2 → /|sda3 → /home"},{"id":"sdb","type":"box","x":20,"y":145,"w":200,"h":70,"k":"my","l":"🔌 /dev/sdb1 (USB)","s":"vfat, 32 GB"},{"id":"nfs","type":"box","x":20,"y":235,"w":200,"h":70,"k":"net","l":"🌐 NFS share","s":"server:/exports/data"},{"id":"root","type":"box","x":380,"y":30,"w":120,"h":45,"k":"store","l":"/","s":""},{"id":"home","type":"box","x":250,"y":110,"w":110,"h":45,"k":"store","l":"/home","s":""},{"id":"mnt","type":"box","x":380,"y":110,"w":120,"h":45,"k":"store","l":"/mnt","s":""},{"id":"data","type":"box","x":530,"y":110,"w":110,"h":45,"k":"store","l":"/data","s":""},{"id":"usb","type":"box","x":380,"y":190,"w":120,"h":45,"k":"ghost","l":"/mnt/usb","s":"empty folder"},{"id":"m1","type":"line","a":"root","b":"home"},{"id":"m2","type":"line","a":"root","b":"mnt"},{"id":"m3","type":"line","a":"root","b":"data"},{"id":"m4","type":"line","a":"mnt","b":"usb"},{"id":"fst","type":"box","x":250,"y":265,"w":530,"h":95,"k":"note","l":"/etc/fstab (mounted at every boot)","s":"UUID=3f2a…  /data  ext4  defaults,noatime  0 2|server:/exports/data  /mnt/nfs  nfs  defaults,_netdev  0 0|find UUIDs with: sudo blkid   ·   test with: sudo mount -a"},{"id":"busy","type":"box","x":20,"y":325,"w":210,"h":135,"k":"sec","l":"umount: target is busy","s":"you are inside it (cd /)|or a program has a file|open: lsof +f -- /mnt/usb|        fuser -vm /mnt/usb"},{"id":"io","type":"box","x":250,"y":375,"w":530,"h":85,"k":"vm","l":"I/O path","s":"program → page cache (RAM) → disk later|sync forces cached writes to disk; umount does sync|ro · noexec · nosuid · nodev: options that restrict a mount"}],"steps":[{"t":"Storage devices are files in /dev","d":"Disks appear as /dev/sda, /dev/sdb (or /dev/nvme0n1 for NVMe SSDs), partitions as /dev/sda1, /dev/sda2. lsblk shows the tree of disks and partitions and where each is mounted.","s":["sda","sdb","nfs"],"hi":["sdb"],"a":"Book boxes delivered to the school: they exist, but nobody can read them until they are shelved in a room.","dp":"Block devices (b in ls -l) transfer data in blocks, like disks; character devices (c) transfer a stream of bytes, like terminals and /dev/null. That is the \"Basics of I/O\" in one line."},{"t":"A filesystem is needed first","d":"A new partition must be formatted with a filesystem: sudo mkfs.ext4 /dev/sdb1 for Linux, vfat or exfat for USB sticks shared with Windows. Formatting erases everything on that partition, so check the device name twice with lsblk.","hi":["sdb"]},{"t":"Mount: attach it to the tree","d":"sudo mount /dev/sdb1 /mnt/usb attaches the USB stick at the empty folder /mnt/usb, the mount point. Its files now appear under /mnt/usb. Anything that was inside /mnt/usb before is hidden until you unmount.","s":["root","home","mnt","data","usb","m1","m2","m3","m4"],"p":[{"v":["sdb","usb"],"c":"req","l":"mount","d":0,"x":false}],"set":{"usb":{"k":"store","s":"USB files here"}},"dp":"mount without arguments, or findmnt, lists everything mounted. Desktops mount USB sticks automatically under /media/username/. Servers do it manually or through /etc/fstab."},{"t":"Unmount before removing","d":"sudo umount /mnt/usb (the command is umount, without the n). It flushes cached writes and detaches the device. If it says \"target is busy\", someone is using it: your shell may be inside the folder, or a program has a file open there.","s":["busy"],"hi":["busy"],"p":[{"v":["usb","sdb"],"c":"res","l":"umount","d":0,"x":false}],"set":{"usb":{"k":"ghost","s":"empty folder"}}},{"t":"Permanent mounts with /etc/fstab","d":"Lines in /etc/fstab are mounted at every boot. Use the UUID (from sudo blkid) rather than /dev/sdb1, because device names can change when disks are added. Always test with sudo mount -a before rebooting: a broken fstab line can stop the machine from booting normally.","s":["fst"],"hi":["fst"],"p":[{"v":["sda","data"],"c":"data","l":"UUID=3f2a…","d":0,"x":false}],"ins":[["UUID=3f2a…",[["Field 1","what to mount: UUID, LABEL, device or server:/path"]]],["/data",[["Field 2","mount point (folder must exist)"]]],["ext4",[["Field 3","filesystem type: ext4, xfs, vfat, nfs"]]],["defaults,noatime",[["Field 4","options; noatime skips access-time writes"]]],["0 2",[["Field 5","dump backup flag (0)"],["Field 6","fsck order: 1 for /, 2 for others, 0 none"]]]]},{"t":"I/O and mount options","d":"Writes first go to the page cache in RAM and reach the disk a little later, which makes Linux fast. sync forces the flush; umount does it automatically, which is why pulling out a USB stick without unmounting can lose data. Options like ro (read-only), noexec (no programs) and nosuid harden a mount.","s":["io"],"hi":["io"],"a":"Teachers write marks on a whiteboard first and copy them into the register at the end of the day. sync is \"copy to the register now\"."}],"analogy":{"intro":"Shelving new book boxes in a library.","map":[["Sealed box of books","Block device (/dev/sdb1)"],["Organising the box into numbered shelves","Formatting (mkfs)"],["Putting the shelf in a particular room","Mounting at a mount point"],["Room's old contents hidden behind the new shelf","Hidden files under a mount point"],["Permanent shelving plan of the building","/etc/fstab"],["\"Someone is still reading in that room\"","target is busy"],["Copying whiteboard notes into the register","sync / page cache flush"]]},"cmp":{"head":["Command","What it does"],"rows":[["lsblk / lsblk -f","disks, partitions, filesystems, mount points"],["sudo blkid","UUIDs and types"],["df -h / du -sh dir","free space / folder size"],["sudo mkfs.ext4 /dev/sdb1","format (erases!)"],["sudo mkdir -p /mnt/usb","create mount point"],["sudo mount /dev/sdb1 /mnt/usb","mount"],["sudo mount -o ro /dev/sdb1 /mnt/usb","mount read-only"],["findmnt / mount | grep sdb","what is mounted"],["sudo umount /mnt/usb","unmount"],["sudo lsof +f -- /mnt/usb / fuser -vm","who is using it"],["sudo mount -a","test /etc/fstab"],["sync","flush cached writes"]]},"usecase":"<p><b>Cloud engineer:</b> attaches a new 100 GB EBS volume to an EC2 instance; it appears as /dev/nvme1n1, gets formatted, mounted at /data and added to fstab by UUID with the nofail option.</p><p><b>Data engineer:</b> mounts a shared NFS export so every Spark worker sees the same input folder.</p><p><b>System administrator:</b> mounts /tmp with noexec so downloaded malware cannot be executed from there.</p>","terms":[["Block device","Device read and written in blocks, e.g. disks."],["Character device","Device handled as a byte stream, e.g. terminals."],["Partition","Section of a disk."],["Filesystem","Structure that organises files on a partition (ext4, xfs)."],["mkfs","Create a filesystem (format)."],["Mount point","Folder where a filesystem is attached."],["mount / umount","Attach / detach a filesystem."],["/etc/fstab","List of filesystems mounted at boot."],["UUID","Unique ID of a filesystem; stable across reboots."],["Page cache","RAM holding recently read and pending written data."],["sync","Write cached data to disk now."],["NFS","Network File System: mount a remote folder."]],"myths":[["The command is unmount","It is umount."],["/dev/sdb1 always means the same disk","Names can change; use UUIDs in fstab."],["Data is on the USB as soon as cp finishes","It may still be in cache; unmount (or sync) first."]],"quiz":[{"q":"Attach /dev/sdb1 at /mnt/usb:","o":["sudo attach /dev/sdb1","sudo mount /dev/sdb1 /mnt/usb","sudo umount /mnt/usb","sudo mkfs /mnt/usb"],"a":1,"why":"mount device mountpoint."},{"q":"umount says \"target is busy\". A common cause:","o":["Disk is full","Your shell is inside that folder","Wrong UUID","No sudo"],"a":1,"why":"cd out, or find users with lsof/fuser."},{"q":"Why use UUID in /etc/fstab?","o":["It is shorter","Device names like sdb can change between boots","Required by ext4","Faster mounting"],"a":1,"why":"UUIDs stay the same."}]},{"part":6,"title":"Remote access: telnet, ftp, ssh and sftp","lead":"Working on a server you cannot touch. Why telnet and FTP are dangerous today, and how SSH keys protect every cloud login.","scene":[{"id":"lap","type":"box","x":20,"y":40,"w":150,"h":80,"k":"user","l":"💻 Your laptop","s":"client"},{"id":"net","type":"box","x":260,"y":40,"w":280,"h":80,"k":"net","l":"Network / Internet","s":"Wi-Fi, ISP, routers"},{"id":"eve","type":"box","x":310,"y":140,"w":180,"h":60,"k":"sec","l":"👀 Eavesdropper","s":"same Wi-Fi"},{"id":"zs","type":"zone","x":600,"y":25,"w":180,"h":250,"k":"plain","l":"Server ports"},{"id":"p23","type":"box","x":615,"y":55,"w":150,"h":50,"k":"down","l":"23 telnet","s":"plain text"},{"id":"p21","type":"box","x":615,"y":115,"w":150,"h":50,"k":"down","l":"21 ftp","s":"plain text"},{"id":"p22","type":"box","x":615,"y":175,"w":150,"h":80,"k":"store","l":"22 ssh","s":"encrypted|also sftp, scp"},{"id":"keys","type":"box","x":20,"y":290,"w":370,"h":170,"k":"vm","l":"SSH key login","s":"ssh-keygen -t ed25519|private key: ~/.ssh/id_ed25519 (keep secret)|public key → server ~/.ssh/authorized_keys|ssh-copy-id asha@server|server checks a signature, no password sent"},{"id":"ft","type":"box","x":410,"y":290,"w":370,"h":170,"k":"note","l":"File transfer over SSH","s":"sftp asha@server|  put local.csv   get remote.log|  ls  cd  lcd  bye|scp report.pdf asha@server:/home/asha/|rsync -avz data/ asha@server:/data/"}],"steps":[{"t":"Why remote access?","d":"Servers live in data centres or the cloud, often without a screen or keyboard. Administrators log in over the network, run commands and copy files. The protocol used decides whether anyone on the way can read your password.","s":["lap","net","zs","p23","p21","p22"],"a":"Phoning the school office instead of walking there: what matters is whether anyone can listen to the call."},{"t":"telnet: everything in plain text","d":"telnet (port 23) sends every keystroke, including your password, unencrypted. Anyone on the same Wi-Fi or any router on the path can capture it. It is disabled on modern servers; today telnet (or nc) is only used to test whether a port is open: telnet server 80.","s":["eve"],"hi":["p23","eve"],"p":[{"v":["lap","net","p23"],"c":"bad","l":"pass: Asha@123","d":0,"x":false},{"v":["net","eve"],"c":"bad","l":"I can read it!","d":1.2,"x":false}]},{"t":"FTP: plain text too","d":"FTP (ports 21 for commands, 20 or a random port for data) transfers files but also sends the username and password in plain text. Anonymous FTP still exists for public downloads; for anything private use SFTP or FTPS instead.","hi":["p21","eve"],"p":[{"v":["lap","net","p21"],"c":"bad","l":"USER asha PASS …","d":0,"x":false},{"v":["net","eve"],"c":"bad","l":"captured","d":1.2,"x":false}]},{"t":"SSH: an encrypted tunnel","d":"ssh asha@server connects to port 22. Client and server first agree on encryption keys, so everything after that, including the password, is unreadable to the eavesdropper. On the first connection you are asked to confirm the server's fingerprint; it is then saved in ~/.ssh/known_hosts.","hi":["p22"],"p":[{"v":["lap","net","p22"],"c":"res","l":"🔒 encrypted","d":0,"x":false},{"v":["net","eve"],"c":"data","l":"????","d":1.2,"x":false}],"ins":[["telnet",[["Port","23"],["Eavesdropper sees","login: asha / Password: Asha@123"],["Use today","never for logins"]]],["ftp",[["Port","21 (+ data port)"],["Eavesdropper sees","USER asha / PASS Asha@123 / file contents"]]],["ssh",[["Port","22"],["Eavesdropper sees","random-looking encrypted bytes"],["Bonus","server identity checked via known_hosts"]]],["sftp / scp",[["Port","22 (runs inside SSH)"],["Eavesdropper sees","nothing useful"]]]],"dp":"\"WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!\" means the server's key differs from the saved one. It happens after a server rebuild, but can also mean someone is intercepting the connection. Verify before running ssh-keygen -R server to remove the old entry."},{"t":"Keys instead of passwords","d":"ssh-keygen -t ed25519 creates a key pair. The private key never leaves your laptop; the public key goes into ~/.ssh/authorized_keys on the server (ssh-copy-id does it). At login the server sends a challenge only the private key can sign. Cloud VMs such as AWS EC2 work exactly this way with a .pem key.","s":["keys"],"hi":["keys"],"p":[{"v":["keys","p22"],"c":"res","l":"signature ✓","d":0,"x":false}],"a":"A padlock (public key) you can hand out freely, and the only key that opens it (private key) stays in your pocket.","dp":"The private key must be readable only by you: chmod 600 ~/.ssh/id_ed25519 (or chmod 400 key.pem), otherwise ssh refuses to use it. Hardening on the server, in /etc/ssh/sshd_config: PasswordAuthentication no and PermitRootLogin no, then sudo systemctl restart ssh."},{"t":"Copying files securely: sftp, scp, rsync","d":"sftp opens an interactive session over SSH: put uploads, get downloads, lcd changes the local folder. scp copies in one command. rsync -avz copies only what changed, ideal for large or repeated transfers. All three use port 22 and your SSH keys.","s":["ft"],"hi":["ft"],"p":[{"v":["lap","p22"],"c":"data","l":"report.pdf","d":0,"x":false},{"v":["p22","lap"],"c":"data","l":"remote.log","d":1.5,"x":false}]}],"analogy":{"intro":"Sending messages to the head office.","map":[["Postcard anyone can read","telnet"],["Postcard with a parcel attached","FTP"],["Sealed, tamper-proof courier bag","SSH"],["Courier bag used for parcels","sftp / scp"],["Open padlock you give to the office","Public key"],["The only key that opens it, kept by you","Private key"],["Office's list of padlocks it accepts","authorized_keys"]]},"cmp":{"head":["Command","What it does"],"rows":[["ssh asha@10.0.0.5","log in"],["ssh -p 2222 asha@host","non-standard port"],["ssh -i key.pem ubuntu@IP","log in with a key file (cloud)"],["ssh-keygen -t ed25519","create a key pair"],["ssh-copy-id asha@host","install your public key"],["ssh asha@host \"df -h\"","run one remote command"],["sftp asha@host (put, get, ls, lcd)","interactive file transfer"],["scp f.csv asha@host:/data/","copy a file"],["scp -r asha@host:/logs ./","copy a folder back"],["rsync -avz dir/ asha@host:/backup/","sync changes only"],["nc -zv host 22 / telnet host 22","is the port open?"],["~/.ssh/config","shortcuts: Host, HostName, User, IdentityFile"]]},"usecase":"<p><b>Cloud engineer:</b> every EC2 login is ssh -i key.pem ubuntu@public-ip; password login is disabled by default on cloud images.</p><p><b>Data engineer:</b> a partner delivers daily files by SFTP; a cron job runs sftp -b batch.txt to download them at 2 am.</p><p><b>System administrator:</b> GitHub accepts pushes over SSH keys; the same key pair can log in to servers and push code.</p>","terms":[["telnet","Remote login protocol without encryption (port 23)."],["FTP","File Transfer Protocol without encryption (port 21)."],["SSH","Secure Shell: encrypted remote login (port 22)."],["sshd","The SSH server daemon."],["Host key / known_hosts","Server identity / list of trusted servers."],["Key pair","Private key (secret) + public key (shareable)."],["authorized_keys","Public keys allowed to log in to an account."],["SFTP","File transfer running inside SSH."],["scp","Secure copy over SSH."],["rsync","Efficient sync tool, usually over SSH."],["FTPS","FTP with TLS encryption (different from SFTP)."]],"myths":[["SFTP is FTP with security added","SFTP is a separate protocol running over SSH; FTPS is FTP with TLS."],["A long password over telnet is safe","Telnet sends it in plain text, whatever its length."],["Sharing your public key is risky","The public key is meant to be shared; protect the private key."]],"quiz":[{"q":"Which protocol encrypts the login?","o":["telnet","ftp","ssh","http"],"a":2,"why":"SSH encrypts the whole session."},{"q":"Which file must never leave your laptop?","o":["id_ed25519.pub","id_ed25519","authorized_keys","known_hosts"],"a":1,"why":"That is the private key."},{"q":"Copy report.pdf to the server's /tmp:","o":["scp report.pdf asha@host:/tmp/","ftp -put report.pdf","ssh report.pdf /tmp","cp report.pdf host:/tmp"],"a":0,"why":"scp source user@host:path."}]},{"part":6,"title":"The vi / vim editor","lead":"Every Linux server has vi, often with no other editor available. Learn its modes, and editing becomes fast instead of frightening.","scene":[{"id":"norm","type":"box","x":290,"y":170,"w":220,"h":90,"k":"srv","l":"NORMAL mode","s":"move, delete, copy,|paste (start here)"},{"id":"ins","type":"box","x":30,"y":40,"w":220,"h":90,"k":"store","l":"INSERT mode","s":"type text|(-- INSERT -- at bottom)"},{"id":"cmdl","type":"box","x":550,"y":40,"w":220,"h":90,"k":"vm","l":"COMMAND-LINE mode","s":":w save  :q quit|:%s/a/b/g replace"},{"id":"vis","type":"box","x":30,"y":300,"w":220,"h":90,"k":"my","l":"VISUAL mode","s":"select text|v  V  Ctrl+v"},{"id":"srch","type":"box","x":550,"y":300,"w":220,"h":90,"k":"net","l":"Search","s":"/word forward|?word back  n N"},{"id":"k1","type":"box","x":30,"y":145,"w":220,"h":140,"k":"note","l":"Enter insert","s":"i before cursor|a after cursor|o new line below|O new line above|A end of line"},{"id":"k2","type":"box","x":550,"y":145,"w":220,"h":140,"k":"note","l":"Save and quit","s":":w  save   :q  quit|:wq or ZZ  save + quit|:q!  quit, discard|:w new.txt  save as|:x  save if changed"},{"id":"k3","type":"box","x":270,"y":300,"w":260,"h":160,"k":"note","l":"Normal-mode commands","s":"h j k l  move   w b word|0 $  line start/end|gg G  file start/end  :25|x char  dd line  dw word|yy copy line  p paste|u undo  Ctrl+r redo  . repeat"},{"id":"esc","type":"box","x":290,"y":40,"w":220,"h":110,"k":"sec","l":"Esc","s":"always returns|to NORMAL mode|(press twice if|unsure)"}],"steps":[{"t":"Why vi?","d":"vi (today usually vim, \"vi improved\") is installed on practically every Linux and Unix system, including minimal servers and containers where nano or gedit is missing. Editing a config file over SSH at 2 am often means vi.","s":["norm"],"a":"A Swiss army knife: always in your pocket, odd at first, very quick once learned.","dp":"gedit is the graphical editor of GNOME desktops: it behaves like Notepad and is fine on a desktop VM (gedit notes.txt &). nano is a simple terminal editor with menus at the bottom. vimtutor is a 30-minute built-in vim lesson: run it once."},{"t":"Modes: the one idea to understand","d":"vi starts in NORMAL mode, where keys are commands, not text. Pressing i switches to INSERT mode, where you type. Esc always brings you back to NORMAL. : opens the COMMAND-LINE at the bottom for saving, quitting and replacing.","s":["ins","cmdl","esc","k1"],"hi":["norm","ins"],"p":[{"v":["norm","ins"],"c":"req","l":"i","d":0,"x":false},{"v":["ins","esc","norm"],"c":"res","l":"Esc","d":1.4,"x":false},{"v":["norm","cmdl"],"c":"req","l":":wq","d":2.8,"x":false}]},{"t":"Saving and quitting","d":"In NORMAL mode type :w to save, :q to quit, :wq (or ZZ) to save and quit, :q! to quit without saving. If vi refuses to quit with \"No write since last change\", you have unsaved edits: choose :wq or :q!.","s":["k2"],"hi":["k2","cmdl"],"dp":"\"E45: readonly option is set\" or \"Can't open file for writing\" means you opened a root-owned file as a normal user. Save it with :w !sudo tee % > /dev/null, or quit and reopen with sudo vim (or sudoedit)."},{"t":"Moving and editing in NORMAL mode","d":"h j k l move left, down, up, right. w and b jump by words; 0 and $ to the start and end of the line; gg and G to the start and end of the file; :25 to line 25. x deletes a character, dd a line, u undoes, Ctrl+r redoes, and . repeats the last change.","s":["k3"],"hi":["k3"],"ins":[["3dd",[["Does","delete 3 lines (numbers repeat commands)"]]],["dw / d$",[["Does","delete to end of word / end of line"]]],["cw",[["Does","change word: delete it and enter insert mode"]]],["r x",[["Does","replace one character with x"]]],["J",[["Does","join this line with the next"]]],[".",[["Does","repeat the last change"]]]]},{"t":"Cut, copy and paste","d":"dd cuts a line, yy copies (yanks) it, p pastes below, P above. 5yy copies 5 lines. For any region press v (characters), V (whole lines) or Ctrl+v (a column block), move to extend the selection, then y to copy or d to cut.","s":["vis"],"hi":["vis"],"p":[{"v":["norm","vis"],"c":"req","l":"V","d":0,"x":false},{"v":["vis","norm"],"c":"res","l":"y","d":1.4,"x":false}]},{"t":"Find and replace","d":"/error searches forward, ?error backwards; n and N move to the next and previous match. :%s/old/new/g replaces every occurrence in the file; add c (:%s/old/new/gc) to confirm each one; :10,20s/old/new/g limits it to lines 10 to 20.","s":["srch"],"hi":["srch","cmdl"],"p":[{"v":["norm","srch"],"c":"req","l":"/error","d":0,"x":false}],"dp":"In the replacement, & means the matched text: :%s/[0-9]\\+/<&>/g wraps every number in < >. Use a different separator for paths: :%s#/old/path#/new/path#g."},{"t":"The set command and other tools","d":":set number shows line numbers, :set ignorecase makes searches case-insensitive, :set hlsearch highlights matches, :set autoindent keeps indentation, :set tabstop=4 expandtab uses 4 spaces for Tab, :set list reveals Tabs. Put them in ~/.vimrc to apply every time. :r file inserts a file, :!ls runs a shell command, :sp other.txt splits the window.","hi":["cmdl"]}],"analogy":{"intro":"A typewriter with a separate control panel.","map":[["Control panel: moving the carriage, cutting paper","NORMAL mode"],["Typing on the keys","INSERT mode"],["Office instructions: file it, discard it","COMMAND-LINE mode (:w, :q)"],["Highlighter pen","VISUAL mode"],["\"Back to the control panel\"","Esc"],["Photocopy and paste back","yy and p"],["Find-and-replace sheet","%s/old/new/g"]]},"cmp":{"head":["Keys","What they do"],"rows":[["vim file / vimtutor","open / learn"],["i a o A O","enter insert mode"],["Esc","back to normal mode"],[":w :q :wq ZZ :q!","save, quit, both, discard"],["h j k l w b 0 $ gg G :n","move"],["x dd dw D","delete char / line / word / to end"],["yy 5yy p P","copy, paste below / above"],["v V Ctrl+v then y or d","select, copy or cut"],["u Ctrl+r .","undo, redo, repeat"],["/text ?text n N","search"],[":%s/old/new/g  (gc confirm)","replace all"],[":set nu ic hlsearch ai"," line numbers, ignore case, highlight, autoindent"],[":r file  :!cmd  :sp file","insert file, run shell, split"],["gedit file &","graphical editor (desktop)"]]},"usecase":"<p><b>System administrator:</b> a web server will not start; ssh in, sudo vim /etc/nginx/sites-available/default, :25 jumps to the line in the error message, fix, :wq, then sudo nginx -t.</p><p><b>Data engineer:</b> :%s/;/,/g converts a semicolon-separated file to CSV in a second.</p><p><b>DevOps engineer:</b> containers and minimal cloud images often have only vi; editing a YAML file there needs :set expandtab so no Tab characters break it.</p>","terms":[["vi / vim","Modal text editor present on almost every Unix system."],["Normal mode","Keys are commands."],["Insert mode","Keys type text."],["Command-line mode","Commands typed after : at the bottom."],["Visual mode","Select text to act on."],["Yank","vi word for copy."],["Register","Clipboard slots in vim."],[".vimrc","vim settings file in your home folder."],["gedit","Graphical text editor on GNOME desktops."],["nano","Simple menu-driven terminal editor."]],"myths":[["You cannot exit vi","Esc, then :q! (discard) or :wq (save)."],["vi is only for experts","Ten commands cover most daily editing."],["Typing in normal mode inserts text","Normal-mode keys are commands; press i first."]],"quiz":[{"q":"Quit without saving changes:","o":[":wq",":q!","ZZ",":w"],"a":1,"why":":q! discards changes."},{"q":"Replace every \"dbda\" with \"DBDA\" in the file:","o":["/dbda/DBDA",":%s/dbda/DBDA/g",":r dbda",":set dbda"],"a":1,"why":"% means all lines; g all matches per line."},{"q":"Copy 3 lines and paste them below:","o":["3dd then p","3yy then p","v3 then y","yy3 then P"],"a":1,"why":"yank 3 lines, paste."}]},{"part":7,"title":"Shells, variables and startup files","lead":"Which shell you are using, the difference between ordinary and environment variables, and which file bash reads when: .profile, .bash_profile, .bashrc and .bash_logout.","scene":[{"id":"types","type":"box","x":20,"y":25,"w":240,"h":215,"k":"note","l":"Types of shells","s":"sh     Bourne shell (1979)|bash   Bourne Again: Ubuntu, RHEL|dash   /bin/sh on Ubuntu, fast|ksh    Korn: AIX, banks|csh / tcsh  C-like syntax|zsh    macOS default|fish   friendly, interactive|list: cat /etc/shells"},{"id":"vars","type":"box","x":20,"y":255,"w":240,"h":205,"k":"vm","l":"Variables","s":"user-defined: X=5|  only this shell|environment: export X|  passed to child programs|PATH HOME USER SHELL|PWD PS1 LANG|env  printenv  set"},{"id":"a1","type":"line","a":"login","b":"eprof"},{"id":"a2","type":"line","a":"eprof","b":"uprof"},{"id":"a3","type":"line","a":"nonl","b":"ebrc"},{"id":"a4","type":"line","a":"ebrc","b":"ubrc"},{"id":"a5","type":"line","a":"uprof","b":"ubrc"},{"id":"login","type":"box","x":290,"y":25,"w":235,"h":55,"k":"user","l":"Login shell","s":"ssh, console, su -"},{"id":"nonl","type":"box","x":545,"y":25,"w":235,"h":55,"k":"user","l":"Non-login interactive","s":"new terminal tab, bash"},{"id":"eprof","type":"box","x":290,"y":100,"w":235,"h":55,"k":"srv","l":"/etc/profile","s":"system-wide, every user"},{"id":"ebrc","type":"box","x":545,"y":100,"w":235,"h":55,"k":"srv","l":"/etc/bash.bashrc","s":"system-wide"},{"id":"uprof","type":"box","x":290,"y":175,"w":235,"h":90,"k":"vm","l":"First one found:","s":"~/.bash_profile|~/.bash_login|~/.profile"},{"id":"ubrc","type":"box","x":545,"y":175,"w":235,"h":90,"k":"vm","l":"~/.bashrc","s":"aliases, prompt (PS1),|functions"},{"id":"lo","type":"box","x":290,"y":285,"w":235,"h":55,"k":"sec","l":"~/.bash_logout","s":"runs at logout"},{"id":"src","type":"box","x":545,"y":285,"w":235,"h":55,"k":"note","l":"source ~/.bashrc","s":"apply changes now"},{"id":"pos","type":"box","x":290,"y":360,"w":490,"h":100,"k":"note","l":"Positional parameters","s":"$0 name   $1 … $9  ${10}   $# count|\"$@\" each argument separately   \"$*\" one string|shift: $2 becomes $1   $? exit code   $$ PID"}],"steps":[{"t":"Many shells, one job","d":"A shell reads what you type and runs programs. Unix has had several: the original Bourne shell (sh), the C shell (csh) with C-like syntax, the Korn shell (ksh), and bash, the Bourne Again Shell, which is the default login shell on Ubuntu and Red Hat. zsh is the default on macOS. /etc/shells lists the shells installed.","s":["types"],"hi":["types"],"a":"Different interpreters in the same office: each understands requests, but each has its own accent and shortcuts.","dp":"echo $0 shows the shell you are running now; echo $SHELL shows your login shell from /etc/passwd. chsh -s /bin/zsh changes your login shell. On Ubuntu /bin/sh is dash, a smaller and faster shell, so a script starting with #!/bin/sh cannot use bash-only features like [[ ]] or arrays."},{"t":"User-defined versus environment variables","d":"X=5 creates a variable inside the current shell only. export X makes it an environment variable, copied to every program started from this shell. That is how PATH, HOME and LANG reach every command you run.","s":["vars"],"hi":["vars"],"ins":[["X=5; bash; echo $X",[["Output","(empty line)"],["Why","X was not exported, so the child shell does not have it"]]],["export X=5; bash; echo $X",[["Output","5"],["Why","exported variables are copied to children"]]],["PATH",[["Value","/usr/local/bin:/usr/bin:/bin:…"],["Role","folders searched for commands, left to right"]]],["PS1",[["Value","\\u@\\h:\\w\\$ "],["Role","your prompt: user@host:folder$"]]]]},{"t":"Login and non-login shells","d":"A login shell starts when you log in: over SSH, on a text console, or with su - (note the dash). A non-login interactive shell is a new terminal tab on a desktop or typing bash inside bash. They read different startup files.","s":["login","nonl"],"hi":["login","nonl"]},{"t":"What a login shell reads","d":"First /etc/profile for every user. Then the FIRST file it finds of ~/.bash_profile, ~/.bash_login and ~/.profile; the others are ignored. Ubuntu ships only ~/.profile, which itself runs ~/.bashrc, so your aliases work in both kinds of shell.","s":["eprof","uprof","a1","a2","a5"],"hi":["uprof"],"p":[{"v":["login","eprof","uprof","ubrc"],"c":"req","l":"login","d":0,"x":false}],"dp":"Classic trap: you create ~/.bash_profile to set one variable. bash now finds it first and silently stops reading ~/.profile, so ~/.bashrc and your aliases are no longer loaded at login. Fix: add the line  [ -f ~/.bashrc ] && . ~/.bashrc  to ~/.bash_profile."},{"t":"What an interactive non-login shell reads","d":"A new terminal tab reads /etc/bash.bashrc and then ~/.bashrc. Put aliases (alias ll=\"ls -alF\"), your prompt (PS1) and small functions in ~/.bashrc. Put environment variables such as PATH additions in ~/.profile.","s":["ebrc","ubrc","a3","a4"],"hi":["ubrc"],"p":[{"v":["nonl","ebrc","ubrc"],"c":"req","l":"new tab","d":0,"x":false}]},{"t":"Logging out, and applying changes","d":"~/.bash_logout runs when a login shell exits; Ubuntu uses it to clear the screen. Changes to startup files only affect new shells; source ~/.bashrc (or . ~/.bashrc) applies them to the current shell immediately.","s":["lo","src"],"hi":["src"],"a":"A new school rule printed in the handbook applies to classes that start after printing. To apply it to the class already running, read it out loud now (source)."},{"t":"Positional parameters","d":"Arguments given to a script or function arrive as $1, $2 … ($0 is the script name, ${10} needs braces). $# is the count. \"$@\" keeps each argument separate even if it contains spaces; \"$*\" joins them into one string. shift drops $1 and moves the rest down.","s":["pos"],"hi":["pos"],"dp":"set -- a b c sets the positional parameters of the current shell, useful for practice: set -- \"Asha Rao\" ravi; echo $#  prints 2. for arg in \"$@\" loops correctly over arguments with spaces; for arg in $* would split \"Asha Rao\" into two."}],"analogy":{"intro":"Joining a school as a new teacher.","map":[["Different language interpreters at the office","sh, bash, ksh, csh, zsh"],["Note in your own notebook","User-defined variable"],["Notice copied to every classroom you send a student to","Environment variable (export)"],["Arriving at school for the day","Login shell"],["Moving to another classroom during the day","Non-login shell"],["School-wide rules book","/etc/profile, /etc/bash.bashrc"],["Your personal checklist","~/.profile, ~/.bashrc"],["End-of-day routine","~/.bash_logout"]]},"cmp":{"head":["Command","What it does"],"rows":[["cat /etc/shells","installed shells"],["echo $0 / echo $SHELL","current / login shell"],["chsh -s /bin/zsh","change your login shell"],["X=5 / export X=5","shell variable / environment variable"],["env / printenv PATH / set","environment / one variable / everything"],["unset X","delete a variable"],["echo 'export PATH=$PATH:~/bin' >> ~/.profile","add a folder to PATH"],["alias ll=\"ls -alF\"","define an alias (put in ~/.bashrc)"],["source ~/.bashrc","reload now"],["bash -l / shopt login_shell","start login shell / am I one?"],["set -- a b c; echo $2 $#","practise positional parameters"]]},"usecase":"<p><b>Data engineer:</b> Spark and Java need JAVA_HOME and SPARK_HOME; they are exported in ~/.profile so every job and every terminal sees them.</p><p><b>System administrator:</b> a company-wide proxy setting goes into a file under /etc/profile.d/, so every user's login shell gets it.</p><p><b>Developer:</b> a script works in the terminal but fails in cron: cron does not read ~/.bashrc, so PATH is different. Set the variables inside the script.</p>","terms":[["Shell","Program that interprets commands."],["bash","Bourne Again Shell, default on most Linux."],["sh / dash","POSIX shell / Ubuntu's fast /bin/sh."],["csh / ksh / zsh","Other shells with different syntax and features."],["Environment variable","Exported variable passed to child processes."],["export","Turn a shell variable into an environment variable."],["PATH","Folders searched for commands."],["Login shell","Shell started at login; reads profile files."],["~/.profile / ~/.bash_profile","Personal login-time settings."],["~/.bashrc","Personal settings for interactive shells."],["~/.bash_logout","Runs when a login shell exits."],["source","Run a file in the current shell."],["Positional parameters","$1, $2 … arguments of a script or function."]],"myths":[["bash reads all of .bash_profile, .bash_login and .profile","It reads only the first one it finds."],["A variable you set is seen by every program","Only after export, and only by programs started afterwards."],["/bin/sh is always bash","On Ubuntu it is dash."]],"quiz":[{"q":"You set X=5 and start a new bash inside the current one. echo $X prints:","o":["5","nothing","X","an error"],"a":1,"why":"X was not exported."},{"q":"Which file should hold your aliases?","o":["~/.bash_logout","~/.bashrc","/etc/shells","/etc/passwd"],"a":1,"why":"Interactive settings go in ~/.bashrc."},{"q":"\"$@\" versus \"$*\":","o":["Identical","\"$@\" keeps each argument separate","\"$*\" counts arguments","\"$@\" is the script name"],"a":1,"why":"\"$*\" joins everything into one string."}]},{"part":7,"title":"Input, output, redirection and pipes","lead":"Every command has three streams. Redirection and pipes connect them, and they are the glue of shell scripts.","scene":[{"id":"in","type":"box","x":20,"y":170,"w":200,"h":80,"k":"note","l":"stdin (0)","s":"keyboard by default"},{"id":"cmd","type":"box","x":300,"y":170,"w":200,"h":80,"k":"vm","l":"command","s":"e.g. grep nursery"},{"id":"out","type":"box","x":580,"y":100,"w":200,"h":70,"k":"store","l":"stdout (1)","s":"screen by default"},{"id":"err","type":"box","x":580,"y":240,"w":200,"h":70,"k":"sec","l":"stderr (2)","s":"errors, screen"},{"id":"f1","type":"box","x":580,"y":20,"w":200,"h":60,"k":"store","l":"out.txt","s":""},{"id":"pipe","type":"box","x":20,"y":300,"w":540,"h":70,"k":"net","l":"cat staff.csv | grep nursery | sort | uniq -c","s":"output of one command becomes input of the next"},{"id":"tab","type":"box","x":20,"y":385,"w":760,"h":75,"k":"note","l":"Operators","s":">  overwrite   >>  append   2>  errors   2>&1  errors to same place   <  from file   \\|  pipe   tee  screen and file"}],"steps":[{"t":"Three standard streams","d":"Every program starts with stdin (0, input), stdout (1, normal output) and stderr (2, error messages). By default stdin is the keyboard and both outputs go to the screen.","s":["in","cmd","out","err"],"p":[{"v":["in","cmd","out"],"c":"req","l":"data","d":0,"x":false},{"v":["cmd","err"],"c":"bad","l":"error message","d":1.2,"x":false}],"a":"A clerk with an in-tray, an out-tray, and a separate complaints tray."},{"t":"Redirect output to a file","d":"grep nursery staff.csv > out.txt sends stdout to a file, replacing its contents. >> appends instead. < reads stdin from a file.","s":["f1"],"p":[{"v":["cmd","f1"],"c":"req","l":"> out.txt","d":0,"x":false}]},{"t":"Separating errors","d":"2> errors.log sends stderr elsewhere. 2>&1 sends stderr to wherever stdout currently goes. command > all.log 2>&1 captures everything; &> all.log is the bash shortcut. 2>/dev/null throws errors away.","hi":["err"],"dp":"Order matters: cmd > file 2>&1 puts both in the file. cmd 2>&1 > file sends stderr to the terminal (where stdout pointed at that moment) and only stdout to the file."},{"t":"Pipes chain commands","d":"| connects one command's stdout to the next command's stdin. Small tools combine into powerful one-liners: count nursery staff per role without writing a program.","s":["pipe"],"p":[{"v":["pipe@l","pipe@r"],"c":"data","l":"stream","d":0,"x":false}],"a":"An assembly line: each worker does one job and passes the tray on."},{"t":"Operator summary","d":"> overwrite, >> append, 2> errors, 2>&1 merge, < input, | pipe, tee to see output and save it at the same time (useful with sudo: echo text | sudo tee /etc/file).","s":["tab"],"hi":["tab"],"dp":"sudo echo text > /etc/file fails: the redirection is done by your non-root shell before sudo runs. Use echo text | sudo tee /etc/file."}],"analogy":{"intro":"Office trays and an assembly line.","map":[["In-tray","stdin"],["Out-tray","stdout"],["Complaints tray","stderr"],["Sending the out-tray to a filing cabinet",">"],["Adding to an existing file",">>"],["Assembly line between clerks","Pipe |"],["Photocopy: keep one, pass one on","tee"]]},"cmp":{"head":["Example","Effect"],"rows":[["ls > list.txt","save output (overwrite)"],["date >> log.txt","append"],["cmd 2> err.txt","errors only"],["cmd > all.txt 2>&1","both to file"],["cmd 2>/dev/null","discard errors"],["sort < names.txt","read input from file"],["cut -d, -f2 staff.csv | sort | uniq -c","count values"],["cmd | tee out.txt","screen and file"],["echo x | sudo tee -a /etc/file","append as root"]]},"usecase":"<p><b>System administrator:</b> grep \"Failed password\" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr finds attacking IPs.</p><p><b>Developer:</b> captures build errors separately with 2> build-errors.log.</p><p><b>Data / DevOps engineer:</b> quick data profiling of CSVs with cut, sort, uniq and wc before loading into a database.</p>","terms":[["stdin / stdout / stderr","Standard input (0), output (1), error (2)."],["File descriptor","Number identifying an open stream."],["Redirection","Connecting a stream to a file."],["Pipe","Connecting stdout of one command to stdin of another."],["/dev/null","Device that discards everything written to it."],["tee","Copies input to a file and to stdout."],["Here-document","<<EOF … EOF multi-line input."]],"myths":[["> appends","> overwrites; >> appends."],["sudo works on redirections","The redirect is done by your shell; use sudo tee."]],"quiz":[{"q":"Capture both output and errors in one file:","o":["cmd > f","cmd > f 2>&1","cmd 2> f","cmd | f"],"a":1,"why":"2>&1 merges stderr into stdout."},{"q":"Append rather than overwrite:","o":[">",">>","<","|"],"a":1,"why":">> appends."},{"q":"Discard error messages:","o":["2>/dev/null",">/dev/null 1","| null","2>&1"],"a":0,"why":"Send stderr to /dev/null."}]},{"part":7,"title":"Shell scripting basics: shebang, variables, arguments, quoting","lead":"Turning commands you type into a reusable program.","scene":[{"id":"file","type":"box","x":20,"y":30,"w":370,"h":200,"k":"note","l":"greet.sh","s":"#!/bin/bash|# greet a teacher by name|NAME=\"$1\"|TODAY=$(date +%A)|echo \"Good morning, $NAME! It is $TODAY.\"|exit 0"},{"id":"sheb","type":"box","x":420,"y":30,"w":360,"h":60,"k":"vm","l":"#! shebang","s":"which interpreter runs the file"},{"id":"var","type":"box","x":420,"y":100,"w":360,"h":60,"k":"vm","l":"Variables","s":"NAME=value   (no spaces around =)"},{"id":"cs","type":"box","x":420,"y":170,"w":360,"h":60,"k":"vm","l":"Command substitution","s":"$(date +%A) → Wednesday"},{"id":"run","type":"box","x":20,"y":250,"w":370,"h":90,"k":"net","l":"Run it","s":"chmod +x greet.sh|./greet.sh Asha"},{"id":"args","type":"box","x":420,"y":250,"w":360,"h":90,"k":"note","l":"Arguments and specials","s":"$0 script name   $1 $2 … arguments|$# count   \"$@\" all arguments   $? last exit code"},{"id":"q","type":"box","x":20,"y":360,"w":760,"h":100,"k":"sec","l":"Quoting","s":"\"double\": variables expand → \"Hi $NAME\" gives Hi Asha|'single': literal → 'Hi $NAME' gives Hi $NAME|unquoted $VAR splits on spaces and expands * : always write \"$VAR\""}],"steps":[{"t":"A script is a text file of commands","d":"Anything you can type at the prompt can go in a file and run in order. Lines starting with # are comments.","s":["file"],"a":"A written recipe card instead of telling the cook each step aloud."},{"t":"The shebang","d":"The first line #!/bin/bash tells the kernel which program should run this file. Without it, the file may be run by a different shell and behave differently.","s":["sheb"],"hi":["sheb"],"dp":"#!/usr/bin/env bash finds bash on the PATH, useful on systems where bash is elsewhere. #!/bin/sh means a POSIX shell (dash on Ubuntu), which lacks bash features such as [[ ]] and arrays."},{"t":"Variables","d":"NAME=\"$1\" stores a value. No spaces around =, because NAME = x would run a command called NAME. Read it with $NAME or ${NAME}. Convention: UPPERCASE for environment variables, lowercase for script variables is also common.","s":["var"],"hi":["var"]},{"t":"Command substitution","d":"$(command) runs a command and inserts its output. TODAY=$(date +%A) stores the weekday name.","s":["cs"],"hi":["cs"]},{"t":"Running it with arguments","d":"chmod +x greet.sh then ./greet.sh Asha. \"Asha\" becomes $1. The ./ is needed because the current folder is not on the PATH.","s":["run","args"],"p":[{"v":["run","file"],"c":"req","l":"./greet.sh Asha","d":0,"x":false}],"ins":[["Line 3: NAME=\"$1\"",[["$1","Asha"],["NAME","Asha"]]],["Line 4: TODAY=$(date +%A)",[["runs","date +%A"],["TODAY","Wednesday"]]],["Line 5: echo",[["prints","Good morning, Asha! It is Wednesday."]]],["Line 6: exit 0",[["$? for the caller","0 = success"]]]],"dp":"bash greet.sh Asha also works without x permission, because bash itself is the program being run and only reads the file. source greet.sh (or . greet.sh) runs it inside your current shell, so its variables remain afterwards."},{"t":"Quoting","d":"Double quotes allow $variables and $(commands) to expand but keep spaces together. Single quotes keep everything literal. Unquoted variables are split on spaces and * is expanded: a name like \"Asha Rao\" becomes two words. Rule: always quote \"$VAR\".","s":["q"],"hi":["q"]}],"analogy":{"intro":"A recipe card.","map":[["Recipe card","Script file"],["\"Cook in Hindi\" written at the top","Shebang"],["Labelled jars","Variables"],["\"Use today's vegetable\" filled in at cooking time","Command substitution"],["Customer's order slip","Arguments $1, $2"],["Writing an ingredient name exactly as spelled","Single quotes"]]},"cmp":{"head":["Syntax","Meaning"],"rows":[["#!/bin/bash","shebang"],["NAME=\"Asha\"","assign (no spaces)"],["echo \"$NAME\" / \"${NAME}s\"","use a variable"],["X=$(command)","command substitution"],["$1 … $9, ${10}","positional arguments"],["$#  \"$@\"  $0","count, all args, script name"],["$?","exit code of last command"],["read -r -p \"Name: \" NAME","read input"],["export VAR=x","pass to child processes"],["${VAR:-default}","use default if empty"]]},"usecase":"<p><b>System administrator:</b> a script that creates a user, sets a password-change policy and emails credentials, run with the username as $1.</p><p><b>Developer:</b> build and deploy scripts in every repository.</p><p><b>Data / DevOps engineer:</b> scripts download files, check row counts and trigger loads; environment variables carry settings and secrets.</p>","terms":[["Script","File of commands run in sequence."],["Shebang","#! line naming the interpreter."],["Variable","Named value."],["Command substitution","$(…) inserts a command's output."],["Positional parameters","$1, $2 … arguments."],["Exit code","0 for success, non-zero for failure."],["PATH","Folders searched for commands."],["export","Make a variable visible to child processes."],["source","Run a script in the current shell."]],"myths":[["NAME = Asha assigns a variable","Spaces turn it into a command; write NAME=Asha."],["Quotes are optional","Unquoted variables break on spaces and wildcards."]],"quiz":[{"q":"Which assignment is correct?","o":["NAME = Asha","NAME=Asha","$NAME=Asha","set NAME Asha"],"a":1,"why":"No spaces around =."},{"q":"echo 'Hi $NAME' prints:","o":["Hi Asha","Hi $NAME","Hi","Error"],"a":1,"why":"Single quotes are literal."},{"q":"Number of arguments passed:","o":["$0","$#","$@","$?"],"a":1,"why":"$# is the count."}]},{"part":7,"title":"Wildcards, metacharacters and command-line expansion","lead":"Before a command runs, bash rewrites the line: braces, ~, variables, $(…), arithmetic, splitting and wildcards. Knowing the order explains most \"why did that happen?\" moments.","scene":[{"id":"typed","type":"box","x":20,"y":25,"w":760,"h":50,"k":"user","l":"You type:  echo {mon,tue} ~ $USER $((6*7)) $(hostname) *.csv","s":""},{"id":"e1","type":"box","x":20,"y":95,"w":180,"h":70,"k":"vm","l":"1. Brace","s":"{mon,tue} → mon tue"},{"id":"e2","type":"box","x":213,"y":95,"w":180,"h":70,"k":"vm","l":"2. Tilde","s":"~ → /home/asha"},{"id":"e3","type":"box","x":406,"y":95,"w":180,"h":70,"k":"vm","l":"3. Parameter","s":"$USER → asha"},{"id":"e4","type":"box","x":600,"y":95,"w":180,"h":70,"k":"vm","l":"4. Arithmetic","s":"$((6*7)) → 42"},{"id":"e5","type":"box","x":20,"y":180,"w":180,"h":70,"k":"vm","l":"5. Command","s":"$(hostname) → srv"},{"id":"e6","type":"box","x":213,"y":180,"w":180,"h":70,"k":"vm","l":"6. Word splitting","s":"unquoted results|split on spaces"},{"id":"e7","type":"box","x":406,"y":180,"w":180,"h":70,"k":"vm","l":"7. Pathname (glob)","s":"*.csv → a.csv b.csv"},{"id":"e8","type":"box","x":600,"y":180,"w":180,"h":70,"k":"vm","l":"8. Quote removal","s":"quotes taken away"},{"id":"w1","type":"line","a":"e1","b":"e2"},{"id":"w2","type":"line","a":"e2","b":"e3"},{"id":"w3","type":"line","a":"e3","b":"e4"},{"id":"w4","type":"line","a":"e4","b":"e5"},{"id":"w5","type":"line","a":"e5","b":"e6"},{"id":"w6","type":"line","a":"e6","b":"e7"},{"id":"w7","type":"line","a":"e7","b":"e8"},{"id":"ran","type":"box","x":20,"y":265,"w":760,"h":50,"k":"store","l":"echo receives:  mon tue /home/asha asha 42 srv a.csv b.csv","s":""},{"id":"wild","type":"box","x":20,"y":330,"w":240,"h":130,"k":"note","l":"Wildcards (globs)","s":"*      any characters|?      exactly one character|[abc]  one of a, b, c|[!0-9] not a digit|* skips hidden .files"},{"id":"meta","type":"box","x":275,"y":330,"w":250,"h":130,"k":"sec","l":"Metacharacters","s":"\\| pipe   & background|; next   && \\|\\| if ok / if not|< > redirect   ( ) subshell|$ ` \\ \" ' * ? [ ] { } ~ # !|space, tab, newline split"},{"id":"quote","type":"box","x":540,"y":330,"w":240,"h":130,"k":"net","l":"Quoting stops it","s":"\\*   escape one character|'$HOME *'  nothing expands|\"$HOME *\"  only $ expands|so \"My File.txt\" stays|one word"}],"steps":[{"t":"The shell rewrites your line first","d":"echo never sees ~, $USER or *.csv. bash expands them first, in a fixed order, and only then starts the command with the final list of words. Put echo in front of any command to see what it will really receive.","s":["typed"],"hi":["typed"],"a":"An office clerk who fills in every blank on your form (date, your name, the file list) before passing it to the department."},{"t":"Braces, tilde, variables, arithmetic","d":"Step 1: {mon,tue} becomes two words; {1..5} a sequence. Step 2: ~ becomes your home folder. Step 3: $USER or ${USER} becomes its value. Step 4: $((6*7)) becomes 42 (integers only; use bc for decimals).","s":["e1","e2","e3","e4","w1","w2","w3"],"p":[{"v":["e1","e2","e3","e4"],"c":"req","l":"expanding…","d":0,"x":false}]},{"t":"Command substitution and word splitting","d":"Step 5: $(hostname) runs a command and inserts its output; old-style backquotes `hostname` do the same. Step 6: the results of steps 3 to 5, if not inside double quotes, are split into separate words wherever there is a space, tab or newline.","s":["e5","e6","w4","w5"],"p":[{"v":["e4","e5","e6"],"c":"req","l":"","d":0,"x":false}],"dp":"Word splitting is why F=\"My File.txt\"; rm $F tries to delete \"My\" and \"File.txt\". rm \"$F\" deletes the one file. The characters used for splitting come from the IFS variable."},{"t":"Pathname expansion (wildcards)","d":"Step 7: words containing *, ? or [ ] are replaced by matching file names, sorted. *.csv becomes a.csv b.csv. If nothing matches, bash leaves the pattern unchanged, so a command may receive a literal *.csv.","s":["e7","wild","w6"],"hi":["e7","wild"],"p":[{"v":["e6","e7"],"c":"req","l":"*.csv","d":0,"x":false}],"ins":[["ls file?.txt",[["Matches","file1.txt, fileA.txt"],["Not","file10.txt (two characters)"]]],["ls [abc]*",[["Matches","names starting with a, b or c"]]],["ls *[0-9].log",[["Matches","app1.log, err9.log"]]],["ls .*",[["Matches","hidden files such as .bashrc"]]],["rm *.tmp",[["Danger","rm * .tmp (with a space) deletes EVERYTHING"]]]]},{"t":"Quote removal and the final command","d":"Step 8 strips the quotes you typed. echo finally receives: mon tue /home/asha asha 42 srv a.csv b.csv. Only now does the program run.","s":["e8","ran","w7"],"hi":["ran"],"p":[{"v":["e8","ran"],"c":"res","l":"run echo","d":0,"x":false}]},{"t":"Metacharacters","d":"Some characters mean something to the shell itself: | pipes, & runs in the background, ; separates commands, && and || run on success or failure, < and > redirect, ( ) start a subshell, # starts a comment, ! recalls history, and spaces separate words.","s":["meta"],"hi":["meta"]},{"t":"Quoting turns expansion off","d":"A backslash protects one character: \\* is a literal star. Single quotes protect everything: '$HOME *' stays exactly as typed. Double quotes allow $ variables, $( ) and \\ but stop splitting and wildcards. Rule of thumb: put variables in double quotes, fixed text in single quotes.","s":["quote"],"hi":["quote"],"a":"Single quotes: \"copy exactly what I wrote\". Double quotes: \"fill in the names, but keep it as one item\"."}],"analogy":{"intro":"A form-filling clerk.","map":[["Your handwritten request","Typed command line"],["\"Make two copies: Monday and Tuesday\"","Brace expansion"],["\"Send to my home address\"","Tilde ~"],["\"Insert my staff name here\"","$USER"],["\"Write the total of 6 × 7\"","$((…))"],["\"Attach every CSV in my tray\"","*.csv"],["\"Copy this exactly, do not fill anything in\"","Single quotes"],["Clerk hands the finished form to the department","Command runs"]]},"cmp":{"head":["Syntax","Result"],"rows":[["echo {a,b,c}.txt","a.txt b.txt c.txt"],["echo {1..5} / {01..10}","sequence / zero-padded"],["echo ~ / ~ravi","your home / ravi's home"],["echo $USER ${USER}_x","variable / with text after it"],["echo $((7 % 3)) $((2**10))","1 1024"],["echo $(date +%F) / `date`","command substitution"],["ls *.csv file?.txt [a-c]*","wildcards"],["echo \\* '$HOME' \"$HOME\"","* $HOME /home/asha"],["cmd1 ; cmd2 / cmd1 && cmd2 / cmd1 || cmd2","always / if ok / if failed"],["(cd /tmp; ls)","subshell: your folder does not change"],["shopt -s nullglob dotglob","no-match → nothing / * includes dotfiles"]]},"usecase":"<p><b>Data engineer:</b> cp data_{2024,2025}_q{1..4}.csv /backup/ copies eight files in one command, and \"${FILE%.csv}.parquet\" builds output names.</p><p><b>System administrator:</b> a cleanup script uses rm -- \"$DIR\"/*.tmp with quotes and --, so names with spaces or starting with - cannot break it.</p><p><b>Classic incident:</b> rm -rf $BUILD/ with BUILD unset expands to rm -rf / . Quoting and set -u prevent it.</p>","terms":[["Expansion","Rewriting of the command line before it runs."],["Brace expansion","{a,b} and {1..10} generate words."],["Tilde expansion","~ becomes a home folder."],["Parameter expansion","$VAR or ${VAR} becomes its value."],["Command substitution","$(cmd) inserts a command's output."],["Arithmetic expansion","$((expr)) computes integers."],["Word splitting","Unquoted results split on IFS characters."],["Glob / wildcard","*, ?, [ ] patterns that match file names."],["Metacharacter","Character with special meaning to the shell."],["Quoting","\\, ' ', \" \" to stop expansion."],["IFS","Internal Field Separator for splitting."]],"myths":[["The program expands *","bash expands it before the program starts."],["* matches hidden files","Not by default; use .* or shopt -s dotglob."],["Double and single quotes are the same","Double quotes still expand $ and $( )."]],"quiz":[{"q":"What does echo file{1..3}.txt print?","o":["file{1..3}.txt","file1.txt file2.txt file3.txt","file1-3.txt","an error"],"a":1,"why":"Brace expansion makes three words."},{"q":"F=\"My File.txt\"; which deletes the file correctly?","o":["rm $F","rm \"$F\"","rm '$F'","rm F"],"a":1,"why":"Double quotes keep it one word and expand the variable."},{"q":"Which matches exactly one character?","o":["*","?","[abc]*","~"],"a":1,"why":"? is a single-character wildcard."}]},{"part":7,"title":"Interactive scripts: read, echo, expr, tput and a menu","lead":"Simple scripts that ask questions, do arithmetic, paint the screen with tput and loop through a menu with while, until, case, break and continue.","scene":[{"id":"scr","type":"box","x":20,"y":25,"w":360,"h":250,"k":"srv","l":"Screen drawn with tput","s":"══ DBDA Student Tools ══|(bold, centred: tput cup 2 30)||  1) Show disk usage|  2) Add tw
