ap":[["The company and its staff directory","Entra ID tenant"],["Divisions with common rules","Management groups"],["Each department's budget","Subscription"],["A project room holding one team's equipment","Resource group"],["Equipment in the room","Resources"],["The central store with shelves, lockers, mailboxes, registers","Storage account: Blob, Files, Queues, Tables"],["Shelves near the door vs the far warehouse","Hot vs Archive tier"],["An on-call worker who acts on a bell","Azure Function"]]},"cmp":{"head":["Task","Azure CLI"],"rows":[["Log in","az login (or az login --use-device-code)"],["Choose subscription","az account set -s \"Azure for Students\""],["Create resource group","az group create -n rg-dbda-dev -l centralindia"],["Create storage account","az storage account create -n dbdastore01 -g rg-dbda-dev --sku Standard_LRS"],["Create container","az storage container create --account-name dbdastore01 -n data --auth-mode login"],["Upload a blob","az storage blob upload --account-name dbdastore01 -c data -f sales.csv --auth-mode login"],["Create a VM","az vm create -g rg-dbda-dev -n vm1 --image Ubuntu2404 --generate-ssh-keys"],["List everything in a group","az resource list -g rg-dbda-dev -o table"],["Delete everything","az group delete -n rg-dbda-dev --yes"]]},"usecase":"<p><b>Retail chain:</b> store sales CSVs land in Blob Storage nightly; Data Factory loads them into Synapse, and Power BI dashboards read from it.</p><p><b>College:</b> staff sign in with their Microsoft 365 accounts (Entra ID) to an internal portal on Azure App Service, with no separate passwords.</p><p><b>IoT:</b> sensor messages arrive at a queue; an Azure Function validates each one and writes it to Cosmos DB through an output binding.</p>","terms":[["Microsoft Entra ID","Azure identity service (formerly Azure AD)."],["Tenant","An organisation's Entra ID instance."],["Management group","Container for several subscriptions."],["Subscription","Billing and access boundary."],["Resource group","Logical container for related resources."],["RBAC","Role-based access control: Owner, Contributor, Reader..."],["Storage account","Namespace for Blob, Files, Queues, Tables."],["Access tier","Hot, Cool, Cold, Archive pricing levels."],["LRS / ZRS / GRS","Replication options."],["Cosmos DB","Globally distributed NoSQL database."],["Data Factory","Managed ETL / data pipeline service."],["Trigger / binding","What starts a Function / declarative input-output."]],"myths":[["Deleting a resource group only removes the folder","It deletes every resource inside it."],["Archive blobs can be read instantly","They must be rehydrated first, which takes hours."],["Azure is only for Windows","Most Azure VMs run Linux."]],"quiz":[{"q":"Correct order from top to bottom:","o":["Subscription → tenant → resource group","Tenant → management group → subscription → resource group","Resource group → subscription → tenant","Tenant → resource group → subscription"],"a":1,"why":"Permissions and policies flow downward."},{"q":"Azure equivalent of an S3 bucket:","o":["Resource group","Blob container in a storage account","Cosmos DB","Data Factory"],"a":1,"why":"Blob Storage is Azure object storage."},{"q":"A blob must be rehydrated before reading in which tier?","o":["Hot","Cool","Cold","Archive"],"a":3,"why":"Archive is offline storage."},{"q":"Which runs code when a new blob arrives?","o":["Azure Functions with a blob trigger","Azure SQL","A management group","LRS"],"a":0,"why":"Triggers start functions on events."}]},{"part":11,"title":"Deploy an application from GitHub to EC2","lead":"Take a Flask app from a GitHub repository to a live URL on EC2, the production way: virtual environment, gunicorn, systemd and nginx. Then automate every future release with GitHub Actions.","scene":[{"id":"dev","type":"box","x":20,"y":30,"w":150,"h":70,"k":"user","l":"💻 Developer","s":"git push main"},{"id":"gh","type":"box","x":190,"y":30,"w":170,"h":70,"k":"store","l":"GitHub repo","s":"app.py, requirements.txt|.github/workflows/"},{"id":"gha","type":"box","x":380,"y":30,"w":180,"h":70,"k":"net","l":"GitHub Actions","s":"test → ssh → restart"},{"id":"sec","type":"box","x":580,"y":30,"w":200,"h":70,"k":"sec","l":"🔒 Repository secrets","s":"EC2_HOST, EC2_USER,|EC2_SSH_KEY"},{"id":"users","type":"box","x":20,"y":160,"w":150,"h":70,"k":"user","l":"🌐 Users","s":"http://13.233.x.x"},{"id":"zec2","type":"zone","x":190,"y":120,"w":590,"h":250,"k":"sg","l":"EC2 Ubuntu · SG: 22 (restricted), 80, 443"},{"id":"ng","type":"box","x":210,"y":160,"w":165,"h":90,"k":"net","l":"nginx :80","s":"reverse proxy,|static files, HTTPS"},{"id":"gu","type":"box","x":400,"y":160,"w":165,"h":90,"k":"srv","l":"gunicorn","s":"127.0.0.1:8000|3 worker processes"},{"id":"fl","type":"box","x":590,"y":160,"w":170,"h":90,"k":"my","l":"Flask app","s":"/home/ubuntu/app|venv/"},{"id":"log","type":"box","x":210,"y":265,"w":165,"h":90,"k":"note","l":"Logs","s":"journalctl -u app|/var/log/nginx/"},{"id":"sd","type":"box","x":400,"y":265,"w":165,"h":90,"k":"sec","l":"systemd","s":"app.service:|restart on crash,|start at boot"},{"id":"repo","type":"box","x":590,"y":265,"w":170,"h":90,"k":"store","l":"git clone / pull","s":"latest code|pip install -r"},{"id":"why","type":"box","x":20,"y":385,"w":760,"h":75,"k":"note","l":"Why each layer?","s":"gunicorn: production WSGI server (the Flask dev server is single-threaded and not secure)|nginx: handles many slow clients, HTTPS, static files · systemd: keeps gunicorn alive"}],"steps":[{"t":"The target architecture","d":"Users reach nginx on port 80. nginx forwards each request to gunicorn on 127.0.0.1:8000, which runs several copies (workers) of the Flask app. systemd keeps gunicorn running. Code arrives from GitHub. Each layer does one job.","s":["zec2","ng","gu","fl","users","why"],"hi":["why"],"p":[{"v":["users","ng","gu","fl"],"c":"req","l":"GET /","d":0,"x":false}],"a":"A restaurant: the receptionist (nginx) greets guests and passes orders to the kitchen (gunicorn), where several cooks (workers) follow the recipe (Flask app); the manager (systemd) replaces any cook who collapses."},{"t":"Code lives on GitHub","d":"The repository holds app.py, requirements.txt with pinned versions, and later the workflow file. The server never gets code by copy-paste: it clones the repository, so every deployment is a known commit.","s":["dev","gh"],"hi":["gh"],"p":[{"v":["dev","gh"],"c":"req","l":"git push","d":0,"x":false}]},{"t":"Prepare the instance","d":"Launch Ubuntu on EC2 with a security group allowing 80 and 443 from anywhere and 22 from your IP. Then install python3-venv, git and nginx.","hi":["zec2"],"ins":[["Commands",[["Update","sudo apt update && sudo apt upgrade -y"],["Install","sudo apt install -y python3-venv git nginx"],["Check","nginx -v ; python3 --version"]]]]},{"t":"Clone and create a virtual environment","d":"Clone the repository into /home/ubuntu/app, create venv inside it and install requirements. A virtual environment keeps the app's library versions separate from the system Python, which Ubuntu protects.","s":["repo"],"hi":["repo","fl"],"p":[{"v":["gh","repo"],"c":"data","l":"git clone","d":0,"x":false},{"v":["repo","fl"],"c":"data","l":"pip install","d":1.2,"x":false}]},{"t":"Run it with gunicorn","d":"gunicorn is a production server for Python web apps. gunicorn -w 3 -b 127.0.0.1:8000 app:app starts 3 workers serving the object app in app.py. Binding to 127.0.0.1 means only nginx on the same machine can reach it.","hi":["gu"],"p":[{"v":["gu","fl"],"c":"req","l":"app:app","d":0,"x":false}],"dp":"A common rule of thumb is 2 × CPU cores + 1 workers. If gunicorn fails, test directly: curl -s 127.0.0.1:8000 on the server."},{"t":"Make it a systemd service","d":"A unit file /etc/systemd/system/app.service tells systemd how to start gunicorn, as which user, from which folder, and to restart it if it crashes. systemctl enable makes it start on every boot.","s":["sd"],"hi":["sd"],"set":{"gu":{"k":"down","s":"crashed!"}},"p":[{"v":["sd","gu"],"c":"req","l":"Restart=always","d":1,"x":false}]},{"t":"Put nginx in front","d":"An nginx server block forwards / to http://127.0.0.1:8000 with proxy_pass and serves /static/ files directly. Open http://public-ip and the app answers. Add HTTPS later with a domain name and certbot.","hi":["ng"],"set":{"gu":{"k":"srv","s":"127.0.0.1:8000|3 worker processes"}},"p":[{"v":["users","ng","gu","fl"],"c":"req","l":"GET /","d":0,"x":false},{"v":["fl","gu","ng","users"],"c":"res","l":"200 OK","d":2,"x":false}]},{"t":"Automate releases with GitHub Actions","d":"A workflow in .github/workflows/deploy.yml runs on every push to main: first run the tests; only if they pass, SSH into the instance and run git pull, pip install and systemctl restart app. The SSH key and host are stored as encrypted repository secrets, never in the code.","s":["gha","sec"],"hi":["gha"],"p":[{"v":["dev","gh","gha"],"c":"req","l":"push to main","d":0,"x":false},{"v":["sec","gha"],"c":"data","l":"secrets","d":0.8,"x":false},{"v":["gha","repo"],"c":"data","l":"ssh: git pull","d":1.6,"x":false},{"v":["repo","sd"],"c":"req","l":"restart","d":2.4,"x":false}],"dp":"GitHub-hosted runners use changing IP addresses, so SSH restricted to your own IP will block them. Options for learning: allow 22 temporarily with key-only login, use a self-hosted runner on the instance, or use AWS Systems Manager or CodeDeploy instead of SSH."},{"t":"When it does not work","d":"Read the logs in order from the outside in: nginx error log, then the app service journal. The inspector lists the common symptoms.","s":["log"],"hi":["log"],"ins":[["Browser times out",[["Cause","port 80 not open in the security group, or nginx stopped"],["Check","sudo systemctl status nginx"]]],["502 Bad Gateway",[["Cause","nginx is fine, gunicorn is down or on another port"],["Check","sudo journalctl -u app -n 50"]]],["ModuleNotFoundError",[["Cause","service not using the venv"],["Fix","ExecStart=/home/ubuntu/app/venv/bin/gunicorn ..."]]],["Old version still shown",[["Fix","git pull, then sudo systemctl restart app"]]],["Works only on :8000",[["Cause","nginx site not enabled"],["Fix","ln -s to sites-enabled, sudo nginx -t, reload"]]]]}],"analogy":{"intro":"A restaurant.","map":[["The recipe book in head office","GitHub repository"],["Receptionist at the door","nginx reverse proxy"],["Kitchen with several cooks","gunicorn workers"],["The recipe","Flask application"],["Manager who replaces a cook who falls ill","systemd"],["Delivery van bringing new recipes after tasting","GitHub Actions"],["Safe for the van keys","Repository secrets"]]},"cmp":{"head":["Piece","File / command"],"rows":[["Dependencies","requirements.txt: flask==3.0.3, gunicorn==22.0.0"],["Virtual environment","python3 -m venv venv ; venv/bin/pip install -r requirements.txt"],["App server","venv/bin/gunicorn -w 3 -b 127.0.0.1:8000 app:app"],["Service","/etc/systemd/system/app.service ; systemctl enable --now app"],["Reverse proxy","/etc/nginx/sites-available/app ; proxy_pass http://127.0.0.1:8000"],["Test nginx config","sudo nginx -t && sudo systemctl reload nginx"],["Logs","journalctl -u app -f ; /var/log/nginx/error.log"],["HTTPS","sudo certbot --nginx -d example.com"],["CI/CD",".github/workflows/deploy.yml + repository secrets"]]},"usecase":"<p><b>Student capstone:</b> a Flask dashboard for a sales dataset is deployed on EC2; each git push to main redeploys it within a minute after tests pass.</p><p><b>Startup:</b> the same nginx + gunicorn + systemd pattern runs their API on two EC2 instances behind a load balancer, with the workflow deploying to both.</p><p><b>ML team:</b> a model-serving API is deployed the same way; later it is containerised (see the Docker lessons) so the server only needs docker pull and run.</p>","terms":[["WSGI","Standard interface between Python web apps and servers."],["gunicorn","Production WSGI HTTP server with worker processes."],["Reverse proxy","Server that forwards client requests to a backend."],["nginx","Web server and reverse proxy."],["systemd unit","Service definition managed by systemctl."],["Virtual environment (venv)","Isolated Python library folder."],["GitHub Actions","GitHub's CI/CD automation."],["Workflow","YAML file describing automated jobs."],["Repository secret","Encrypted value available to workflows."],["502 Bad Gateway","Proxy could not get a valid response from the backend."]],"myths":[["python app.py with nohup is good enough for production","The dev server is not built for real traffic; nothing restarts it."],["Put the SSH key in the workflow file","Use encrypted secrets; repositories leak."],["Deploying means copying files with scp","Deploy known commits from Git, ideally automatically."]],"quiz":[{"q":"Browser shows 502 Bad Gateway. Most likely:","o":["Security group blocks port 80","gunicorn is not running","DNS is wrong","GitHub is down"],"a":1,"why":"nginx answered but its backend did not."},{"q":"What restarts gunicorn automatically after a crash or reboot?","o":["nginx","systemd","pip","GitHub"],"a":1,"why":"Restart=always and systemctl enable."},{"q":"Where should the EC2 private key used by the workflow be stored?","o":["In app.py","In README.md","As a repository secret","In a public gist"],"a":2,"why":"Secrets are encrypted and masked in logs."}]},{"part":12,"title":"DevOps: lifecycle, Agile vs DevOps, CI/CD","lead":"Why development and operations merged into one way of working, the eight-stage DevOps loop, how it extends Agile, and how continuous integration and delivery turn every commit into a tested, deployable release.","scene":[{"id":"plan","type":"box","x":20,"y":30,"w":175,"h":65,"k":"note","l":"📝 Plan","s":"user stories, Jira, sprint"},{"id":"code","type":"box","x":215,"y":30,"w":175,"h":65,"k":"my","l":"💻 Code","s":"Git, branches, PRs"},{"id":"build","type":"box","x":410,"y":30,"w":175,"h":65,"k":"srv","l":"🔨 Build","s":"pip, docker build"},{"id":"test","type":"box","x":605,"y":30,"w":175,"h":65,"k":"sec","l":"🧪 Test","s":"pytest, lint, scans"},{"id":"mon","type":"box","x":20,"y":140,"w":175,"h":65,"k":"note","l":"📈 Monitor","s":"Prometheus, CloudWatch"},{"id":"ops","type":"box","x":215,"y":140,"w":175,"h":65,"k":"srv","l":"⚙️ Operate","s":"scale, patch, backup"},{"id":"dep","type":"box","x":410,"y":140,"w":175,"h":65,"k":"net","l":"🚀 Deploy","s":"EC2, Kubernetes"},{"id":"rel","type":"box","x":605,"y":140,"w":175,"h":65,"k":"store","l":"📦 Release","s":"version tag, artifact"},{"id":"agile","type":"box","x":20,"y":225,"w":370,"h":105,"k":"my","l":"Agile","s":"short iterations (sprints) of 1-2 weeks|developers + product owner + testers|working software delivered often|done = \"code complete, demo given\""},{"id":"dvo","type":"box","x":410,"y":225,"w":370,"h":105,"k":"net","l":"DevOps","s":"extends Agile through to operations|dev and ops share goals, tools, on-call|automate build, test, deploy, monitor|done = \"running well in production\""},{"id":"ci","type":"box","x":20,"y":345,"w":370,"h":115,"k":"srv","l":"CI: Continuous Integration","s":"merge small changes to main often|every push: build + automated tests|a broken build is fixed first|fast feedback: minutes, not weeks"},{"id":"cd","type":"box","x":410,"y":345,"w":370,"h":115,"k":"srv","l":"CD: Delivery vs Deployment","s":"delivery: always releasable,|  a person clicks \"release\"|deployment: every green build goes|  to production automatically"}],"steps":[{"t":"The wall between Dev and Ops","d":"Traditionally developers wrote code and \"threw it over the wall\" to an operations team that ran it. Developers wanted change; operations wanted stability. Releases were rare, large and risky, and failures led to blame: \"it works on my machine\".","s":["code","ops"],"hi":["code","ops"],"p":[{"v":["code","ops"],"c":"bad","l":"works on my machine","d":0,"x":true}],"a":"A cook who never sees the dining room and a waiter who never enters the kitchen, blaming each other for cold food."},{"t":"DevOps: one team, one loop","d":"DevOps is a culture and set of practices where the people who build software also help run it, supported by automation. Work flows continuously around the loop: plan, code, build, test, release, deploy, operate, monitor, and what you learn from monitoring feeds the next plan.","s":["plan","build","test","rel","dep","mon"],"hi":["plan"],"p":[{"v":["plan","code","build","test","rel","dep","ops","mon","plan"],"c":"data","l":"feedback loop","d":0,"x":false}],"ins":[["Plan",[["Activity","break work into small user stories"],["Tools","Jira, GitHub Issues, Azure Boards"]]],["Code",[["Activity","branch, commit, pull request, code review"],["Tools","Git, GitHub, VS Code"]]],["Build",[["Activity","compile, install dependencies, build a Docker image"],["Tools","pip, Maven, docker build"]]],["Test",[["Activity","unit, integration, security and style checks"],["Tools","pytest, flake8, SonarQube, Trivy"]]],["Release",[["Activity","version and store the artifact"],["Tools","Git tags, Docker Hub, ECR, Nexus"]]],["Deploy",[["Activity","put it into an environment automatically"],["Tools","GitHub Actions, Jenkins, Argo CD, Terraform"]]],["Operate",[["Activity","scale, patch, back up, handle incidents"],["Tools","Kubernetes, Ansible, AWS, Azure"]]],["Monitor",[["Activity","metrics, logs, alerts, user feedback"],["Tools","Prometheus, Grafana, CloudWatch, ELK"]]]]},{"t":"Agile versus DevOps","d":"Agile changed how teams build software: small iterations, close contact with the customer, embracing change. DevOps extends the same thinking past \"code complete\" to testing, release and operations, adding automation and shared responsibility for production. They are partners, not rivals.","s":["agile","dvo"],"hi":["agile","dvo"],"ins":[["Focus",[["Agile","building the right thing iteratively"],["DevOps","delivering and running it quickly and reliably"]]],["Team",[["Agile","developers, testers, product owner"],["DevOps","adds operations, security (DevSecOps)"]]],["Feedback",[["Agile","customer at sprint review"],["DevOps","production metrics and users, continuously"]]],["Key practices",[["Agile","Scrum, Kanban, stand-ups, retrospectives"],["DevOps","CI/CD, infrastructure as code, monitoring"]]],["Release cadence",[["Agile","end of sprint"],["DevOps","many times a day if needed"]]]]},{"t":"Continuous Integration","d":"Developers merge small changes into the main branch frequently, at least daily. Each push automatically builds the code and runs the tests on a CI server. If anything fails, the team knows within minutes which commit broke it, while the change is still fresh in the author's mind.","s":["ci"],"hi":["ci","build","test"],"p":[{"v":["code","build","test"],"c":"req","l":"push → build → test","d":0,"x":false},{"v":["test","code"],"c":"bad","l":"test failed: fix now","d":2,"x":false}],"a":"Checking each brick as it is laid, instead of discovering a crooked wall at the end."},{"t":"Continuous Delivery and Deployment","d":"Continuous Delivery keeps the main branch always ready to release: every passing build produces a versioned artifact and can be deployed with one click. Continuous Deployment removes the click: every build that passes all checks goes to production automatically.","s":["cd"],"hi":["cd","rel","dep"],"p":[{"v":["test","rel","dep"],"c":"req","l":"green build","d":0,"x":false}],"dp":"Safe automation needs good tests, staged environments (dev → staging → production), and gradual rollout patterns such as blue-green (switch traffic between two identical environments) or canary (send 5% of users to the new version first) with quick rollback."},{"t":"A real pipeline: GitHub Actions","d":"A workflow file in .github/workflows/ci.yml runs on every push and pull request: check out the code, set up Python, install requirements, run flake8 and pytest. A red cross on the pull request blocks the merge. The inspector shows the file.","hi":["test","build"],"ins":[["ci.yml",[["name","ci"],["on","[push, pull_request]"],["jobs.test.runs-on","ubuntu-latest"],["step 1","uses: actions/checkout@v4"],["step 2","uses: actions/setup-python@v5 with python-version 3.12"],["step 3","run: pip install -r requirements.txt pytest flake8"],["step 4","run: flake8 . --max-line-length 120"],["step 5","run: pytest -q"]]],["Popular CI/CD tools",[["Hosted","GitHub Actions, GitLab CI, Azure Pipelines, AWS CodePipeline"],["Self-hosted","Jenkins, GitLab Runner"],["GitOps for Kubernetes","Argo CD, Flux"]]]]},{"t":"Measuring DevOps","d":"The DORA research programme found four measures that separate high-performing teams: how often they deploy, how long a commit takes to reach production, what share of changes cause failures, and how quickly service is restored. Monitoring closes the loop.","hi":["mon"],"p":[{"v":["mon","plan"],"c":"data","l":"learn","d":0,"x":false}],"ins":[["Deployment frequency",[["Elite teams","on demand, many per day"]]],["Lead time for changes",[["Elite teams","less than a day from commit to production"]]],["Change failure rate",[["Meaning","% of deployments causing an incident"]]],["Time to restore service",[["Elite teams","less than an hour"]]]]}],"analogy":{"intro":"A restaurant chain that cooks, serves and listens as one team.","map":[["Menu planning meeting","Plan"],["Writing and refining recipes","Code"],["Preparing ingredients","Build"],["Tasting before serving","Test"],["Plating the dish","Release"],["Serving the table","Deploy"],["Keeping the kitchen running","Operate"],["Reading customer feedback cards","Monitor"],["Tasting every batch, not only at the end","Continuous integration"],["Dish always ready to serve vs served automatically","Continuous delivery vs deployment"]]},"cmp":{"head":["Term","Meaning"],"rows":[["DevOps","culture + practices + tools uniting development and operations"],["Agile","iterative development with frequent customer feedback"],["CI","frequent merges, each automatically built and tested"],["Continuous delivery","always releasable; release is a manual decision"],["Continuous deployment","every passing change released automatically"],["Pipeline","automated sequence: build → test → release → deploy"],["Artifact","built output: wheel, JAR, Docker image"],["Infrastructure as code","servers and networks defined in files (Terraform, CloudFormation)"],["DevSecOps","security checks built into the pipeline"],["Blue-green / canary","safe ways to switch to a new version"],["MLOps","DevOps practices applied to training and serving ML models"]]},"usecase":"<p><b>E-commerce company:</b> each developer's pull request runs 800 tests in 6 minutes; merges to main deploy to staging automatically and to production after a one-click approval, several times a day.</p><p><b>Bank:</b> continuous delivery with manual approval for compliance, security scanning of every image, and canary releases to 5% of users first.</p><p><b>ML team:</b> a pipeline retrains the model weekly, runs accuracy checks, builds a Docker image and deploys it only if accuracy has not dropped (MLOps).</p>","terms":[["DevOps","Collaboration and automation across development and operations."],["DevOps lifecycle","Plan, code, build, test, release, deploy, operate, monitor."],["CI","Continuous Integration."],["CD","Continuous Delivery / Deployment."],["Pipeline","Automated stages run on each change."],["Runner / agent","Machine that executes pipeline jobs."],["Artifact","Versioned build output."],["Rollback","Returning to the previous working version."],["Canary release","Gradual rollout to a small share of users."],["DORA metrics","Four delivery performance measures."],["IaC","Infrastructure as code."]],"myths":[["DevOps is a job title or a tool","It is a way of working; tools support it."],["DevOps replaces Agile","It extends Agile to delivery and operations."],["Continuous deployment means no testing","It depends on strong automated tests."]],"quiz":[{"q":"Every passing build goes to production with no human approval. This is:","o":["Continuous integration","Continuous delivery","Continuous deployment","Waterfall"],"a":2,"why":"Delivery keeps a manual release step."},{"q":"Which stage comes right after Build in the loop?","o":["Plan","Test","Monitor","Operate"],"a":1,"why":"Built code is tested before release."},{"q":"Main difference between Agile and DevOps:","o":["Agile uses no iterations","DevOps extends the practices into release and operations","DevOps forbids sprints","They are the same"],"a":1,"why":"DevOps covers the path to and life in production."}]},{"part":12,"title":"Docker: images, containers and the Dockerfile","lead":"Package an application with everything it needs into an image, run it as a lightweight container anywhere, and share it through a registry. Containers versus virtual machines, layers, volumes, ports and the everyday commands.","scene":[{"id":"df","type":"box","x":20,"y":30,"w":170,"h":130,"k":"note","l":"Dockerfile","s":"FROM python:3.12-slim|WORKDIR /app|COPY requirements.txt .|RUN pip install -r ...|COPY . .|CMD [\"python\",\"app.py\"]"},{"id":"cmds","type":"box","x":20,"y":175,"w":170,"h":155,"k":"my","l":"Core commands","s":"build · run · ps|logs · exec|stop · start · rm|images · rmi|pull · push · tag|compose up"},{"id":"zimg","type":"zone","x":210,"y":20,"w":200,"h":220,"k":"plain","l":"Image: myapp:1.0"},{"id":"l4","type":"box","x":220,"y":50,"w":180,"h":40,"k":"store","l":"CMD python app.py","s":""},{"id":"l3","type":"box","x":220,"y":95,"w":180,"h":40,"k":"store","l":"COPY . . (code)","s":""},{"id":"l2","type":"box","x":220,"y":140,"w":180,"h":40,"k":"store","l":"RUN pip install","s":""},{"id":"l1","type":"box","x":220,"y":185,"w":180,"h":40,"k":"store","l":"FROM python:3.12","s":""},{"id":"hub","type":"box","x":430,"y":30,"w":160,"h":80,"k":"store","l":"🐳 Docker Hub","s":"registry: push / pull|asha/myapp:1.0"},{"id":"cli","type":"box","x":610,"y":30,"w":170,"h":80,"k":"my","l":"docker CLI","s":"talks to dockerd|(Docker Engine)"},{"id":"zhost","type":"zone","x":430,"y":130,"w":350,"h":200,"k":"plain","l":"Docker host: Linux + Docker Engine"},{"id":"c1","type":"box","x":445,"y":165,"w":100,"h":70,"k":"vm","l":"container 1","s":"-p 8001:5000"},{"id":"c2","type":"box","x":555,"y":165,"w":100,"h":70,"k":"vm","l":"container 2","s":"-p 8002:5000"},{"id":"c3","type":"box","x":665,"y":165,"w":100,"h":70,"k":"vm","l":"container 3","s":"redis"},{"id":"vol","type":"box","x":445,"y":250,"w":155,"h":65,"k":"store","l":"Volume","s":"data survives|container removal"},{"id":"netw","type":"box","x":615,"y":250,"w":150,"h":65,"k":"net","l":"Network","s":"containers reach|each other by name"},{"id":"vm","type":"box","x":20,"y":345,"w":370,"h":115,"k":"store","l":"Virtual machine","s":"full guest OS per VM (gigabytes)|boots in tens of seconds to minutes|hypervisor isolation: strongest|run any OS (Windows on Linux host)"},{"id":"ct","type":"box","x":410,"y":345,"w":370,"h":115,"k":"srv","l":"Container","s":"shares the host kernel (megabytes)|starts in about a second|isolated by namespaces + cgroups|Linux containers need a Linux kernel"}],"steps":[{"t":"The problem: it works on my machine","d":"An app that runs on a developer's laptop fails on the server because of a different Python version, a missing library or a different OS setting. Docker packages the application together with its runtime, libraries and settings into one image that runs the same everywhere.","s":["vm","ct"],"hi":["ct"],"a":"A shipping container: whatever is inside, every port, ship, train and truck in the world handles the same standard box.","ins":[["Size",[["VM","GBs: includes a whole OS"],["Container","MBs: app + libraries only"]]],["Start time",[["VM","tens of seconds to minutes"],["Container","about a second"]]],["Isolation",[["VM","separate kernel (hypervisor)"],["Container","shared kernel, namespaces and cgroups"]]],["Density",[["VM","a few to dozens per host"],["Container","dozens to hundreds per host"]]],["Together",[["Typical","containers usually run inside cloud VMs"]]]]},{"t":"The Dockerfile: a recipe","d":"A Dockerfile is a text file of instructions. FROM picks a base image, WORKDIR sets the folder, COPY adds files, RUN executes commands during the build, EXPOSE documents the port, and CMD is the command the container runs when it starts.","s":["df"],"hi":["df"],"ins":[["FROM",[["Example","FROM python:3.12-slim"],["Meaning","start from an official, small Python image"]]],["WORKDIR",[["Example","WORKDIR /app"]]],["COPY",[["Example","COPY requirements.txt ."]]],["RUN",[["Example","RUN pip install --no-cache-dir -r requirements.txt"],["When","at build time"]]],["EXPOSE",[["Example","EXPOSE 5000"],["Note","documentation only; -p actually publishes"]]],["CMD",[["Example","CMD [\"python\", \"app.py\"]"],["When","at container start"]]]]},{"t":"docker build creates an image of layers","d":"docker build -t myapp:1.0 . reads the Dockerfile and creates an image: a read-only stack of layers, one per instruction that changes files. Images are named repository:tag, such as myapp:1.0; latest is just the default tag, not automatically the newest.","s":["zimg","l1","l2","l3","l4"],"hi":["zimg"],"p":[{"v":["df","l1","l2","l3","l4"],"c":"data","l":"docker build","d":0,"x":false}]},{"t":"Layer caching makes rebuilds fast","d":"Docker reuses an unchanged layer from cache. Copy requirements.txt and install packages before copying your code: then editing app.py rebuilds only the last layers in seconds, instead of reinstalling every library.","hi":["l2","l3"],"set":{"l1":{"k":"store","s":"cached"},"l2":{"k":"store","s":"cached"},"l3":{"k":"my","s":"rebuilt"}},"dp":"Also add a .dockerignore file (venv/, .git/, __pycache__/, data/) so the build context is small and secrets or large files are never copied into the image."},{"t":"docker run starts containers","d":"A container is a running instance of an image with its own thin writable layer, process list, file system view and network. One image can run as many containers. -p 8001:5000 maps port 8001 on the host to port 5000 inside the container; -d runs it in the (function(){const txt=document.getElementById('labs').textContent.split('\n');let mi=-1,st=null;
  const flush=()=>{if(st&&mi>=0){MODS[mi].lab.steps.push([st.t,st.c.join('\n').replace(/\s+$/,''),st.n.join(' '),st.o.join('\n')]);}st=null;};
  txt.forEach(line=>{
    if(line.startsWith('### ')){flush();mi=parseInt(line.slice(4))-1;MODS[mi].lab={intro:'',steps:[]};return;}
    if(mi<0)return;
    if(line.startsWith('#i ')){MODS[mi].lab.intro=line.slice(3);return;}
    if(line.startsWith('## ')){flush();st={t:line.slice(3),c:[],n:[],o:[]};return;}
    if(!st)return;
    if(line.startsWith('-- ')){st.n.push(line.slice(3));return;}
    if(line.startsWith('>> ')){st.o.push(line.slice(3));return;}
    if(line==='>>'){st.o.push('');return;}
    st.c.push(line);});
  flush();})();

function chmodHTML(){const cls=[['u','Owner'],['g','Group'],['o','Others']];
  let h='<div class="tryit"><p>Tick boxes or type an octal mode. Everything updates together.</p><div class="table-responsive"><table class="table maptbl text-center mb-2"><thead><tr><th class="text-start">Class</th><th>read (4)</th><th>write (2)</th><th>execute (1)</th></tr></thead><tbody>';
  cls.forEach(([c,n])=>{h+=`<tr><td class="text-start">${n} (${c})</td>`+['r','w','x'].map(p=>`<td><input class="form-check-input" type="checkbox" id="cb_${c}${p}" aria-label="${n} ${p}"></td>`).join('')+'</tr>';});
  h+='</tbody></table></div><div class="d-flex flex-wrap gap-3 mb-3"><label><input class="form-check-input me-1" type="checkbox" id="cb_s4">SUID (4)</label><label><input class="form-check-input me-1" type="checkbox" id="cb_s2">SGID (2)</label><label><input class="form-check-input me-1" type="checkbox" id="cb_s1">Sticky (1)</label></div>';
  h+='<label for="octIn" class="form-label fw-bold">Octal mode</label><input id="octIn" class="form-control mb-3" style="max-width:9rem" value="750" inputmode="numeric"><div class="out" id="chOut"></div></div>';return h;}
function chmodInit(){
  const cb=id=>document.getElementById('cb_'+id);const out=document.getElementById('chOut'),oi=document.getElementById('octIn');
  const read=()=>{const d=[0,0,0];['u','g','o'].forEach((c,i)=>{if(cb(c+'r').checked)d[i]+=4;if(cb(c+'w').checked)d[i]+=2;if(cb(c+'x').checked)d[i]+=1;});let sp=0;[4,2,1].forEach(v=>{if(cb('s'+v).checked)sp+=v;});return {sp,d};};
  const write=(sp,d)=>{['u','g','o'].forEach((c,i)=>{cb(c+'r').checked=!!(d[i]&4);cb(c+'w').checked=!!(d[i]&2);cb(c+'x').checked=!!(d[i]&1);});[4,2,1].forEach(v=>cb('s'+v).checked=!!(sp&v));};
  const render=(fromInput)=>{const {sp,d}=read();let s='-';const word=['','',''];
    [0,1,2].forEach(i=>{const r=d[i]&4,w=d[i]&2,x=d[i]&1;s+=(r?'r':'-')+(w?'w':'-');
      const spec=(i===0&&(sp&4))||(i===1&&(sp&2)),stk=(i===2&&(sp&1));
      s+=spec?(x?'s':'S'):stk?(x?'t':'T'):(x?'x':'-');word[i]=(r?'r':'')+(w?'w':'')+(x?'x':'');});
    const oct=(sp?String(sp):'')+d.join('');if(!fromInput)oi.value=oct;
    const extra=[sp&4?'u+s':'',sp&2?'g+s':'',sp&1?'+t':''].filter(Boolean);
    const who=['Owner','Group','Others'].map((n,i)=>`${n}: ${word[i]?word[i].split('').map(c=>({r:'read',w:'write',x:'execute'}[c])).join(', '):'nothing'}`).join('<br>');
    const warn=s.includes('S')||s.includes('T')?'<br><span class="text-danger">Capital S/T: special bit set without execute, usually a mistake.</span>':(d[2]&2?'<br><span class="text-danger">Others can write: rarely what you want.</span>':'');
    out.innerHTML=`ls -l shows: <b>${s}</b><br>Octal: <b>${oct}</b><br>chmod ${oct} file<br>chmod u=${word[0]},g=${word[1]},o=${word[2]}${extra.length?','+extra.join(','):''} file<br><br>${who}${warn}`;};
  document.querySelectorAll('.tryit input[type=checkbox]').forEach(c=>c.onchange=()=>render(false));
  oi.oninput=()=>{const v=oi.value.trim();if(!/^[0-7]{3,4}$/.test(v)){out.textContent='Type 3 or 4 digits from 0 to 7, e.g. 755 or 2770.';return;}
    const digits=v.split('').map(Number);const sp=digits.length===4?digits[0]:0;write(sp,digits.slice(-3));render(true);};
  oi.oninput();}
function umaskHTML(){return '<div class="tryit"><p>Type a umask and see what new files and folders will get.</p><label for="umIn" class="form-label fw-bold">umask</label><input id="umIn" class="form-control mb-3" style="max-width:9rem" value="022" inputmode="numeric"><div class="out" id="umOut"></div></div>';}
function umaskInit(){const i=document.getElementById('umIn'),o=document.getElementById('umOut');
  const sym=n=>[(n>>6)&7,(n>>3)&7,n&7].map(v=>(v&4?'r':'-')+(v&2?'w':'-')+(v&1?'x':'-')).join('');
  const f=()=>{const v=i.value.trim();if(!/^0?[0-7]{3}$/.test(v)){o.textContent='Type 3 digits from 0 to 7, e.g. 022 or 077.';return;}
    const m=parseInt(v.slice(-3),8),fl=0o666&~m,dr=0o777&~m;const oc=n=>n.toString(8).padStart(3,'0');
    o.innerHTML=`New file: 666 &amp; ~${oc(m)} = <b>${oc(fl)}</b>  -${sym(fl)}<br>New folder: 777 &amp; ~${oc(m)} = <b>${oc(dr)}</b>  d${sym(dr)}<br><br>Naive subtraction would give file ${(0o666-m>=0)?oc(0o666-m).replace(/[89]/g,'?'):'?'} — compare: bits are removed, not subtracted.<br>Set it: umask ${oc(m)}`;};
  i.oninput=f;f();}

  svg.innerHTML='';G={};nodes={};
  const layers=['zones','lines','boxes','pk'].reduce((o,n)=>(o[n]=mk('g',{},svg),o),{});
  m.scene.forEach(e=>{ if(e.type==='box'||e.type==='zone') G[e.id]={x:e.x,y:e.y,w:e.w,h:e.h}; else if(e.type==='txt') G[e.id]={x:e.x-5,y:e.y-10,w:10,h:14}; });
  m.scene.forEach(e=>{
    let g;
    if(e.type==='zone'){g=mk('g',{class:`el zone z-${e.k}`},layers.zones);mk('rect',{x:e.x,y:e.y,width:e.w,height:e.h,rx:14},g);const t=mk('text',{x:e.x+12,y:e.y+21,class:'zlab'},g);t.textContent=e.l;}
    else if(e.type==='line'){const a=ctr(e.a),b=ctr(e.b);g=mk('g',{class:'el'},layers.lines);mk('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'link'},g);}
    else if(e.type==='txt'){g=mk('g',{class:'el'},layers.boxes);const t=mk('text',{x:e.x,y:e.y,'text-anchor':e.anchor,class:'zlab'},g);t.textContent=e.l;}
    else {g=mk('g',{class:'el box'},layers.boxes);mk('rect',{x:e.x,y:e.y,width:e.w,height:e.h,rx:10},g);}
    nodes[e.id]={g,e};
  });
  svg._pk=layers.pk;
}
function drawBoxText(n,st){
  const {g,e}=n; g.querySelectorAll('text').forEach(t=>t.remove());
  g.setAttribute('class',`el box k-${st.k}`+(g.classList.contains('on')?' on':'')+(g.classList.contains('hi')?' hi':''));
  const lines=[st.l].concat(st.s?st.s.split(/(?<!\\)\|/).map(x=>x.replace(/\\\|/g,'|')):[]);
  const total=17+(lines.length-1)*15; let y=e.y+e.h/2-total/2+13;
  lines.forEach((ln,i)=>{const t=mk('text',{x:e.x+e.w/2,y:y,'text-anchor':'middle',class:i?'sub':'lab'},g);t.textContent=ln;y+=i?15:18;});
}
function ctr(ref){
  if(Array.isArray(ref))return ref;
  const [id,side]=ref.split('@');const b=G[id];if(!b)return[400,240];
  const c=[b.x+b.w/2,b.y+b.h/2];
  if(side==='t')return[c[0],b.y]; if(side==='b')return[c[0],b.y+b.h];
  if(side==='l')return[b.x,c[1]]; if(side==='r')return[b.x+b.w,c[1]]; return c;
}
function stateAt(m,i){
  const appear=new Set();m.steps.forEach(s=>(s.s||[]).forEach(id=>appear.add(id)));
  const vis=new Set(m.scene.map(e=>e.id).filter(id=>!appear.has(id)));
  const ov={};
  for(let k=0;k<=i;k++){const s=m.steps[k];(s.s||[]).forEach(id=>vis.add(id));(s.h||[]).forEach(id=>vis.delete(id));
    for(const id in (s.set||{}))ov[id]=Object.assign({},ov[id],s.set[id]);}
  return {vis,ov};
}
function applyStep(){
  const m=MODS[cur],s=m.steps[step],{vis,ov}=stateAt(m,step);const hi=new Set(s.hi||[]);
  for(const id in nodes){const n=nodes[id];n.g.classList.toggle('on',vis.has(id));n.g.classList.toggle('hi',hi.has(id));
    if(n.e.type==='box'){const st=Object.assign({k:n.e.k,l:n.e.l,s:n.e.s},ov[id]||{});drawBoxText(n,st);}}
  document.getElementById('stepno').textContent=`Step ${step+1} of ${m.steps.length}`;
  document.getElementById('stitle').textContent=s.t;
  document.getElementById('sdesc').textContent=s.d;
  const an=document.getElementById('sana');
  if(s.a){an.style.display='';an.innerHTML='<b>Think of it as:</b> ';an.appendChild(document.createTextNode(s.a));}else an.style.display='none';
  document.querySelectorAll('.dot').forEach((d,i)=>{d.classList.toggle('on',i===step);d.classList.toggle('past',i<step);d.setAttribute('aria-current',i===step?'step':'false');});
  const dp=document.getElementById('sdeep');if(s.dp){dp.style.display='';document.getElementById('sdeept').textContent=s.dp;}else dp.style.display='none';
  renderInspector(s.ins);
  startPackets(s.p||[]);
  document.getElementById('prev').disabled=step===0;
  document.getElementById('next').disabled=step===m.steps.length-1&&cur===MODS.length-1;
}
/* inspector */
let insTimer=null;
function renderInspector(ins){
  clearInterval(insTimer);const box=document.getElementById('sins');
  if(!ins){box.style.display='none';return;}box.style.display='';
  const hops=document.getElementById('hops');hops.innerHTML='';
  const show=i=>{hops.querySelectorAll('.hop').forEach((h,k)=>h.classList.toggle('on',k===i));
    document.getElementById('hopbody').innerHTML=ins[i][1].map(r=>`<div class="hdr"><div>${esc(r[0])}</div><div>${esc(r[1])}</div></div>`).join('');};
  ins.forEach((h,i)=>{const b=document.createElement('button');b.className='hop';b.textContent=`${i+1}. ${h[0]}`;b.onclick=()=>{clearInterval(insTimer);show(i);};hops.appendChild(b);});
  let i=0;show(0);if(!reduce)insTimer=setInterval(()=>{i=(i+1)%ins.length;show(i);},3200/speed);
}
/* packets */
function startPackets(list){
  cancelAnimationFrame(raf);svg._pk.innerHTML='';packets=[];
  list.forEach(p=>{
    const pts=p.v.map(ctr);const segs=[];let len=0;
    for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);len+=d;}
    const g=mk('g',{class:`pk pk-${p.c}`},svg._pk);mk('circle',{r:8,cx:pts[0][0],cy:pts[0][1]},g);
    const t=mk('text',{x:pts[0][0],y:pts[0][1]-14,'text-anchor':'middle'},g);t.textContent=p.l;
    let x=null;if(p.x){x=mk('text',{class:'xmark','text-anchor':'middle',x:pts[pts.length-1][0],y:pts[pts.length-1][1]+9,opacity:0},svg._pk);x.textContent='✕';}
    g.style.opacity=0;
    packets.push({pts,segs,len,g,t,x,delay:p.d*1000,born:performance.now()});
  });
  if(!packets.length)return;
  if(reduce){packets.forEach(pk=>{const e=pk.pts[pk.pts.length-1];place(pk,e);pk.g.style.opacity=1;if(pk.x)pk.x.setAttribute('opacity',1);});return;}
  const loop=now=>{
    packets.forEach(pk=>{
      const travel=pk.len/(170*speed)*1000, pause=1100;
      const period=Math.max(...packets.map(q=>q.delay/speed+q.len/(170*speed)*1000))+pause;
      let t=(now-pk.born)%period - pk.delay/speed;
      if(t<0||t>travel+pause*0.8){pk.g.style.opacity=0;if(pk.x)pk.x.setAttribute('opacity',0);return;}
      if(t>travel){place(pk,pk.pts[pk.pts.length-1]);pk.g.style.opacity=pk.x?0.3:1;if(pk.x)pk.x.setAttribute('opacity',1);return;}
      if(pk.x)pk.x.setAttribute('opacity',0);
      let dist=t/travel*pk.len,i=0;while(i<pk.segs.length-1&&dist>pk.segs[i]){dist-=pk.segs[i];i++;}
      const a=pk.pts[i],b=pk.pts[i+1],f=pk.segs[i]?Math.min(dist/pk.segs[i],1):1;
      place(pk,[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);pk.g.style.opacity=1;
    });
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}
function place(pk,[x,y]){const c=pk.g.querySelector('circle');c.setAttribute('cx',x);c.setAttribute('cy',y);pk.t.setAttribute('x',x);pk.t.setAttribute('y',y-14);}

/* navigation */
function go(i){step=i;applyStep();}
function next(){const m=MODS[cur];if(step<m.steps.length-1)go(step+1);else if(cur<MODS.length-1){loadModule(cur+1);}else stopPlay();}
function prev(){if(step>0)go(step-1);}
function dwell(){const s=MODS[cur].steps[step];const pk=(s.p||[]).reduce((mx,p)=>Math.max(mx,p.d*1000+3000),0);return Math.max(5000+s.d.length*40,pk+1500)/speed;}
function schedule(){clearTimeout(playTimer);if(!playing)return;playTimer=setTimeout(()=>{const m=MODS[cur];if(step===m.steps.length-1){stopPlay();return;}next();schedule();},dwell());}
function startPlay(){playing=true;document.getElementById('play').textContent='Pause';schedule();}
function stopPlay(){playing=false;clearTimeout(playTimer);document.getElementById('play').textContent='Play';}

function loadModule(i){
  stopPlay();cur=i;step=0;const m=MODS[i];visited.add(i);try{localStorage.setItem('awsVisited',JSON.stringify([...visited]));}catch(e){}
  document.getElementById('mnum').textContent=`Module ${i+1} of ${MODS.length}, ${PARTS[m.part]}`;
  document.getElementById('mtitle').textContent=m.title;
  document.getElementById('mlead').textContent=m.lead;
  const dots=document.getElementById('dots');dots.innerHTML='';
  m.steps.forEach((s,k)=>{const b=document.createElement('button');b.className='dot';b.title=`Step ${k+1}: ${s.t}`;b.setAttribute('aria-label',`Go to step ${k+1}`);b.onclick=()=>{stopPlay();go(k);};dots.appendChild(b);});
  buildScene(m);applyStep();renderTabs(m);renderNav();
  if(window.bootstrap){const oc=bootstrap.Offcanvas.getInstance(document.getElementById('side'));if(oc)oc.hide();}
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
}
function renderNav(){
  const box=document.getElementById('modlist');box.innerHTML='';
  PARTS.forEach((p,pi)=>{const h=document.createElement('div');h.className='part';h.textContent=p;box.appendChild(h);
    MODS.forEach((m,i)=>{if(m.part!==pi)return;const b=document.createElement('button');
      b.className='modlink'+(i===cur?' active':'')+(visited.has(i)&&i!==cur?' done':'');
      b.innerHTML=`<span class="num">${i+1}</span><span></span>`;b.lastChild.textContent=m.title;b.onclick=()=>loadModule(i);box.appendChild(b);});});
}
/* tabs */
function renderTabs(m){
  const tabs=[['lab','Hands-on lab'],['cmp','Cheat sheet'],['ana','Analogy'],['use','Use cases'],['terms',`Key terms (${m.terms.length})`],['myth','Myths']];
  if(m.tryit)tabs.splice(1,0,['try',({chmod:'Try it: chmod calculator',umask:'Try it: umask calculator',cidr:'Try it: CIDR calculator'})[m.tryit]]);
  tabs.push(['quiz',`Quiz (${m.quiz.length})`]);
  const ul=document.getElementById('tabs');ul.innerHTML='';
  tabs.forEach(([k,l],i)=>{const li=document.createElement('li');li.className='nav-item';li.innerHTML=`<button class="nav-link${i?'':' active'}" role="tab">${l}</button>`;
    li.firstChild.onclick=()=>{ul.querySelectorAll('.nav-link').forEach(n=>n.classList.remove('active'));li.firstChild.classList.add('active');showTab(m,k);};ul.appendChild(li);});
  showTab(m,'lab');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showTab(m,k){
  const b=document.getElementById('tabbody');
  if(k==='ana'){b.innerHTML=`<p class="fw-bold mb-2">${esc(m.analogy.intro)}</p><div class="table-responsive"><table class="table maptbl mb-0"><thead><tr><th>Everyday world</th><th>Technical term</th></tr></thead><tbody>${m.analogy.map.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;}
  else if(k==='use'){b.innerHTML=m.usecase;}
  else if(k==='cmp'){b.innerHTML=`<div class="table-responsive"><table class="table maptbl cmp mb-0"><thead><tr>${m.cmp.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${m.cmp.rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<td><code>${esc(c)}</code></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
  else if(k==='lab'){
    b.innerHTML=`<p>${esc(m.lab.intro)}</p>`+m.lab.steps.map((st,i)=>`<div class="labstep"><div class="d-flex align-items-center gap-2 mb-1"><span class="lnum">${i+1}</span><b>${esc(st[0])}</b><button class="btn btn-sm btn-outline-dark ms-auto copy" data-i="${i}">Copy</button></div><pre class="code"><code>${esc(st[1])}</code></pre>${st[3]?`<div class="outlab">Expected output (yours may differ)</div><pre class="code out"><code>${esc(st[3])}</code></pre>`:''}${st[2]?`<p class="small text-secondary mb-0">${esc(st[2])}</p>`:''}</div>`).join('')+`<button class="btn btn-sm btn-dark mt-2" id="dlAll">Download all lab commands</button>`;
    b.querySelectorAll('.copy').forEach(btn=>btn.onclick=()=>{const t=m.lab.steps[+btn.dataset.i][1];
      const done=()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1500);};
      if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done);});
    document.getElementById('dlAll').onclick=downloadAll;
  }
  else if(k==='myth'){b.innerHTML='<h4 class="h6 fw-bold">Common misconceptions</h4>'+m.myths.map(x=>`<div class="myth"><div class="m">✕ ${esc(x[0])}</div><div class="f">✓ ${esc(x[1])}</div></div>`).join('');}
  else if(k==='terms'){b.innerHTML=m.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b><div>${esc(t[1])}</div></div>`).join('');}
  else if(k==='try'){if(m.tryit==='chmod'){b.innerHTML=chmodHTML();chmodInit();}else if(m.tryit==='cidr'){b.innerHTML=cidrHTML();cidrInit();}else{b.innerHTML=umaskHTML();umaskInit();}}
  else if(k==='quiz'){
    b.innerHTML=m.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><p class="fw-bold mb-1">${qi+1}. ${esc(q.q)}</p>${q.o.map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join('')}<div class="why" hidden></div></div>`).join('');
    b.querySelectorAll('.q').forEach(qd=>{const q=m.quiz[+qd.dataset.q];qd.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      qd.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));const ok=+btn.dataset.o===q.a;
      btn.classList.add(ok?'right':'wrong');qd.querySelectorAll('.opt')[q.a].classList.add('right');
      const w=qd.querySelector('.why');w.hidden=false;w.textContent=(ok?'Correct. ':'Not quite. ')+q.why;});});
  }
}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
function downloadAll(){let out='# Linux & Cloud, animated: all lab commands\n# Run on a PRACTICE machine only. Run step by step, not as one script.\n';
  MODS.forEach((m,i)=>{out+=`\n\n# =====================================================\n# Module ${i+1}: ${m.title}\n# =====================================================\n`;
    m.lab.steps.forEach((st,k)=>{out+=`\n# Step ${k+1}: ${st[0]}\n${st[1]}\n`;});});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain'}));a.download='linux_cloud_course_labs.txt';a.click();}
/* CIDR calculator */
function cidrHTML(){return `<div class="tryit row g-3 align-items-end"><div class="col-sm-6"><label for="cip" class="form-label">Base IP</label><input id="cip" class="form-control" value="10.0.1.0"></div>
<div class="col-sm-6"><label for="cpre" class="form-label">Prefix: /<span id="cpv">24</span></label><input id="cpre" type="range" class="form-range" min="16" max="28" value="24"></div>
<div class="col-12"><div class="out" id="cout"></div><p class="small text-secondary mt-2 mb-0">AWS VPCs and subnets accept /16 to /28. Usable = total − 5 reserved by AWS.</p></div></div>`;}
function cidrInit(){const ip=document.getElementById('cip'),pr=document.getElementById('cpre');const f=()=>{
  const p=+pr.value;document.getElementById('cpv').textContent=p;const parts=ip.value.trim().split('.').map(Number);const out=document.getElementById('cout');
  if(parts.length!==4||parts.some(n=>isNaN(n)||n<0||n>255)){out.textContent='Enter an IPv4 address like 10.0.1.0';return;}
  const n=((parts[0]<<24)>>>0)+(parts[1]<<16)+(parts[2]<<8)+parts[3];const mask=p===0?0:(0xFFFFFFFF<<(32-p))>>>0;
  const net=(n&mask)>>>0,size=2**(32-p),last=(net+size-1)>>>0;const q=x=>[x>>>24,(x>>>16)&255,(x>>>8)&255,x&255].join('.');
  out.innerHTML=`CIDR: <b>${q(net)}/${p}</b><br>Subnet mask: ${q(mask)}<br>Network bits: ${p}, host bits: ${32-p}<br>Total addresses: 2^${32-p} = <b>${size.toLocaleString('en-IN')}</b><br>Usable in AWS: <b>${(size-5).toLocaleString('en-IN')}</b><br>Range: ${q(net)} to ${q(last)}<br>Reserved: ${q(net)}, ${q(net+1)}, ${q(net+2)}, ${q(net+3)}, ${q(last)}`;};
  ip.oninput=f;pr.oninput=f;f();}
/* glossary */
function renderGloss(filter=''){
  const f=filter.toLowerCase();const all=[];MODS.forEach((m,i)=>m.terms.forEach(t=>all.push([t[0],t[1],i])));
  all.sort((a,b)=>a[0].localeCompare(b[0]));
  const list=all.filter(t=>!f||t[0].toLowerCase().includes(f)||t[1].toLowerCase().includes(f));
  const g=document.getElementById('glist');
  g.innerHTML=list.length?list.map(t=>`<div class="term"><b>${esc(t[0])}</b> <button class="btn btn-link btn-sm p-0 ms-1 align-baseline" data-m="${t[2]}">Module ${t[2]+1}</button><div>${esc(t[1])}</div></div>`).join(''):'<p>No term matches. Try a shorter word, such as "subnet".</p>';
  g.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(window.bootstrap){const md=bootstrap.Modal.getInstance(document.getElementById('gloss'));if(md)md.hide();}loadModule(+b.dataset.m);});
}
document.getElementById('gsearch').oninput=e=>renderGloss(e.target.value);
/* controls */
document.getElementById('next').onclick=()=>{stopPlay();next();};
document.getElementById('prev').onclick=()=>{stopPlay();prev();};
document.getElementById('play').onclick=()=>playing?stopPlay():startPlay();
document.getElementById('replay').onclick=()=>startPackets(MODS[cur].steps[step].p||[]);
document.getElementById('speed').onchange=e=>{speed=+e.target.value;startPackets(MODS[cur].steps[step].p||[]);if(playing)schedule();};
document.getElementById('deepT').onchange=e=>document.body.classList.toggle('nodeep',!e.target.checked);
document.getElementById('presentBtn').onclick=()=>{const on=document.body.classList.toggle('present');document.getElementById('presentBtn').textContent=on?'Exit presenter mode':'Presenter mode';};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;
  if(e.key==='ArrowRight'){stopPlay();next();}else if(e.key==='ArrowLeft'){stopPlay();prev();}else if(e.key===' '){e.preventDefault();playing?stopPlay():startPlay();}});
renderGloss();loadModule(0);
</script>
