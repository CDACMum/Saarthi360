o numbers|  3) Today's date|  4) Quit||Choice: _"},{"id":"loop","type":"box","x":410,"y":25,"w":370,"h":80,"k":"vm","l":"until loop","s":"until [ \"$choice\" = 4 ]; do|  … show menu, read choice …   done"},{"id":"read","type":"box","x":410,"y":120,"w":175,"h":70,"k":"note","l":"read -p","s":"read -p \"Choice: \"|choice"},{"id":"case","type":"box","x":605,"y":120,"w":175,"h":70,"k":"my","l":"case \"$choice\"","s":"1) 2) 3) 4)|*) invalid"},{"id":"c1","type":"box","x":410,"y":205,"w":85,"h":55,"k":"store","l":"df -h","s":""},{"id":"c2","type":"box","x":505,"y":205,"w":85,"h":55,"k":"store","l":"expr","s":""},{"id":"c3","type":"box","x":600,"y":205,"w":85,"h":55,"k":"store","l":"date","s":""},{"id":"c4","type":"box","x":695,"y":205,"w":85,"h":55,"k":"sec","l":"break","s":""},{"id":"tput","type":"box","x":20,"y":290,"w":360,"h":170,"k":"net","l":"tput: control the terminal","s":"tput clear     clear screen|tput cup 5 10  move to row 5, col 10|tput bold / tput sgr0  bold / normal|tput setaf 2   green text (1 red, 3 yellow)|tput cols / lines  terminal size|tput smso / rmso   highlight on / off"},{"id":"math","type":"box","x":410,"y":275,"w":370,"h":185,"k":"note","l":"Arithmetic in scripts","s":"expr 5 + 3        8 (spaces needed!)|expr 5 \\* 3       15 (escape *)|echo $((5 * 3))   15 (modern)|let \"n = n + 1\"   increment|echo \"7 / 2\" \\| bc -l   3.5000|integer only: $((7/2)) = 3"}],"steps":[{"t":"A script that talks to the user","d":"read waits for input and stores it in a variable: read -p \"Name: \" name shows a prompt first; read -s hides typing (passwords); read -t 10 gives up after 10 seconds. echo prints; echo -n stays on the same line; printf gives exact formatting.","s":["read"],"hi":["read"],"a":"A receptionist who asks a question, waits for the answer, then acts on it."},{"t":"Arithmetic: expr and $(( ))","d":"The original way is expr: expr 5 + 3 (spaces required, and * must be escaped as \\*). Modern bash uses $(( )): echo $((5 * 3)). Both do whole numbers only, so 7 / 2 gives 3. For decimals pipe to bc: echo \"scale=2; 7 / 2\" | bc gives 3.50.","s":["math"],"hi":["math"],"ins":[["expr 10 + 5",[["Output","15"]]],["expr 10 \\* 5",[["Output","50"],["Note","unescaped * would expand to file names"]]],["expr 10 / 3 ; expr 10 % 3",[["Output","3 and 1 (quotient, remainder)"]]],["echo $(( (4 + 6) * 2 ))",[["Output","20"]]],["echo \"scale=2; 10/3\" | bc",[["Output","3.33"]]]]},{"t":"tput paints the screen","d":"tput sends terminal control codes so scripts can clear the screen, move the cursor to a row and column, and switch bold, colours and highlighting on and off. tput sgr0 resets everything. tput cols and tput lines report the window size, so you can centre text.","s":["scr","tput"],"hi":["tput"],"dp":"tput reads the terminal's capabilities from the terminfo database using $TERM, so the same script works in different terminals. Colours: tput setaf N sets the foreground (0 black, 1 red, 2 green, 3 yellow, 4 blue, 5 magenta, 6 cyan, 7 white); tput setab N the background."},{"t":"Menu logic: read, then case","d":"After drawing the menu, the script reads the choice and a case statement picks the action: 1 runs df -h, 2 reads two numbers and adds them with expr, 3 runs date, any other key prints \"Invalid choice\".","s":["case","c1","c2","c3"],"p":[{"v":["read","case","c1"],"c":"req","l":"1","d":0,"x":false},{"v":["read","case","c2"],"c":"req","l":"2","d":1.4,"x":false},{"v":["read","case","c3"],"c":"req","l":"3","d":2.8,"x":false}]},{"t":"Looping: until, while, break and continue","d":"until [ \"$choice\" = 4 ] repeats the menu until the user picks 4 (until runs while the test is false; while runs while it is true). Inside a loop, continue jumps straight to the next round (for example after an invalid choice) and break leaves the loop immediately.","s":["loop","c4"],"hi":["loop","c4"],"p":[{"v":["read","case","c4"],"c":"bad","l":"4 → break","d":0,"x":false}],"a":"A canteen counter: keep serving until the customer says \"that is all\" (until); skip an item that is sold out (continue); close the counter on a fire alarm (break)."}],"analogy":{"intro":"A school reception kiosk.","map":[["Receptionist asks a question and waits","read"],["Calculator on the desk","expr / $(( )) / bc"],["Arranging the notice board: position, bold, colour","tput cup, bold, setaf"],["Menu card","case choices"],["Serving until the customer says \"done\"","until loop"],["\"Sold out, next item please\"","continue"],["\"Counter closed\"","break"]]},"cmp":{"head":["Syntax","Meaning"],"rows":[["read -p \"Name: \" name","prompt and read"],["read -s -p \"Password: \" pw","hidden input"],["echo -n \"…\" / echo -e \"a\\tb\"","no newline / interpret escapes"],["printf \"%-10s %5d\\n\" asha 95","formatted output"],["expr 5 + 3 / expr 5 \\* 3","integer arithmetic (old style)"],["$((a + b)), ((n++))","integer arithmetic (bash)"],["echo \"scale=2; 7/2\" | bc","decimals"],["tput clear / cup R C","clear / move cursor"],["tput bold / setaf 2 / sgr0","bold / green / reset"],["while cond; do …; done","loop while true"],["until cond; do …; done","loop until true"],["break / continue","leave loop / next round"],["cmd1; cmd2 / cmd1 && cmd2","multiple commands on one line"]]},"usecase":"<p><b>Lab coordinator:</b> a menu script on the lab server lets students check disk quota, reset their practice folder or view the timetable without knowing the commands.</p><p><b>System administrator:</b> an interactive \"new user\" script asks for name and group with read, validates input, and colours errors red with tput setaf 1.</p><p><b>Data engineer:</b> a small script asks which date to reprocess, computes the previous day with $(( )) or date -d, and starts the job.</p>","terms":[["read","Read a line of input into variables."],["echo / printf","Print text / formatted text."],["expr","External command for integer arithmetic and string operations."],["$(( ))","Bash arithmetic expansion."],["bc","Calculator for decimal arithmetic."],["tput","Sends terminal control codes (cursor, colour, clear)."],["sgr0","tput capability that resets all attributes."],["until","Loop that runs until a condition becomes true."],["break / continue","Leave the loop / skip to the next iteration."],["Menu-driven script","Script that loops showing choices."]],"myths":[["expr 5*3 works","It needs spaces and an escaped star: expr 5 \\* 3."],["bash arithmetic handles decimals","$(( )) and expr are integer only; use bc or awk."],["until and while are the same","until runs while the condition is false."]],"quiz":[{"q":"Correct way to multiply with expr:","o":["expr 4*5","expr 4 \\* 5","expr 4x5","expr (4*5)"],"a":1,"why":"Spaces around operators and an escaped *."},{"q":"Move the cursor to row 5, column 10:","o":["tput cup 5 10","tput move 5 10","tput 5,10","echo 5 10"],"a":0,"why":"cup = cursor position."},{"q":"Leave a loop immediately:","o":["continue","exit 0","break","done"],"a":2,"why":"break exits the loop; exit would end the whole script."}]},{"part":7,"title":"Conditions: if, test, [[ ]], && || and case","lead":"Making scripts decide: does the folder exist, is the user already there, which group should they join?","scene":[{"id":"iff","type":"box","x":20,"y":30,"w":370,"h":230,"k":"note","l":"if / elif / else","s":"if [[ -d \"$DIR\" ]]; then|  echo \"already there\"|elif [[ -e \"$DIR\" ]]; then|  echo \"exists but not a folder\"|else|  mkdir -p \"$DIR\"|fi"},{"id":"tests","type":"box","x":420,"y":30,"w":360,"h":230,"k":"vm","l":"Test operators","s":"-e exists   -f file   -d folder|-r -w -x  readable / writable / executable|-z empty string   -n not empty|== != for strings|-eq -ne -lt -gt for numbers|&& and   \\|\\| or   ! not"},{"id":"q","type":"box","x":20,"y":280,"w":200,"h":60,"k":"net","l":"Folder exists?","s":""},{"id":"yes","type":"box","x":260,"y":280,"w":240,"h":60,"k":"store","l":"yes → skip","s":""},{"id":"no","type":"box","x":540,"y":280,"w":240,"h":60,"k":"vm","l":"no → mkdir","s":""},{"id":"cs","type":"box","x":20,"y":360,"w":760,"h":100,"k":"note","l":"case for many choices","s":"case \"$ROLE\" in|  teacher) GRP=teachers ;;   nursery) GRP=nursery ;;   *) GRP=staff ;;|esac"}],"steps":[{"t":"if … then … fi","d":"An if statement runs a command and checks its exit code: 0 means true. [[ -d \"$DIR\" ]] is a test command that succeeds if $DIR is a directory.","s":["iff"],"hi":["iff"],"a":"\"If the classroom exists, use it; otherwise build it.\""},{"t":"Test operators","d":"File tests (-e, -f, -d, -r, -w, -x), string tests (-z, -n, ==, !=) and number tests (-eq, -ne, -lt, -le, -gt, -ge). Combine with &&, || and !.","s":["tests"],"hi":["tests"],"dp":"Inside [ ] (the old test command) use -a and -o carefully and always quote variables; inside [[ ]] (bash keyword) variables are not word-split, you can use && and ||, pattern matching with == and regex with =~. Prefer [[ ]] in bash scripts; use [ ] for portable /bin/sh scripts. (( )) is for arithmetic: (( COUNT > 5 ))."},{"t":"Decision in action","d":"The script checks whether /school/nursery exists: if yes it skips, otherwise it creates it. Running the script twice is safe: it is idempotent.","s":["q","yes","no"],"p":[{"v":["q","yes"],"c":"res","l":"exists","d":0,"x":false},{"v":["q","no"],"c":"req","l":"missing","d":1.5,"x":false}]},{"t":"Short-circuit shortcuts","d":"id asha &>/dev/null || sudo useradd -m asha means \"if asha does not exist, create her\". mkdir dir && cd dir means \"cd only if mkdir worked\".","hi":["tests"],"a":"\"Check the register; only if the name is missing, make a new ID card.\""},{"t":"case for multiple options","d":"case compares one value against patterns, cleaner than many elifs. *) is the default. Each branch ends with ;;.","s":["cs"],"hi":["cs"]}],"analogy":{"intro":"A school office decision sheet.","map":[["\"If the room exists…\"","if [[ -d ]]"],["Checklist of yes/no questions","Test operators"],["\"Only if missing, make an ID card\"","||"],["\"Only if built, move in\"","&&"],["Sorting forms into trays by type","case"]]},"cmp":{"head":["Syntax","Meaning"],"rows":[["if [[ cond ]]; then … fi","conditional"],["[[ -f file ]] / [[ -d dir ]]","file / directory exists"],["[[ -z \"$X\" ]]","empty string"],["[[ \"$A\" == \"$B\" ]]","string equal"],["(( N > 5 ))","arithmetic test"],["cmd && echo ok || echo fail","success / failure shortcut"],["case \"$X\" in a) … ;; *) … ;; esac","multiple branches"],["if grep -q x file; then","use any command as condition"]]},"usecase":"<p><b>System administrator:</b> scripts check whether a user, group or folder exists before creating it, so they can be re-run safely.</p><p><b>Developer:</b> deploy scripts abort if tests fail: npm test || exit 1.</p><p><b>Data / DevOps engineer:</b> skip a load if the input file is empty: [[ -s \"$FILE\" ]] || exit 0.</p>","terms":[["if","Runs commands based on an exit code."],["test / [ ]","POSIX condition command."],["[[ ]]","Bash conditional keyword, safer and richer."],["(( ))","Arithmetic evaluation."],["&& / ||","Run next command on success / failure."],["case","Pattern-based multi-branch."],["Idempotent","Safe to run repeatedly with the same result."]],"myths":[["[ is part of if syntax","[ is a command (test); spaces around it are required."],["if checks true/false values","It checks exit codes; 0 means success/true."]],"quiz":[{"q":"True if $DIR is a directory:","o":["[[ -f \"$DIR\" ]]","[[ -d \"$DIR\" ]]","[[ -z \"$DIR\" ]]","[[ -x \"$DIR\" ]]"],"a":1,"why":"-d tests for a directory."},{"q":"Create asha only if she does not exist:","o":["id asha && useradd asha","id asha || useradd asha","useradd asha || id asha","if asha"],"a":1,"why":"|| runs on failure."},{"q":"Compare numbers in [[ ]]:","o":["==","-eq","=","=~"],"a":1,"why":"-eq for integers (or use (( )))."}]},{"part":7,"title":"Loops and arrays","lead":"Do the same thing for every teacher, file or folder.","scene":[{"id":"lst","type":"box","x":20,"y":30,"w":250,"h":170,"k":"store","l":"teachers.txt","s":"asha|meena|ravi|priya"},{"id":"loop","type":"box","x":300,"y":30,"w":480,"h":170,"k":"vm","l":"while read loop","s":"while IFS= read -r NAME; do|  sudo usermod -aG teachers \"$NAME\"|  echo \"added $NAME\"|done < teachers.txt"},{"id":"n1","type":"box","x":20,"y":225,"w":175,"h":55,"k":"ghost","l":"asha","s":""},{"id":"n2","type":"box","x":215,"y":225,"w":175,"h":55,"k":"ghost","l":"meena","s":""},{"id":"n3","type":"box","x":410,"y":225,"w":175,"h":55,"k":"ghost","l":"ravi","s":""},{"id":"n4","type":"box","x":605,"y":225,"w":175,"h":55,"k":"ghost","l":"priya","s":""},{"id":"for","type":"box","x":20,"y":300,"w":370,"h":160,"k":"note","l":"for loops","s":"for F in *.csv; do echo \"$F\"; done|for i in {1..5}; do echo \"$i\"; done|for (( i=0; i<5; i++ )); do …; done"},{"id":"arr","type":"box","x":410,"y":300,"w":370,"h":160,"k":"note","l":"Arrays and control","s":"CLASSES=(nursery kg1 kg2)|echo \"${CLASSES[0]}\" \"${#CLASSES[@]}\"|for C in \"${CLASSES[@]}\"; do …; done|break   continue   until"}],"steps":[{"t":"A list of names","d":"teachers.txt has one name per line. Adding each to the teachers group by hand is slow and error-prone.","s":["lst"]},{"t":"while read: one line at a time","d":"while IFS= read -r NAME reads the file line by line into NAME and runs the body for each. IFS= keeps spaces; -r keeps backslashes as they are.","s":["loop"],"hi":["loop"],"a":"Going down the attendance register and stamping each name."},{"t":"The loop runs four times","d":"Each iteration takes the next name and runs usermod. The animation shows each pass.","s":["n1","n2","n3","n4"],"p":[{"v":["lst","loop","n1"],"c":"req","l":"asha","d":0,"x":false},{"v":["lst","loop","n2"],"c":"req","l":"meena","d":1.6,"x":false},{"v":["lst","loop","n3"],"c":"req","l":"ravi","d":3.2,"x":false},{"v":["lst","loop","n4"],"c":"req","l":"priya","d":4.8,"x":false}]},{"t":"Done","d":"All four are now in teachers. The same script works for 4 or 400 names.","set":{"n1":{"k":"user","s":"added"},"n2":{"k":"user","s":"added"},"n3":{"k":"user","s":"added"},"n4":{"k":"user","s":"added"}}},{"t":"for loops","d":"for F in *.csv loops over files matching a pattern. {1..5} makes a sequence. The C-style form uses (( )). Always quote \"$F\" because file names may contain spaces.","s":["for"],"hi":["for"],"dp":"Do not loop over $(ls) or $(cat file): output is split on spaces and wildcards expand. Use globs (for F in *.csv) for files, and while read for lines."},{"t":"Arrays and loop control","d":"Arrays hold lists: CLASSES=(nursery kg1 kg2). ${CLASSES[0]} is the first item, ${#CLASSES[@]} the count, \"${CLASSES[@]}\" all items safely. break leaves a loop; continue skips to the next item.","s":["arr"],"hi":["arr"],"dp":"Avoid naming a variable GROUPS, HOSTNAME or UID in bash: those are built-in shell variables."}],"analogy":{"intro":"Going down a register.","map":[["Register of names","Input file"],["Stamping each name in turn","Loop body"],["Each line","Iteration"],["\"Skip absentees\"","continue"],["\"Stop at the first fire alarm\"","break"],["Row of labelled boxes","Array"]]},"cmp":{"head":["Syntax","Meaning"],"rows":[["for X in a b c; do …; done","loop over words"],["for F in *.csv; do …; done","loop over files"],["for i in {1..10}; do …; done","numeric range"],["while IFS= read -r L; do …; done < file","loop over lines"],["until cond; do …; done","loop until true"],["ARR=(a b); \"${ARR[@]}\"; ${#ARR[@]}","array, all items, count"],["break / continue","exit loop / next iteration"]]},"usecase":"<p><b>System administrator:</b> loop over a list of servers and run a health check on each with ssh.</p><p><b>Developer:</b> run tests for every module in a folder.</p><p><b>Data / DevOps engineer:</b> loop over daily CSV files, validate each, and move bad ones to a quarantine folder.</p>","terms":[["for","Loop over a list."],["while","Loop while a command succeeds."],["until","Loop until a command succeeds."],["read","Read a line into variables."],["IFS","Internal field separator used for splitting."],["Array","Indexed list variable."],["Glob","Wildcard pattern like *.csv."],["break / continue","Loop control."]],"myths":[["for line in $(cat file) reads lines","It splits on spaces; use while read."],["Arrays are not available in shell","Bash supports indexed and associative arrays (not plain sh)."]],"quiz":[{"q":"Read a file line by line safely:","o":["for L in $(cat f)","while IFS= read -r L; do …; done < f","cat f | for","read f"],"a":1,"why":"Preserves spaces and backslashes."},{"q":"Number of items in array A:","o":["${A}","${#A[@]}","$#A","len(A)"],"a":1,"why":"${#A[@]} is the count."},{"q":"Skip to the next iteration:","o":["break","continue","exit","return"],"a":1,"why":"continue skips the rest of the body."}]},{"part":7,"title":"Functions, exit codes, safety and scheduling","lead":"Writing scripts that are reusable, stop on errors, clean up after themselves and run on a schedule.","scene":[{"id":"fn","type":"box","x":20,"y":30,"w":370,"h":200,"k":"vm","l":"Function","s":"create_teacher() {|  local NAME=\"$1\" GRP=\"$2\"|  id \"$NAME\" &>/dev/null && return 0|  sudo useradd -m -G \"$GRP\" \"$NAME\"|}|create_teacher asha nursery"},{"id":"ec","type":"box","x":420,"y":30,"w":360,"h":120,"k":"note","l":"Exit codes","s":"0 = success   1-255 = failure|$? holds the last one|exit 3 ends the script with code 3"},{"id":"safe","type":"box","x":420,"y":165,"w":360,"h":120,"k":"sec","l":"Safety header","s":"set -euo pipefail|-e stop on error   -u error on unset vars|pipefail: a failing pipe stage counts"},{"id":"dbg","type":"box","x":20,"y":250,"w":370,"h":90,"k":"net","l":"Debugging","s":"bash -x script.sh (trace each line)|shellcheck script.sh (find bugs)"},{"id":"trap","type":"box","x":420,"y":300,"w":360,"h":80,"k":"note","l":"trap: clean up","s":"trap 'rm -f \"$TMP\"' EXIT"},{"id":"cron","type":"box","x":20,"y":360,"w":370,"h":100,"k":"note","l":"Schedule with cron","s":"crontab -e|30 18 * * 1-5 /opt/scripts/backup.sh|minute hour day month weekday"},{"id":"tmr","type":"box","x":420,"y":395,"w":360,"h":65,"k":"net","l":"systemd timers","s":"modern alternative with logging"}],"steps":[{"t":"Functions","d":"A function groups commands under a name. Arguments arrive as $1, $2 inside it. local keeps variables private to the function. return gives a status code.","s":["fn"],"hi":["fn"],"a":"A standard procedure card: \"To enrol a teacher: check register, issue ID, assign staffroom.\""},{"t":"Exit codes","d":"Every command returns a status: 0 for success, anything else for failure. $? shows the last one. Scripts should end with exit 0 on success and a non-zero code on failure, so other tools can react.","s":["ec"],"hi":["ec"]},{"t":"Stop on the first error","d":"By default bash keeps going after a failed command, which can be disastrous (cd fails, then rm -rf runs in the wrong folder). set -euo pipefail makes the script stop on errors, on unset variables, and on failures inside pipelines.","s":["safe"],"hi":["safe"],"dp":"Classic disaster: rm -rf \"$DIR/\"* with DIR unset becomes rm -rf /*. set -u stops it. Also use \"${DIR:?DIR not set}\" to fail with a message."},{"t":"Debugging","d":"bash -x script.sh prints each command after expansion, showing exactly what runs. shellcheck is a free tool that catches quoting mistakes and common bugs before they bite.","s":["dbg"],"hi":["dbg"]},{"t":"trap: always clean up","d":"trap 'commands' EXIT runs those commands when the script ends, even after an error. Typical use: delete temporary files, release locks.","s":["trap"],"hi":["trap"]},{"t":"Run it on a schedule","d":"crontab -e opens your personal schedule. Five fields: minute, hour, day of month, month, day of week. 30 18 * * 1-5 means 6:30 pm, Monday to Friday. systemd timers are the modern alternative with better logging.","s":["cron","tmr"],"hi":["cron"],"dp":"cron runs with a minimal environment: PATH is short and your aliases do not exist. Use full paths in cron scripts, and redirect output to a log: >> /var/log/backup.log 2>&1. crontab.guru is a handy site to check expressions."}],"analogy":{"intro":"Standard operating procedures.","map":[["Procedure card","Function"],["\"Done\" or \"failed, code 3\" stamp","Exit code"],["Stop the line at the first defect","set -e"],["Narrating each step aloud","bash -x"],["Always switch off the lights when leaving, whatever happened","trap EXIT"],["School timetable bell","cron"]]},"cmp":{"head":["Syntax","Meaning"],"rows":[["name() { …; }","define function"],["local X=\"$1\"","function-local variable"],["return 1 / exit 1","leave function / script with code"],["set -euo pipefail","strict mode"],["bash -x script.sh","trace execution"],["shellcheck script.sh","lint"],["trap 'cleanup' EXIT","run on exit"],["crontab -e / crontab -l","edit / list schedule"],["systemctl list-timers","systemd timers"]]},"usecase":"<p><b>System administrator:</b> nightly backup script with strict mode, logging and a cron entry; failures produce a non-zero exit code that monitoring picks up.</p><p><b>Developer:</b> reusable functions in a deploy script; CI fails the build when the script exits non-zero.</p><p><b>Data / DevOps engineer:</b> scheduled extract scripts with trap cleanup of temporary files and clear exit codes for orchestration tools such as Airflow.</p>","terms":[["Function","Named, reusable block of commands."],["local","Variable scoped to a function."],["return / exit","End function / script with a status."],["set -e / -u / -o pipefail","Stop on error / unset variable / pipe failure."],["bash -x","Trace mode."],["shellcheck","Static analysis tool for shell scripts."],["trap","Run commands on signals or exit."],["cron / crontab","Time-based job scheduler and its table."],["systemd timer","Scheduler integrated with systemd and its logs."]],"myths":[["Bash stops when a command fails","Only with set -e."],["cron uses my normal environment","It has a minimal PATH and no aliases."]],"quiz":[{"q":"Make a script stop on the first failing command:","o":["set -x","set -e","trap","local"],"a":1,"why":"-e exits on errors."},{"q":"Cron expression for 18:30 Monday to Friday:","o":["18 30 * * 1-5","30 18 * * 1-5","30 18 1-5 * *","* * 18 30 1-5"],"a":1,"why":"minute hour day month weekday."},{"q":"Delete temp files even if the script fails:","o":["trap 'rm -f \"$TMP\"' EXIT","rm at the end only","cron","umask"],"a":0,"why":"trap EXIT always runs."}]},{"part":7,"title":"Job control, history, directory stacks and built-ins","lead":"Run several things from one terminal, recall and reuse past commands, jump between folders, and know which commands are part of the shell itself.","scene":[{"id":"fg","type":"box","x":20,"y":25,"w":240,"h":80,"k":"srv","l":"Foreground job","s":"owns the keyboard|python3 train.py"},{"id":"bg1","type":"box","x":20,"y":120,"w":240,"h":55,"k":"vm","l":"[1]  Running","s":"tar -czf big.tgz data &"},{"id":"bg2","type":"box","x":20,"y":190,"w":240,"h":55,"k":"down","l":"[2]+ Stopped","s":"vim notes.txt  (Ctrl+Z)"},{"id":"jc","type":"box","x":20,"y":260,"w":240,"h":200,"k":"note","l":"Job control","s":"cmd &       start in background|Ctrl+Z      pause foreground job|jobs        list jobs|bg %2       continue in background|fg %1       bring to foreground|kill %1     stop job 1|nohup cmd &   survives logout|disown %1   detach from shell"},{"id":"hist","type":"box","x":280,"y":25,"w":240,"h":215,"k":"vm","l":"History","s":"history \\| tail -5|!!        run last command again|sudo !!   … with sudo|!42       command number 42|!grep    last command starting grep|!$        last word of last command|Ctrl+R    search backwards|~/.bash_history"},{"id":"stack","type":"box","x":540,"y":25,"w":240,"h":215,"k":"store","l":"Directory stack","s":"pushd /var/log    (push)|pushd /etc/nginx  (push)|dirs -v|  0 /etc/nginx|  1 /var/log|  2 ~|popd   → back to /var/log|cd -   → previous folder"},{"id":"bi","type":"box","x":280,"y":260,"w":500,"h":200,"k":"net","l":"Built-ins versus external commands","s":"built-in: part of bash itself → cd, echo, read, export, alias,|  type, history, jobs, pushd, popd, source, help, test, ulimit|external: a separate program file → ls (/usr/bin/ls), grep, find|type cd → \"cd is a shell builtin\"    type ls → \"ls is /usr/bin/ls\"|why cd must be built in: a child process cannot change|its parent shell's folder|help cd   (built-ins)      man ls   (external commands)"}],"steps":[{"t":"Foreground and background","d":"A command normally runs in the foreground: the terminal waits until it finishes. Ending it with & starts it in the background, so you get the prompt back at once. bash shows a job number [1] and a PID.","s":["fg","bg1"],"hi":["bg1"],"p":[{"v":["fg","bg1"],"c":"req","l":"… &","d":0,"x":false}],"a":"A teacher who sets one group a long exercise (background) while teaching another group at the board (foreground)."},{"t":"Pause, resume, switch","d":"Ctrl+Z pauses the foreground job (Stopped). jobs lists all jobs; + marks the current one. bg %2 resumes job 2 in the background, fg %1 brings job 1 back to the foreground, kill %1 stops it. % refers to job numbers, plain numbers to PIDs.","s":["bg2","jc"],"hi":["jc"],"p":[{"v":["fg","bg2"],"c":"bad","l":"Ctrl+Z","d":0,"x":false},{"v":["bg2","fg"],"c":"res","l":"fg %2","d":1.6,"x":false}],"dp":"Background jobs still die when you close the terminal (they receive the HUP signal). For long jobs on a server use nohup cmd > out.log 2>&1 &, disown, or better, a terminal multiplexer such as tmux or screen, which keeps the whole session alive after you disconnect."},{"t":"History: never type it twice","d":"bash saves your commands in ~/.bash_history. history lists them with numbers. !! repeats the last command (sudo !! when you forgot sudo), !42 runs number 42, !grep the last command starting with grep, !$ is the last word of the previous command. Ctrl+R searches as you type.","s":["hist"],"hi":["hist"],"ins":[["mkdir -p /dbda/reports",[["Then","cd !$"],["Runs","cd /dbda/reports"]]],["apt update  → Permission denied",[["Then","sudo !!"],["Runs","sudo apt update"]]],["Ctrl+R  then type ssh",[["Shows","the most recent command containing ssh"],["Keys","Ctrl+R again for older, Enter to run"]]],["HISTSIZE=10000",[["Effect","keep more history (in ~/.bashrc)"],["Also","HISTCONTROL=ignoreboth skips duplicates and lines starting with a space"]]]]},{"t":"Directory stacks","d":"pushd folder changes to it and remembers where you were on a stack. dirs -v shows the stack with numbers. popd returns to the previous folder. cd - simply toggles between the last two folders.","s":["stack"],"hi":["stack"],"p":[{"v":["stack","stack@b"],"c":"data","l":"pushd / popd","d":0,"x":false}],"a":"A pile of bookmarks: put one in each chapter you visit, then pull them off the top to go back in order."},{"t":"Built-ins versus external commands","d":"Some commands are part of bash itself (built-ins): cd, echo, read, export, alias, jobs, history, pushd. Others are separate programs on disk: ls, grep, find. type tells you which. cd must be built in: a separate program could only change its own folder, not your shell's.","s":["bi"],"hi":["bi"],"dp":"Order bash uses to resolve a name: alias, then function, then built-in, then a file found on PATH. command ls skips aliases and functions; builtin echo forces the built-in; \\ls bypasses an alias. help lists all built-ins; help read explains one."}],"analogy":{"intro":"A busy teacher's desk.","map":[["Lesson at the board","Foreground job"],["Group working on its own","Background job (&)"],["\"Pause, put your pens down\"","Ctrl+Z"],["\"Carry on by yourselves\" / \"Come back to the board\"","bg / fg"],["Diary of everything you said today","history"],["Bookmarks in chapters you visited","pushd / popd stack"],["Things you can do yourself versus tasks you send to the office","Built-in versus external commands"]]},"cmp":{"head":["Command","What it does"],"rows":[["cmd &","run in background"],["Ctrl+Z / Ctrl+C","pause / interrupt foreground job"],["jobs -l","list jobs with PIDs"],["fg %1 / bg %1","foreground / background job 1"],["kill %1","terminate job 1"],["nohup cmd > out.log 2>&1 &","keep running after logout"],["history / history 20 / history -c","list / last 20 / clear"],["!! / sudo !! / !n / !str / !$","re-run tricks"],["Ctrl+R","reverse search"],["pushd dir / popd / dirs -v","directory stack"],["cd -","previous folder"],["type cmd / help cmd","built-in or file? / built-in help"],["wait","wait for background jobs to finish"]]},"usecase":"<p><b>Data engineer:</b> starts a long download with nohup … &, keeps working in the same SSH session, and checks progress with jobs and tail -f out.log.</p><p><b>System administrator:</b> pushd /etc/nginx, pushd /var/log/nginx: flips between config and logs with pushd +1 while fixing a site; Ctrl+R finds last week's long certificate command.</p><p><b>Security analyst:</b> reads ~/.bash_history of a compromised account to see what an attacker ran (and knows attackers often run history -c).</p>","terms":[["Job","A command started from the shell, tracked with a job number."],["Foreground / background","Owns the terminal / runs without it (&)."],["Ctrl+Z","Suspend the foreground job."],["fg / bg","Resume a job in the foreground / background."],["nohup","Run a command immune to hang-up on logout."],["disown","Remove a job from the shell's job table."],["history","List of previous commands."],["History expansion","!!, !n, !string, !$."],["Directory stack","List of remembered folders: pushd, popd, dirs."],["Built-in","Command implemented inside the shell."],["type","Shows whether a name is alias, function, built-in or file."]],"myths":[["Ctrl+Z stops a program","It pauses it; it is still in memory until resumed or killed."],["A background job keeps running after logout","Usually it gets HUP and dies; use nohup or tmux."],["Every command is a program file","Built-ins like cd and export exist only inside bash."]],"quiz":[{"q":"You pressed Ctrl+Z on a job. Resume it in the background:","o":["fg","bg","jobs","kill -9"],"a":1,"why":"bg continues the stopped job in the background."},{"q":"Re-run the previous command with sudo:","o":["sudo !$","sudo !!","!sudo","history sudo"],"a":1,"why":"!! expands to the last command."},{"q":"Why is cd a built-in?","o":["It is faster","A child process cannot change the parent shell's folder","It is older","For security"],"a":1,"why":"Only the shell itself can change its own working directory."}]},{"part":8,"title":"Project: onboarding script for the school server","lead":"Everything together: groups, users, SGID team folders, ACLs, umask and logging, from one CSV file.","scene":[{"id":"csv","type":"box","x":20,"y":30,"w":200,"h":120,"k":"store","l":"staff.csv","s":"name,group|asha,nursery|meena,nursery|ravi,accounts"},{"id":"sc","type":"box","x":260,"y":30,"w":250,"h":120,"k":"vm","l":"onboard.sh","s":"reads CSV; creates groups,|users, folders, ACLs; logs"},{"id":"grp","type":"box","x":550,"y":30,"w":230,"h":55,"k":"net","l":"groupadd","s":"nursery, accounts"},{"id":"usr","type":"box","x":550,"y":95,"w":230,"h":55,"k":"user","l":"useradd + usermod -aG","s":""},{"id":"f1","type":"box","x":20,"y":180,"w":370,"h":120,"k":"store","l":"/school/nursery   drwxrws---+","s":"owner root, group nursery|SGID: new files stay in nursery|ACL: principal priya r-x"},{"id":"f2","type":"box","x":410,"y":180,"w":370,"h":120,"k":"store","l":"/school/accounts   drwxrws---+","s":"group accounts only|ACL: principal priya r-x"},{"id":"log","type":"box","x":20,"y":320,"w":370,"h":60,"k":"note","l":"/var/log/onboard.log","s":"what was created, when"},{"id":"test","type":"box","x":410,"y":320,"w":370,"h":60,"k":"sec","l":"Test: sudo -u ravi ls /school/nursery","s":"Permission denied ✓"},{"id":"pr","type":"box","x":20,"y":400,"w":760,"h":60,"k":"note","l":"Principal priya can read both folders through ACLs, without joining either group","s":""}],"steps":[{"t":"Input and script","d":"HR provides staff.csv. onboard.sh reads it line by line (while read with IFS=,).","s":["csv","sc"],"p":[{"v":["csv","sc"],"c":"data","l":"3 rows","d":0,"x":false}]},{"t":"Groups and users","d":"For each row: create the group if missing, create the user if missing, add the user to the group with -aG. Using existence checks makes it safe to run again.","s":["grp","usr"],"p":[{"v":["sc","grp"],"c":"req","l":"groupadd","d":0,"x":false},{"v":["sc","usr"],"c":"req","l":"useradd","d":0.8,"x":false}]},{"t":"Team folders","d":"For each group: mkdir /school/<group>, chown root:<group>, chmod 2770 (SGID + rwx for owner and group). New files inherit the team group automatically.","s":["f1","f2"],"p":[{"v":["sc","f1"],"c":"req","l":"mkdir + chmod 2770","d":0,"x":false},{"v":["sc","f2"],"c":"req","l":"","d":0.8,"x":false}]},{"t":"ACLs for the principal","d":"setfacl -m u:priya:rX and a default ACL -d -m u:priya:rX give priya read access to everything now and in future, without making her a member of each team.","s":["pr"],"hi":["f1","f2","pr"]},{"t":"Log everything","d":"Each action is appended to /var/log/onboard.log with a timestamp, via a small log() function using tee -a.","s":["log"],"p":[{"v":["sc","log"],"c":"data","l":"append","d":0,"x":false}]},{"t":"Test the result","d":"Switch identities with sudo -u to verify: ravi cannot list nursery, meena can create files there and they get group nursery, priya can read both.","s":["test"],"p":[{"v":["test","f1"],"c":"bad","l":"ravi denied","d":0,"x":true}]}],"analogy":{"intro":"Enrolment day at school.","map":[["Admission list from HR","staff.csv"],["Office clerk processing the list","onboard.sh"],["Creating staffrooms and issuing ID cards","groupadd, useradd"],["Staffroom stamp on every document","SGID"],["Principal's pass to all staffrooms","ACL entries"],["Office logbook","onboard.log"]]},"cmp":{"head":["Step","Command used"],"rows":[["group","getent group G || groupadd G"],["user","id U || useradd -m -s /bin/bash U"],["membership","usermod -aG G U"],["folder","mkdir -p /school/G; chown root:G; chmod 2770"],["ACL","setfacl -m u:priya:rX; setfacl -d -m u:priya:rX"],["log","echo \"$(date) msg\" | tee -a log"],["test","sudo -u ravi ls /school/nursery"]]},"usecase":"<p><b>System administrator:</b> onboarding and offboarding scripts are standard in every organisation; this pattern scales to hundreds of staff.</p><p><b>Developer:</b> the same structure provisions project folders for teams.</p><p><b>Data / DevOps engineer:</b> the same ideas are written as Ansible or cloud-init in production, but they rely on exactly these commands underneath.</p>","terms":[["Provisioning","Automatically creating users, groups and resources."],["Idempotent script","Safe to run repeatedly."],["sudo -u","Run a command as another user for testing."],["Configuration management","Tools like Ansible that apply such steps at scale."]],"myths":[["Scripts must be run once only","Good scripts check before creating, so re-runs are safe."]],"quiz":[{"q":"Why chmod 2770 on team folders?","o":["SUID","SGID + full access for owner and group only","Sticky bit","Make it public"],"a":1,"why":"2 = SGID; 770 = rwx for owner and group."},{"q":"Give priya read access without joining groups:","o":["ACL entry","usermod -aG","chmod o+r","chown priya"],"a":0,"why":"Named user ACL."},{"q":"Make the script safe to re-run:","o":["Delete everything first","Check existence before creating","Run as root only","Use 777"],"a":1,"why":"Idempotency."}]},{"part":8,"title":"Troubleshooting lab: \"Permission denied\"","lead":"A real investigation, using every concept from the course, in the order an experienced administrator would check.","scene":[{"id":"err","type":"box","x":20,"y":30,"w":760,"h":60,"k":"sec","l":"meena: cat: /school/nursery/plan.docx: Permission denied","s":""},{"id":"c1","type":"box","x":20,"y":110,"w":240,"h":85,"k":"note","l":"1. Who am I?","s":"id meena|is nursery listed?"},{"id":"c2","type":"box","x":280,"y":110,"w":240,"h":85,"k":"note","l":"2. New login since?","s":"group changes need|a new session"},{"id":"c3","type":"box","x":540,"y":110,"w":240,"h":85,"k":"note","l":"3. x on every folder","s":"namei -l /school/nursery/plan.docx"},{"id":"c4","type":"box","x":20,"y":210,"w":240,"h":85,"k":"note","l":"4. File bits and owner","s":"ls -l: first match wins"},{"id":"c5","type":"box","x":280,"y":210,"w":240,"h":85,"k":"note","l":"5. ACL and mask","s":"getfacl: mask may|limit rights"},{"id":"c6","type":"box","x":540,"y":210,"w":240,"h":85,"k":"note","l":"6. Beyond permissions","s":"read-only mount, SELinux /|AppArmor, chattr +i (lsattr)"},{"id":"found","type":"box","x":20,"y":315,"w":760,"h":70,"k":"store","l":"Root cause","s":"meena was added with usermod -aG nursery this morning but never logged out: her session has no nursery group"},{"id":"fix","type":"box","x":20,"y":395,"w":760,"h":65,"k":"net","l":"Fix","s":"log out and back in (or newgrp nursery / su - meena) → id shows nursery → file opens"}],"steps":[{"t":"The symptom","d":"meena cannot open plan.docx in the nursery folder. Resist chmod 777. Investigate step by step.","s":["err"]},{"t":"Check 1: identity","d":"id meena lists her UID and groups. Compare with ls -l on the file: is her UID the owner, or is the file's group in her list?","s":["c1"],"hi":["c1"],"dp":"Run id with no username inside meena's own session. id meena reads the group database (current), while plain id shows the groups of the running session. If they differ, you have found the problem."},{"t":"Check 2: stale session","d":"Groups are fixed at login. If id (her session) does not show nursery but id meena (database) does, she needs a new login.","s":["c2"],"hi":["c2"]},{"t":"Check 3: the whole path","d":"namei -l shows every folder on the path. A missing x on /school or /school/nursery blocks access regardless of the file's own bits.","s":["c3"],"hi":["c3"]},{"t":"Check 4: file permissions","d":"ls -l plan.docx. Remember first-match-wins: if meena happens to be the owner and owner bits are empty, group bits do not help.","s":["c4"],"hi":["c4"]},{"t":"Check 5: ACL and mask","d":"If ls -l shows +, read getfacl. A restrictive mask can cut effective rights for the group and named entries.","s":["c5"],"hi":["c5"]},{"t":"Check 6: beyond permissions","d":"Read-only or noexec mounts (mount | grep school), SELinux or AppArmor denials (ausearch, journalctl), and immutable files (lsattr shows i, set with chattr +i) can all produce Permission denied with perfect-looking bits.","s":["c6"],"hi":["c6"]},{"t":"Found and fixed","d":"In this case: her session predates the group change. After logging in again, id shows nursery and the file opens. No permissions were loosened.","s":["found","fix"],"hi":["found","fix"]}],"analogy":{"intro":"A doctor ruling out causes in order.","map":[["Checking the patient's ID","id"],["Old prescription card from before the new medicine","Stale login session"],["Every door on the corridor","x on each folder (namei)"],["The lock on the cupboard","File mode"],["Special permission slips","ACL and mask"],["Building closed for repairs","Read-only mount, SELinux, immutable flag"]]},"cmp":{"head":["Check","Command"],"rows":[["identity in this session","id"],["identity in database","id meena / getent group nursery"],["whole path","namei -l /path/to/file"],["file mode / owner","ls -l file, stat file"],["ACLs","getfacl file"],["mounts","findmnt /school, mount | grep school"],["immutable flag","lsattr file"],["SELinux","getenforce; ls -Z file; ausearch -m avc"],["test as user","sudo -u meena cat /path"]]},"usecase":"<p><b>System administrator:</b> this checklist resolves most access tickets in minutes and avoids the dangerous chmod 777 habit.</p><p><b>Developer:</b> diagnoses why an app cannot read its config after deployment.</p><p><b>Data / DevOps engineer:</b> containers add one more layer: the UID inside the container must match the owner on the mounted volume.</p>","terms":[["namei","Lists permissions along a path."],["Stale session","Login started before a group change."],["Immutable attribute","chattr +i: file cannot be changed even by root until removed."],["SELinux / AppArmor","Mandatory access control layers above normal permissions."],["Mount options","ro, noexec, nosuid restrict a whole filesystem."]],"myths":[["chmod 777 is a fix","It hides the cause and creates a security hole."],["Correct rwx bits guarantee access","ACL masks, mounts, SELinux and immutable flags can still deny."]],"quiz":[{"q":"id meena shows nursery, but plain id in her session does not. Cause?","o":["Wrong umask","Session started before she was added","File corrupted","Sticky bit"],"a":1,"why":"Groups are read at login."},{"q":"Fastest way to check x on every folder in a path:","o":["ls -l","namei -l path","chmod","df -i"],"a":1,"why":"namei lists each component."},{"q":"Even root cannot modify a file. Check:","o":["lsattr for the i flag","umask","groups","inode count"],"a":0,"why":"Immutable attribute blocks changes."}]},{"part":8,"title":"Lab: nologin shells and a single-user ACL","lead":"Sessions 3-4 lab, solved: lock user3 out with the nologin shell, observe what user4 sees when switching to user3, and let only user5 read and write a file under /dbda.","scene":[{"id":"u4","type":"box","x":20,"y":30,"w":160,"h":60,"k":"user","l":"👤 user4","s":"logged in"},{"id":"su","type":"box","x":210,"y":30,"w":170,"h":60,"k":"vm","l":"su - user3","s":"asks user3's password"},{"id":"pw","type":"box","x":410,"y":30,"w":370,"h":60,"k":"note","l":"/etc/passwd","s":"user3:x:1003:1003::/home/user3:/usr/sbin/nologin"},{"id":"msg","type":"box","x":210,"y":110,"w":570,"h":60,"k":"sec","l":"This account is currently not available.","s":"password accepted, but the \"shell\" refuses to start"},{"id":"why","type":"box","x":20,"y":190,"w":370,"h":110,"k":"note","l":"Why use nologin?","s":"service accounts (www-data, mysql)|users who may only use SFTP or a web app|a leaver whose files must stay for a while|(also: usermod -L locks the password)"},{"id":"root","type":"box","x":410,"y":190,"w":370,"h":110,"k":"srv","l":"👑 root works in /dbda","s":"touch /dbda/filewithacl|chmod 600  (only root)|setfacl -m u:user5:rw- /dbda/filewithacl"},{"id":"u5","type":"box","x":20,"y":320,"w":170,"h":60,"k":"user","l":"👤 user5","s":"named ACL entry"},{"id":"u4b","type":"box","x":20,"y":395,"w":170,"h":60,"k":"user","l":"👤 user4","s":"others: ---"},{"id":"path","type":"box","x":220,"y":320,"w":250,"h":140,"k":"store","l":"Path check first","s":"/      x for others ✓|/dbda  755: x for others ✓|(not /root/dbda: /root is 700|and blocks everyone)"},{"id":"file","type":"box","x":500,"y":320,"w":280,"h":140,"k":"my","l":"/dbda/filewithacl","s":"user::rw-|user:user5:rw-|group::---|mask::rw-|other::---"}],"steps":[{"t":"Change user3's shell to nologin","d":"sudo usermod -s /usr/sbin/nologin user3 replaces user3's login shell in /etc/passwd. The account still exists, owns its files and keeps its password.","s":["pw"],"hi":["pw"],"dp":"Debian and Ubuntu use /usr/sbin/nologin, which prints a polite message (customisable in /etc/nologin.txt); /bin/false just exits silently. Red Hat systems also use /sbin/nologin. Check the path with: which nologin."},{"t":"user4 tries to become user3","d":"Log in as user4 and run su - user3. su asks for user3's password and accepts it, then tries to start user3's login shell, which is nologin. It prints \"This account is currently not available.\" and exits, so user4 is back at user4's own prompt.","s":["u4","su","msg"],"hi":["msg"],"p":[{"v":["u4","su","pw"],"c":"req","l":"su - user3","d":0,"x":false},{"v":["pw","msg"],"c":"bad","l":"nologin","d":1.6,"x":true}],"a":"A staff ID card that still opens the gate (password correct), but the classroom behind it has been locked permanently (no shell)."},{"t":"Why administrators do this","d":"Service accounts never need an interactive login. A user who should only upload files over SFTP, or a staff member who left but whose files are still needed, gets nologin. usermod -L additionally locks the password, and chage -E 0 expires the account.","s":["why"],"hi":["why"],"dp":"root can still run commands as user3 with a different shell: sudo -u user3 bash or su -s /bin/bash user3. nologin blocks interactive logins, not root. Do not rely on it alone to stop SSH port forwarding; use sshd_config settings (AllowUsers, Match blocks) for that."},{"t":"root creates filewithacl under /dbda","d":"All of root's lab work is under /dbda. root creates /dbda/filewithacl and sets mode 600, so normally only root could use it. Then one setfacl command gives user5 read and write.","s":["root","file"],"hi":["root"],"p":[{"v":["root","file"],"c":"req","l":"setfacl -m u:user5:rw-","d":0,"x":false}]},{"t":"The path matters","d":"user5 must pass through every folder on the way: / and /dbda both give others x (mode 755). If the file were under /root/dbda it would fail, because /root is 700 and stops everyone except root before the ACL is even read.","s":["path"],"hi":["path"],"dp":"If you must use a private folder, add a minimal traverse ACL on each folder in the path: sudo setfacl -m u:user5:x /root /root/dbda. Prefer a shared location like /dbda instead."},{"t":"Test: only user5 gets in","d":"sudo -u user5 reads and writes the file successfully. sudo -u user4 gets \"Permission denied\": user4 is not the owner, has no named entry and falls into others, which is ---.","s":["u5","u4b"],"p":[{"v":["u5","path","file"],"c":"res","l":"rw ✓","d":0,"x":false},{"v":["u4b","path","file"],"c":"bad","l":"denied","d":1.6,"x":true}]}],"analogy":{"intro":"A school that keeps staff records but restricts access.","map":[["Card still works at the gate, classroom permanently locked","nologin shell"],["Locking the card itself","usermod -L"],["Records room only the principal can open","chmod 600 file owned by root"],["Named pass for one teacher","u:user5:rw- ACL entry"],["Corridors that must be passable","x on /, /dbda"],["Principal's private office in the way","/root (700) blocks the path"]]},"cmp":{"head":["Command","What it does"],"rows":[["sudo useradd -m -s /bin/bash user3 (… user4, user5)","create the lab users"],["sudo usermod -s /usr/sbin/nologin user3","disable interactive login"],["getent passwd user3","check the shell field"],["su - user4, then su - user3","observe the refusal"],["sudo usermod -s /bin/bash user3","undo"],["sudo mkdir -p /dbda; ls -ld /dbda","work folder, check 755"],["sudo touch /dbda/filewithacl; sudo chmod 600 …","root-only file"],["sudo setfacl -m u:user5:rw- /dbda/filewithacl","user5 read + write"],["getfacl /dbda/filewithacl","verify"],["sudo -u user5 cat … / sudo -u user4 cat …","test allowed / denied"],["namei -l /dbda/filewithacl","check x on every folder"]]},"usecase":"<p><b>System administrator:</b> the backup service account owns /backups but has shell nologin, so even if its password leaks nobody can log in with it interactively.</p><p><b>Data platform:</b> partner companies get SFTP-only accounts (nologin plus an sshd ChrootDirectory) to drop files without shell access.</p><p><b>HR offboarding:</b> a leaver's account is set to nologin and locked on the last day; their project files remain readable by the team through ACLs until handed over.</p>","terms":[["nologin","Shell that refuses interactive logins with a message."],["/bin/false","Shell that exits immediately with failure, silently."],["usermod -s","Change a user's login shell."],["usermod -L / -U","Lock / unlock the password."],["su -","Switch user with a full login environment."],["Service account","Account used by a program, not a person."],["Traverse (x) permission","Needed on every folder of a path."],["Named user ACL","Gives one specific user rights on a file."]],"myths":[["nologin deletes or disables the account","The account and its files remain; only interactive login fails."],["su - user3 fails because of the password","The password is accepted; the nologin shell refuses."],["An ACL on the file is enough","The user also needs x on every parent folder."]],"quiz":[{"q":"What does user4 see after su - user3 with the correct password?","o":["Authentication failure","This account is currently not available.","A user3 prompt","Permission denied on /home"],"a":1,"why":"The nologin shell prints that message and exits."},{"q":"Give only user5 read and write on the file:","o":["chmod 666","setfacl -m u:user5:rw- file","chown user5 file","usermod -aG root user5"],"a":1,"why":"A named user ACL entry."},{"q":"Why not create the file under /root/dbda?","o":["Too long a path","/root is 700, so user5 cannot pass through it","ACLs do not work there","It is a different disk"],"a":1,"why":"Every folder on the path needs x for user5."}]},{"part":9,"title":"Git basics: repository, staging and commits","lead":"Version control remembers every saved state of your project. Git does it with three areas: working directory, staging area and repository.","scene":[{"id":"zw","type":"zone","x":20,"y":25,"w":240,"h":250,"k":"plain","l":"1. Working directory"},{"id":"zs","type":"zone","x":280,"y":25,"w":240,"h":250,"k":"plain","l":"2. Staging area (index)"},{"id":"zr","type":"zone","x":540,"y":25,"w":240,"h":250,"k":"plain","l":"3. Repository (.git)"},{"id":"wf1","type":"box","x":35,"y":60,"w":210,"h":55,"k":"my","l":"clean.py","s":"modified"},{"id":"wf2","type":"box","x":35,"y":130,"w":210,"h":55,"k":"ghost","l":"notes.md","s":"untracked"},{"id":"wf3","type":"box","x":35,"y":200,"w":210,"h":60,"k":"store","l":"data_loader.py","s":"unchanged"},{"id":"sf1","type":"box","x":295,"y":60,"w":210,"h":55,"k":"ghost","l":"(empty)","s":"git add puts files here"},{"id":"rc","type":"box","x":555,"y":60,"w":210,"h":200,"k":"db","l":"Commits","s":"a3f9c21  Add cleaning step|7b21e04  Load CSV data|1c0d9aa  Initial commit||each = full snapshot +|author, time, message,|parent commit"},{"id":"c1","type":"box","x":20,"y":300,"w":150,"h":55,"k":"store","l":"1c0d9aa","s":"Initial commit"},{"id":"c2","type":"box","x":210,"y":300,"w":150,"h":55,"k":"store","l":"7b21e04","s":"Load CSV data"},{"id":"c3","type":"box","x":400,"y":300,"w":150,"h":55,"k":"store","l":"a3f9c21","s":"Add cleaning step"},{"id":"head","type":"box","x":590,"y":300,"w":190,"h":55,"k":"sec","l":"HEAD → main","s":"where you are now"},{"id":"cc1","type":"line","a":"c2","b":"c1"},{"id":"cc2","type":"line","a":"c3","b":"c2"},{"id":"cc3","type":"line","a":"head","b":"c3"},{"id":"cmd","type":"box","x":20,"y":375,"w":760,"h":85,"k":"note","l":"Everyday cycle","s":"git status  →  edit  →  git add file  →  git commit -m \"message\"  →  git log --oneline|git diff (not yet staged)   git diff --staged (staged)   git restore file (discard edit)|git restore --staged file (unstage)   .gitignore lists files Git should never track"}],"steps":[{"t":"Why version control?","d":"Without it, projects become folders full of report_final.docx, report_final2.docx and report_REAL_final.docx, and nobody knows what changed or who changed it. A version control system records every saved state, who made it and why, and lets you go back. Git is the standard: Linus Torvalds wrote it in 2005 to manage the Linux kernel.","s":["zw","zs","zr"],"a":"A school register with a carbon copy for every day: you can always see what the class looked like on any date.","dp":"Centralised systems (SVN, CVS) keep history on one server; if it is down you cannot commit. Git is distributed: every clone holds the full history, so you can commit, branch and view logs offline, then sync later."},{"t":"Start a repository","d":"git init turns the current folder into a repository by creating a hidden .git folder: that is where all history lives. Tell Git who you are once per machine: git config --global user.name and user.email. Every commit records them.","s":["rc"],"hi":["zr"],"dp":"Deleting the .git folder deletes the entire history, but not your current files. git config --global init.defaultBranch main makes new repositories start with a branch called main."},{"t":"Working directory: where you edit","d":"Your files live in the working directory as normal files. git status compares them with the last commit: clean.py is modified, notes.md is untracked (Git has never seen it), data_loader.py is unchanged.","s":["wf1","wf2","wf3"],"hi":["wf1","wf2"],"ins":[["modified",[["Meaning","tracked file changed since the last commit"]]],["untracked",[["Meaning","new file Git is not following yet"]]],["staged",[["Meaning","change chosen for the next commit"]]],["unchanged",[["Meaning","same as in the last commit"]]]]},{"t":"Staging: choose what goes in the next commit","d":"git add clean.py copies the current version of clean.py into the staging area. You can stage some files and not others, so each commit contains one logical change. git add . stages everything in the folder.","s":["sf1"],"p":[{"v":["wf1","sf1"],"c":"req","l":"git add clean.py","d":0,"x":false}],"set":{"sf1":{"k":"my","l":"clean.py","s":"staged"},"wf1":{"k":"store","s":"staged copy in index"}},"a":"Putting chosen photos into an envelope before posting it: you decide what goes in this envelope."},{"t":"Commit: save a snapshot","d":"git commit -m \"Add cleaning step\" saves everything in the staging area as a new commit with a unique ID (a hash such as a3f9c21), your name, the time, the message, and a link to the previous commit. git log --oneline lists the chain, newest first.","s":["c1","c2","c3","head","cc1","cc2","cc3"],"hi":["c3"],"p":[{"v":["sf1","rc"],"c":"res","l":"git commit","d":0,"x":false}],"set":{"sf1":{"k":"ghost","l":"(empty)","s":"git add puts files here"}},"dp":"A commit ID is a SHA-1 hash of the content and its history, so changing anything in the past would change every later ID: history cannot be silently edited. Good messages are short and say WHY: \"Fix date parsing for DD/MM/YYYY\" beats \"update\"."},{"t":"Track and undo changes","d":"git diff shows edits not yet staged; git diff --staged shows what will be committed; git show a3f9c21 shows one commit. git restore file throws away unstaged edits (careful: they are gone). git restore --staged file unstages but keeps the edit. .gitignore lists files never to track: passwords, .env, large data, __pycache__.","s":["cmd"],"hi":["cmd"]}],"analogy":{"intro":"A photographer's studio.","map":[["Scene on the studio floor","Working directory"],["Choosing who stands in the next photo","Staging (git add)"],["Taking the photo and filing it in the album","Commit"],["Album with every photo, dated and captioned","Repository (.git)"],["Photo number on the back","Commit hash"],["\"You are here\" marker in the album","HEAD"],["Things never allowed in a photo",".gitignore"]]},"cmp":{"head":["Command","What it does"],"rows":[["git config --global user.name \"Asha Rao\"","set your name (once)"],["git config --global user.email asha@cdac.in","set your email"],["git init","create a repository"],["git status","what changed?"],["git add file / git add .","stage one / all"],["git commit -m \"msg\"","save a snapshot"],["git log --oneline --graph","history"],["git diff / git diff --staged","unstaged / staged changes"],["git show <id>","one commit in detail"],["git restore file","discard working changes"],["git restore --staged file","unstage"],["echo \".env\" >> .gitignore","never track a file"]]},"usecase":"<p><b>Data scientist:</b> notebooks and cleaning scripts in Git mean \"which version produced last month's model?\" has an exact answer: a commit ID.</p><p><b>Team project:</b> five PG-DBDA students work on one project; Git shows who changed which line and when (git blame), instead of emailing zip files.</p><p><b>Mistake recovery:</b> a script worked yesterday and is broken today; git diff shows exactly what changed, and git restore brings back the working version.</p>","terms":[["Version control system","Records changes to files over time."],["Git","Distributed version control system created in 2005."],["Repository","Project folder plus its full history (.git)."],["Working directory","Your current files on disk."],["Staging area (index)","Changes chosen for the next commit."],["Commit","Saved snapshot with message, author and parent."],["Hash","Unique ID of a commit, e.g. a3f9c21."],["HEAD","Pointer to the commit you are on."],["Untracked file","File Git is not following."],[".gitignore","List of files Git should ignore."]],"myths":[["git add saves your work permanently","Only git commit records a snapshot in history."],["Git stores only differences","Each commit is a full snapshot (stored efficiently)."],["Git and GitHub are the same","Git is the tool; GitHub is a website hosting Git repositories."]],"quiz":[{"q":"Which command records a snapshot in history?","o":["git add","git commit","git status","git init"],"a":1,"why":"add stages; commit saves."},{"q":"Show changes that are staged but not committed:","o":["git diff","git diff --staged","git log","git show"],"a":1,"why":"--staged compares index with last commit."},{"q":"Where does Git keep the history?","o":["In the cloud only","In the hidden .git folder","In /etc/git","In each file"],"a":1,"why":".git is the repository database."}]},{"part":9,"title":"Branches, merging and merge conflicts","lead":"Work on a new feature without disturbing working code, then combine the work, and resolve the conflict when two people changed the same line.","scene":[{"id":"a","type":"box","x":20,"y":190,"w":95,"h":50,"k":"store","l":"A","s":"init"},{"id":"b","type":"box","x":145,"y":190,"w":95,"h":50,"k":"store","l":"B","s":"load data"},{"id":"c","type":"box","x":270,"y":190,"w":95,"h":50,"k":"store","l":"C","s":"fix typo"},{"id":"d","type":"box","x":270,"y":80,"w":95,"h":50,"k":"my","l":"D","s":"add chart"},{"id":"e","type":"box","x":395,"y":80,"w":95,"h":50,"k":"my","l":"E","s":"style chart"},{"id":"m","type":"box","x":520,"y":190,"w":110,"h":50,"k":"vm","l":"M","s":"merge commit"},{"id":"l1","type":"line","a":"b","b":"a"},{"id":"l2","type":"line","a":"c","b":"b"},{"id":"l3","type":"line","a":"d","b":"b"},{"id":"l4","type":"line","a":"e","b":"d"},{"id":"l5","type":"line","a":"m","b":"c"},{"id":"l6","type":"line","a":"m","b":"e"},{"id":"main","type":"box","x":145,"y":265,"w":110,"h":40,"k":"sec","l":"main","s":""},{"id":"feat","type":"box","x":520,"y":80,"w":110,"h":40,"k":"sec","l":"feature","s":""},{"id":"headp","type":"box","x":395,"y":265,"w":110,"h":40,"k":"user","l":"HEAD","s":""},{"id":"br","type":"box","x":660,"y":25,"w":120,"h":215,"k":"note","l":"A branch is","s":"a movable|label on a|commit.|Creating one|copies nothing:|it is just a|41-byte file."},{"id":"conf","type":"box","x":20,"y":325,"w":440,"h":135,"k":"sec","l":"Conflict in clean.py","s":"<<<<<<< HEAD|df = df.dropna()|=======|df = df.fillna(0)|>>>>>>> feature"},{"id":"fix","type":"box","x":480,"y":325,"w":300,"h":135,"k":"net","l":"Resolve","s":"1. edit: keep the right line(s)|2. delete the <<< === >>> markers|3. git add clean.py|4. git commit|or git merge --abort"}],"steps":[{"t":"Commits on main","d":"Every repository starts with one branch, usually called main. You have made commits A, B and C on it. main is simply a label pointing at the latest commit, C.","s":["a","b","c","l1","l2","main"],"hi":["main"],"a":"A railway line with stations (commits); main is the train currently at the last station."},{"t":"A branch is just a pointer","d":"git switch -c feature (or git checkout -b feature) creates a new label called feature at the current commit and moves HEAD to it. Nothing is copied, so branches are instant and free. Create one for every new piece of work.","s":["br","feat","headp"],"hi":["br","feat"],"dp":"HEAD is a pointer to the branch you are on. git branch lists branches (* marks the current one). git switch main moves back. Your working files change to match the branch you switch to, so commit or stash your edits first."},{"t":"Work happens on both branches","d":"On feature you commit D (add chart) and E (style chart). Meanwhile a teammate fixes a typo on main (C). The two lines of history have now diverged from B.","s":["d","e","l3","l4"],"hi":["d","e"],"p":[{"v":["b","d","e"],"c":"data","l":"feature work","d":0,"x":false}],"set":{"main":{"l":"main"},"feat":{"l":"feature"}}},{"t":"Merging","d":"Switch to main and run git merge feature. If main had not moved, Git would simply slide the main label forward (a fast-forward merge). Here both sides moved, so Git creates a new merge commit M with two parents, C and E, combining both sets of changes.","s":["m","l5","l6"],"hi":["m"],"p":[{"v":["e","m"],"c":"req","l":"merge","d":0,"x":false},{"v":["c","m"],"c":"req","l":"","d":0.3,"x":false}],"dp":"git log --oneline --graph --all draws the history as a tree in the terminal. After merging, delete the finished branch: git branch -d feature (the commits stay; only the label goes)."},{"t":"When a merge conflicts","d":"If both branches changed the same lines of the same file differently, Git cannot guess which is right. It stops, marks the file as conflicted, and writes both versions between <<<<<<<, ======= and >>>>>>> markers. git status lists the conflicted files.","s":["conf"],"hi":["conf"],"set":{"m":{"k":"down","s":"paused: conflict"}},"a":"Two teachers edited the same line of the timetable differently. The office cannot choose; it shows both and asks a person to decide."},{"t":"Resolving the conflict","d":"Open the file, keep the correct line (or combine both), delete the three marker lines, then git add clean.py and git commit to finish the merge. If you want to give up and return to the state before the merge, run git merge --abort.","s":["fix"],"hi":["fix"],"set":{"m":{"k":"vm","s":"merge commit"}},"p":[{"v":["fix","m"],"c":"res","l":"git commit","d":0,"x":false}]}],"analogy":{"intro":"Rewriting a recipe book with a friend.","map":[["The published recipe book","main branch"],["Your personal draft copy","feature branch"],["Bookmark showing which copy you are reading","HEAD"],["Combining your draft into the book","merge"],["Both of you rewrote the same line differently","merge conflict"],["Editor deciding the final wording","resolving the conflict"]]},"cmp":{"head":["Command","What it does"],"rows":[["git branch","list branches"],["git switch -c feature","create and switch"],["git checkout -b feature","same (older syntax)"],["git switch main","go back to main"],["git merge feature","merge feature into current branch"],["git log --oneline --graph --all","draw the history"],["git status","see conflicted files"],["git merge --abort","cancel a conflicted merge"],["git branch -d feature","delete a merged branch"],["git diff main..feature","compare two branches"],["git stash / git stash pop","park unfinished edits / bring back"]]},"usecase":"<p><b>Developer:</b> a hotfix branch for a production bug is created from main, fixed, merged and deployed in an hour, while a large feature branch continues separately for weeks.</p><p><b>Data team:</b> each analyst experiments on a branch (exp-xgboost, exp-random-forest); only the winning model is merged into main.</p><p><b>Project groups:</b> two students edit the same README line; the conflict markers show both versions and they agree on one.</p>","terms":[["Branch","Movable pointer to a commit; a line of development."],["main","Default branch name."],["HEAD","Pointer to the current branch or commit."],["git switch / checkout","Change branch."],["Merge","Combine another branch into the current one."],["Fast-forward","Merge that just moves the label forward."],["Merge commit","Commit with two parents."],["Merge conflict","Same lines changed differently on both branches."],["Conflict markers","<<<<<<<, =======, >>>>>>> in the file."],["Stash","Temporary shelf for uncommitted changes."]],"myths":[["A branch copies the whole project","It is just a pointer; creating it is instant."],["Conflicts mean something is broken","They are normal; Git simply needs a human decision."],["Deleting a merged branch deletes its work","The commits remain in main's history."]],"quiz":[{"q":"Create a branch called feature and switch to it:","o":["git branch feature main","git switch -c feature","git merge feature","git commit -b feature"],"a":1,"why":"switch -c creates and switches."},{"q":"Both branches changed the same line. What happens on merge?","o":["Git picks the newest","A merge conflict to resolve by hand","The merge is impossible","Both lines are deleted"],"a":1,"why":"Git marks the conflict for you to decide."},{"q":"After editing a conflicted file, next step:","o":["git merge again","git add file, then git commit","git push --force","git init"],"a":1,"why":"Staging marks it resolved; commit finishes."}]},{"part":9,"title":"GitHub: remote repositories, push, pull and clone","lead":"Put your repository online so the team can share it: create a GitHub repository, push your commits, clone it on another machine and collaborate with pull requests.","scene":[{"id":"lap","type":"box","x":20,"y":40,"w":210,"h":110,"k":"user","l":"💻 Your laptop","s":"local repo|commits A B C"},{"id":"gh","type":"box","x":290,"y":40,"w":220,"h":110,"k":"net","l":"🐙 GitHub","s":"origin|github.com/asha/dbda-project|README, issues, PRs"},{"id":"team","type":"box","x":570,"y":40,"w":210,"h":110,"k":"user","l":"👩 Teammate","s":"git clone|gets full history"},{"id":"ci","type":"box","x":290,"y":175,"w":220,"h":60,"k":"vm","l":"⚙️ GitHub Actions","s":"tests run on every push"},{"id":"auth","type":"box","x":20,"y":255,"w":370,"h":105,"k":"sec","l":"Authentication","s":"HTTPS: personal access token (PAT),|not your account password|SSH: ssh-keygen + add public key|to GitHub → Settings → SSH keys"},{"id":"pr","type":"box","x":410,"y":255,"w":370,"h":105,"k":"store","l":"Pull request (PR)","s":"push a branch → open PR on GitHub →|teammates review and comment →|checks pass → Merge into main"},{"id":"cmds","type":"box","x":20,"y":375,"w":760,"h":85,"k":"note","l":"Commands","s":"git remote add origin git@github.com:asha/dbda-project.git   git push -u origin main|git clone <url>   git pull (fetch + merge)   git fetch   git remote -v|.gitignore: never push passwords, .env files or big datasets"}],"steps":[{"t":"Git versus GitHub","d":"Git is the tool on your machine. GitHub is a website that hosts Git repositories and adds collaboration: browsing code, issues, pull requests, reviews and automation. GitLab and Bitbucket are similar services.","s":["lap","gh"],"a":"Git is your personal diary; GitHub is the school library where a copy of the diary is kept for the class to read and comment on."},{"t":"Create a repository on GitHub","d":"On github.com click New repository, give it a name (dbda-project), choose public or private, and optionally add a README and a .gitignore template for Python. GitHub shows the commands to connect an existing local repository.","hi":["gh"],"dp":"A README.md is the front page of the project: what it does, how to install and run it. A LICENSE file says how others may use the code. Private repositories are visible only to people you invite."},{"t":"Connect and push","d":"git remote add origin <url> tells your repository where the GitHub copy lives; origin is just the conventional nickname. git push -u origin main uploads your commits; -u remembers the link, so later a plain git push is enough.","s":["cmds"],"p":[{"v":["lap","gh"],"c":"req","l":"git push","d":0,"x":false}],"hi":["cmds"]},{"t":"Authentication","d":"GitHub stopped accepting account passwords for git operations in 2021. Over HTTPS use a personal access token as the password; or, better, use SSH keys: generate a key pair and add the public key in your GitHub settings. The same SSH knowledge from the remote-access module applies.","s":["auth"],"hi":["auth"]},{"t":"Clone and pull","d":"A teammate runs git clone <url> to get the complete repository with all history. When you push new commits, they run git pull, which fetches them and merges them into their branch. Pull before you start work and before you push, to avoid conflicts.","s":["team"],"p":[{"v":["gh","team"],"c":"res","l":"git clone","d":0,"x":false},{"v":["lap","gh","team"],"c":"req","l":"push → pull","d":1.5,"x":false}],"dp":"git fetch downloads new commits without changing your files; git pull = fetch + merge. If git push is rejected with \"fetch first\", someone else pushed: pull, resolve any conflict, then push. Never use git push --force on a shared branch: it overwrites teammates' work."},{"t":"Pull requests and automation","d":"Instead of pushing directly to main, push a branch and open a pull request. Teammates review the changes and comment, automated checks (GitHub Actions) run the tests, and when everything is green someone clicks Merge.","s":["ci","pr"],"hi":["pr"],"p":[{"v":["lap","gh","ci"],"c":"data","l":"push branch","d":0,"x":false},{"v":["ci","pr"],"c":"res","l":"checks ✓","d":1.5,"x":false}],"a":"Submitting an assignment for review: a teacher marks it, a checklist is ticked, and only then is it added to the class portfolio."}],"analogy":{"intro":"A shared class portfolio.","map":[["Your own notebook","Local repository"],["Copy kept in the library","GitHub repository (origin)"],["Handing in new pages","git push"],["Photocopying the whole portfolio for a new student","git clone"],["Collecting the latest pages others added","git pull"],["\"Please review my pages before adding them\"","Pull request"],["Library card instead of your house key","Personal access token / SSH key"]]},"cmp":{"head":["Command","What it does"],"rows":[["git remote add origin <url>","link to GitHub"],["git remote -v","show remotes"],["git push -u origin main","first push, remember link"],["git push","push later commits"],["git clone <url>","copy a repository"],["git pull","fetch + merge"],["git fetch","download without merging"],["git push origin feature","push a branch (for a PR)"],["ssh -T git@github.com","test SSH authentication"],["gh repo create / gh pr create","GitHub CLI (optional)"]]},"usecase":"<p><b>Students:</b> a public GitHub profile with well-documented projects (README, clean commits) is often the first thing recruiters open.</p><p><b>Data team:</b> all ETL code lives on GitHub; every change goes through a pull request so another engineer reviews the SQL before it touches production tables.</p><p><b>DevOps:</b> pushing to main triggers GitHub Actions, which tests the code and deploys it to AWS automatically (see the deployment module).</p>","terms":[["GitHub","Website hosting Git repositories with collaboration tools."],["Remote","Another copy of the repository, e.g. on GitHub."],["origin","Default name of the remote you cloned from or added."],["push","Upload local commits to a remote."],["clone","Copy a remote repository with full history."],["pull / fetch","Download and merge / download only."],["Pull request","Proposal to merge a branch, with review."],["Personal access token","Password replacement for git over HTTPS."],["Fork","Your own GitHub copy of someone else's repository."],["README.md","Project front page in Markdown."]],"myths":[["GitHub is required to use Git","Git works fully offline; GitHub is optional hosting."],["Use your GitHub password in git push","Use a token or SSH key."],["Deleting a secret in a new commit removes it","It stays in history; rotate the secret immediately."]],"quiz":[{"q":"Upload your local commits to GitHub:","o":["git pull","git push","git clone","git fetch"],"a":1,"why":"push sends commits to the remote."},{"q":"Get a full copy of a GitHub repository on a new machine:","o":["git init","git clone <url>","git remote add","git commit"],"a":1,"why":"clone copies everything."},{"q":"You accidentally pushed an AWS key. Most important step:","o":["Delete the file and push","Revoke/rotate the key immediately","Make the repo private","Rename the file"],"a":1,"why":"It remains in history and may already be copied."}]},{"part":10,"title":"What is cloud computing?","lead":"Renting computing power over the internet instead of owning it: the paradigm shift, the five essential characteristics, deployment models and the major vendors.","scene":[{"id":"onp","type":"box","x":20,"y":25,"w":370,"h":100,"k":"down","l":"🏢 Before: your own data centre","s":"buy servers months ahead (CapEx)|pay for them even when idle|growth = order more hardware"},{"id":"cl","type":"box","x":410,"y":25,"w":370,"h":100,"k":"store","l":"☁️ Cloud: rent on demand","s":"a server in minutes (OpEx)|pay per second, hour or GB|scale up and down any time"},{"id":"k1","type":"box","x":20,"y":140,"w":144,"h":95,"k":"vm","l":"Self-service","s":"click or API,|no ticket to|IT staff"},{"id":"k2","type":"box","x":174,"y":140,"w":144,"h":95,"k":"vm","l":"Network access","s":"use from|anywhere: web,|CLI, mobile"},{"id":"k3","type":"box","x":328,"y":140,"w":144,"h":95,"k":"vm","l":"Resource pooling","s":"shared hardware,|many customers|(multi-tenant)"},{"id":"k4","type":"box","x":482,"y":140,"w":144,"h":95,"k":"vm","l":"Rapid elasticity","s":"grow and shrink|with demand,|even automatically"},{"id":"k5","type":"box","x":636,"y":140,"w":144,"h":95,"k":"vm","l":"Measured service","s":"metered like|electricity:|pay for use"},{"id":"dep","type":"box","x":20,"y":250,"w":370,"h":115,"k":"net","l":"Deployment models","s":"public: shared provider (AWS, Azure, GCP)|private: one organisation only|hybrid: private + public, connected|community · multi-cloud (several providers)"},{"id":"ven","type":"box","x":410,"y":250,"w":370,"h":115,"k":"note","l":"Major vendors","s":"AWS (2006): largest, broadest catalogue|Microsoft Azure (2010): enterprise, Office|Google Cloud (2008): data, AI, Kubernetes|also Oracle, IBM, Alibaba; India: MeghRaj"},{"id":"comp","type":"box","x":20,"y":380,"w":760,"h":80,"k":"srv","l":"Components of a cloud","s":"front end (browser, CLI, apps) · network (internet, private links) · back end (data centres in regions|and availability zones) · virtualisation layer · management (console, APIs, billing) · security"}],"steps":[{"t":"The old way: own everything","d":"Before the cloud, a company buying a new application ordered servers, waited weeks for delivery, installed them in its own data centre and paid for power, cooling and staff, even when the servers sat idle at night. Planning for the peak meant paying for the peak all year.","s":["onp"],"hi":["onp"],"a":"Buying a bus for your family because once a year you go on a trip with 40 relatives."},{"t":"The cloud way: rent what you need","d":"Cloud computing delivers computing resources (servers, storage, databases, software) over the internet, on demand, paid for as you use them. Capital expenditure on hardware becomes operating expenditure, like a utility bill.","s":["cl"],"hi":["cl"],"p":[{"v":["onp","cl"],"c":"req","l":"paradigm shift","d":0,"x":false}],"a":"Calling a taxi or renting a bus only for the trip day, instead of owning one.","ins":[["1960s-80s Mainframes",[["Idea","one big computer shared by many terminals (time-sharing)"]]],["1990s Client-server",[["Idea","every company runs its own servers"]]],["2000s Grid and utility computing",[["Idea","computing sold like electricity; virtualisation matures"]]],["2006 Public cloud",[["Idea","AWS launches S3 and EC2: rent servers by the hour"]]],["Today",[["Idea","serverless, containers, edge computing, AI services"]]]]},{"t":"Five essential characteristics (NIST)","d":"The US standards body NIST defines cloud computing by five characteristics. If a service lacks them (for example, you must email IT and wait a week), it is just hosting, not cloud.","s":["k1","k2","k3","k4","k5"],"hi":["k4"],"ins":[["On-demand self-service",[["Example","launch a VM yourself in the console in 2 minutes"]]],["Broad network access",[["Example","manage it from a laptop, phone or script"]]],["Resource pooling",[["Example","your VM shares a physical host with other customers, isolated by the hypervisor"]]],["Rapid elasticity",[["Example","IRCTC-style traffic spike at 10 am: 2 servers become 20, then back to 2"]]],["Measured service",[["Example","bill shows 730 VM-hours, 50 GB-months of storage"]]]]},{"t":"Benefits","d":"Speed (minutes, not months), no up-front hardware cost, elastic capacity for peaks, global reach (deploy near users), built-in reliability across data centres, and managed services so small teams can run large systems.","hi":["cl","k4"],"dp":"The cloud is not automatically cheaper. A server running 24×7 for three years can cost more than owning one. Savings come from switching things off, right-sizing, reserved or spot pricing, and using managed services instead of paying staff to run them."},{"t":"Deployment models","d":"Public cloud: the provider's infrastructure, shared by many customers. Private cloud: infrastructure for one organisation, on its premises or hosted. Hybrid: both, connected, for example sensitive data on-premises and web front ends in the public cloud. Multi-cloud: using more than one provider.","s":["dep"],"hi":["dep"]},{"t":"The vendors","d":"AWS started the public cloud in 2006 and remains the largest. Microsoft Azure is strong with enterprises that use Windows, Office 365 and Active Directory. Google Cloud is known for data analytics (BigQuery), AI and Kubernetes. India's government runs the MeghRaj cloud initiative. Concepts transfer between providers; names differ.","s":["ven"],"hi":["ven"]},{"t":"Components","d":"A cloud has a front end (the console, CLI and SDKs you use), the network, the back end (data centres grouped into regions and availability zones), a virtualisation layer that splits hardware between customers, management services (APIs, monitoring, billing) and security controls.","s":["comp"],"hi":["comp"],"dp":"A region is a geographic area such as ap-south-1 (Mumbai) or Central India (Pune). Each region has several availability zones: separate data centres with independent power and networking a few kilometres apart, so one fire or flood does not take everything down."}],"analogy":{"intro":"Electricity from the grid instead of your own generator.","map":[["Your own diesel generator","On-premises data centre"],["Plug into the grid, pay per unit","Cloud computing"],["Switch appliances on yourself","On-demand self-service"],["Power for the whole street from shared plants","Resource pooling"],["Extra power during a festival, automatically","Rapid elasticity"],["Electricity meter","Measured service"],["Generator at home plus grid connection","Hybrid cloud"]]},"cmp":{"head":["Term","Meaning / example"],"rows":[["CapEx vs OpEx","buy hardware up front vs pay monthly for use"],["Public cloud","AWS, Azure, Google Cloud"],["Private cloud","OpenStack or VMware in your own data centre"],["Hybrid cloud","on-premises + public, connected (VPN, Direct Connect, ExpressRoute)"],["Multi-cloud","AWS for apps, Google Cloud for analytics"],["Region","ap-south-1 Mumbai, ap-south-2 Hyderabad (AWS)"],["Availability zone","separate data centre inside a region"],["Pay-as-you-go","per second / hour / GB / request"],["Free tier","limited free usage to learn (check current terms)"]]},"usecase":"<p><b>E-commerce:</b> during a festival sale traffic grows twentyfold for a few days; the site adds servers automatically and removes them afterwards, paying only for those days.</p><p><b>Startup:</b> launches a product in a week with zero hardware purchase, using managed databases and storage.</p><p><b>Bank:</b> keeps core banking in a private cloud for regulation and runs its mobile-app front end and analytics in a public cloud: a hybrid design.</p>","terms":[["Cloud computing","On-demand computing resources over the internet, paid per use."],["NIST definition","5 characteristics, 3 service models, 4 deployment models."],["On-demand self-service","Provision resources yourself, instantly."],["Resource pooling","Shared physical resources serving many customers."],["Rapid elasticity","Scale out and in quickly."],["Measured service","Usage is metered and billed."],["Multi-tenancy","Many customers on shared infrastructure, isolated."],["Public / private / hybrid cloud","Deployment models."],["Region","Geographic area with several data centres."],["Availability zone (AZ)","Isolated data centre(s) within a region."],["CapEx / OpEx","Capital vs op
