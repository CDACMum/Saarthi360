<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat Sheets · Saarthi 360 · PGCP-BDA</title>
<script>try{if(localStorage.getItem('saarthi_theme')==='dark')document.documentElement.classList.add('sp-dark')}catch(e){}</script>
<style>
:root{
  --bg:#f4f7f7;--panel:#ffffff;--panel2:#f0f6f5;--line:#dbe6e4;--text:#14232a;--text2:#3d5158;--text3:#5d7178;
  --accent:#0f766e;--accent2:#14b8a6;--accent-soft:#e6f6f3;--code-bg:#0f1e24;--code-text:#e3eef0;
  --kw:#7dd3fc;--str:#a7f3d0;--com:#8aa1a8;--num:#fcd34d;--fn:#f9a8d4;--tip:#fff7e6;--tip-line:#f0b429;--tip-text:#5c4200;
  --shadow:0 1px 2px rgba(16,40,40,.06),0 4px 14px rgba(16,40,40,.05);
}
html.sp-dark{
  --bg:#0c1518;--panel:#132126;--panel2:#18292f;--line:#24393f;--text:#e5eef0;--text2:#b8c9cd;--text3:#93a8ad;
  --accent:#2dd4bf;--accent2:#14b8a6;--accent-soft:#11312f;--code-bg:#081114;--tip:#2b2410;--tip-line:#d69e2e;--tip-text:#f5e2b3;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
code,pre,.mono{font-family:"Cascadia Code",Consolas,"JetBrains Mono",ui-monospace,monospace}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:linear-gradient(90deg,#0b5f59,#0f766e 45%,#119c90);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:18px}
.brand b{font-size:16px;letter-spacing:.2px}.brand span{display:block;font-size:11.5px;opacity:.85;margin-top:-2px}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;border:0;border-radius:10px;padding:9px 12px 9px 34px;font:inherit;font-size:14px;background:rgba(255,255,255,.95);color:#14232a;outline:none}
.search input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.search:before{content:"🔍";position:absolute;left:11px;top:8px;font-size:13px;opacity:.7}
.tbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:7px 11px;font-size:13px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.2)}
.menu-btn{display:none}

/* layout */
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:16px 12px 30px;border-right:1px solid var(--line);background:var(--panel)}
.side h4{margin:16px 10px 6px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text3)}
.side h4:first-child{margin-top:4px}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--text2);padding:7px 10px;border-radius:8px;font-size:14px;text-decoration:none}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav .ic{width:22px;text-align:center}
.nav .ct{margin-left:auto;font-size:11px;color:var(--text3);background:var(--panel2);border-radius:20px;padding:0 7px}
.home-link{font-weight:600}
main{padding:24px 28px 60px;min-width:0}

/* sheet */
.sh-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.sh-ic{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:28px;flex-shrink:0}
.sh-head h1{margin:0;font-size:26px;line-height:1.2}
.sh-head p{margin:3px 0 0;color:var(--text3);font-size:14px}
.chip{display:inline-block;font-size:11.5px;font-weight:650;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 10px;margin-bottom:6px}
.sh-tools{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:9px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.grid{columns:2 460px;column-gap:18px}
.card{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;margin:0 0 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15.5px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card h3:before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--accent2),var(--accent))}
.card p{margin:6px 0;color:var(--text2)}
.card ul{margin:6px 0;padding-left:20px;color:var(--text2)}
.card li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13.6px;margin:4px 0 6px}
td,th{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
tr:first-child td{border-top:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);background:var(--panel2);border-top:0}
td:first-child{color:var(--text);font-weight:600;width:42%}
td.full{width:auto;font-weight:400;color:var(--text2)}
td code,p code,.tip code,li code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12.6px}
td:first-child code{background:none;border:0;padding:0;font-size:13px;color:var(--accent)}
td:not(:first-child){color:var(--text2)}
.code{position:relative;margin:8px 0}
pre{margin:0;background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:30px 14px 12px;overflow:auto;font-size:13px;line-height:1.55;tab-size:4}
.copy{position:absolute;top:5px;right:6px;z-index:1;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#cfe3e6;border-radius:7px;font-size:11.5px;padding:2px 8px;opacity:.75}
.copy:hover{opacity:1}
.lang{position:absolute;top:8px;left:14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#5d7a80}
.k{color:var(--kw)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.n{color:var(--num)}.f{color:var(--fn)}
.tip{background:var(--tip);border-left:4px solid var(--tip-line);color:var(--tip-text);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13.8px}
.tip:before{content:"💡 "}
mark{background:#fde68a;color:#000;border-radius:3px;padding:0 1px}

/* home */
.hero{background:linear-gradient(120deg,#0b5f59,#0f766e 55%,#14b8a6);color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:24px;position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92;max-width:720px}
.hero .stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.hero .stats div{font-size:13px;opacity:.9}.hero .stats b{display:block;font-size:22px}
.gh{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.gh h2{margin:0;font-size:18px}.gh .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--accent2),transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{display:flex;gap:12px;align-items:flex-start;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .ti{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.tile b{display:block;font-size:14.5px;color:var(--text)}.tile span{font-size:12.5px;color:var(--text3);line-height:1.4}
.results h2{font-size:18px;margin:0 0 14px}
.hit{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.hit:hover{border-color:var(--accent)}
.hit b{color:var(--text)}.hit small{color:var(--text3);display:block;margin-top:2px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.pager a{flex:1;max-width:48%;text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;color:var(--text2);font-size:13px}
.pager a:hover{border-color:var(--accent)}
.pager a b{display:block;color:var(--text);font-size:14.5px}
.pager .nx{text-align:right;margin-left:auto}
.foot{color:var(--text3);font-size:12px;text-align:center;margin-top:34px}


/* ===== visuals ===== */
.card.wide{column-span:all;-webkit-column-span:all}
.card.wide h3:after{content:"⚡ visual recall";margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:20px}
.vis{margin:10px 0 12px}
.vis-t{font-size:13px;font-weight:700;color:var(--text2);margin:0 0 8px;display:flex;align-items:center;gap:6px}.vis-t:before{content:'';width:8px;height:8px;border-radius:2px;background:var(--accent2)}
.vic{font-size:22px;line-height:1;display:block;margin-bottom:4px}
.vt{font-weight:700;color:var(--text);font-size:13.5px;display:block;line-height:1.3}
.vs{font-size:12px;color:var(--text2);display:block;line-height:1.35;margin-top:2px}
.vt code,.vs code{font-size:11.5px;background:rgba(127,127,127,.12);border-radius:4px;padding:0 3px}
/* flow */
.v-flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 4px}
.v-step{flex:1 1 110px;min-width:96px;max-width:220px;text-align:center;background:color-mix(in srgb,var(--c) 10%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-top:4px solid var(--c);border-radius:12px;padding:10px 8px;position:relative}
.v-step .num{position:absolute;top:-11px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.v-arr{align-self:center;color:var(--text3);font-size:18px;font-weight:700;padding:0 1px}
/* layers / funnel */
.v-layers{display:flex;flex-direction:column;gap:5px;align-items:center}
.v-layer{width:100%;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);border-left:6px solid var(--c);border-radius:10px;padding:8px 12px}
.v-layer .vic{margin:0;font-size:22px}
.v-layer .vs{margin:0 0 0 auto;text-align:right;max-width:60%}
/* tiles */
.v-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.v-tile{background:color-mix(in srgb,var(--c) 11%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:12px;padding:10px;text-align:center}
.v-tile .vic{font-size:26px;margin-bottom:6px}
.v-tile .big{font-size:28px;font-weight:900;color:var(--c);display:block;line-height:1;margin-bottom:4px;font-family:Georgia,serif}
/* tree */
.v-tree,.v-tree ul{list-style:none;margin:0;padding:0}
.v-tree ul{margin-left:18px;padding-left:14px;border-left:2px dashed var(--line)}
.v-tree li{position:relative;margin:6px 0}
.v-tree ul>li:before{content:"";position:absolute;left:-14px;top:17px;width:12px;border-top:2px dashed var(--line)}
.v-node{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--c) 11%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:10px;padding:5px 11px}
.v-node .vic{font-size:17px;margin:0}.v-node .vs{margin:0}
/* nest */
.v-nest{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:12px;padding:24px 10px 10px;position:relative;margin-top:4px}
.v-nest>.lbl{position:absolute;top:4px;left:10px;font-size:12px;font-weight:800;color:var(--c)}
.v-nest>.lbl small{font-weight:500;color:var(--text3);margin-left:6px}
.v-nest.core{padding:10px;text-align:center;font-weight:800;color:var(--c)}
/* hub & ring */
.v-hub{position:relative;height:330px;max-width:640px;margin:0 auto}
.v-hub svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.v-hub .hn{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:min(34%,210px);text-align:center;background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:12px;padding:7px 10px;box-shadow:var(--shadow)}
.v-hub .hn.ctr{border-width:2.5px;padding:10px 14px;background:color-mix(in srgb,var(--c) 22%,var(--panel))}
.v-hub .el{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:800;color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 8px;white-space:nowrap}
.v-hub .cl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--text3);text-align:center;max-width:30%}
/* joins */
.v-joins{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.v-join{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 4px}
.v-join svg{width:100%;max-width:120px;height:66px}
.v-join b{display:block;font-size:12.5px}.v-join span{font-size:11px;color:var(--text3)}
/* strip */
.v-strip{overflow-x:auto}
.v-strip table{width:auto;border-collapse:separate;border-spacing:3px;margin:0}
.v-strip td{border:0;padding:0;width:auto!important}
.v-strip .ix{font-size:10.5px;color:var(--text3);text-align:center;font-family:ui-monospace,Consolas,monospace;font-weight:400}
.v-strip .ch{width:30px;height:30px;text-align:center;font:700 14px ui-monospace,Consolas,monospace;border-radius:7px;background:var(--panel2);border:1.5px solid var(--line);color:var(--text)}
.v-strip .ch.on{background:var(--c);border-color:var(--c);color:#fff}
.v-strip .ex{font:600 12.5px ui-monospace,Consolas,monospace;color:var(--accent);padding-right:10px!important;white-space:nowrap;text-align:right}
.v-strip .rs{font:600 12.5px ui-monospace,Consolas,monospace;color:var(--text2);padding-left:10px!important;white-space:nowrap}
/* matrix */
.v-mx{display:inline-grid;gap:4px;align-items:center;font:600 13px ui-monospace,Consolas,monospace}
.v-mx .c{width:40px;height:34px;display:grid;place-items:center;border-radius:7px;background:var(--panel2);border:1.5px solid var(--line);color:var(--text)}
.v-mx .r1{background:color-mix(in srgb,#ec4899 18%,var(--panel));border-color:#ec489988}
.v-mx .r0{background:color-mix(in srgb,#3b82f6 18%,var(--panel));border-color:#3b82f688}
.v-mx .lab{font:700 11px "Segoe UI",sans-serif;color:var(--text3);text-align:center}
.v-mxw{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.v-mxk{font-size:12.5px;color:var(--text2);line-height:1.7}
.v-mxk i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* ladder */
.v-ladder{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:6px}
.v-rung{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0}
.v-rung .bar{background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--panel)));border-radius:9px 9px 3px 3px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:7px 4px;color:#fff;text-align:center;overflow:hidden}
.v-rung .bar .vt{color:#fff;font-size:12.5px}.v-rung .bar .vs{color:rgba(255,255,255,.92);font-size:11px}
.v-rung .bar .vic{font-size:18px}
/* mini table */
.v-mt{overflow-x:auto}
.v-mt table{font-size:12.6px;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.v-mt th{background:var(--accent);color:#fff;text-transform:none;letter-spacing:0;font-size:12px}
.v-mt td,.v-mt td:first-child{font-weight:400;width:auto;color:var(--text);font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap}
.v-mt tr.hi td{background:color-mix(in srgb,#10b981 18%,var(--panel));font-weight:700}
.v-mt tr.lo td{color:var(--text3);text-decoration:line-through;text-decoration-color:rgba(127,127,127,.5)}
.v-mt tr.g1 td{background:color-mix(in srgb,#3b82f6 11%,var(--panel))}
.v-mt tr.g2 td{background:color-mix(in srgb,#f59e0b 13%,var(--panel))}
.v-mt tr.g3 td{background:color-mix(in srgb,#ec4899 11%,var(--panel))}
/* memory hook */
.mem{border-radius:12px;padding:10px 14px;margin:10px 0;background:linear-gradient(135deg,color-mix(in srgb,#8b5cf6 14%,var(--panel)),color-mix(in srgb,#ec4899 10%,var(--panel)));border:1.5px solid color-mix(in srgb,#8b5cf6 40%,transparent)}
.mem .mh{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#8b5cf6;margin-bottom:4px}
html.sp-dark .mem .mh{color:#c4b5fd}
.mem div.mi{font-size:14px;color:var(--text);margin:3px 0;font-weight:500}
.mem div.mi b{color:#8b5cf6}html.sp-dark .mem div.mi b{color:#c4b5fd}
.mem code{background:rgba(127,127,127,.14);border-radius:4px;padding:0 4px;font-size:12.5px}
@media (max-width:640px){.v-hub{height:300px}.v-hub .hn{max-width:40%;padding:5px 6px}.v-hub .hn .vs{display:none}.v-layer .vs{max-width:52%}.v-ladder{height:150px}.v-rung .bar .vs{display:none}}
@media print{.card.wide{column-span:all}.v-step,.v-layer,.v-tile,.v-node,.v-hub .hn{box-shadow:none}.mem{background:#f6f0ff!important}}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:56px;width:280px;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  body.menu .side{transform:none}
  .menu-btn{display:inline-block}
  main{padding:18px 14px 50px}
  .brand span{display:none}
  .grid{columns:1}
  .tbtn.pr{display:none}
}
@media (max-width:560px){.brand b{display:none}.sh-head h1{font-size:21px}td:first-child{width:46%}}
@media print{
  .top,.side,.sh-tools,.copy,.pager,.foot{display:none!important}
  .wrap{display:block}main{padding:0}
  body{background:#fff;color:#000;font-size:11px}
  .grid{columns:2;column-gap:12px}
  .card{box-shadow:none;border-color:#bbb;padding:8px 10px;margin-bottom:10px}
  pre{background:#f3f6f6!important;color:#111!important;border:1px solid #ccc;font-size:10px;white-space:pre-wrap;padding:8px 10px}
  .lang{display:none}
  .k,.s,.c,.n,.f{color:#111!important}.c{color:#555!important}
  .tip{background:#fff8e6!important;color:#333!important}
}
</style>
</head>
<body>
<header class="top">
  <button class="tbtn menu-btn" onclick="document.body.classList.toggle('menu')" aria-label="Open the list of sheets">☰</button>
  <a class="brand" href="#"><div class="logo">📋</div><div><b>Saarthi · Cheat Sheets</b><span>PGCP-BDA · C-DAC Mumbai</span></div></a>
  <div class="search"><input id="q" type="search" placeholder="Search all sheets: groupby, $lookup, SCD, decorator…" autocomplete="off" aria-label="Search all cheat sheets"></div>
  <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
  <button class="tbtn pr" onclick="window.print()">🖨️ Print</button>
</header>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = {"groups": ["Python", "R", "Databases & SQL", "NoSQL", "Warehouse, Lake & Cloud"], "sheets": [{"id": "py-basics", "g": "Python", "i": "🐍", "t": "Python Basics", "d": "Syntax, types, operators, I/O, control flow", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "How a Python program runs", "c": ["📝 Source code :: script.py", "⚙️ Interpreter :: compiles to bytecode (.pyc)", "🖥️ Python VM :: executes line by line", "📤 Output :: print / files / errors"]}, {"k": "vis", "t": "tiles", "ti": "Built-in data types", "c": ["🔢 int / float :: 10, 3.14", "🔤 str :: 'text', immutable", "✅ bool :: True / False", "📋 list :: [ ] ordered, mutable", "📦 tuple :: ( ) ordered, immutable", "📖 dict :: {k: v} key → value", "🎲 set :: { } unique, unordered", "🚫 None :: \"nothing\""]}, {"k": "mem", "c": ["**Brackets decide the type:** `[ ]` list · `( )` tuple · `{k:v}` dict · `{a,b}` set", "**Mutable = can change in place:** list, dict, set. Immutable: int, float, str, tuple, bool.", "`/` always gives float, `//` drops the fraction, `%` gives the remainder → **7 / 2 = 3.5, 7 // 2 = 3, 7 % 2 = 1**"]}], "w": 1}, {"h": "Loop control, pictured", "b": [{"k": "vis", "t": "tiles", "ti": "", "c": ["⛔ break :: exit the loop now", "⏭️ continue :: skip to next round", "🕳️ pass :: do nothing, placeholder", "🔁 for…else :: else runs only if no break"]}]}, {"h": "Data types", "b": [{"k": "tbl", "h": null, "r": [["int, float, complex", "10, 3.14, 2+3j"], ["str", "'hi', \"hi\", '''multi-line'''"], ["bool", "True, False (bool is a subclass of int)"], ["None", "the \"no value\" object"], ["list / tuple / set / dict", "[1,2] / (1,2) / {1,2} / {'k':1}"], ["type(x), isinstance(x, int)", "check a type"], ["int('5'), float('2.5'), str(9), bool(0)", "convert types"]]}]}, {"h": "Operators", "b": [{"k": "tbl", "h": null, "r": [["+ - * /", "add, subtract, multiply, true divide (7/2 → 3.5)"], ["// % **", "floor divide (7//2 → 3), modulo (7%2 → 1), power (2**3 → 8)"], ["== != < <= > >=", "comparison (chainable: 1 < x < 5)"], ["and or not", "logical (short-circuit)"], ["is, is not", "same object? (use for None: x is None)"], ["in, not in", "membership ('a' in 'cat')"], ["& | ^ ~ << >>", "bitwise"], ["x += 1", "augmented assignment (no ++ in Python)"], ["n := len(a)", "walrus: assign inside an expression"]]}]}, {"h": "Input / output", "b": [{"k": "code", "l": "py", "c": "name = input(\"Name: \")            # always returns str\nage  = int(input(\"Age: \"))        # convert\na, b = map(int, input().split())  # two ints on one line\nprint(\"Hi\", name, sep=\", \", end=\"!\\n\")\nprint(f\"{name} is {age} years\")   # f-string"}]}, {"h": "Branching", "b": [{"k": "code", "l": "py", "c": "if marks >= 75:\n    grade = \"A\"\nelif marks >= 60:\n    grade = \"B\"\nelse:\n    grade = \"C\"\n\nstatus = \"pass\" if marks >= 40 else \"fail\"   # ternary\n\nmatch cmd:                      # Python 3.10+\n    case \"start\": run()\n    case \"stop\" | \"quit\": stop()\n    case _: print(\"unknown\")"}]}, {"h": "Loops", "b": [{"k": "code", "l": "py", "c": "lst, l1, l2 = [4, 9, 7], [1, 2], ['a', 'b']\nfor i in range(5): print(i)              # 0..4\nfor i in range(2, 10, 2): print(i)       # 2,4,6,8\nfor i, v in enumerate(lst): print(i, v)  # index + value\nfor a, b in zip(l1, l2): print(a, b)     # pair up\n\nn = 3\nwhile n > 0:\n    n -= 1\n\ntarget = 7\nfor x in lst:\n    if x == target:\n        break\nelse:                                    # runs only if no break\n    print(\"not found\")"}, {"k": "tbl", "h": null, "r": [["break", "leave the loop now"], ["continue", "skip to next iteration"], ["pass", "do nothing (placeholder)"]]}, {"k": "tip", "c": "Indentation (4 spaces) defines blocks. Mixing tabs and spaces raises TabError."}]}]}, {"id": "py-strings", "g": "Python", "i": "🔤", "t": "Strings & Formatting", "d": "Indexing, slicing, methods, f-strings", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "strip", "ti": "Index & slice: s = \"BigData\"", "c": ["\"BigData\"", "s[0:3]", "s[3:]", "s[-4:]", "s[::2]", "s[::-1]"]}, {"k": "mem", "c": ["**[start : stop : step]** → start is included, stop is **excluded**. Think \"up to, not including\".", "Negative index counts from the end: `s[-1]` is the last character.", "`s[::-1]` = reverse. Strings are **immutable**: methods return a **new** string."]}], "w": 1}, {"h": "Method families", "b": [{"k": "vis", "t": "tiles", "ti": "", "c": ["🔠 Case :: lower upper title capitalize", "✂️ Trim :: strip lstrip rstrip", "🔎 Search :: find index count startswith", "🔁 Change :: replace split join", "❓ Test :: isdigit isalpha isalnum", "📏 Pad :: zfill center ljust rjust"]}]}, {"h": "Indexing & slicing", "b": [{"k": "code", "l": "py", "c": "s = \"BigData\"\ns[0]      # 'B'      s[-1]   # 'a'\ns[0:3]    # 'Big'    s[3:]   # 'Data'\ns[::2]    # 'Bgaa'   s[::-1] # 'ataDgiB' (reverse)\nlen(s)    # 7"}, {"k": "tip", "c": "Strings are immutable: s[0] = 'b' raises TypeError. Build a new string instead."}]}, {"h": "Common methods", "b": [{"k": "tbl", "h": null, "r": [["s.lower() / upper() / title() / capitalize() / swapcase()", "change case"], ["s.strip() / lstrip() / rstrip()", "remove whitespace (or given chars)"], ["s.split(',') / s.split()", "to list (default splits on any whitespace)"], ["','.join(lst)", "list of str → one str"], ["s.replace('a','b')", "replace all"], ["s.find('x') / s.index('x')", "position (find → -1, index → ValueError)"], ["s.count('a')", "occurrences"], ["s.startswith('Big') / endswith('a')", "prefix / suffix test"], ["s.isdigit() / isalpha() / isalnum() / isspace()", "character tests"], ["s.zfill(5) / center(10,'*') / ljust / rjust", "padding"]]}]}, {"h": "Formatting", "b": [{"k": "code", "l": "py", "c": "name, pi = \"Asha\", 3.14159\nf\"{name:>10}\"      # right-align in 10\nf\"{pi:.2f}\"        # '3.14'\nf\"{1234567:,}\"     # '1,234,567'\nf\"{0.25:.0%}\"      # '25%'\nf\"{7:03d}\"         # '007'\nf\"{name=}\"         # \"name='Asha'\" (debug)\n\"{} scored {}\".format(name, 90) ": null, "r": [["x in a", "membership"], ["a.index(x) / a.count(x)", "position / frequency"], ["len, min, max, sum", "built-ins"], ["sorted(a)", "new sorted list"], ["a.sort(reverse=True, key=len)", "sort in place, returns None"], ["a.reverse() / a[::-1]", "reverse in place / reversed copy"], ["a.copy() / a[:] / list(a)", "shallow copy"]]}]}, {"h": "Comprehension & mapping", "b": [{"k": "code", "l": "py", "c": "squares = [x*x for x in range(10)]\nevens   = [x for x in nums if x % 2 == 0]\nlabels  = [\"even\" if x%2==0 else \"odd\" for x in nums]\nflat    = [v for row in grid for v in row]\nupper   = list(map(str.upper, words))\nlongw   = list(filter(lambda w: len(w) > 3, words))"}]}, {"h": "Strings ↔ lists", "b": [{"k": "code", "l": "py", "c": "words = \"a b c\".split()      # ['a','b','c']\nline  = \"-\".join(words)      # 'a-b-c'\nchars = list(\"abc\")          # ['a','b','c']"}, {"k": "tip", "c": "b = a does NOT copy: both names point to the same list. Use a.copy() or copy.deepcopy() for nested lists."}]}]}, {"id": "py-dicts", "g": "Python", "i": "📖", "t": "Dictionaries & Sets", "d": "Define, modify, delete, comprehension, sets", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tree", "ti": "Anatomy of a dict", "c": ["📖 student = { … }", "  🔑 'name' :: key → value 'Asha'", "  🔑 'marks' :: key → value [80, 90]", "  🔑 'city' :: key → value 'Pune'", "    ⚠️ keys must be unique & hashable :: str, int, tuple"]}, {"k": "vis", "t": "tiles", "ti": "Set operations", "c": ["∪ a | b :: union: in either", "∩ a & b :: intersection: in both", "➖ a - b :: in a, not in b", "⊕ a ^ b :: in one only"]}, {"k": "mem", "c": ["`d[k]` crashes on a missing key (**KeyError**); `d.get(k, default)` never crashes.", "Loop with **`.items()`** to get key and value together.", "`{}` is an **empty dict**, not a set. Empty set = `set()`."]}], "w": 1}, {"h": "Define & access", "b": [{"k": "code", "l": "py", "c": "d = {'Arham': 'Blue', 'Lisa': 'Yellow'}\nd = dict(name='Asha', age=21)\nd['Lisa']               # KeyError if missing\nd.get('Tom', 'N/A')     # default instead of error\nlen(d)                  # number of keys"}]}, {"h": "Modify & delete", "b": [{"k": "tbl", "h": null, "r": [["d[k] = v", "add or update"], ["d.update({'a':1})", "merge another dict"], ["d.setdefault(k, [])", "get, inserting default if missing"], ["del d[k]", "delete key (KeyError if missing)"], ["d.pop(k, None)", "remove and return value"], ["d.popitem()", "remove last inserted pair"], ["d.clear()", "empty"], ["d1 | d2", "merged copy (3.9+)"]]}]}, {"h": "Iterate", "b": [{"k": "code", "l": "py", "c": "for k in d: ...\nfor k, v in d.items(): ...\nfor k in sorted(d): print(k, d[k])           # alphabetical\nsorted(d.items(), key=lambda kv: kv[1])      # by value"}]}, {"h": "Comprehension", "b": [{"k": "code", "l": "py", "c": "sq = {x: x*x for x in range(5)}\ninv = {v: k for k, v in d.items()}\nrot13 = {c: chr((ord(c)-97+13)%26+97) for c in 'abcdefghijklmnopqrstuvwxyz'}"}]}, {"h": "Counting patterns", "b": [{"k": "code", "l": "py", "c": "from collections import Counter, defaultdict\nCounter(\"banana\").most_common(2)   # [('a',3),('n',2)]\ngroups = defaultdict(list)\nfor name, dept in rows: groups[dept].append(name)"}]}, {"h": "Sets", "b": [{"k": "tbl", "h": null, "r": [["{1,2,3} / set()", "create (note {} is an empty dict)"], ["add / remove / discard", "discard does not raise if missing"], ["a | b, a & b, a - b, a ^ b", "union, intersection, difference, symmetric difference"], ["a <= b / a.isdisjoint(b)", "subset / no common items"]]}, {"k": "tip", "c": "Dict keys must be hashable (str, int, tuple). Lists can't be keys. Dicts keep insertion order (3.7+)."}]}]}, {"id": "py-tuples", "g": "Python", "i": "📦", "t": "Tuples", "d": "Immutable sequences, packing, zip", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "List vs tuple", "c": ["📋 List [ ] :: mutable · more methods · not a dict key", "📦 Tuple ( ) :: immutable · faster · can be a dict key", "🧷 (5,) :: one-item tuple needs the comma", "📤 a, b = t :: unpacking", "🤝 zip(a, b) :: pairs items into tuples", "🏷️ namedtuple :: tuple with field names"]}, {"k": "mem", "c": ["**Tuple = \"locked list\"**. Only 2 methods: `count()` and `index()`.", "`(5)` is just the int 5; `(5,)` is a tuple."]}], "w": 1}, {"h": "", "b": [{"k": "code", "l": "py", "c": "t = (1, 2, 3)\none = (5,)          # comma makes the tuple, not brackets\nt[0], t[-1], t[1:]\na, b, c = t         # unpack\nt.count(2), t.index(3)\nt + (4,)            # new tuple"}, {"k": "tbl", "h": null, "r": [["Immutable", "can't add/remove/change items; can be dict keys"], ["Faster & smaller", "than lists, good for fixed records"], ["A tuple can hold a list", "the list inside is still mutable"]]}]}, {"h": "Patterns from the lab", "b": [{"k": "code", "l": "py", "c": "from collections import Counter\ndups = [x for x, c in Counter(t).items() if c > 1]          # repeated items\ndata = [('item1','12.20'), ('item2','15.10'), ('item3','24.5')]\nsorted(data, key=lambda x: float(x[1]), reverse=True)       # sort by float\ntuple(map(sum, zip((1,2,3), (4,5,6))))                      # (5,7,9)\nnext(i for i, x in enumerate(lst) if isinstance(x, tuple))  # count until tuple"}]}, {"h": "Named tuples", "b": [{"k": "code", "l": "py", "c": "from collections import namedtuple\nPoint = namedtuple('Point', 'x y')\np = Point(3, 4); p.x, p._asdict()"}]}]}, {"id": "py-functions", "g": "Python", "i": "⚙️", "t": "Functions & Modules", "d": "Arguments, lambda, scope, built-ins, pickle", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "Order of parameters in def", "c": ["1️⃣ positional :: a, b", "2️⃣ default :: c=10", "⭐ *args :: extra positional → tuple", "🔐 keyword-only :: key=None", "⭐⭐ **kwargs :: extra named → dict"]}, {"k": "vis", "t": "nest", "ti": "Scope lookup: LEGB (inside → out)", "c": ["🏛️ Built-in :: len, print, range", "🌍 Global :: module-level names", "📦 Enclosing :: outer function", "📍 Local"]}, {"k": "mem", "c": ["**LEGB**: Python looks for a name in **L**ocal → **E**nclosing → **G**lobal → **B**uilt-in.", "`lambda x: x*2` = a one-line function with no name. **map** transforms, **filter** keeps, **reduce** combines.", "No `return` → the function returns **None**."]}], "w": 1}, {"h": "Define & call", "b": [{"k": "code", "l": "py", "c": "def area(l, w=1):            # w has a default\n    \"\"\"Return area.\"\"\"       # docstring\n    return l * w\n\narea(5), area(5, 2), area(w=2, l=5)   # positional / named"}]}, {"h": "Argument kinds", "b": [{"k": "code", "l": "py", "c": "def f(a, b=2, *args, key=None, **kwargs): ...\nf(1, 2, 3, 4, key='x', extra=9)\n# a=1 b=2 args=(3,4) key='x' kwargs={'extra':9}\ndef g(a, /, b, *, c): ...   # a positional-only, c keyword-only"}, {"k": "tip", "c": "Never use a mutable default (def f(x=[])). Use def f(x=None): x = x or []."}]}, {"h": "Lambda, map, filter, reduce", "b": [{"k": "code", "l": "py", "c": "sq = lambda x: x*x\nlist(map(lambda x: x*2, [1,2,3]))       # [2,4,6]\nlist(filter(lambda x: x > 1, [1,2,3]))  # [2,3]\nfrom functools import reduce\nreduce(lambda a, b: a*b, range(1, 6))   # 120\nsorted(words, key=lambda w: (len(w), w))"}]}, {"h": "Scope (LEGB)", "b": [{"k": "code", "l": "py", "c": "count = 0\ndef inc():\n    global count     # modify module-level name\n    count += 1\ndef outer():\n    x = 1\n    def inner():\n        nonlocal x   # modify enclosing function's name\n        x += 1"}]}, {"h": "Recursion", "b": [{"k": "code", "l": "py", "c": "def fact(n): return 1 if n <= 1 else n * fact(n-1)\ndef total(x): return 1 if x == 1 else x + total(x-1)"}]}, {"h": "Built-ins worth knowing", "b": [{"k": "tbl", "h": null, "r": [["type, id, dir, help, str, repr", "inspect objects"], ["len, sum, min, max, abs, round", "numbers & sizes"], ["sorted, reversed, enumerate, zip", "iteration helpers"], ["any, all", "True if any / all items truthy"], ["map, filter, range, isinstance", "functional / checks"]]}]}, {"h": "Modules", "b": [{"k": "code", "l": "py", "c": "import math                 # math.sqrt(16)\nfrom math import pi, sqrt\nimport numpy as np\nif __name__ == \"__main__\":  # runs only when executed directly\n    main()"}]}, {"h": "Pickling (save Python objects)", "b": [{"k": "code", "l": "py", "c": "import pickle\nwith open('data.pkl', 'wb') as f: pickle.dump(obj, f)\nwith open('data.pkl', 'rb') as f: obj = pickle.load(f)"}, {"k": "tip", "c": "Only unpickle files you trust: loading a pickle can run code."}]}]}, {"id": "py-oop", "g": "Python", "i": "🧱", "t": "OOP in Python", "d": "Class, object, inheritance, overriding, data hiding", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "The 4 pillars", "c": ["E — Encapsulation :: bundle data + methods, hide internals", "A — Abstraction :: show what, hide how", "I — Inheritance :: child reuses parent", "P — Polymorphism :: same name, different behaviour"]}, {"k": "vis", "t": "tree", "ti": "Inheritance tree (class Employee(Person))", "c": ["👤 Person :: name, info()", "  💼 Employee :: + salary, overrides info()", "    🧑‍💼 Manager :: + team", "  🎓 Student :: + marks, gpa()"]}, {"k": "mem", "c": ["Pillars = **\"A PIE\"**: **A**bstraction, **P**olymorphism, **I**nheritance, **E**ncapsulation.", "Class = **blueprint (cookie cutter)**, object = **the cookie**. `self` = \"this particular cookie\".", "`_x` = \"please don't touch\", `__x` = name-mangled. `super()` calls the parent."]}], "w": 1}, {"h": "Class vs object, pictured", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["📐 class Student :: blueprint", "🛠️ __init__ :: runs on creation", "🍪 s1 = Student(…) :: object 1", "🍪 s2 = Student(…) :: object 2, own data"]}]}, {"h": "Class & object", "b": [{"k": "code", "l": "py", "c": "class Student:\n    school = \"C-DAC\"                 # class attribute (shared)\n\n    def __init__(self, sid, name, marks):\n        self.sid = sid               # instance attributes\n        self.name = name\n        self.marks = marks\n\n    def gpa(self):                   # instance method\n        return round(sum(self.marks) / len(self.marks) / 10, 2)\n\n    def __str__(self):               # print(obj)\n        return f\"{self.sid} {self.name}\"\n\ns = Student(1, \"Asha\", [80, 90, 70])\nprint(s, s.gpa())"}]}, {"h": "The four pillars", "b": [{"k": "tbl", "h": null, "r": [["Encapsulation", "bundle data + methods; hide internals"], ["Abstraction", "expose what, hide how (abc.ABC, @abstractmethod)"], ["Inheritance", "child reuses parent: class Child(Parent)"], ["Polymorphism", "same method name, different behaviour"]]}]}, {"h": "Inheritance & overriding", "b": [{"k": "code", "l": "py", "c": "class Person:\n    def __init__(self, name): self.name = name\n    def info(self): return f\"Person {self.name}\"\n\nclass Employee(Person):\n    def __init__(self, name, salary):\n        super().__init__(name)       # call parent constructor\n        self.salary = salary\n    def info(self):                  # override\n        return super().info() + f\", salary {self.salary}\""}, {"k": "tbl", "h": null, "r": [["Single / Multiple / Multilevel / Hierarchical", "class C(A, B) is multiple; MRO decides lookup order (C.__mro__)"]]}]}, {"h": "Overloading", "b": [{"k": "tip", "c": "Python has no method overloading by signature: the last def wins. Use default args or *args. Operator overloading uses dunder methods."}, {"k": "code", "l": "py", "c": "class Vec:\n    def __init__(self, x, y): self.x, self.y = x, y\n    def __add__(self, o): return Vec(self.x+o.x, self.y+o.y)\n    def __eq__(self, o): return (self.x, self.y) == (o.x, o.y)\n    def __len__(self): return 2"}]}, {"h": "Data hiding", "b": [{"k": "code", "l": "py", "c": "class Account:\n    def __init__(self, bal):\n        self._bal = bal        # _single: \"internal\" by convention\n        self.__pin = 1234      # __double: name-mangled to _Account__pin\n\n    @property                  # getter\n    def balance(self): return self._bal\n    @balance.setter            # setter with validation\n    def balance(self, v):\n        if v < 0: raise ValueError(\"negative\")\n        self._bal = v"}]}, {"h": "Class & static methods", "b": [{"k": "code", "l": "py", "c": "class Date:\n    @classmethod\n    def from_str(cls, s): return cls(*map(int, s.split('-')))\n    @staticmethod\n    def is_leap(y): return y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)"}]}, {"h": "Abstract class", "b": [{"k": "code", "l": "py", "c": "from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self): ...\nclass Circle(Shape):\n    def __init__(self, r): self.r = r\n    def area(self): return 3.14159 * self.r ** 2"}]}, {"h": "Object references", "b": [{"k": "tip", "c": "Variables are names bound to objects. a = b binds both to one object; `is` tests identity, `==` tests value. Mutable objects passed to a function can be changed inside it."}]}]}, {"id": "py-advanced", "g": "Python", "i": "✨", "t": "Regex, Generators, Decorators", "d": "re module, yield, @decorator", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "nest", "ti": "Decorator = a function wrapped in a function", "c": ["🎁 @log_call :: wrapper(): print before / after", "⚙️ display() :: original function"]}, {"k": "vis", "t": "flow", "ti": "Generator: values on demand", "c": ["🏭 def gen(): yield :: define", "▶️ next(g) :: runs to first yield", "⏸️ paused :: keeps its state", "▶️ next(g) :: resumes, next value", "🛑 StopIteration :: no more values"]}, {"k": "mem", "c": ["**return** ends a function; **yield** pauses it. Generator = lazy list that remembers where it stopped.", "`@deco` above `def f` is just **f = deco(f)**.", "Regex trio: **\\d** digit, **\\w** word char, **\\s** space. Capitals mean NOT."]}], "w": 1}, {"h": "Regex quantifiers", "b": [{"k": "vis", "t": "tiles", "ti": "", "c": ["* — zero or more :: a* → '', a, aa", "+ — one or more :: a+ → a, aa", "? — zero or one :: colou?r → color, colour", "{} — exact range :: \\d{6} → 400614"]}]}, {"h": "Regular expressions", "b": [{"k": "code", "l": "py", "c": "import re\nre.search(r\"\\d+\", \"Order 42\")        # first match anywhere → m.group()\nre.match(r\"Ord\", \"Order 42\")         # only at the start\nre.fullmatch(r\"\\d{6}\", \"400614\")     # whole string\nre.findall(r\"\\w+@\\w+\\.\\w+\", text)    # all matches (list)\nre.sub(r\"\\s+\", \" \", text)            # replace\nre.split(r\"[,;]\\s*\", \"a, b;c\")       # ['a','b','c']\np = re.compile(r\"(?P<y>\\d{4})-(?P<m>\\d{2})\")\np.search(\"2026-11\").group(\"y\")       # '2026'"}, {"k": "tbl", "h": null, "r": [[". ^ $", "any char, start, end"], ["\\d \\w \\s (\\D \\W \\S)", "digit, word char, whitespace (and negations)"], ["* + ? {m,n}", "0+, 1+, 0/1, m to n"], ["*? +?", "lazy (shortest)"], ["[abc] [^abc] [a-z]", "character class"], ["( ) (?: ) |", "group, non-capturing group, OR"], ["\\b", "word boundary"], ["re.I / re.M / re.S", "ignore case / multiline / dot matches newline"]]}, {"k": "tip", "c": "Always use raw strings r\"...\" so backslashes reach the regex engine."}]}, {"h": "Generators", "b": [{"k": "code", "l": "py", "c": "def evens(limit):\n    for n in range(0, limit + 1, 2):\n        yield n                   # pauses here, resumes on next()\n\ng = evens(10)\nnext(g), next(g)                  # 0, 2\nlist(evens(10))                   # [0,2,4,6,8,10]\nsquares = (x*x for x in range(10**6))   # generator expression, lazy"}, {"k": "tip", "c": "Generators produce values one at a time, so memory stays small. They can be iterated only once."}]}, {"h": "Decorators", "b": [{"k": "code", "l": "py", "c": "import functools, time\ndef log_call(func):\n    @functools.wraps(func)            # keep name/docstring\n    def wrapper(*args, **kwargs):\n        print(f\"Calling {func.__name__}\")\n        result = func(*args, **kwargs)\n        print(f\"{func.__name__} done\")\n        return result\n    return wrapper\n\nclass Student:\n    @log_call\n    def display(self): ...\n\ndef timer(func):\n    def w(*a, **k):\n        t = time.perf_counter(); r = func(*a, **k)\n        print(f\"{time.perf_counter()-t:.4f}s\"); return r\n    return w"}, {"k": "tbl", "h": null, "r": [["@decorator above def", "same as f = decorator(f)"], ["Built-in decorators", "@property, @staticmethod, @classmethod, @functools.lru_cache"]]}]}]}, {"id": "py-exceptions", "g": "Python", "i": "🚨", "t": "Exceptions & Logging", "d": "try/except/else/finally, custom errors, logging", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "try / except / else / finally", "c": ["🧪 try :: risky code", "🚨 except :: only if an error happened", "✅ else :: only if NO error", "🧹 finally :: always runs"]}, {"k": "vis", "t": "ladder", "ti": "Logging levels (low → high)", "c": ["🐞 DEBUG :: details", "ℹ️ INFO :: normal events", "⚠️ WARNING :: something odd", "❌ ERROR :: a failure", "🔥 CRITICAL :: app down"]}, {"k": "mem", "c": ["**\"Try, Except, Else, Finally\" = \"Try Eating Every Fruit\"**: the order never changes.", "Level set to WARNING → DEBUG and INFO are **dropped**; WARNING and above are kept.", "Custom error = `class MyError(Exception)` then `raise MyError(\"msg\")`."]}], "w": 1}, {"h": "Structure", "b": [{"k": "code", "l": "py", "c": "try:\n    x = int(input())\n    r = 10 / x\nexcept ValueError:\n    print(\"not a number\")\nexcept ZeroDivisionError as e:\n    print(\"error:\", e)\nexcept (TypeError, KeyError):\n    print(\"type or key problem\")\nelse:\n    print(\"no error:\", r)        # runs only if try succeeded\nfinally:\n    print(\"always runs\")         # cleanup"}]}, {"h": "Common exceptions", "b": [{"k": "tbl", "h": null, "r": [["ValueError", "right type, bad value: int('abc')"], ["TypeError", "wrong type: '1' + 1"], ["ZeroDivisionError", "1 / 0"], ["IndexError / KeyError", "bad list index / missing dict key"], ["FileNotFoundError", "open() on a missing file"], ["AttributeError / NameError", "no such attribute / undefined name"], ["ImportError / ModuleNotFoundError", "import failed"]]}]}, {"h": "Raise & custom exceptions", "b": [{"k": "code", "l": "py", "c": "class InsufficientFunds(Exception):\n    def __init__(self, need):\n        super().__init__(f\"Need {need} more\")\n\ndef withdraw(bal, amt):\n    if amt > bal:\n        raise InsufficientFunds(amt - bal)\n    return bal - amt\n\nraise ValueError(\"bad\") from err   # chain exceptions"}]}, {"h": "Logging", "b": [{"k": "code", "l": "py", "c": "import logging\nlogging.basicConfig(\n    filename=\"app.log\", level=logging.DEBUG,\n    format=\"%(asctime)s %(levelname)s %(name)s: %(message)s\")\nlog = logging.getLogger(__name__)\n\nlog.debug(\"detail\");  log.info(\"started\")\nlog.warning(\"disk 90%\");  log.error(\"failed\")\ntry: 1/0\nexcept ZeroDivisionError: log.exception(\"calc failed\")  # adds traceback"}, {"k": "tbl", "h": null, "r": [["DEBUG < INFO < WARNING < ERROR < CRITICAL", "levels; messages below the set level are dropped"], ["Handlers", "FileHandler, StreamHandler, RotatingFileHandler"]]}]}]}, {"id": "py-files", "g": "Python", "i": "📁", "t": "Files, CSV & JSON", "d": "open modes, with, csv, json", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "File modes", "c": ["📖 r :: read, must exist", "✍️ w :: write, wipes file", "➕ a :: append at end", "🆕 x :: create, fail if exists", "💾 b :: binary (rb / wb)", "🔄 + :: read and write"]}, {"k": "vis", "t": "flow", "ti": "Lifecycle (with closes the file for you)", "c": ["📂 open() :: get a file object", "📝 read / write :: do the work", "🔒 close() :: automatic with `with`"]}, {"k": "mem", "c": ["**w = wipe, a = add**. Opening with \"w\" erases the old content.", "**json.load / dump** = files; **json.loads / dumps** = strings (s = string).", "Always `newline=\"\"` when writing CSV on Windows, or you get blank rows."]}], "w": 1}, {"h": "Open modes", "b": [{"k": "tbl", "h": null, "r": [["'r'", "read (default; error if missing)"], ["'w'", "write (creates / overwrites)"], ["'a'", "append"], ["'x'", "create, fail if exists"], ["'b' / 't'", "binary / text, e.g. 'rb'"], ["'+'", "read and write, e.g. 'r+'"]]}]}, {"h": "Text files", "b": [{"k": "code", "l": "py", "c": "with open(\"notes.txt\", \"w\", encoding=\"utf-8\") as f:   # auto-closes\n    f.write(\"line 1\\n\")\n    f.writelines([\"a\\n\", \"b\\n\"])\n\nwith open(\"notes.txt\") as f:\n    data = f.read()          # whole file\n    # f.readline()  one line   f.readlines()  list of lines\nwith open(\"notes.txt\") as f:\n    for line in f:           # memory-friendly\n        print(line.rstrip())"}]}, {"h": "CSV", "b": [{"k": "code", "l": "py", "c": "import csv\nwith open(\"emp.csv\", newline=\"\") as f:\n    for row in csv.DictReader(f):       # each row is a dict\n        print(row[\"name\"], row[\"salary\"])\n\nwith open(\"out.csv\", \"w\", newline=\"\") as f:\n    w = csv.writer(f)\n    w.writerow([\"name\", \"salary\"])\n    w.writerows([[\"Asha\", 50000], [\"Ravi\", 42000]])"}]}, {"h": "JSON", "b": [{"k": "code", "l": "py", "c": "import json\nobj = json.loads('{\"a\": 1, \"b\": [1, 2]}')   # str → dict\ntext = json.dumps(obj, indent=2)            # dict → str\nwith open(\"data.json\") as f: obj = json.load(f)\nwith open(\"data.json\", \"w\") as f: json.dump(obj, f, indent=2)"}, {"k": "tbl", "h": null, "r": [["JSON ↔ Python", "object↔dict, array↔list, string↔str, true/false↔True/False, null↔None"]]}]}, {"h": "Context managers", "b": [{"k": "code", "l": "py", "c": "from contextlib import contextmanager\n@contextmanager\ndef opened(path):\n    f = open(path)\n    try: yield f\n    finally: f.close()\n# class version: define __enter__ and __exit__"}]}, {"h": "Paths", "b": [{"k": "code", "l": "py", "c": "from pathlib import Path\np = Path(\"data\") / \"sales.csv\"\np.exists(), p.suffix, p.stem, p.read_text()\nlist(Path(\".\").glob(\"*.csv\"))"}]}]}, {"id": "numpy", "g": "Python", "i": "🔢", "t": "NumPy", "d": "ndarray, shapes, indexing, broadcasting, maths", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "matrix", "ti": "axis=0 goes DOWN (per column), axis=1 goes ACROSS (per row)", "c": ["1 2 3", "4 5 6"]}, {"k": "mem", "c": ["**axis=0 ↓ \"down the rows\"** → one result per column. **axis=1 → \"across the columns\"** → one result per row.", "shape is always **(rows, columns)**. `reshape(2, -1)`: -1 means \"work it out\".", "A slice is a **view** (shares memory). Use `.copy()` for an independent array."]}], "w": 1}, {"h": "Broadcasting, pictured", "b": [{"k": "vis", "t": "mtable", "ti": "m (2×3) + row (3,) → the row is copied down every row", "c": ["m | + | row | = | result", "[1 2 3] | + | [10 20 30] | = | [11 22 33]", "[4 5 6] | + | [10 20 30] | = | [14 25 36]"]}, {"k": "vis", "t": "tiles", "ti": "Create arrays", "c": ["0️⃣ zeros / ones :: filled arrays", "🔢 arange :: like range", "📏 linspace :: n evenly spaced", "🎲 random :: random values", "🪪 eye :: identity matrix"]}]}, {"h": "Create arrays", "b": [{"k": "code", "l": "py", "c": "import numpy as np\na = np.array([1, 2, 3])\nm = np.array([[1, 2], [3, 4]])\nnp.zeros((2, 3)), np.ones(3), np.full((2,2), 7), np.eye(3)\nnp.arange(0, 10, 2)        # [0 2 4 6 8]\nnp.linspace(0, 1, 5)       # 5 evenly spaced points\nnp.random.default_rng(42).integers(1, 100, size=(3, 3))"}]}, {"h": "Inspect", "b": [{"k": "tbl", "h": null, "r": [["a.shape / a.ndim / a.size", "dimensions tuple / number of axes / total items"], ["a.dtype / a.astype(float)", "element type / convert"], ["a.reshape(2, -1)", "new shape (-1 = work it out)"], ["a.ravel() / a.flatten()", "to 1-D (view / copy)"], ["a.T", "transpose"]]}]}, {"h": "Indexing & slicing", "b": [{"k": "code", "l": "py", "c": "m[0, 1]          # row 0, col 1\nm[:, 0]          # first column\nm[1:, :]         # rows from 1\na[a > 2]         # boolean mask\na[[0, 2]]        # fancy indexing\nnp.where(a > 2, \"hi\", \"lo\")"}, {"k": "tip", "c": "Slices are views: changing them changes the original. Use .copy() to detach."}]}, {"h": "Maths & aggregation", "b": [{"k": "tbl", "h": null, "r": [["a + 1, a * b, a ** 2", "element-wise (vectorised, no loops)"], ["a @ b / np.dot(a, b)", "matrix multiplication"], ["sum, mean, median, std, var, min, max", "np.mean(m, axis=0) = per column; axis=1 = per row"], ["argmax / argmin / cumsum", "index of max / min, running total"], ["np.sqrt, np.exp, np.log, np.round", "universal functions (ufuncs)"], ["np.unique(a, return_counts=True)", "distinct values + counts"], ["np.sort, np.argsort", "sorted values / sorting indices"]]}]}, {"h": "Broadcasting", "b": [{"k": "code", "l": "py", "c": "m = np.array([[1, 2, 3], [4, 5, 6]])   # (2,3)\nm + np.array([10, 20, 30])             # (3,) stretched over rows\nm - m.mean(axis=0)                      # centre each column"}, {"k": "tip", "c": "Shapes are compared from the right: sizes must be equal or 1."}]}, {"h": "Combine & split", "b": [{"k": "code", "l": "py", "c": "np.concatenate([a, b]); np.vstack([a, b]); np.hstack([a, b])\nnp.split(a, 3)"}]}, {"h": "Lab patterns", "b": [{"k": "code", "l": "py", "c": "data = np.genfromtxt(\"data.csv\", delimiter=\",\", skip_header=1)  # CSV → array\narr = df.to_numpy()                                             # DataFrame → array\nfrom PIL import Image\nimg = np.array(Image.open(\"pic.png\"))      # image → array (H, W, channels)\nImage.fromarray(img.astype(\"uint8\")).show()"}]}, {"h": "NaN handling", "b": [{"k": "code", "l": "py", "c": "np.isnan(a).sum(); np.nanmean(a); np.nan_to_num(a, nan=0)"}]}]}, {"id": "pandas", "g": "Python", "i": "🐼", "t": "Pandas", "d": "Series, DataFrame, select, filter, group, merge", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "mtable", "ti": "DataFrame anatomy: index + columns + values. One column = a Series", "c": ["index | name | dept | marks", "0 | Asha | IT | 88", "1 | Ravi | HR | 72", "2 | Neha | IT | 95"]}, {"k": "vis", "t": "flow", "ti": "Split → apply → combine (groupby)", "c": ["✂️ split :: rows into groups by dept", "🧮 apply :: mean / sum / count per group", "🧩 combine :: one row per group"]}, {"k": "mem", "c": ["**loc = label, iloc = integer position**. `df.loc[rows, cols]`.", "`df['a']` → Series (1 column), `df[['a']]` → DataFrame (double brackets).", "`axis=0` = rows (down), `axis=1` = columns (across), same as NumPy."]}], "w": 1}, {"h": "merge, pictured", "b": [{"k": "vis", "t": "joins", "ti": "", "c": []}]}, {"h": "Create & load", "b": [{"k": "code", "l": "py", "c": "import pandas as pd\ns = pd.Series([10, 20], index=['a', 'b'])\ndf = pd.DataFrame({'name': ['Asha', 'Ravi'], 'marks': [88, 72]})\ndf = pd.read_csv(\"diamonds.csv\")      # read_excel, read_json, read_sql, read_html\ndf.to_csv(\"out.csv\", index=False)"}]}, {"h": "Explore", "b": [{"k": "tbl", "h": null, "r": [["df.head(), df.tail(), df.sample(5)", "first / last / random rows"], ["df.shape, df.columns, df.dtypes", "size, column names, types"], ["df.info(), df.describe()", "non-null counts & types / summary stats"], ["df['col'].value_counts()", "frequency of each value"], ["df['col'].unique(), nunique()", "distinct values / count"]]}]}, {"h": "Select", "b": [{"k": "code", "l": "py", "c": "df['marks']                 # Series\ndf[['name', 'marks']]       # DataFrame\ndf.loc[0, 'name']           # by label\ndf.loc[df.marks > 80, ['name']]\ndf.iloc[0:5, 0:2]           # by position\ndf.query(\"marks > 80 and city == 'Pune'\")\ndf[df['city'].isin(['Pune', 'Mumbai'])]\ndf[df['name'].str.contains('a', case=False)]"}]}, {"h": "Add / change / remove", "b": [{"k": "code", "l": "py", "c": "df['grade'] = np.where(df.marks >= 75, 'A', 'B')\ndf['total'] = df['m1'] + df['m2']\ndf = df.assign(pct=lambda d: d.total / 2)\ndf.rename(columns={'m1': 'maths'}, inplace=True)\ndf.drop(columns=['tmp']); df.drop(index=[0, 1])\ndf['marks'] = df['marks'].astype(int)\ndf['col'].apply(lambda x: x * 2); df['city'].map({'PUN': 'Pune'})"}]}, {"h": "Sort", "b": [{"k": "code", "l": "py", "c": "df.sort_values('marks', ascending=False)\ndf.sort_values(['dept', 'salary'], ascending=[True, False])\ndf.nlargest(3, 'marks')"}]}, {"h": "Group & aggregate", "b": [{"k": "code", "l": "py", "c": "df.groupby('dept')['salary'].mean()\ndf.groupby('dept').agg(avg=('salary', 'mean'), n=('id', 'count'))\ndf.pivot_table(index='dept', columns='year', values='sales', aggfunc='sum')\npd.crosstab(df.gender, df.dept)"}]}, {"h": "Combine", "b": [{"k": "code", "l": "py", "c": "pd.merge(emp, dept, on='dept_id', how='left')   # inner/left/right/outer\npd.concat([df1, df2], ignore_index=True)        # stack rows\npd.concat([df1, df2], axis=1)                   # side by side"}]}, {"h": "Reshape", "b": [{"k": "code", "l": "py", "c": "df.melt(id_vars='id', var_name='subject', value_name='marks')  # wide → long\nlong.pivot(index='id', columns='subject', values='marks')      # long → wide"}]}, {"h": "Dates", "b": [{"k": "code", "l": "py", "c": "df['date'] = pd.to_datetime(df['date'])\ndf['date'].dt.year, df['date'].dt.month_name()\ndf.set_index('date').resample('ME')['sales'].sum()   # 'ME' = month end ('M' in pandas < 2.2)"}, {"k": "tip", "c": "Chained indexing df[df.x > 1]['y'] = 0 may not write back. Use df.loc[df.x > 1, 'y'] = 0."}]}]}, {"id": "data-cleaning", "g": "Python", "i": "🧹", "t": "Data Cleaning & Wrangling", "d": "Missing values, duplicates, types, outliers", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "Cleaning order", "c": ["🔍 Inspect :: info, isna, describe", "🔤 Fix types :: to_numeric, to_datetime", "👯 Duplicates :: drop_duplicates", "🕳️ Missing :: drop or fill", "📈 Outliers :: IQR / clip", "🧪 Derive :: cut, dummies, scale"]}, {"k": "vis", "t": "tiles", "ti": "Fill missing values with…", "c": ["0️⃣ constant :: fillna(0)", "📊 mean :: normal data", "📍 median :: skewed data / outliers", "🏆 mode :: categories", "⏩ ffill / bfill :: time series", "📈 interpolate :: smooth numeric gaps"]}, {"k": "mem", "c": ["IQR rule: outside **Q1 − 1.5·IQR** to **Q3 + 1.5·IQR** is an outlier.", "Median for skewed numbers, mode for categories."]}], "w": 1}, {"h": "Find problems", "b": [{"k": "code", "l": "py", "c": "df.isna().sum()                 # missing per column\ndf.duplicated().sum()           # duplicate rows\ndf.dtypes                       # wrong types?\ndf.describe()                   # odd min/max?\ndf['city'].value_counts()       # spelling variants"}]}, {"h": "Missing values", "b": [{"k": "tbl", "h": null, "r": [["df.dropna()", "drop rows with any NaN"], ["df.dropna(subset=['email'], thresh=…)", "only check some columns / keep rows with ≥ thresh values"], ["df.fillna(0)", "constant"], ["df['age'].fillna(df['age'].median())", "median (robust to outliers)"], ["df['city'].fillna(df['city'].mode()[0])", "most frequent"], ["df.ffill() / df.bfill()", "carry previous / next value"], ["df['v'].interpolate()", "fill numeric gaps"]]}]}, {"h": "Duplicates & text", "b": [{"k": "code", "l": "py", "c": "df.drop_duplicates(subset=['email'], keep='first')\ndf['name'] = df['name'].str.strip().str.title()\ndf['phone'] = df['phone'].str.replace(r'\\D', '', regex=True)\ndf['city'] = df['city'].replace({'Bombay': 'Mumbai'})"}]}, {"h": "Types", "b": [{"k": "code", "l": "py", "c": "df['price'] = pd.to_numeric(df['price'], errors='coerce')  # bad → NaN\ndf['date'] = pd.to_datetime(df['date'], errors='coerce', dayfirst=True)\ndf['grade'] = df['grade'].astype('category')"}]}, {"h": "Outliers (IQR rule)", "b": [{"k": "code", "l": "py", "c": "q1, q3 = df['sal'].quantile([.25, .75])\niqr = q3 - q1\nok = df['sal'].between(q1 - 1.5*iqr, q3 + 1.5*iqr)\ndf = df[ok]                     # or clip: df['sal'].clip(lower, upper)"}]}, {"h": "Transform", "b": [{"k": "code", "l": "py", "c": "df['age_band'] = pd.cut(df.age, bins=[0, 25, 40, 60, 100], labels=['<25','25-40','40-60','60+'])\ndf['q'] = pd.qcut(df.sal, 4, labels=False)        # quartiles\npd.get_dummies(df, columns=['city'], drop_first=True)   # one-hot\n(df.x - df.x.min()) / (df.x.max() - df.x.min())   # min-max scale\n(df.x - df.x.mean()) / df.x.std()                 # z-score"}, {"k": "tip", "c": "Clean in a fixed order: inspect → fix types → duplicates → missing → outliers → derive. Record every step so it can be repeated."}]}]}, {"id": "web-scraping", "g": "Python", "i": "🕸️", "t": "Web Scraping (BeautifulSoup)", "d": "requests, parse HTML, find, select, tables", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "Scraping pipeline", "c": ["🌐 GET page :: requests.get(url)", "🍲 Make soup :: BeautifulSoup(html)", "🔎 Find tags :: select / find_all", "🧾 Extract :: get_text, ['href']", "🐼 Save :: DataFrame → CSV"]}, {"k": "vis", "t": "tree", "ti": "HTML is a tree: navigate it", "c": ["🌳 html", "  🧠 head", "    🏷️ title", "  📄 body", "    📦 div.product", "      🔤 h2 :: name", "      💰 span.price :: price", "      🔗 a href :: link"]}, {"k": "mem", "c": ["**find = first, find_all = all**. **select = CSS selector** (`div.card > h2`).", "`.text` for words, `['href']` for attributes.", "Be polite: check **robots.txt**, add a delay, prefer an API."]}], "w": 1}, {"h": "Fetch & parse", "b": [{"k": "code", "l": "py", "c": "import requests\nfrom bs4 import BeautifulSoup\nr = requests.get(url, headers={\"User-Agent\": \"Mozilla/5.0\"}, timeout=10)\nr.raise_for_status()                      # error on 4xx / 5xx\nsoup = BeautifulSoup(r.text, \"html.parser\")   # or \"lxml\""}]}, {"h": "Find elements", "b": [{"k": "tbl", "h": null, "r": [["soup.title.string", "page title"], ["soup.find('div', class_='price')", "first match"], ["soup.find_all('a', href=True)", "all matches (list)"], ["soup.find(id='main')", "by id"], ["soup.select('div.card > h2')", "CSS selector, all"], ["soup.select_one('#price')", "CSS selector, first"], ["tag.get_text(strip=True)", "visible text"], ["tag['href'] / tag.get('href')", "attribute (get → None if missing)"], ["tag.parent / find_next_sibling()", "navigate the tree"]]}]}, {"h": "Typical loop", "b": [{"k": "code", "l": "py", "c": "rows = []\nfor card in soup.select(\"div.product\"):\n    rows.append({\n        \"name\":  card.select_one(\"h2\").get_text(strip=True),\n        \"price\": card.select_one(\".price\").get_text(strip=True),\n        \"link\":  card.select_one(\"a\")[\"href\"],\n    })\ndf = pd.DataFrame(rows)"}]}, {"h": "Tables & pagination", "b": [{"k": "code", "l": "py", "c": "from io import StringIO\ntables = pd.read_html(StringIO(r.text))  # every <table> → DataFrame list\nfrom urllib.parse import urljoin\nnext_a = soup.select_one(\"a.next\")\nnext_url = urljoin(url, next_a[\"href\"]) if next_a else None\nimport time; time.sleep(1)               # be polite between requests"}, {"k": "tip", "c": "Check robots.txt and the site's terms. Use an official API when one exists. Pages built by JavaScript need Selenium or Playwright, since requests only sees the raw HTML."}]}]}, {"id": "py-viz", "g": "Python", "i": "📊", "t": "Matplotlib, Seaborn, Plotly", "d": "Common charts and when to use them", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "Pick the chart by the question", "c": ["📈 Trend over time :: line", "📊 Compare groups :: bar", "🔔 Distribution :: histogram / KDE", "🔗 Relationship :: scatter", "📦 Spread & outliers :: box plot", "🌡️ Correlation matrix :: heatmap", "🥧 Parts of a whole :: pie (few slices)"]}, {"k": "vis", "t": "nest", "ti": "Matplotlib's two objects", "c": ["🖼️ Figure :: the whole canvas, plt.subplots()", "📐 Axes :: one chart: ax.plot, ax.set_title"]}, {"k": "mem", "c": ["**Matplotlib = control, Seaborn = statistics in one line, Plotly = interactive (hover, zoom).**", "`fig, ax = plt.subplots()` then always draw on **ax**."]}], "w": 1}, {"h": "Matplotlib", "b": [{"k": "code", "l": "py", "c": "import matplotlib.pyplot as plt\nfig, ax = plt.subplots(figsize=(8, 4))\nax.plot(x, y, marker='o', label='sales')\nax.set(title='Monthly sales', xlabel='Month', ylabel='₹ lakh')\nax.legend(); ax.grid(alpha=.3)\nplt.tight_layout(); plt.savefig('sales.png', dpi=150); plt.show()\n\nfig, axes = plt.subplots(1, 2)   # grid of charts: axes[0], axes[1]"}, {"k": "tbl", "h": null, "r": [["ax.plot", "line: trend over time"], ["ax.bar / ax.barh", "compare categories"], ["ax.hist(x, bins=20)", "distribution"], ["ax.scatter(x, y)", "relationship"], ["ax.boxplot(data)", "spread & outliers"], ["ax.pie(v, labels=l, autopct='%1.0f%%')", "parts of a whole (few slices)"]]}]}, {"h": "Seaborn", "b": [{"k": "code", "l": "py", "c": "import seaborn as sns\nsns.histplot(df, x='price', kde=True)\nsns.boxplot(df, x='cut', y='price')\nsns.scatterplot(df, x='carat', y='price', hue='cut')\nsns.countplot(df, x='color')\nsns.heatmap(df.corr(numeric_only=True), annot=True, cmap='coolwarm')\nsns.pairplot(df[['carat', 'price', 'depth']])\nsns.lineplot(df, x='month', y='sales', hue='region')"}]}, {"h": "Most correlated pair → scatter (lab)", "b": [{"k": "code", "l": "py", "c": "c = df.corr(numeric_only=True).abs()\nc = c.mask(np.eye(len(c), dtype=bool))      # hide self-correlation\na, b = c.stack().idxmax()\nsns.scatterplot(df, x=a, y=b)"}]}, {"h": "Plotly (interactive)", "b": [{"k": "code", "l": "py", "c": "import plotly.express as px\nfig = px.scatter(df, x='carat', y='price', color='cut', hover_data=['clarity'])\nfig = px.bar(df, x='dept', y='sales'); fig = px.line(df, x='date', y='close')\nfig.show(); fig.write_html('chart.html')"}]}, {"h": "ggplot style in Python (plotnine)", "b": [{"k": "code", "l": "py", "c": "from plotnine import ggplot, aes, geom_point\nggplot(df, aes('carat', 'price', color='cut')) + geom_point()"}]}]}, {"id": "py-db", "g": "Python", "i": "🔌", "t": "Python + Databases", "d": "venv, MySQL, SQLite, SQLAlchemy, PyMongo", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "DB-API steps (same for every SQL database)", "c": ["🔌 connect() :: host, user, db", "🖱️ cursor() :: run SQL through it", "▶️ execute(sql, params) :: %s / ? placeholders", "📥 fetch… :: fetchone / fetchall", "💾 commit() :: save changes", "🔒 close() :: release"]}, {"k": "vis", "t": "flow", "ti": "Virtual environment", "c": ["🧪 python -m venv venv :: create", "⚡ activate :: use it", "📦 pip install … :: libraries go here only", "📝 pip freeze > requirements.txt :: share"]}, {"k": "mem", "c": ["**C-C-E-F-C-C**: Connect, Cursor, Execute, Fetch, Commit, Close.", "Never build SQL with f-strings → **SQL injection**. Use `%s` / `?` parameters."]}], "w": 1}, {"h": "Virtual environment", "b": [{"k": "code", "l": "bash", "c": "python -m venv venv\nvenv\\Scripts\\activate          # Windows\nsource venv/bin/activate       # Linux / macOS\npip install pandas mysql-connector-python pymongo\npip freeze > requirements.txt\npip install -r requirements.txt\ndeactivate"}]}, {"h": "MySQL (DB-API)", "b": [{"k": "code", "l": "py", "c": "import mysql.connector\nconn = mysql.connector.connect(host=\"localhost\", user=\"root\",\n                               password=\"***\", database=\"company\")\ncur = conn.cursor()\ncur.execute(\"SELECT name, salary FROM emp WHERE dept = %s\", (\"IT\",))\nfor name, sal in cur.fetchall(): print(name, sal)\ncur.execute(\"INSERT INTO emp(name, salary) VALUES (%s, %s)\", (\"Asha\", 50000))\nconn.commit()                 # save changes (rollback() to undo)\ncur.close(); conn.close()"}, {"k": "tbl", "h": null, "r": [["fetchone() / fetchmany(n) / fetchall()", "one row / n rows / all rows"], ["cur.rowcount, cur.lastrowid", "rows affected / new id"], ["executemany(sql, list_of_tuples)", "bulk insert"]]}, {"k": "tip", "c": "Always pass values as parameters (%s or ?), never with f-strings: that prevents SQL injection."}]}, {"h": "SQLite (built in)", "b": [{"k": "code", "l": "py", "c": "import sqlite3\nwith sqlite3.connect(\"app.db\") as conn:     # commits on success\n    conn.execute(\"CREATE TABLE IF NOT EXISTS t(id INTEGER PRIMARY KEY, n TEXT)\")\n    conn.execute(\"INSERT INTO t(n) VALUES (?)\", (\"x\",))\n    rows = conn.execute(\"SELECT * FROM t\").fetchall()"}]}, {"h": "Pandas + SQLAlchemy", "b": [{"k": "code", "l": "py", "c": "from sqlalchemy import create_engine\neng = create_engine(\"mysql+mysqlconnector://root:***@localhost/company\")\ndf = pd.read_sql(\"SELECT * FROM emp\", eng)\ndf.to_sql(\"emp_copy\", eng, if_exists=\"replace\", index=False)"}]}, {"h": "MongoDB (PyMongo)", "b": [{"k": "code", "l": "py", "c": "from pymongo import MongoClient\ndb = MongoClient(\"mongodb://localhost:27017\")[\"shop\"]\ndb.products.insert_one({\"name\": \"pen\", \"price\": 10})\nfor p in db.products.find({\"price\": {\"$gt\": 5}}, {\"_id\": 0}).sort(\"price\", -1):\n    print(p)\ndb.products.update_one({\"name\": \"pen\"}, {\"$set\": {\"price\": 12}})"}]}]}, {"id": "fastapi", "g": "Python", "i": "⚡", "t": "FastAPI", "d": "Routes, path/query params, models, Swagger", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "Request → response", "c": ["📮 Client :: browser / Postman", "🛣️ Route :: @app.get(\"/students/{id}\")", "✅ Validate :: Pydantic model", "⚙️ Your function :: logic", "📦 JSON response :: + status code"]}, {"k": "vis", "t": "tiles", "ti": "HTTP verbs = CRUD", "c": ["➕ POST :: Create", "👀 GET :: Read", "✏️ PUT / PATCH :: Update (all / part)", "🗑️ DELETE :: Delete"]}, {"k": "mem", "c": ["**Path param** = part of the URL `/students/5`. **Query param** = after `?` `/students?city=Pune`.", "Free docs at **/docs** (Swagger UI). Run with `uvicorn main:app --reload`.", "Codes: **2xx ok, 4xx your mistake, 5xx server's mistake**. 422 = body failed validation."]}], "w": 1}, {"h": "Minimal app", "b": [{"k": "code", "l": "py", "c": "# main.py\nfrom fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel\n\napp = FastAPI(title=\"Student API\")\n\nclass Student(BaseModel):          # request / response model\n    id: int\n    name: str\n    marks: float = 0\n\ndb: dict[int, Student] = {}\n\n@app.get(\"/\")\ndef home(): return {\"msg\": \"ok\"}\n\n@app.get(\"/students/{sid}\", response_model=Student)    # path parameter\ndef get_student(sid: int):\n    if sid not in db: raise HTTPException(404, \"Not found\")\n    return db[sid]\n\n@app.get(\"/students\")                                   # query params\ndef list_students(min_marks: float = 0, limit: int = 10):\n    return [s for s in db.values() if s.marks >= min_marks][:limit]\n\n@app.post(\"/students\", status_code=201)\ndef add(s: Student): db[s.id] = s; return s\n\n@app.put(\"/students/{sid}\")\ndef update(sid: int, s: Student): db[sid] = s; return s\n\n@app.delete(\"/students/{sid}\")\ndef delete(sid: int): db.pop(sid, None); return {\"deleted\": sid}"}]}, {"h": "Run & test", "b": [{"k": "code", "l": "bash", "c": "pip install fastapi uvicorn\nuvicorn main:app --reload        # http://127.0.0.1:8000\n# Swagger UI: /docs    ReDoc: /redoc    schema: /openapi.json"}, {"k": "tbl", "h": null, "r": [["Path param", "/students/5 → part of the URL, required"], ["Query param", "/students?min_marks=60 → after ?, optional with default"], ["Body", "JSON validated by a Pydantic model"], ["HTTP verbs", "GET read, POST create, PUT replace, PATCH partial, DELETE remove"], ["Status codes", "200 OK, 201 Created, 400 Bad request, 404 Not found, 422 Validation error, 500 Server error"]]}, {"k": "tip", "c": "In Postman: set method + URL, Body → raw → JSON for POST/PUT. FastAPI returns 422 automatically when the body doesn't match the model."}]}]}, {"id": "r-basics", "g": "R", "i": "📐", "t": "R Basics", "d": "Setup, help, operators, RStudio", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "layers", "ti": "RStudio's 4 panes", "c": ["📝 Source :: write scripts (Ctrl+Enter runs a line)", "💬 Console :: commands run here", "🧳 Environment / History :: your variables", "📊 Files / Plots / Packages / Help :: everything else"]}, {"k": "mem", "c": ["Assign with **`<-`** (Alt + −). Indexing starts at **1**, not 0.", "`%/%` integer division, `%%` remainder, `%in%` membership.", "**Help yourself:** `?mean` for one function, `??topic` to search everything."]}], "w": 1}, {"h": "Getting started", "b": [{"k": "tbl", "h": null, "r": [["R / RStudio", "R is the language; RStudio is the editor (Source, Console, Environment, Plots/Help panes)"], ["Ctrl+Enter", "run current line / selection in RStudio"], ["?mean / help(mean)", "help page"], ["??regression", "search all help"], ["example(mean)", "run the examples"], ["getwd() / setwd(\"D:/r\")", "working directory"], ["ls() / rm(x) / rm(list = ls())", "list / remove objects"]]}]}, {"h": "Assignment & arithmetic", "b": [{"k": "code", "l": "r", "c": "x <- 10          # preferred assignment (= also works)\ny <- 3\nx + y; x - y; x * y; x / y   # 13 7 30 3.333\nx %/% y          # 3   integer division\nx %% y           # 1   remainder\nx ^ 2            # 100\nsqrt(16); abs(-5); exp(1); log(100, base = 10); round(3.456, 2)"}, {"k": "tbl", "h": null, "r": [["== != < > <= >=", "comparison"], ["& | !", "element-wise AND, OR, NOT"], ["&& ||", "single-value AND / OR (in if)"], ["%in%", "membership: 3 %in% c(1,3) → TRUE"]]}]}, {"h": "Control flow", "b": [{"k": "code", "l": "r", "c": "if (x > 5) {\n  print(\"big\")\n} else if (x > 0) {\n  print(\"small\")\n} else print(\"non-positive\")\n\nifelse(v > 0, \"pos\", \"neg\")     # vectorised if\n\nfor (i in 1:5) print(i)\nwhile (n > 0) n <- n - 1\nrepeat { if (done) break }      # next = skip"}]}, {"h": "Output & strings", "b": [{"k": "code", "l": "r", "c": "print(x); cat(\"Total:\", x, \"\\n\")\npaste(\"a\", \"b\"); paste0(\"id_\", 1:3)     # \"a b\", \"id_1\" ...\nsprintf(\"%.2f\", pi)                     # \"3.14\"\nnchar(\"data\"); toupper(\"r\"); substr(\"bigdata\", 1, 3)\ngsub(\"a\", \"A\", \"banana\"); strsplit(\"a,b\", \",\")"}, {"k": "tip", "c": "R indexes from 1, not 0. Comments start with #."}]}]}, {"id": "r-data", "g": "R", "i": "🧮", "t": "R Data Structures", "d": "Vectors, lists, matrices, arrays, factors, data frames", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "R data structures", "c": ["➖ Vector :: 1-D, one type, c()", "🧺 List :: 1-D, mixed types, list()", "🔲 Matrix :: 2-D, one type, matrix()", "🧊 Array :: n-D, one type, array()", "🏷️ Factor :: categories with levels", "📋 Data frame :: 2-D table, columns of any type"]}, {"k": "vis", "t": "mtable", "ti": "By dimension and type", "c": [" | same type | mixed types", "1-D | vector | list", "2-D | matrix | data frame", "n-D | array | –"]}, {"k": "mem", "c": ["**Same type?** vector / matrix / array. **Mixed?** list / data frame.", "`[ ]` keeps the container, `[[ ]]` / `$` takes the item out.", "`df[rows, cols]`: leave a side blank for \"all\". `df[df$marks > 80, ]`."]}], "w": 1}, {"h": "Atomic types", "b": [{"k": "tbl", "h": null, "r": [["numeric / integer", "3.5 / 3L"], ["character / logical", "\"a\" / TRUE, FALSE, NA"], ["class(x) / typeof(x) / str(x)", "inspect"], ["as.numeric(), as.character(), as.integer()", "convert"]]}]}, {"h": "Vector (one type)", "b": [{"k": "code", "l": "r", "c": "v <- c(4, 9, 7)\nv[1]; v[-1]; v[v > 5]; v[c(1, 3)]\nlength(v); sum(v); mean(v); prod(v); rev(v); sort(v)\n1:10; seq(0, 1, by = 0.25); rep(\"x\", 3)\nv * 2            # vectorised: no loop needed"}]}, {"h": "List (mixed types)", "b": [{"k": "code", "l": "r", "c": "l <- list(name = \"Asha\", marks = c(80, 90), pass = TRUE)\nl$name; l[[\"marks\"]]; l[\"name\"]   # [ ] returns a list, [[ ]] the item\ndfs <- list(d1 = head(airquality), d2 = head(mtcars))   # list of data frames"}]}, {"h": "Matrix & array", "b": [{"k": "code", "l": "r", "c": "m <- matrix(1:6, nrow = 2, byrow = TRUE)\ndim(m); t(m); m %*% t(m); m[2, 3]; m[, 1]\nrbind(m, 7:9); cbind(m, c(0, 0))\na <- array(1:24, dim = c(2, 3, 4))\napply(m, 1, sum)     # 1 = rows, 2 = columns"}]}, {"h": "Factor (categories)", "b": [{"k": "code", "l": "r", "c": "g <- factor(c(\"low\", \"high\", \"low\"), levels = c(\"low\", \"high\"))\nlevels(g); table(g); as.integer(g)"}]}, {"h": "Data frame", "b": [{"k": "code", "l": "r", "c": "df <- data.frame(name = c(\"A\", \"B\"), marks = c(88, 72))\nnrow(df); ncol(df); names(df); head(df); summary(df); str(df)\ndf$marks; df[df$marks > 80, ]; df[, c(\"name\")]\ndf$grade <- ifelse(df$marks >= 75, \"A\", \"B\")\ndf[order(-df$marks), ]          # sort descending\nsubset(df, marks > 80, select = name)\naggregate(marks ~ grade, data = df, FUN = mean)\nmerge(df1, df2, by = \"id\", all.x = TRUE)   # left join"}]}, {"h": "Missing values", "b": [{"k": "code", "l": "r", "c": "is.na(x); sum(is.na(df)); na.omit(df); mean(x, na.rm = TRUE)"}]}]}, {"id": "r-io", "g": "R", "i": "📥", "t": "R Packages & Import/Export", "d": "install, library, CSV, Excel, databases", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "Package workflow", "c": ["📦 install.packages(\"x\") :: once per computer", "📚 library(x) :: every session", "🛠️ use functions :: x::fn() also works"]}, {"k": "vis", "t": "tiles", "ti": "Read & write", "c": ["📄 CSV :: read.csv / write.csv", "📗 Excel :: readxl::read_excel / writexl::write_xlsx", "🗄️ Database :: DBI dbConnect / dbGetQuery", "💾 R objects :: saveRDS / readRDS"]}, {"k": "mem", "c": ["**install once, library every time**."]}], "w": 1}, {"h": "Packages", "b": [{"k": "code", "l": "r", "c": "install.packages(\"dplyr\")        # once\nlibrary(dplyr)                   # every session\ninstalled.packages()[, \"Package\"]\ndata()                           # built-in datasets\ndata(airquality); head(airquality)"}]}, {"h": "Workspace", "b": [{"k": "tbl", "h": null, "r": [["save(x, y, file = \"w.RData\") / load(\"w.RData\")", "save / restore objects"], ["saveRDS(df, \"df.rds\") / readRDS(\"df.rds\")", "one object"], ["save.image()", "whole workspace"]]}]}, {"h": "Read", "b": [{"k": "code", "l": "r", "c": "df <- read.csv(\"emp.csv\", stringsAsFactors = FALSE)\ndf <- read.table(\"data.txt\", header = TRUE, sep = \"\\t\")\nlibrary(readxl);  x <- read_excel(\"sales.xlsx\", sheet = 1)\nlibrary(readr);   df <- read_csv(\"emp.csv\")     # faster, tibble"}]}, {"h": "Write", "b": [{"k": "code", "l": "r", "c": "write.csv(df, \"out.csv\", row.names = FALSE)\nlibrary(writexl); write_xlsx(df, \"out.xlsx\")"}]}, {"h": "Databases", "b": [{"k": "code", "l": "r", "c": "library(DBI)\ncon <- dbConnect(RMySQL::MySQL(), dbname = \"company\",\n                 host = \"localhost\", user = \"root\", password = \"***\")\n# SQLite: dbConnect(RSQLite::SQLite(), \"app.db\")\ndbListTables(con)\nemp <- dbGetQuery(con, \"SELECT * FROM emp WHERE salary > 40000\")\ndbWriteTable(con, \"emp_copy\", emp, overwrite = TRUE)\ndbDisconnect(con)"}]}]}, {"id": "tidyverse", "g": "R", "i": "🪄", "t": "Tidyverse (dplyr, tidyr, ggplot2)", "d": "Pipe, verbs, joins, reshape, plots", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "One pipeline, read it as \"then\"", "c": ["📋 df |> :: start", "🔍 filter() :: keep rows", "🎯 select() :: keep columns", "➕ mutate() :: new columns", "👥 group_by() :: groups", "🧮 summarise() :: one row per group", "↕️ arrange() :: sort"]}, {"k": "vis", "t": "tiles", "ti": "Verb ↔ SQL", "c": ["🔍 filter :: WHERE", "🎯 select :: SELECT cols", "➕ mutate :: computed column", "👥 group_by + summarise :: GROUP BY", "↕️ arrange :: ORDER BY", "🔗 left_join :: LEFT JOIN"]}, {"k": "mem", "c": ["Read `|>` (or `%>%`) as **\"and then\"**.", "ggplot = **data + aes (mapping) + geom (shape)**, layered with `+`."]}], "w": 1}, {"h": "Core packages", "b": [{"k": "tbl", "h": null, "r": [["dplyr", "manipulate rows & columns"], ["tidyr", "reshape & tidy"], ["ggplot2", "plots"], ["readr / tibble / stringr / lubridate / purrr", "read files / modern data frame / strings / dates / functional"]]}]}, {"h": "dplyr verbs", "b": [{"k": "code", "l": "r", "c": "library(tidyverse)\nemp |>                                   # or %>%\n  filter(dept == \"IT\", salary > 40000) |>\n  select(name, dept, salary) |>\n  mutate(bonus = salary * 0.1) |>\n  arrange(desc(salary)) |>\n  head(5)\n\nemp |> group_by(dept) |>\n  summarise(avg = mean(salary), n = n(), .groups = \"drop\")\n\nemp |> count(dept, sort = TRUE)\nemp |> distinct(dept)\nemp |> rename(pay = salary)\nemp |> slice_max(salary, n = 3)"}]}, {"h": "Joins & combine", "b": [{"k": "code", "l": "r", "c": "inner_join(emp, dept, by = \"dept_id\")\nleft_join(emp, dept, by = \"dept_id\")   # also right_, full_, anti_, semi_join\nbind_rows(df1, df2); bind_cols(df1, df2)"}]}, {"h": "Reshape (tidyr)", "b": [{"k": "code", "l": "r", "c": "long <- wide |> pivot_longer(cols = m1:m3, names_to = \"subject\", values_to = \"marks\")\nwide <- long |> pivot_wider(names_from = subject, values_from = marks)\nseparate(df, full_name, into = c(\"first\", \"last\"), sep = \" \")\nunite(df, \"full\", first, last, sep = \" \")\ndrop_na(df); replace_na(df, list(x = 0))"}]}, {"h": "ggplot2", "b": [{"k": "code", "l": "r", "c": "ggplot(ChickWeight, aes(x = Time, y = weight, colour = Diet)) +\n  geom_point() +\n  geom_smooth(method = \"lm\") +\n  labs(title = \"Chick weight\", x = \"Days\", y = \"Weight (g)\") +\n  theme_minimal()"}, {"k": "tbl", "h": null, "r": [["geom_line / geom_col / geom_bar", "trend / bars from values / bars from counts"], ["geom_histogram / geom_boxplot", "distribution / spread"], ["facet_wrap(~ Diet)", "one panel per group"], ["ggsave(\"plot.png\")", "save"]]}]}]}, {"id": "r-functions", "g": "R", "i": "🧪", "t": "R Functions & R Markdown", "d": "Writing functions, built-ins, apply family, reports", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "apply family", "c": ["🔁 lapply :: list in → list out", "🎁 sapply :: simplifies to a vector", "🔲 apply :: matrix rows (1) / cols (2)", "👥 tapply :: per group"]}, {"k": "vis", "t": "flow", "ti": "R Markdown", "c": ["📝 .Rmd :: text + code chunks", "🧶 Knit :: runs every chunk", "📄 Report :: HTML / PDF / Word"]}, {"k": "mem", "c": ["**l**apply = **l**ist, **s**apply = **s**implified, **t**apply = **t**able by group.", "A function returns its **last** expression; `return()` is optional."]}], "w": 1}, {"h": "Write a function", "b": [{"k": "code", "l": "r", "c": "square <- function(x, power = 2) {\n  x ^ power             # last value is returned\n}\nsquare(4); square(2, power = 3)\n\nstats <- function(v) list(mean = mean(v), sd = sd(v))"}]}, {"h": "Built-in functions", "b": [{"k": "tbl", "h": null, "r": [["Numeric", "abs,
