<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat Sheets · Saarthi 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('saarthi_theme')==='dark')document.documentElement.classList.add('sp-dark')}catch(e){}</script>
<style>
/* Saarthi Pro tokens (same as #studentPage in login.html) */
:root{
  --ink:#0f1222;--ink2:#454b66;--mut:#7a8099;--line:#e8eaf2;--line2:#d9dce8;
  --bg:#f6f7fb;--card:#ffffff;--card2:#fafbfd;--bg3:#f0f2f8;
  --accent:#5b5bf7;--violet:#8b5cf6;--indigo:#4f46e5;--cyan:#0891b2;--green:#0ea371;--red:#e5484d;--amber:#d68a00;
  --tint:#eef0ff;--tint2:#f5f5ff;--good-bg:#e7f8f1;--bad-bg:#ffeef0;--warn-bg:#fff4dc;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --pro-grad:linear-gradient(135deg,#5b5bf7 0%,#8b5cf6 100%);
  --pro-hero:radial-gradient(900px 400px at 0% 0%,rgba(91,91,247,.55),transparent 60%),radial-gradient(700px 380px at 100% 100%,rgba(139,92,246,.55),transparent 60%),radial-gradient(500px 300px at 70% 0%,rgba(34,211,238,.25),transparent 60%),#0d1030;
  --disp:'Inter Tight','Inter',system-ui,sans-serif;--mono:'JetBrains Mono',Consolas,ui-monospace,monospace;
  --code-bg:#0d1030;--code-line:#1f2547;--code-ink:#e3e6ff;
}
html.sp-dark{
  --ink:#eef1ff;--ink2:#b9c0dc;--mut:#9aa2c2;--line:#273050;--line2:#34406a;
  --bg:#0b0f1e;--card:#141a30;--card2:#182039;--bg3:#1c2440;
  --accent:#8b8cff;--violet:#b39bff;--indigo:#a5a6ff;--cyan:#22d3ee;--green:#34d399;--red:#ff6b70;--amber:#fbbf24;
  --tint:#1e2550;--tint2:#19203f;--good-bg:#10302a;--bad-bg:#3a1a22;--warn-bg:#352a10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --code-bg:#080b1a;--code-line:#222a4d;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Inter',system-ui,sans-serif;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;cursor:pointer}
code,pre,.mono{font-family:var(--mono)}
::selection{background:rgba(91,91,247,.2)}

/* top bar — like Saarthi's white blurred bar */
.top{position:sticky;top:0;z-index:30;height:62px;display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(255,255,255,.86);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.8) blur(14px);-webkit-backdrop-filter:saturate(1.8) blur(14px)}
html.sp-dark .top{background:rgba(14,19,38,.9)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.brand .lg{width:34px;height:34px;border-radius:11px;background:var(--pro-grad);display:grid;place-items:center;color:#fff;font:800 16px var(--disp);box-shadow:0 6px 16px rgba(91,91,247,.3)}
.brand b{font:800 18px var(--disp);letter-spacing:-.4px;color:var(--ink)}
.brand span{color:var(--mut);font-weight:600;font-size:14px;margin-left:2px}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--line2);border-radius:12px;padding:0 12px 0 38px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:#b9bdfb;box-shadow:0 0 0 4px rgba(91,91,247,.12)}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--mut)}
.search kbd{position:absolute;right:10px;top:10px;font:600 11px var(--mono);color:var(--mut);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--bg3)}
.nbtn{height:38px;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line2);color:var(--ink2);border-radius:10px;padding:0 13px;font-weight:600;font-size:12.5px;box-shadow:0 1px 2px rgba(16,24,40,.05);white-space:nowrap}
.nbtn:hover{border-color:#b9bdfb;color:var(--indigo);background:var(--tint2)}
.menu-btn{display:none}

/* layout */
.wrap{display:grid;grid-template-columns:268px minmax(0,1fr)}
.rail{position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto;background:#0c0f1f;border-right:1px solid #1b2038;padding:16px 12px 40px;scrollbar-width:thin;scrollbar-color:#2a3052 transparent}
.rail h4{margin:18px 10px 6px;font:700 10.5px 'Inter';letter-spacing:1.2px;text-transform:uppercase;color:#5d6488}
.rail h4:first-of-type{margin-top:8px}
.ri{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;color:#9aa1c4;text-decoration:none;font-size:13.5px;font-weight:500;border:1px solid transparent;line-height:1.3}
.ri:hover{color:#e6e8f5;background:rgba(255,255,255,.04)}
.ri .ic{width:22px;text-align:center;font-size:15px;opacity:.85;flex-shrink:0}
.ri.on{color:#fff;background:linear-gradient(180deg,rgba(91,91,247,.28),rgba(139,92,246,.18));border-color:rgba(139,140,255,.35);box-shadow:0 8px 24px rgba(91,91,247,.2)}
.ri.on:before{content:'';position:absolute;left:-12px;top:28%;bottom:28%;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#22d3ee,#8b5cf6)}
main{min-width:0;padding:28px 32px 90px}
.page{display:grid;grid-template-columns:minmax(0,880px) 210px;gap:36px;justify-content:center}
.page.solo{grid-template-columns:minmax(0,1080px)}

/* hero (Saarthi glass gradient) */
.hero{background:var(--pro-hero);color:#fff;border-radius:22px;padding:28px 30px;box-shadow:0 20px 50px rgba(30,27,75,.25);margin-bottom:22px;position:relative;overflow:hidden}
.hero .kick{display:inline-flex;align-items:center;gap:6px;font:700 11px 'Inter';letter-spacing:1px;text-transform:uppercase;color:#c7c9ff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 10px}
.hero h1{font:800 32px/1.15 var(--disp);letter-spacing:-1px;margin:12px 0 6px;display:flex;align-items:center;gap:12px}
.hero h1 .hi{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.hero p{margin:0;color:#d4d7f5;max-width:640px}
.hero .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.gbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;font-weight:600;text-decoration:none}
.gbtn:hover{background:rgba(255,255,255,.16)}
.hero .stats{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.hero .stats div{font-size:12.5px;color:#c7c9ff}.hero .stats b{display:block;font:800 26px var(--disp);color:#fff;letter-spacing:-.5px}

/* section cards */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px}
.sec>h2{margin:0 0 14px;font:700 19px/1.3 var(--disp);letter-spacing:-.3px;display:flex;align-items:baseline;gap:10px}
.sec>h2 .no{font:600 12px var(--mono);color:var(--mut)}
.sec.pic{border-color:#d4d6f7;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(91,91,247,.08)}
html.sp-dark .sec.pic{border-color:#34406a}
.sec.pic>h2 .no{color:var(--accent)}
.sec p{margin:8px 0;color:var(--ink2)}
.sec ul{margin:6px 0;padding-left:20px;color:var(--ink2)}.sec li{margin:4px 0}
table.kv{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 4px}
table.kv td,table.kv th{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
table.kv tr:first-child td{border-top:0}
table.kv th{font:700 11px 'Inter';letter-spacing:.6px;text-transform:uppercase;color:var(--mut);background:var(--bg3);border-top:0}
table.kv th:first-child{border-radius:8px 0 0 8px}table.kv th:last-child{border-radius:0 8px 8px 0}
table.kv td:first-child{width:40%;font-weight:600;color:var(--ink)}
table.kv td:not(:first-child){color:var(--ink2)}
table.kv td.full{width:auto;font-weight:400;color:var(--ink2)}
table.kv td:first-child code{color:var(--indigo);font-size:13px;background:none;border:0;padding:0}
table.kv td{overflow-wrap:anywhere}
.sec code{font-size:12.8px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--ink)}
.code{position:relative;margin:10px 0;border-radius:14px;border:1px solid var(--code-line);background:var(--code-bg);box-shadow:0 10px 24px rgba(13,16,48,.12)}
.code .bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px 0 14px;font:600 10.5px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:#6c74a8}
.copy{border:1px solid #2a3360;background:#161c40;color:#c7c9ff;border-radius:7px;font:600 11px 'Inter';padding:3px 9px}
.copy:hover{background:#20285a}
pre{margin:0;padding:8px 16px 14px;overflow:auto;color:var(--code-ink);font-size:13.2px;line-height:1.6;tab-size:4}
.sec pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}
.k{color:#a5b4fc}.s{color:#86efac}.c{color:#6c74a8;font-style:italic}.n{color:#fcd34d}.f{color:#67e8f9}
.tip{display:flex;gap:10px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px;color:var(--ink)}
.tip:before{content:"!";flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#fff;font:800 12px 'Inter';display:grid;place-items:center;margin-top:1px}
.mem{background:var(--tint2);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-left:4px solid var(--accent);border-radius:12px;padding:12px 16px;margin:14px 0 4px}
.mem .mh{font:700 11px 'Inter';letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.mem .mi{font-size:14.5px;color:var(--ink);margin:4px 0}
.mem .mi b{color:var(--indigo)}
mark{background:#fde68a;color:#000;border-radius:3px;padding:0 1px}

/* on-this-page */
.toc{position:sticky;top:86px;align-self:start;font-size:13px}
.toc h5{margin:0 0 8px;font:700 11px 'Inter';letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--mut);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--ink)}
.toc a.on{border-left-color:var(--accent);color:var(--accent);font-weight:600}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pager a{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--mut);font-size:12.5px;box-shadow:var(--shadow)}
.pager a:hover{border-color:#b9bdfb}
.pager a b{display:block;color:var(--ink);font:700 15px var(--disp);margin-top:2px}
.pager .nx{text-align:right;grid-column:2}

/* home */
.gh{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.gh h2{margin:0;font:700 18px var(--disp);letter-spacing:-.3px}.gh small{color:var(--mut);font-size:13px}
.gh .ln{flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;gap:12px;align-items:flex-start;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:#d4d6f7;box-shadow:0 2px 4px rgba(16,24,40,.05),0 16px 40px rgba(16,24,40,.10)}
.tile .ti{width:42px;height:42px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.tile b{display:block;font:700 15px var(--disp);color:var(--ink)}.tile span{font-size:12.5px;color:var(--mut);line-height:1.45}
.hit{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.hit:hover{border-color:#b9bdfb}.hit b{color:var(--ink)}.hit small{color:var(--mut);display:block;margin-top:3px;font-family:var(--mono);font-size:12px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:36px}

/* ================= figures ================= */
.fig{margin:6px 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);padding:18px 18px 14px;overflow-x:auto}
.fig-t{font:700 13.5px var(--disp);color:var(--ink);margin:0 0 12px}
.cap{margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line2);font-size:13px;color:var(--ink2)}
.cap:before{content:"How to read it  ";font-weight:700;color:var(--accent);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.fig code{font-size:12px;background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:0 4px}
/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0}
.fn{flex:1 1 0;min-width:112px;max-width:210px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;position:relative}
.fn .st{font:700 10.5px var(--mono);color:var(--mut)}
.fn b{display:block;font:700 13.5px/1.3 'Inter';color:var(--ink);margin-top:1px;overflow-wrap:anywhere}
.fn span{display:block;font-size:12px;color:var(--mut);line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
.fn.hl{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.fn.hl b{color:var(--indigo)}
.fa{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--line2)}
.fa:after{content:"";width:8px;height:8px;border-top:2px solid var(--mut);border-right:2px solid var(--mut);transform:rotate(45deg);opacity:.6}
/* data tables chain */
.tchain{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.tbox{flex:0 1 auto}
.tbox .tt{font:700 11.5px 'Inter';color:var(--mut);margin-bottom:5px;letter-spacing:.2px}
.tbox table{border-collapse:separate;border-spacing:0;font:12.5px var(--mono);background:var(--card);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.tbox th{background:var(--bg3);color:var(--ink2);font:700 11px 'Inter';padding:6px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbox td{padding:5px 10px;border-top:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.tbox tr:nth-child(2) td{border-top:0}
.tbox tr.hl td{background:var(--tint);color:var(--indigo);font-weight:700}
.tbox tr.dim td{color:var(--mut);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--red) 60%,transparent)}
.tbox tr.g1 td{background:color-mix(in srgb,#5b5bf7 9%,var(--card))}
.tbox tr.g2 td{background:color-mix(in srgb,#0891b2 10%,var(--card))}
.tbox tr.g3 td{background:color-mix(in srgb,#d68a00 11%,var(--card))}
.tbox tr.g1 td:first-child{box-shadow:inset 3px 0 #5b5bf7}.tbox tr.g2 td:first-child{box-shadow:inset 3px 0 #0891b2}.tbox tr.g3 td:first-child{box-shadow:inset 3px 0 #d68a00}
.tbox td.yes{color:var(--green);font-weight:800;text-align:center}.tbox td.no{color:var(--red);font-weight:800;text-align:center}
.tbox td.null{color:var(--red);font-style:italic}
.tbox td.new,.tbox th.new{background:color-mix(in srgb,var(--green) 12%,var(--card))}
.tbox th.new{color:var(--green)}
.top-arrow{align-self:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:18px 6px 0;min-width:70px}
.top-arrow span{font:700 11px var(--mono);color:var(--accent);text-align:center;line-height:1.3;max-width:190px;white-space:normal;overflow-wrap:anywhere}
.top-arrow i{display:block;width:100%;min-width:46px;height:2px;background:var(--accent);position:relative;opacity:.8}
.top-arrow i:after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--accent);border-right:0}
/* code → output */
.c2o{display:grid;grid-template-columns:minmax(0,max-content) 26px minmax(170px,1fr);gap:7px 6px;align-items:center;font:13px var(--mono)}
.c2o .in{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:6px 10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:540px}
.c2o .ar{color:var(--mut);text-align:center}
.c2o .out{border-radius:8px;padding:6px 10px;background:var(--good-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);white-space:pre-wrap}
.c2o .out.err{background:var(--bad-bg);border-color:color-mix(in srgb,var(--red) 35%,transparent);color:var(--red)}
.c2o .out.note{background:var(--bg3);border-color:var(--line);color:var(--ink2);font-family:'Inter';font-size:13px}
.c2o .hd{font:700 11px 'Inter';color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
/* anatomy */
.anat{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 2px;font:600 15px var(--mono)}
.anat .sg{display:flex;flex-direction:column;align-items:center}
.anat .tx{padding:4px 3px;border-bottom:3px solid var(--c,var(--line2));color:var(--ink);white-space:pre}
.anat .lb{margin-top:6px;font:600 11.5px/1.3 'Inter';color:var(--c,var(--mut));text-align:center;max-width:150px;padding:0 4px}
.anat .sg.plain .tx{border-bottom-color:transparent;color:var(--mut)}
/* sequence */
.seq svg{display:block;min-width:560px;width:100%;height:auto}
.seq text{font-family:'Inter',sans-serif}
/* strip */
.strip table{border-collapse:separate;border-spacing:3px;margin:0}
.strip td{padding:0;border:0}
.strip .ix{font:500 10.5px var(--mono);color:var(--mut);text-align:center}
.strip .ch{width:32px;height:32px;display:grid;place-items:center;font:700 14px var(--mono);border-radius:8px;background:var(--card);border:1px solid var(--line2);color:var(--ink)}
.strip .ch.on{background:var(--accent);border-color:var(--accent);color:#fff}
.strip .ch.ghost{background:transparent;border-style:dashed;color:transparent}
.strip .ex{font:600 13px var(--mono);color:var(--indigo);padding-right:12px;white-space:nowrap;text-align:right}
.strip .rs{font:600 13px var(--mono);color:var(--ink2);padding-left:12px;white-space:nowrap}
/* matrix */
.mxw{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.mx{display:inline-grid;gap:5px;align-items:center;font:700 14px var(--mono)}
.mx .c{width:44px;height:38px;display:grid;place-items:center;border-radius:9px;background:var(--card);border:1px solid var(--line2);color:var(--ink)}
.mx .r0{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--indigo)}
.mx .r1{background:color-mix(in srgb,var(--cyan) 12%,var(--card));border-color:color-mix(in srgb,var(--cyan) 45%,transparent);color:var(--cyan)}
.mx .lab{font:600 11px 'Inter';color:var(--mut);text-align:center}
.mxk{font-size:13.5px;color:var(--ink2);line-height:1.6}.mxk p{margin:0 0 10px}
.mxk code{font-size:12.5px}
/* boxes: nest / tree / layers / grid */
.nest{border:1.5px solid var(--bc);background:var(--bg);border-radius:12px;padding:28px 12px 12px;position:relative;margin-top:2px}
.nest>.lbl{position:absolute;top:6px;left:12px;font:700 12.5px 'Inter';color:var(--indigo)}
.nest>.lbl small{font-weight:500;color:var(--mut);margin-left:6px;font-size:12px}
.nest.core{padding:12px;text-align:center;font:700 13.5px 'Inter';color:var(--indigo)}
.nest.core small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:16px;padding-left:16px;border-left:1.5px solid var(--line2)}
.tree li{position:relative;margin:6px 0}
.tree ul>li:before{content:"";position:absolute;left:-16px;top:16px;width:13px;border-top:1.5px solid var(--line2)}
.tn{display:inline-flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:4px 11px;font-size:13.5px}
.tn b{font-weight:700;color:var(--ink)}.tn span{color:var(--mut);font-size:12.5px}
.tn.hl{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}.tn.hl b{color:var(--indigo)}
.tn code{font-size:12px}
.layers{display:flex;flex-direction:column;gap:6px}
.ly{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line2);border-left:4px solid var(--lc);border-radius:10px;padding:10px 14px}
.ly b{font:700 14px 'Inter';color:var(--ink)}.ly span{font-size:13px;color:var(--ink2)}
.cmp{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.cmp>div{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.cmp h6{margin:0 0 6px;font:700 14px var(--disp);color:var(--ink);display:flex;align-items:center;gap:8px}
.cmp h6 i{font-style:normal;font-size:17px}
.cmp ul{margin:0;padding-left:17px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}.cmp li{margin:3px 0}
/* hub / ring */
.hub{position:relative;height:340px;max-width:660px;margin:0 auto}
.hub svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hub .hn{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:min(36%,220px);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);text-align:center}
.hub .hn b{display:block;font:700 13.5px 'Inter';color:var(--ink)}.hub .hn span{display:block;font-size:12px;color:var(--mut);line-height:1.35}
.hub .hn.ctr{background:var(--tint);border:1.5px solid color-mix(in srgb,var(--accent) 50%,transparent)}.hub .hn.ctr b{color:var(--indigo)}
.hub .hn.hl{border:1.5px solid var(--accent)}
.hub .el{position:absolute;transform:translate(-50%,-50%);font:700 11.5px 'Inter';color:var(--indigo);background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;white-space:nowrap}
.hub .cl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 12px 'Inter';color:var(--mut);text-align:center;max-width:30%}
/* joins */
.joins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.jn{text-align:center;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:8px 6px}
.jn svg{width:100%;max-width:118px;height:64px}
.jn b{display:block;font:700 12.5px 'Inter';color:var(--ink)}.jn span{font-size:11.5px;color:var(--mut)}
/* ladder */
.ladder{display:flex;align-items:flex-end;gap:8px;height:150px}
.lr{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.lr .bar{border-radius:10px 10px 4px 4px;background:var(--bc);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.lr b{display:block;font:700 12.5px 'Inter';color:var(--ink);margin-top:6px;text-align:center}
.lr span{display:block;font-size:11.5px;color:var(--mut);text-align:center;line-height:1.35}
/* mini charts */
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mc{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 10px 8px;text-align:center}
.mc svg{width:100%;height:70px}
.mc b{display:block;font:700 13px 'Inter';color:var(--ink);margin-top:4px}.mc span{font-size:12px;color:var(--mut)}

/* stream balls */
.balls{display:grid;grid-template-columns:max-content max-content 1fr;gap:8px 30px;align-items:center}
.bl{display:contents}
.bl .bs{display:flex;gap:4px;flex-wrap:wrap}
.bl .bs.o{justify-content:flex-start}
.bl i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 11.5px var(--mono);background:var(--tint);border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--indigo)}
.bl .bs.o i{background:color-mix(in srgb,var(--green) 14%,var(--card));border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.bl .m{font:600 12.5px var(--mono);background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:6px 10px;text-align:left;position:relative}
.bl .m:after{content:"→";position:absolute;right:-20px;top:5px;color:var(--mut);font-family:'Inter'}
.bl .m:before{content:"→";position:absolute;left:-20px;top:5px;color:var(--mut);font-family:'Inter'}
.bl .val{font:700 12.5px var(--mono);color:var(--green);background:var(--good-bg);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);border-radius:8px;padding:4px 10px;justify-self:start}
.bl .hd{font:700 11px 'Inter';color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
/* raw svg helpers */
.svgfig svg{display:block;width:100%;height:auto;max-width:760px;margin:0 auto}
.svgfig text{font-family:'Inter',sans-serif}
.sv-box{fill:var(--card);stroke:var(--line2)}
.sv-hl{fill:var(--tint);stroke:var(--accent)}
.sv-good{fill:var(--good-bg);stroke:var(--green)}
.sv-bad{fill:var(--bad-bg);stroke:var(--red)}
.sv-t{fill:var(--ink);font-size:13px;font-weight:700}
.sv-s{fill:var(--mut);font-size:11.5px}
.sv-a{stroke:var(--mut);stroke-width:1.6;fill:none}
.sv-aa{stroke:var(--accent);stroke-width:1.8;fill:none}
.sv-lbl{fill:var(--accent);font-size:11.5px;font-weight:700}
.sv-red{fill:var(--red);font-size:11.5px;font-weight:700}
.sv-green{fill:var(--green);font-size:11.5px;font-weight:700}
.sv-m{font-family:'JetBrains Mono',monospace!important}

@media (max-width:1280px){.page{grid-template-columns:minmax(0,880px)}.toc{display:none}}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:62px;width:280px;z-index:25;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.3)}
  body.menu .rail{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:16px 12px 70px}
  .brand span,.search kbd,.nbtn .lbl{display:none}
  .hero{padding:22px 20px;border-radius:18px}.hero h1{font-size:24px}
  .sec{padding:18px 16px}
  .ly{grid-template-columns:1fr;gap:2px}
  .cmp{grid-template-columns:1fr}
  .hub{height:300px}.hub .hn span{display:none}.hub .hn{padding:6px 8px;max-width:40%}
  .pager{grid-template-columns:1fr}.pager .nx{grid-column:1}
  .c2o{grid-template-columns:1fr;gap:3px}.c2o .ar{display:none}.c2o .out{margin-bottom:8px}.c2o .in{white-space:pre-wrap;word-break:break-word}
  .seq svg{min-width:500px}.balls{grid-template-columns:1fr;gap:4px}.bl .m:before,.bl .m:after{display:none}.bl .hd{display:none}.bl .bs.o,.bl .val{margin-bottom:10px}.fig{padding:14px 12px 12px}
}
@media print{
  .top,.rail,.toc,.pager,.copy,.hero .acts,.foot{display:none!important}
  .wrap{display:block}main{padding:0}body{background:#fff}
  .hero{background:#fff!important;color:#000;box-shadow:none;border:1px solid #ccc;padding:12px 16px}
  .hero p,.hero .kick{color:#333}
  .sec{box-shadow:none;break-inside:avoid-page;padding:12px 14px}
  .code{box-shadow:none}pre{white-space:pre-wrap}
}
</style>
</head>

const DATA = {"groups": ["Python", "R", "Java", "Databases & SQL", "NoSQL", "Warehouse, Lake & Cloud", "Big Data Technologies"], "sheets": [{"id": "py-basics", "g": "Python", "i": "🐍", "t": "Python Basics", "d": "Syntax, types, operators, I/O, control flow", "s": [{"h": "Variables are name tags, not boxes", "b": [{"k": "vis", "t": "svg", "ti": "Two names, one list: b = a does not copy", "c": ["<svg viewBox=\"0 0 760 210\">", "<defs><marker id=\"pbA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--accent)\"/><\/marker><\/defs>", "<text x=\"20\" y=\"22\" class=\"sv-s\" font-weight=\"700\">MUTABLE: list<\/text>", "<rect x=\"20\" y=\"40\" width=\"70\" height=\"34\" rx=\"9\" class=\"sv-hl\"/><text x=\"55\" y=\"62\" text-anchor=\"middle\" class=\"sv-t sv-m\">a<\/text>", "<rect x=\"20\" y=\"100\" width=\"70\" height=\"34\" rx=\"9\" class=\"sv-hl\"/><text x=\"55\" y=\"122\" text-anchor=\"middle\" class=\"sv-t sv-m\">b<\/text>", "<path d=\"M92 57 C150 57 150 85 196 85\" class=\"sv-aa\" marker-end=\"url(#pbA)\"/><path d=\"M92 117 C150 117 150 92 196 92\" class=\"sv-aa\" marker-end=\"url(#pbA)\"/>", "<rect x=\"200\" y=\"66\" width=\"150\" height=\"44\" rx=\"10\" class=\"sv-box\"/><text x=\"275\" y=\"94\" text-anchor=\"middle\" class=\"sv-t sv-m\">[1, 2, 9]<\/text>", "<text x=\"20\" y=\"170\" class=\"sv-s sv-m\">b = a<\/text><text x=\"20\" y=\"190\" class=\"sv-s sv-m\">b.append(9)  →  a is now [1, 2, 9] too<\/text>", "<line x1=\"390\" y1=\"20\" x2=\"390\" y2=\"195\" stroke=\"var(--line2)\" stroke-dasharray=\"4 4\"/>", "<text x=\"420\" y=\"22\" class=\"sv-s\" font-weight=\"700\">IMMUTABLE: int<\/text>", "<rect x=\"420\" y=\"40\" width=\"70\" height=\"34\" rx=\"9\" class=\"sv-hl\"/><text x=\"455\" y=\"62\" text-anchor=\"middle\" class=\"sv-t sv-m\">x<\/text>", "<rect x=\"420\" y=\"100\" width=\"70\" height=\"34\" rx=\"9\" class=\"sv-hl\"/><text x=\"455\" y=\"122\" text-anchor=\"middle\" class=\"sv-t sv-m\">y<\/text>", "<path d=\"M492 57 L596 57\" class=\"sv-aa\" marker-end=\"url(#pbA)\"/><path d=\"M492 117 L596 117\" class=\"sv-aa\" marker-end=\"url(#pbA)\"/>", "<rect x=\"600\" y=\"38\" width=\"80\" height=\"38\" rx=\"10\" class=\"sv-box\"/><text x=\"640\" y=\"63\" text-anchor=\"middle\" class=\"sv-t sv-m\">5<\/text>", "<rect x=\"600\" y=\"98\" width=\"80\" height=\"38\" rx=\"10\" class=\"sv-good\"/><text x=\"640\" y=\"123\" text-anchor=\"middle\" class=\"sv-t sv-m\">6<\/text>", "<text x=\"420\" y=\"170\" class=\"sv-s sv-m\">y = x;  y += 1<\/text><text x=\"420\" y=\"190\" class=\"sv-s sv-m\">→ y points to a NEW object; x stays 5<\/text>", "<\/svg>", "% A variable is a label stuck on an object. Changing a mutable object (list, dict, set) through one name is visible through every name stuck on it. Immutable objects (int, str, tuple) can't change, so \"changing\" one just moves the label to a new object."]}, {"k": "vis", "t": "cmp", "ti": "Which types can change in place?", "c": ["## ✏️ Mutable", "- `list` `[1, 2]`", "- `dict` `{'k': 1}`", "- `set` `{1, 2}`", "- change them with methods: append, update, add", "## 🔒 Immutable", "- `int` `float` `bool` `None`", "- `str` `'text'`", "- `tuple` `(1, 2)`", "- \"changes\" always build a new object"]}, {"k": "mem", "c": ["`b = a` copies the **label**, not the list. Use `a.copy()` for a real copy."]}]}, {"h": "Operators that surprise people", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["7 / 2 => 3.5        (always float)", "7 // 2 => 3         (floor division)", "-7 // 2 => -4       (floor goes DOWN, not toward 0)", "7 % 2 => 1          (remainder)", "2 ** 3 => 8", "True + True => 2    (bool is an int)", "\"5\" + 5 =x TypeError: can only concatenate str (not \"int\") to str", "int(\"5\") + 5 => 10", "% Green = the value you get. Red = the error Python raises."]}]}, {"h": "break vs continue, traced", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["for i in range(5): if i == 3: break     → prints => 0 1 2", "for i in range(5): if i == 3: continue  → prints => 0 1 2 4", "for … else: (no break happened) =~ the `else` block runs", "% break leaves the loop; continue only skips the rest of this one round."]}]}, {"h": "Data types", "b": [{"k": "tbl", "h": null, "r": [["int, float, complex", "10, 3.14, 2+3j"], ["str", "'hi', \"hi\", '''multi-line'''"], ["bool", "True, False (bool is a subclass of int)"], ["None", "the \"no value\" object"], ["list / tuple / set / dict", "[1,2] / (1,2) / {1,2} / {'k':1}"], ["type(x), isinstance(x, int)", "check a type"], ["int('5'), float('2.5'), str(9), bool(0)", "convert types"]]}]}, {"h": "Operators", "b": [{"k": "tbl", "h": null, "r": [["+ - * /", "add, subtract, multiply, true divide (7/2 → 3.5)"], ["// % **", "floor divide (7//2 → 3), modulo (7%2 → 1), power (2**3 → 8)"], ["== != < <= > >=", "comparison (chainable: 1 < x < 5)"], ["and or not", "logical (short-circuit)"], ["is, is not", "same object? (use for None: x is None)"], ["in, not in", "membership ('a' in 'cat')"], ["& | ^ ~ << >>", "bitwise"], ["x += 1", "augmented assignment (no ++ in Python)"], ["n := len(a)", "walrus: assign inside an expression"]]}]}, {"h": "Input / output", "b": [{"k": "code", "l": "py", "c": "name = input(\"Name: \")            # always returns str\nage  = int(input(\"Age: \"))        # convert\na, b = map(int, input().split())  # two ints on one line\nprint(\"Hi\", name, sep=\", \", end=\"!\\n\")\nprint(f\"{name} is {age} years\")   # f-string"}]}, {"h": "Branching", "b": [{"k": "code", "l": "py", "c": "if marks >= 75:\n    grade = \"A\"\nelif marks >= 60:\n    grade = \"B\"\nelse:\n    grade = \"C\"\n\nstatus = \"pass\" if marks >= 40 else \"fail\"   # ternary\n\nmatch cmd:                      # Python 3.10+\n    case \"start\": run()\n    case \"stop\" | \"quit\": stop()\n    case _: print(\"unknown\")"}]}, {"h": "Loops", "b": [{"k": "code", "l": "py", "c": "lst, l1, l2 = [4, 9, 7], [1, 2], ['a', 'b']\nfor i in range(5): print(i)              # 0..4\nfor i in range(2, 10, 2): print(i)       # 2,4,6,8\nfor i, v in enumerate(lst): print(i, v)  # index + value\nfor a, b in zip(l1, l2): print(a, b)     # pair up\n\nn = 3\nwhile n > 0:\n    n -= 1\n\ntarget = 7\nfor x in lst:\n    if x == target:\n        break\nelse:                                    # runs only if no break\n    print(\"not found\")"}, {"k": "tbl", "h": null, "r": [["break", "leave the loop now"], ["continue", "skip to next iteration"], ["pass", "do nothing (placeholder)"]]}, {"k": "tip", "c": "Indentation (4 spaces) defines blocks. Mixing tabs and spaces raises TabError."}]}]}, {"id": "py-strings", "g": "Python", "i": "🔤", "t": "Strings & Formatting", "d": "Indexing, slicing, methods, f-strings", "s": [{"h": "How slicing picks characters", "b": [{"k": "vis", "t": "strip", "ti": "", "c": ["\"BigData\"", "s[0:3]", "s[3:]", "s[-4:]", "s[::2]", "s[::-1]", "% Top row = positive index, bottom row = negative index. A slice [start:stop:step] takes start, stops BEFORE stop, and jumps by step. Filled boxes are the characters you get."]}, {"k": "mem", "c": ["**Stop is never included:** `s[0:3]` gives 3 characters (0, 1, 2)."]}]}, {"h": "Reading a format spec", "b": [{"k": "vis", "t": "anat", "ti": "", "c": ["\"f'{price\"", "\": :: starts the format spec\"", "\"> :: align right\"", "\"10 :: total width 10\"", "\", :: thousands separator\"", "\".2f :: 2 decimals, float\"", "\"}'\"", "% f'{1234.5:>10,.2f}' → '  1,234.50'. Read the spec left to right: alignment, width, separator, precision."]}]}, {"h": "Common methods, with results", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["\"  Hi There \".strip() => 'Hi There'", "\"a,b,c\".split(\",\") => ['a', 'b', 'c']", "\"-\".join([\"a\", \"b\"]) => 'a-b'", "\"banana\".count(\"a\") => 3", "\"banana\".find(\"z\") => -1", "\"banana\".index(\"z\") =x ValueError: substring not found", "s = \"data\"; s[0] = \"D\" =x TypeError: 'str' object does not support item assignment", "s.upper() => 'DATA'   (a new string; s is unchanged)"]}]}, {"h": "Indexing & slicing", "b": [{"k": "code", "l": "py", "c": "s = \"BigData\"\ns[0]      # 'B'      s[-1]   # 'a'\ns[0:3]    # 'Big'    s[3:]   # 'Data'\ns[::2]    # 'Bgaa'   s[::-1] # 'ataDgiB' (reverse)\nlen(s)    # 7"}, {"k": "tip", "c": "Strings are immutable: s[0] = 'b' raises TypeError. Build a new string instead."}]}, {"h": "Common methods", "b": [{"k": "tbl", "h": null, "r": [["s.lower() / upper() / title() / capitalize() / swapcase()", "change case"], ["s.strip() / lstrip() / rstrip()", "remove whitespace (or given chars)"], ["s.split(',') / s.split()", "to list (default splits on any whitespace)"], ["','.join(lst)", "list of str → one str"], ["s.replace('a','b')", "replace all"], ["s.find('x') / s.index('x')", "position (find → -1, index → ValueError)"], ["s.count('a')", "occurrences"], ["s.startswith('Big') / endswith('a')", "prefix / suffix test"], ["s.isdigit() / isalpha() / isalnum() / isspace()", "character tests"], ["s.zfill(5) / center(10,'*') / ljust / rjust", "padding"]]}]}, {"h": "Formatting", "b": [{"k": "code", "l": "py", "c": "name, pi = \"Asha\", 3.14159\nf\"{name:>10}\"      # right-align in 10\nf\"{pi:.2f}\"        # '3.14'\nf\"{1234567:,}\"     # '1,234,567'\nf\"{0.25:.0%}\"      # '25%'\nf\"{7:03d}\"         # '007'\nf\"{name=}\"         # \"name='Asha'\" (debug)\n\"{} scored {}\".format(name, 90)\n\"%s scored %d\" % (name, 90)        # old style"}]}, {"h": "Multiple assignment & unpacking", "b": [{"k": "code", "l": "py", "c": "a, b = 1, 2\na, b = b, a                 # swap\nfirst, *rest = [1, 2, 3, 4] # first=1, rest=[2,3,4]"}]}, {"h": "Useful tricks", "b": [{"k": "code", "l": "py", "c": "clean = ''.join(c.lower() for c in s if c.isalnum())\nis_pal = clean == clean[::-1]            # palindrome\nimport string\nset(string.ascii_lowercase) <= set(s.lower())   # pangram"}]}]}, {"id": "py-lists", "g": "Python", "i": "📋", "t": "Lists", "d": "Create, add, search, delete, sort, comprehension", "s": [{"h": "Slicing a list", "b": [{"k": "vis", "t": "strip", "ti": "", "c": ["[4, 9, 7, 2, 5]", "nums[1:3]", "nums[:2]", "nums[-2:]", "nums[::2]", "% Same rules as strings. The result is a new list."]}]}, {"h": "What each method does to a = [1, 2]", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["## every line starts again from a = [1, 2]", "a.append([3, 4]) => a = [1, 2, [3, 4]]    (adds ONE item: the whole list)", "a.extend([3, 4]) => a = [1, 2, 3, 4]      (adds each item)", "a.insert(0, 9) => a = [9, 1, 2]", "a.pop() => returns 2, a = [1]", "a.remove(5) =x ValueError: list.remove(x): x not in list", "sorted(a, reverse=True) => [2, 1]          (new list, a unchanged)", "a.sort() => returns None, a is sorted in place", "% append vs extend is the classic exam trap: append puts the list inside as one element."]}]}, {"h": "Reading a list comprehension", "b": [{"k": "vis", "t": "anat", "ti": "", "c": ["\"[\"", "\"x * x :: what to keep (output)\"", "\"for x in nums :: loop over the input\"", "\"if x % 2 == 0 :: optional filter\"", "\"]\"", "% Read it as: \"x squared, for every x in nums, but only if x is even\". [x*x for x in [1,2,3,4] if x % 2 == 0] → [4, 16]."]}]}, {"h": "Create & access", "b": [{"k": "code", "l": "py", "c": "nums = [4, 9, 7]\nempty = []\ngrid = [[0]*3 for _ in range(3)]   # NOT [[0]*3]*3 (shares rows)\nnums[0], nums[-1], nums[1:]"}]}, {"h": "Add / remove", "b": [{"k": "tbl", "h": null, "r": [["append(x)", "add one item at the end"], ["extend(iter) / a + b", "add many / concatenate"], ["insert(i, x)", "insert at index"], ["remove(x)", "delete first matching value (ValueError if missing)"], ["pop() / pop(i)", "remove and return last / at index"], ["del a[i] / del a[1:3]", "delete by index / slice"], ["clear()", "empty the list"]]}]}, {"h": "Search & info", "b": [{"k": "tbl", "h": null, "r": [["x in a", "membership"], ["a.index(x) / a.count(x)", "position / frequency"], ["len, min, max, sum", "built-ins"], ["sorted(a)", "new sorted list"], ["a.sort(reverse=True, key=len)", "sort in place, returns None"], ["a.reverse() / a[::-1]", "reverse in place / reversed copy"], ["a.copy() / a[:] / list(a)", "shallow copy"]]}]}, {"h": "Comprehension & mapping", "b": [{"k": "code", "l": "py", "c": "squares = [x*x for x in range(10)]\nevens   = [x for x in nums if x % 2 == 0]\nlabels  = [\"even\" if x%2==0 else \"odd\" for x in nums]\nflat    = [v for row in grid for v in row]\nupper   = list(map(str.upper, words))\nlongw   = list(filter(lambda w: len(w) > 3, words))"}]}, {"h": "Strings ↔ lists", "b": [{"k": "code", "l": "py", "c": "words = \"a b c\".split()      # ['a','b','c']\nline  = \"-\".join(words)      # 'a-b-c'\nchars = list(\"abc\")          # ['a','b','c']"}, {"k": "tip", "c": "b = a does NOT copy: both names point to the same list. Use a.copy() or copy.deepcopy() for nested lists."}]}]}, {"id": "py-dicts", "g": "Python", "i": "📖", "t": "Dictionaries & Sets", "d": "Define, modify, delete, comprehension, sets", "s": [{"h": "A dict maps keys to values", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### student = {...}", "key | value", "'name' | 'Asha'", "'marks' | [80, 90]", "'city' | 'Pune'", ">> student['city'] = 'Mumbai'", "### after the update", "key | value", "'name' | 'Asha'", "'marks' | [80, 90]", "* 'city' | 'Mumbai'", "% Keys are unique: assigning to an existing key replaces its value; a new key adds a row."]}, {"k": "vis", "t": "c2o", "ti": "", "c": ["student['name'] => 'Asha'", "student['age'] =x KeyError: 'age'", "student.get('age', 0) => 0        (no crash, default used)", "list(student.keys()) => ['name', 'marks', 'city']", "for k, v in student.items(): … =~ gives each key **and** value"]}]}, {"h": "Set operations, with numbers", "b": [{"k": "vis", "t": "svg", "ti": "a = {1, 2, 3, 4}   b = {3, 4, 5}", "c": ["<svg viewBox=\"0 0 760 200\">", "<circle cx=\"250\" cy=\"100\" r=\"82\" fill=\"var(--accent)\" fill-opacity=\".12\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>", "<circle cx=\"360\" cy=\"100\" r=\"82\" fill=\"var(--cyan)\" fill-opacity=\".12\" stroke=\"var(--cyan)\" stroke-width=\"1.5\"/>", "<text x=\"200\" y=\"40\" class=\"sv-lbl\">a<\/text><text x=\"410\" y=\"40\" class=\"sv-lbl\" style=\"fill:var(--cyan)\">b<\/text>", "<text x=\"215\" y=\"106\" text-anchor=\"middle\" class=\"sv-t sv-m\" font-size=\"18\">1  2<\/text>", "<text x=\"305\" y=\"106\" text-anchor=\"middle\" class=\"sv-t sv-m\" font-size=\"18\">3  4<\/text>", "<text x=\"395\" y=\"106\" text-anchor=\"middle\" class=\"sv-t sv-m\" font-size=\"18\">5<\/text>", "<g class=\"sv-m\" font-size=\"13\">", "<text x=\"500\" y=\"52\" class=\"sv-t\">a | b  →  {1, 2, 3, 4, 5}<\/text>", "<text x=\"500\" y=\"82\" class=\"sv-t\">a &amp; b  →  {3, 4}<\/text>", "<text x=\"500\" y=\"112\" class=\"sv-t\">a - b  →  {1, 2}<\/text>", "<text x=\"500\" y=\"142\" class=\"sv-t\">a ^ b  →  {1, 2, 5}<\/text>", "<\/g>", "<text x=\"500\" y=\"172\" class=\"sv-s\">union · both · only a · not shared<\/text>", "<\/svg>", "% The overlap holds what both sets share. Union takes everything, intersection only the overlap, difference removes b's items from a."]}]}, {"h": "Define & access", "b": [{"k": "code", "l": "py", "c": "d = {'Arham': 'Blue', 'Lisa': 'Yellow'}\nd = dict(name='Asha', age=21)\nd['Lisa']               # KeyError if missing\nd.get('Tom', 'N/A')     # default instead of error\nlen(d)                  # number of keys"}]}, {"h": "Modify & delete", "b": [{"k": "tbl", "h": null, "r": [["d[k] = v", "add or update"], ["d.update({'a':1})", "merge another dict"], ["d.setdefault(k, [])", "get, inserting default if missing"], ["del d[k]", "delete key (KeyError if missing)"], ["d.pop(k, None)", "remove and return value"], ["d.popitem()", "remove last inserted pair"], ["d.clear()", "empty"], ["d1 | d2", "merged copy (3.9+)"]]}]}, {"h": "Iterate", "b": [{"k": "code", "l": "py", "c": "for k in d: ...\nfor k, v in d.items(): ...\nfor k in sorted(d): print(k, d[k])           # alphabetical\nsorted(d.items(), key=lambda kv: kv[1])      # by value"}]}, {"h": "Comprehension", "b": [{"k": "code", "l": "py", "c": "sq = {x: x*x for x in range(5)}\ninv = {v: k for k, v in d.items()}\nrot13 = {c: chr((ord(c)-97+13)%26+97) for c in 'abcdefghijklmnopqrstuvwxyz'}"}]}, {"h": "Counting patterns", "b": [{"k": "code", "l": "py", "c": "from collections import Counter, defaultdict\nCounter(\"banana\").most_common(2)   # [('a',3),('n',2)]\ngroups = defaultdict(list)\nfor name, dept in rows: groups[dept].append(name)"}]}, {"h": "Sets", "b": [{"k": "tbl", "h": null, "r": [["{1,2,3} / set()", "create (note {} is an empty dict)"], ["add / remove / discard", "discard does not raise if missing"], ["a | b, a & b, a - b, a ^ b", "union, intersection, difference, symmetric difference"], ["a <= b / a.isdisjoint(b)", "subset / no common items"]]}, {"k": "tip", "c": "Dict keys must be hashable (str, int, tuple). Lists can't be keys. Dicts keep insertion order (3.7+)."}]}]}, {"id": "py-tuples", "g": "Python", "i": "📦", "t": "Tuples", "d": "Immutable sequences, packing, zip", "s": [{"h": "A tuple is a list you can't change", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["t = (1, 2, 3); t[0] => 1", "t[0] = 9 =x TypeError: 'tuple' object does not support item assignment", "t + (4,) => (1, 2, 3, 4)   (a new tuple)", "type((5)) => <class 'int'>      (brackets alone do nothing)", "type((5,)) => <class 'tuple'>   (the comma makes the tuple)", "a, b, c = t => a = 1, b = 2, c = 3", "list(zip((1, 2), ('x', 'y'))) => [(1, 'x'), (2, 'y')]", "{(19.07, 72.87): 'Mumbai'} => works: tuples can be dict keys, lists can't", "% Use a tuple for fixed records (coordinates, a row from a database), a list when items will change."]}]}, {"h": "", "b": [{"k": "code", "l": "py", "c": "t = (1, 2, 3)\none = (5,)          # comma makes the tuple, not brackets\nt[0], t[-1], t[1:]\na, b, c = t         # unpack\nt.count(2), t.index(3)\nt + (4,)            # new tuple"}, {"k": "tbl", "h": null, "r": [["Immutable", "can't add/remove/change items; can be dict keys"], ["Faster & smaller", "than lists, good for fixed records"], ["A tuple can hold a list", "the list inside is still mutable"]]}]}, {"h": "Patterns from the lab", "b": [{"k": "code", "l": "py", "c": "from collections import Counter\ndups = [x for x, c in Counter(t).items() if c > 1]          # repeated items\ndata = [('item1','12.20'), ('item2','15.10'), ('item3','24.5')]\nsorted(data, key=lambda x: float(x[1]), reverse=True)       # sort by float\ntuple(map(sum, zip((1,2,3), (4,5,6))))                      # (5,7,9)\nnext(i for i, x in enumerate(lst) if isinstance(x, tuple))  # count until tuple"}]}, {"h": "Named tuples", "b": [{"k": "code", "l": "py", "c": "from collections import namedtuple\nPoint = namedtuple('Point', 'x y')\np = Point(3, 4); p.x, p._asdict()"}]}]}, {"id": "py-functions", "g": "Python", "i": "⚙️", "t": "Functions & Modules", "d": "Arguments, lambda, scope, built-ins, pickle", "s": [{"h": "Where each argument lands", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### def f(a, b=2, *args, key=None, **kwargs)", "parameter | receives | why", "a | 1 | first positional", "b | 5 | second positional (default 2 not used)", "*args | (7, 8) | extra positional → tuple", "key | 'x' | named, keyword-only", "**kwargs | {'city': 'Pune'} | extra named → dict", "% For the call f(1, 5, 7, 8, key='x', city='Pune'). Positional values fill a, b in order; leftovers go to *args; named values match by name; unknown names go to **kwargs."]}]}, {"h": "Which x does print(x) see? (LEGB)", "b": [{"k": "vis", "t": "nest", "ti": "", "c": ["Built-in :: len, print, range …", "Global :: x = 'global'   (top of the file)", "Enclosing :: x = 'enclosing'   (outer function)", "Local: x = 'local' → print(x) shows 'local' :: Python stops at the first level that has the name", "% Python searches from the inside out: Local, then Enclosing, then Global, then Built-in. Delete the local x and it would print 'enclosing'."]}]}, {"h": "map, filter, reduce", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["list(map(lambda x: x * 2, [1, 2, 3])) => [2, 4, 6]       (transform each)", "list(filter(lambda x: x > 1, [1, 2, 3])) => [2, 3]       (keep some)", "reduce(lambda a, b: a + b, [1, 2, 3]) => 6                ((1 + 2) + 3)", "def f(): print(\"hi\") ; f() is None => True               (no return → None)"]}]}, {"h": "Define & call", "b": [{"k": "code", "l": "py", "c": "def area(l, w=1):            # w has a default\n    \"\"\"Return area.\"\"\"       # docstring\n    return l * w\n\narea(5), area(5, 2), area(w=2, l=5)   # positional / named"}]}, {"h": "Argument kinds", "b": [{"k": "code", "l": "py", "c": "def f(a, b=2, *args, key=None, **kwargs): ...\nf(1, 2, 3, 4, key='x', extra=9)\n# a=1 b=2 args=(3,4) key='x' kwargs={'extra':9}\ndef g(a, /, b, *, c): ...   # a positional-only, c keyword-only"}, {"k": "tip", "c": "Never use a mutable default (def f(x=[])). Use def f(x=None): x = x or []."}]}, {"h": "Lambda, map, filter, reduce", "b": [{"k": "code", "l": "py", "c": "sq = lambda x: x*x\nlist(map(lambda x: x*2, [1,2,3]))       # [2,4,6]\nlist(filter(lambda x: x > 1, [1,2,3]))  # [2,3]\nfrom functools import reduce\nreduce(lambda a, b: a*b, range(1, 6))   # 120\nsorted(words, key=lambda w: (len(w), w))"}]}, {"h": "Scope (LEGB)", "b": [{"k": "code", "l": "py", "c": "count = 0\ndef inc():\n    global count     # modify module-level name\n    count += 1\ndef outer():\n    x = 1\n    def inner():\n        nonlocal x   # modify enclosing function's name\n        x += 1"}]}, {"h": "Recursion", "b": [{"k": "code", "l": "py", "c": "def fact(n): return 1 if n <= 1 else n * fact(n-1)\ndef total(x): return 1 if x == 1 else x + total(x-1)"}]}, {"h": "Built-ins worth knowing", "b": [{"k": "tbl", "h": null, "r": [["type, id, dir, help, str, repr", "inspect objects"], ["len, sum, min, max, abs, round", "numbers & sizes"], ["sorted, reversed, enumerate, zip", "iteration helpers"], ["any, all", "True if any / all items truthy"], ["map, filter, range, isinstance", "functional / checks"]]}]}, {"h": "Modules", "b": [{"k": "code", "l": "py", "c": "import math                 # math.sqrt(16)\nfrom math import pi, sqrt\nimport numpy as np\nif __name__ == \"__main__\":  # runs only when executed directly\n    main()"}]}, {"h": "Pickling (save Python objects)", "b": [{"k": "code", "l": "py", "c": "import pickle\nwith open('data.pkl', 'wb') as f: pickle.dump(obj, f)\nwith open('data.pkl', 'rb') as f: obj = pickle.load(f)"}, {"k": "tip", "c": "Only unpickle files you trust: loading a pickle can run code."}]}]}, {"id": "py-oop", "g": "Python", "i": "🧱", "t": "OOP in Python", "d": "Class, object, inheritance, overriding, data hiding", "s": [{"h": "Class → objects", "b": [{"k": "vis", "t": "svg", "ti": "One class, two objects with their own data", "c": ["<svg viewBox=\"0 0 760 230\">", "<defs><marker id=\"ooA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--mut)\"/><\/marker><\/defs>", "<rect x=\"20\" y=\"20\" width=\"230\" height=\"190\" rx=\"12\" class=\"sv-hl\"/>", "<text x=\"135\" y=\"46\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"15\">class Student<\/text>", "<line x1=\"20\" y1=\"58\" x2=\"250\" y2=\"58\" stroke=\"var(--accent)\" stroke-opacity=\".4\"/>", "<text x=\"36\" y=\"82\" class=\"sv-s\">attributes<\/text>", "<text x=\"36\" y=\"104\" class=\"sv-t sv-m\" font-size=\"12.5\">name<\/text><text x=\"36\" y=\"124\" class=\"sv-t sv-m\" font-size=\"12.5\">marks<\/text>", "<line x1=\"20\" y1=\"138\" x2=\"250\" y2=\"138\" stroke=\"var(--accent)\" stroke-opacity=\".4\"/>", "<text x=\"36\" y=\"160\" class=\"sv-s\">methods<\/text>", "<text x=\"36\" y=\"182\" class=\"sv-t sv-m\" font-size=\"12.5\">gpa()<\/text><text x=\"110\" y=\"182\" class=\"sv-t sv-m\" font-size=\"12.5\">__str__()<\/text>", "<path d=\"M254 90 C320 90 330 60 400 60\" class=\"sv-a\" marker-end=\"url(#ooA)\"/><path d=\"M254 150 C320 150 330 170 400 170\" class=\"sv-a\" marker-end=\"url(#ooA)\"/>", "<text x=\"300\" y=\"70\" class=\"sv-s sv-m\">Student(\"Asha\", …)<\/text><text x=\"300\" y=\"186\" class=\"sv-s sv-m\">Student(\"Ravi\", …)<\/text>", "<rect x=\"404\" y=\"24\" width=\"320\" height=\"76\" rx=\"12\" class=\"sv-box\"/>", "<text x=\"420\" y=\"48\" class=\"sv-t\">s1<\/text><text x=\"420\" y=\"70\" class=\"sv-s sv-m\">name = 'Asha'   marks = [80, 90]<\/text><text x=\"420\" y=\"90\" class=\"sv-s sv-m\">s1.gpa() → 8.5<\/text>", "<rect x=\"404\" y=\"134\" width=\"320\" height=\"76\" rx=\"12\" class=\"sv-box\"/>", "<text x=\"420\" y=\"158\" class=\"sv-t\">s2<\/text><text x=\"420\" y=\"180\" class=\"sv-s sv-m\">name = 'Ravi'   marks = [60, 70]<\/text><text x=\"420\" y=\"200\" class=\"sv-s sv-m\">s2.gpa() → 6.5<\/text>", "<\/svg>", "% The class is the blueprint (which attributes and methods exist). Each object made from it holds its own values. self inside a method means \"the object this method was called on\"."]}]}, {"h": "Inheritance and overriding", "b": [{"k": "vis", "t": "tree", "ti": "", "c": ["Person :: name · info() → 'Person Ravi'", "  * Employee(Person) :: + salary · info() overrides → super().info() + ', salary 50000'", "    Manager(Employee) :: + team · inherits Employee's info()", "  Student(Person) :: + marks · inherits Person's info()", "% A child class gets everything from its parent and can replace (override) a method. super() calls the parent's version."]}, {"k": "vis", "t": "c2o", "ti": "", "c": ["e = Employee('Ravi', 50000); e.info() => 'Person Ravi, salary 50000'", "isinstance(e, Person) => True", "acct.__pin =x AttributeError (name-mangled: double underscore hides it)", "acct._Account__pin => 1234   (the mangled name still exists)"]}, {"k": "mem", "c": ["Pillars: **Encapsulation, Abstraction, Inheritance, Polymorphism** (\"A PIE\")."]}]}, {"h": "Class & object", "b": [{"k": "code", "l": "py", "c": "class Student:\n    school = \"C-DAC\"                 # class attribute (shared)\n\n    def __init__(self, sid, name, marks):\n        self.sid = sid               # instance attributes\n        self.name = name\n        self.marks = marks\n\n    def gpa(self):                   # instance method\n        return round(sum(self.marks) / len(self.marks) / 10, 2)\n\n    def __str__(self):               # print(obj)\n        return f\"{self.sid} {self.name}\"\n\ns = Student(1, \"Asha\", [80, 90, 70])\nprint(s, s.gpa())"}]}, {"h": "The four pillars", "b": [{"k": "tbl", "h": null, "r": [["Encapsulation", "bundle data + methods; hide internals"], ["Abstraction", "expose what, hide how (abc.ABC, @abstractmethod)"], ["Inheritance", "child reuses parent: class Child(Parent)"], ["Polymorphism", "same method name, different behaviour"]]}]}, {"h": "Inheritance & overriding", "b": [{"k": "code", "l": "py", "c": "class Person:\n    def __init__(self, name): self.name = name\n    def info(self): return f\"Person {self.name}\"\n\nclass Employee(Person):\n    def __init__(self, name, salary):\n        super().__init__(name)       # call parent constructor\n        self.salary = salary\n    def info(self):                  # override\n        return super().info() + f\", salary {self.salary}\""}, {"k": "tbl", "h": null, "r": [["Single / Multiple / Multilevel / Hierarchical", "class C(A, B) is multiple; MRO decides lookup order (C.__mro__)"]]}]}, {"h": "Overloading", "b": [{"k": "tip", "c": "Python has no method overloading by signature: the last def wins. Use default args or *args. Operator overloading uses dunder methods."}, {"k": "code", "l": "py", "c": "class Vec:\n    def __init__(self, x, y): self.x, self.y = x, y\n    def __add__(self, o): return Vec(self.x+o.x, self.y+o.y)\n    def __eq__(self, o): return (self.x, self.y) == (o.x, o.y)\n    def __len__(self): return 2"}]}, {"h": "Data hiding", "b": [{"k": "code", "l": "py", "c": "class Account:\n    def __init__(self, bal):\n        self._bal = bal        # _single: \"internal\" by convention\n        self.__pin = 1234      # __double: name-mangled to _Account__pin\n\n    @property                  # getter\n    def balance(self): return self._bal\n    @balance.setter            # setter with validation\n    def balance(self, v):\n        if v < 0: raise ValueError(\"negative\")\n        self._bal = v"}]}, {"h": "Class & static methods", "b": [{"k": "code", "l": "py", "c": "class Date:\n    @classmethod\n    def from_str(cls, s): return cls(*map(int, s.split('-')))\n    @staticmethod\n    def is_leap(y): return y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)"}]}, {"h": "Abstract class", "b": [{"k": "code", "l": "py", "c": "from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self): ...\nclass Circle(Shape):\n    def __init__(self, r): self.r = r\n    def area(self): return 3.14159 * self.r ** 2"}]}, {"h": "Object references", "b": [{"k": "tip", "c": "Variables are names bound to objects. a = b binds both to one object; `is` tests identity, `==` tests value. Mutable objects passed to a function can be changed inside it."}]}]}, {"id": "py-advanced", "g": "Python", "i": "✨", "t": "Regex, Generators, Decorators", "d": "re module, yield, @decorator", "s": [{"h": "What a decorator actually does", "b": [{"k": "vis", "t": "seq", "ti": "Calling a decorated method: s.display()", "c": ["participants: caller, wrapper, display", "caller -> wrapper : s.display()", "note wrapper : print(\"Calling display\")", "wrapper -> display : func(*args, **kwargs)", "display --> wrapper : result", "note wrapper : print(\"display done\")", "wrapper --> caller : return result", "% @log_call replaced display with wrapper. Every call goes through wrapper first, which runs extra code before and after the real function."]}]}, {"h": "A generator runs in pieces", "b": [{"k": "vis", "t": "seq", "ti": "g = evens(4)", "c": ["participants: caller, generator", "caller -> generator : next(g)", "generator --> caller : yield 0   (pauses here)", "caller -> generator : next(g)", "generator --> caller : yield 2   (resumes, pauses)", "caller -> generator : next(g)", "generator --> caller : yield 4", "caller -> generator : next(g)", "generator --> caller : StopIteration (no more values)", "% Creating g runs nothing. Each next() runs until the next yield, hands back one value, and freezes. A for loop calls next() for you and stops at StopIteration."]}]}, {"h": "Reading a regex", "b": [{"k": "vis", "t": "anat", "ti": "", "c": ["\"^ :: start of text\"", "\"[\\w.]+ :: 1+ letters, digits, _ or .\"", "\"@ :: a literal @\"", "\"\\w+ :: 1+ word characters\"", "\"\\. :: a literal dot\"", "\"(com|in) :: com OR in\"", "\"$ :: end of text\"", "% This pattern matches asha.s@cdac.in but not asha@cdac.org. \\d digit, \\w word char, \\s space; capitals (\\D \\W \\S) mean NOT."]}, {"k": "vis", "t": "c2o", "ti": "", "c": ["re.findall(r\"\\d+\", \"a1b22c333\") => ['1', '22', '333']", "re.sub(r\"\\s+\", \" \", \"a   b\") => 'a b'", "re.match(r\"\\d\", \"a1\") => None      (match only checks the START)", "re.search(r\"\\d\", \"a1\").group() => '1'"]}]}, {"h": "Regular expressions", "b": [{"k": "code", "l": "py", "c": "import re\nre.search(r\"\\d+\", \"Order 42\")        # first match anywhere → m.group()\nre.match(r\"Ord\", \"Order 42\")         # only at the start\nre.fullmatch(r\"\\d{6}\", \"400614\")     # whole string\nre.findall(r\"\\w+@\\w+\\.\\w+\", text)    # all matches (list)\nre.sub(r\"\\s+\", \" \", text)            # replace\nre.split(r\"[,;]\\s*\", \"a, b;c\")       # ['a','b','c']\np = re.compile(r\"(?P<y>\\d{4})-(?P<m>\\d{2})\")\np.search(\"2026-11\").group(\"y\")       # '2026'"}, {"k": "tbl", "h": null, "r": [[". ^ $", "any char, start, end"], ["\\d \\w \\s (\\D \\W \\S)", "digit, word char, whitespace (and negations)"], ["* + ? {m,n}", "0+, 1+, 0/1, m to n"], ["*? +?", "lazy (shortest)"], ["[abc] [^abc] [a-z]", "character class"], ["( ) (?: ) |", "group, non-capturing group, OR"], ["\\b", "word boundary"], ["re.I / re.M / re.S", "ignore case / multiline / dot matches newline"]]}, {"k": "tip", "c": "Always use raw strings r\"...\" so backslashes reach the regex engine."}]}, {"h": "Generators", "b": [{"k": "code", "l": "py", "c": "def evens(limit):\n    for n in range(0, limit + 1, 2):\n        yield n                   # pauses here, resumes on next()\n\ng = evens(10)\nnext(g), next(g)                  # 0, 2\nlist(evens(10))                   # [0,2,4,6,8,10]\nsquares = (x*x for x in range(10**6))   # generator expression, lazy"}, {"k": "tip", "c": "Generators produce values one at a time, so memory stays small. They can be iterated only once."}]}, {"h": "Decorators", "b": [{"k": "code", "l": "py", "c": "import functools, time\ndef log_call(func):\n    @functools.wraps(func)            # keep name/docstring\n    def wrapper(*args, **kwargs):\n        print(f\"Calling {func.__name__}\")\n        result = func(*args, **kwargs)\n        print(f\"{func.__name__} done\")\n        return result\n    return wrapper\n\nclass Student:\n    @log_call\n    def display(self): ...\n\ndef timer(func):\n    def w(*a, **k):\n        t = time.perf_counter(); r = func(*a, **k)\n        print(f\"{time.perf_counter()-t:.4f}s\"); return r\n    return w"}, {"k": "tbl", "h": null, "r": [["@decorator above def", "same as f = decorator(f)"], ["Built-in decorators", "@property, @staticmethod, @classmethod, @functools.lru_cache"]]}]}]}, {"id": "py-exceptions", "g": "Python", "i": "🚨", "t": "Exceptions & Logging", "d": "try/except/else/finally, custom errors, logging", "s": [{"h": "Which blocks run?", "b": [{"k": "vis", "t": "svg", "ti": "try / except / else / finally", "c": ["<svg viewBox=\"0 0 760 250\">", "<defs><marker id=\"exA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--mut)\"/><\/marker><\/defs>", "<rect x=\"20\" y=\"95\" width=\"110\" height=\"46\" rx=\"10\" class=\"sv-box\"/><text x=\"75\" y=\"123\" text-anchor=\"middle\" class=\"sv-t sv-m\">try<\/text>", "<path d=\"M130 118 H178\" class=\"sv-a\" marker-end=\"url(#exA)\"/>", "<polygon points=\"250,78 320,118 250,158 180,118\" class=\"sv-hl\"/><text x=\"250\" y=\"114\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">error<\/text><text x=\"250\" y=\"130\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">raised?<\/text>", "<path d=\"M250 78 V40 H388\" class=\"sv-a\" marker-end=\"url(#exA)\"/><text x=\"262\" y=\"60\" class=\"sv-green\">no<\/text>", "<rect x=\"392\" y=\"18\" width=\"130\" height=\"44\" rx=\"10\" class=\"sv-good\"/><text x=\"457\" y=\"45\" text-anchor=\"middle\" class=\"sv-t sv-m\">else<\/text>", "<path d=\"M250 158 V200 H388\" class=\"sv-a\" marker-end=\"url(#exA)\"/><text x=\"262\" y=\"186\" class=\"sv-red\">yes<\/text>", "<rect x=\"392\" y=\"178\" width=\"130\" height=\"44\" rx=\"10\" class=\"sv-bad\"/><text x=\"457\" y=\"200\" text-anchor=\"middle\" class=\"sv-t sv-m\">except …<\/text><text x=\"457\" y=\"215\" text-anchor=\"middle\" class=\"sv-s\">first matching type<\/text>", "<path d=\"M522 40 H600 V96\" class=\"sv-a\" marker-end=\"url(#exA)\"/><path d=\"M522 200 H600 V142\" class=\"sv-a\" marker-end=\"url(#exA)\"/>", "<rect x=\"545\" y=\"98\" width=\"190\" height=\"42\" rx=\"10\" class=\"sv-hl\"/><text x=\"640\" y=\"124\" text-anchor=\"middle\" class=\"sv-t sv-m\">finally (always)<\/text>", "<text x=\"20\" y=\"232\" class=\"sv-s\">No matching except? finally still runs, then the error continues upward.<\/text>", "<\/svg>", "% Start at try. If no error, go up to else. If an error, go down to the first except whose type matches. Both paths end in finally."]}, {"k": "vis", "t": "c2o", "ti": "", "c": ["## def run(x): try: r = 10 / int(x) … (prints which blocks ran)", "run(\"5\") => try → else → finally", "run(\"0\") => try → except ZeroDivisionError → finally", "run(\"a\") => try → except ValueError → finally"]}]}, {"h": "Logging levels", "b": [{"k": "vis", "t": "ladder", "ti": "Set level=WARNING → only the last three are written", "c": ["DEBUG :: details", "INFO :: normal events", "* WARNING :: something odd", "ERROR :: a failure", "CRITICAL :: app down", "% Levels are ranked. A logger set to one level keeps that level and everything to its right."]}]}, {"h": "Structure", "b": [{"k": "code", "l": "py", "c": "try:\n    x = int(input())\n    r = 10 / x\nexcept ValueError:\n    print(\"not a number\")\nexcept ZeroDivisionError as e:\n    print(\"error:\", e)\nexcept (TypeError, KeyError):\n    print(\"type or key problem\")\nelse:\n    print(\"no error:\", r)        # runs only if try succeeded\nfinally:\n    print(\"always runs\")         # cleanup"}]}, {"h": "Common exceptions", "b": [{"k": "tbl", "h": null, "r": [["ValueError", "right type, bad value: int('abc')"], ["TypeError", "wrong type: '1' + 1"], ["ZeroDivisionError", "1 / 0"], ["IndexError / KeyError", "bad list index / missing dict key"], ["FileNotFoundError", "open() on a missing file"], ["AttributeError / NameError", "no such attribute / undefined name"], ["ImportError / ModuleNotFoundError", "import failed"]]}]}, {"h": "Raise & custom exceptions", "b": [{"k": "code", "l": "py", "c": "class InsufficientFunds(Exception):\n    def __init__(self, need):\n        super().__init__(f\"Need {need} more\")\n\ndef withdraw(bal, amt):\n    if amt > bal:\n        raise InsufficientFunds(amt - bal)\n    return bal - amt\n\nraise ValueError(\"bad\") from err   # chain exceptions"}]}, {"h": "Logging", "b": [{"k": "code", "l": "py", "c": "import logging\nlogging.basicConfig(\n    filename=\"app.log\", level=logging.DEBUG,\n    format=\"%(asctime)s %(levelname)s %(name)s: %(message)s\")\nlog = logging.getLogger(__name__)\n\nlog.debug(\"detail\");  log.info(\"started\")\nlog.warning(\"disk 90%\");  log.error(\"failed\")\ntry: 1/0\nexcept ZeroDivisionError: log.exception(\"calc failed\")  # adds traceback"}, {"k": "tbl", "h": null, "r": [["DEBUG < INFO < WARNING < ERROR < CRITICAL", "levels; messages below the set level are dropped"], ["Handlers", "FileHandler, StreamHandler, RotatingFileHandler"]]}]}]}, {"id": "py-files", "g": "Python", "i": "📁", "t": "Files, CSV & JSON", "d": "open modes, with, csv, json", "s": [{"h": "Open modes compared", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### open(path, mode)", "mode | read | write | creates file | erases old content | writes at", "'r' | ✓ | ✗ | ✗ | ✗ | –", "'w' | ✗ | ✓ | ✓ | ✓ | start", "'a' | ✗ | ✓ | ✓ | ✗ | end", "'x' | ✗ | ✓ | ✓ (error if it exists) | ✗ | start", "'r+' | ✓ | ✓ | ✗ | ✗ | start", "'w+' | ✓ | ✓ | ✓ | ✓ | start", "% Pick the row that matches what you need. 'w' is the dangerous one: it empties the file the moment it opens. Add 'b' (rb, wb) for binary files."]}]}, {"h": "JSON ↔ Python", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["json.dumps({'a': True, 'b': None}) => '{\"a\": true, \"b\": null}'", "json.loads('[1, 2]') => [1, 2]", "json.load(f) / json.dump(obj, f) =~ the versions **without s** read and write **files**"]}]}, {"h": "Open modes", "b": [{"k": "tbl", "h": null, "r": [["'r'", "read (default; error if missing)"], ["'w'", "write (creates / overwrites)"], ["'a'", "append"], ["'x'", "create, fail if exists"], ["'b' / 't'", "binary / text, e.g. 'rb'"], ["'+'", "read and write, e.g. 'r+'"]]}]}, {"h": "Text files", "b": [{"k": "code", "l": "py", "c": "with open(\"notes.txt\", \"w\", encoding=\"utf-8\") as f:   # auto-closes\n    f.write(\"line 1\\n\")\n    f.writelines([\"a\\n\", \"b\\n\"])\n\nwith open(\"notes.txt\") as f:\n    data = f.read()          # whole file\n    # f.readline()  one line   f.readlines()  list of lines\nwith open(\"notes.txt\") as f:\n    for line in f:           # memory-friendly\n        print(line.rstrip())"}]}, {"h": "CSV", "b": [{"k": "code", "l": "py", "c": "import csv\nwith open(\"emp.csv\", newline=\"\") as f:\n    for row in csv.DictReader(f):       # each row is a dict\n        print(row[\"name\"], row[\"salary\"])\n\nwith open(\"out.csv\", \"w\", newline=\"\") as f:\n    w = csv.writer(f)\n    w.writerow([\"name\", \"salary\"])\n    w.writerows([[\"Asha\", 50000], [\"Ravi\", 42000]])"}]}, {"h": "JSON", "b": [{"k": "code", "l": "py", "c": "import json\nobj = json.loads('{\"a\": 1, \"b\": [1, 2]}')   # str → dict\ntext = json.dumps(obj, indent=2)            # dict → str\nwith open(\"data.json\") as f: obj = json.load(f)\nwith open(\"data.json\", \"w\") as f: json.dump(obj, f, indent=2)"}, {"k": "tbl", "h": null, "r": [["JSON ↔ Python", "object↔dict, array↔list, string↔str, true/false↔True/False, null↔None"]]}]}, {"h": "Context managers", "b": [{"k": "code", "l": "py", "c": "from contextlib import contextmanager\n@contextmanager\ndef opened(path):\n    f = open(path)\n    try: yield f\n    finally: f.close()\n# class version: define __enter__ and __exit__"}]}, {"h": "Paths", "b": [{"k": "code", "l": "py", "c": "from pathlib import Path\np = Path(\"data\") / \"sales.csv\"\np.exists(), p.suffix, p.stem, p.read_text()\nlist(Path(\".\").glob(\"*.csv\"))"}]}]}, {"id": "numpy", "g": "Python", "i": "🔢", "t": "NumPy", "d": "ndarray, shapes, indexing, broadcasting, maths", "s": [{"h": "axis=0 vs axis=1", "b": [{"k": "vis", "t": "matrix", "ti": "a = np.array([[1, 2, 3], [4, 5, 6]])", "c": ["1 2 3", "4 5 6", "% axis=0 runs down the rows (blue row at the bottom, one total per column). axis=1 runs across the columns (cyan column on the right, one total per row)."]}]}, {"h": "Broadcasting: the small array is stretched", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### a  (2, 3)", "c0 | c1 | c2", "1 | 2 | 3", "4 | 5 | 6", ">> +", "### b  (3,) stretched to (2, 3)", "c0 | c1 | c2", "10 | 20 | 30", "- 10 | 20 | 30", ">> =", "### a + b", "c0 | c1 | c2", "11 | 22 | 33", "14 | 25 | 36", "% b has one row, so NumPy repeats it for every row of a (the struck-through row is the copy it makes in its head). Shapes are matched from the right: each size must be equal or 1."]}, {"k": "vis", "t": "c2o", "ti": "", "c": ["a.shape => (2, 3)", "a.reshape(3, 2) => [[1, 2], [3, 4], [5, 6]]", "a[a > 3] => [4, 5, 6]", "a * 10 => [[10, 20, 30], [40, 50, 60]]", "v = a[0]; v[0] = 99; a[0, 0] => 99    (a slice is a VIEW of a)"]}]}, {"h": "Create arrays", "b": [{"k": "code", "l": "py", "c": "import numpy as np\na = np.array([1, 2, 3])\nm = np.array([[1, 2], [3, 4]])\nnp.zeros((2, 3)), np.ones(3), np.full((2,2), 7), np.eye(3)\nnp.arange(0, 10, 2)        # [0 2 4 6 8]\nnp.linspace(0, 1, 5)       # 5 evenly spaced points\nnp.random.default_rng(42).integers(1, 100, size=(3, 3))"}]}, {"h": "Inspect", "b": [{"k": "tbl", "h": null, "r": [["a.shape / a.ndim / a.size", "dimensions tuple / number of axes / total items"], ["a.dtype / a.astype(float)", "element type / convert"], ["a.reshape(2, -1)", "new shape (-1 = work it out)"], ["a.ravel() / a.flatten()", "to 1-D (view / copy)"], ["a.T", "transpose"]]}]}, {"h": "Indexing & slicing", "b": [{"k": "code", "l": "py", "c": "m[0, 1]          # row 0, col 1\nm[:, 0]          # first column\nm[1:, :]         # rows from 1\na[a > 2]         # boolean mask\na[[0, 2]]        # fancy indexing\nnp.where(a > 2, \"hi\", \"lo\")"}, {"k": "tip", "c": "Slices are views: changing them changes the original. Use .copy() to detach."}]}, {"h": "Maths & aggregation", "b": [{"k": "tbl", "h": null, "r": [["a + 1, a * b, a ** 2", "element-wise (vectorised, no loops)"], ["a @ b / np.dot(a, b)", "matrix multiplication"], ["sum, mean, median, std, var, min, max", "np.mean(m, axis=0) = per column; axis=1 = per row"], ["argmax / argmin / cumsum", "index of max / min, running total"], ["np.sqrt, np.exp, np.log, np.round", "universal functions (ufuncs)"], ["np.unique(a, return_counts=True)", "distinct values + counts"], ["np.sort, np.argsort", "sorted values / sorting indices"]]}]}, {"h": "Broadcasting", "b": [{"k": "code", "l": "py", "c": "m = np.array([[1, 2, 3], [4, 5, 6]])   # (2,3)\nm + np.array([10, 20, 30])             # (3,) stretched over rows\nm - m.mean(axis=0)                      # centre each column"}, {"k": "tip", "c": "Shapes are compared from the right: sizes must be equal or 1."}]}, {"h": "Combine & split", "b": [{"k": "code", "l": "py", "c": "np.concatenate([a, b]); np.vstack([a, b]); np.hstack([a, b])\nnp.split(a, 3)"}]}, {"h": "Lab patterns", "b": [{"k": "code", "l": "py", "c": "data = np.genfromtxt(\"data.csv\", delimiter=\",\", skip_header=1)  # CSV → array\narr = df.to_numpy()                                             # DataFrame → array\nfrom PIL import Image\nimg = np.array(Image.open(\"pic.png\"))      # image → array (H, W, channels)\nImage.fromarray(img.astype(\"uint8\")).show()"}]}, {"h": "NaN handling", "b": [{"k": "code", "l": "py", "c": "np.isnan(a).sum(); np.nanmean(a); np.nan_to_num(a, nan=0)"}]}]}, {"id": "pandas", "g": "Python", "i": "🐼", "t": "Pandas", "d": "Series, DataFrame, select, filter, group, merge", "s": [{"h": "groupby: split → apply → combine", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### df", "name | dept | salary", "~1 Asha | IT | 50000", "~2 Ravi | HR | 42000", "~1 Neha | IT | 61000", "~1 Om | IT | 39000", "~2 Mira | HR | 47000", ">> groupby('dept')['salary'].mean()", "### result", "dept | salary", "~2 HR | 44500", "~1 IT | 50000", "% Rows with the same dept are coloured alike (split). mean() runs on each colour separately (apply). One row per group comes out (combine)."]}]}, {"h": "merge (a left join)", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### emp", "id | name | dept_id", "1 | Asha | 10", "2 | Ravi | 20", "3 | Neha | 40", "### dept", "dept_id | dname", "10 | IT", "20 | HR", "30 | Ops", ">> pd.merge(emp, dept, on='dept_id', how='left')", "### result", "id | name | dept_id | +dname", "1 | Asha | 10 | IT", "2 | Ravi | 20 | HR", "3 | Neha | 40 | NaN", "% how='left' keeps every emp row. Neha's dept 40 has no match, so dname is NaN. Ops (30) has no employee, so it is not in the result."]}]}, {"h": "loc vs iloc", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["df.loc[0, 'name'] => 'Asha'          (row label 0, column label 'name')", "df.iloc[0, 0] => 'Asha'              (row position 0, column position 0)", "df.loc[df.salary > 45000, 'name'] => Asha, Neha, Mira", "df['salary'] => a Series (one column)", "df[['salary']] => a DataFrame (double brackets)"]}]}, {"h": "Create & load", "b": [{"k": "code", "l": "py", "c": "import pandas as pd\ns = pd.Series([10, 20], index=['a', 'b'])\ndf = pd.DataFrame({'name': ['Asha', 'Ravi'], 'marks': [88, 72]})\ndf = pd.read_csv(\"diamonds.csv\")      # read_excel, read_json, read_sql, read_html\ndf.to_csv(\"out.csv\", index=False)"}]}, {"h": "Explore", "b": [{"k": "tbl", "h": null, "r": [["df.head(), df.tail(), df.sample(5)", "first / last / random rows"], ["df.shape, df.columns, df.dtypes", "size, column names, types"], ["df.info(), df.describe()", "non-null counts & types / summary stats"], ["df['col'].value_counts()", "frequency of each value"], ["df['col'].unique(), nunique()", "distinct values / count"]]}]}, {"h": "Select", "b": [{"k": "code", "l": "py", "c": "df['marks']                 # Series\ndf[['name', 'marks']]       # DataFrame\ndf.loc[0, 'name']           # by label\ndf.loc[df.marks > 80, ['name']]\ndf.iloc[0:5, 0:2]           # by position\ndf.query(\"marks > 80 and city == 'Pune'\")\ndf[df['city'].isin(['Pune', 'Mumbai'])]\ndf[df['name'].str.contains('a', case=False)]"}]}, {"h": "Add / change / remove", "b": [{"k": "code", "l": "py", "c": "df['grade'] = np.where(df.marks >= 75, 'A', 'B')\ndf['total'] = df['m1'] + df['m2']\ndf = df.assign(pct=lambda d: d.total / 2)\ndf.rename(columns={'m1': 'maths'}, inplace=True)\ndf.drop(columns=['tmp']); df.drop(index=[0, 1])\ndf['marks'] = df['marks'].astype(int)\ndf['col'].apply(lambda x: x * 2); df['city'].map({'PUN': 'Pune'})"}]}, {"h": "Sort", "b": [{"k": "code", "l": "py", "c": "df.sort_values('marks', ascending=False)\ndf.sort_values(['dept', 'salary'], ascending=[True, False])\ndf.nlargest(3, 'marks')"}]}, {"h": "Group & aggregate", "b": [{"k": "code", "l": "py", "c": "df.groupby('dept')['salary'].mean()\ndf.groupby('dept').agg(avg=('salary', 'mean'), n=('id', 'count'))\ndf.pivot_table(index='dept', columns='year', values='sales', aggfunc='sum')\npd.crosstab(df.gender, df.dept)"}]}, {"h": "Combine", "b": [{"k": "code", "l": "py", "c": "pd.merge(emp, dept, on='dept_id', how='left')   # inner/left/right/outer\npd.concat([df1, df2], ignore_index=True)        # stack rows\npd.concat([df1, df2], axis=1)                   # side by side"}]}, {"h": "Reshape", "b": [{"k": "code", "l": "py", "c": "df.melt(id_vars='id', var_name='subject', value_name='marks')  # wide → long\nlong.pivot(index='id', columns='subject', values='marks')      # long → wide"}]}, {"h": "Dates", "b": [{"k": "code", "l": "py", "c": "df['date'] = pd.to_datetime(df['date'])\ndf['date'].dt.year, df['date'].dt.month_name()\ndf.set_index('date').resample('ME')['sales'].sum()   # 'ME' = month end ('M' in pandas < 2.2)"}, {"k": "tip", "c": "Chained indexing df[df.x > 1]['y'] = 0 may not write back. Use df.loc[df.x > 1, 'y'] = 0."}]}]}, {"id": "data-cleaning", "g": "Python", "i": "🧹", "t": "Data Cleaning & Wrangling", "d": "Missing values, duplicates, types, outliers", "s": [{"h": "Before and after", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### raw", "name | city | age | salary", "' asha ' | bombay | 24 | '50000'", "RAVI | Pune | NaN | 'abc'", "Neha | Mumbai | 29 | '61000'", "- Neha | Mumbai | 29 | '61000'", ">> strip/title · replace · fillna(median) · to_numeric · drop_duplicates", "### clean", "name | city | age | salary", "Asha | Mumbai | 24 | 50000", "Ravi | Pune | 29 | NaN", "Neha | Mumbai | 29 | 61000", "% Each fix targets one problem: spaces and case in names, an old city name, a missing age (filled with the median, 29), a salary that isn't a number (now NaN, so it can be handled), and a duplicate row (struck through)."]}]}, {"h": "Spotting an outlier with IQR", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["## salaries = [30, 32, 35, 36, 40, 41, 200]", "Q1, Q3 => 33.5, 40.5", "IQR = Q3 - Q1 => 7.0", "range = Q1 - 1.5·IQR … Q3 + 1.5·IQR => 23.0 … 51.0", "200 => outside the range → outlier", "% Anything below the lower fence or above the upper fence is flagged."]}]}, {"h": "Find problems", "b": [{"k": "code", "l": "py", "c": "df.isna().sum()                 # missing per column\ndf.duplicated().sum()           # duplicate rows\ndf.dtypes                       # wrong types?\ndf.describe()                   # odd min/max?\ndf['city'].value_counts()       # spelling variants"}]}, {"h": "Missing values", "b": [{"k": "tbl", "h": null, "r": [["df.dropna()", "drop rows with any NaN"], ["df.dropna(subset=['email'], thresh=…)", "only check some columns / keep rows with ≥ thresh values"], ["df.fillna(0)", "constant"], ["df['age'].fillna(df['age'].median())", "median (robust to outliers)"], ["df['city'].fillna(df['city'].mode()[0])", "most frequent"], ["df.ffill() / df.bfill()", "carry previous / next value"], ["df['v'].interpolate()", "fill numeric gaps"]]}]}, {"h": "Duplicates & text", "b": [{"k": "code", "l": "py", "c": "df.drop_duplicates(subset=['email'], keep='first')\ndf['name'] = df['name'].str.strip().str.title()\ndf['phone'] = df['phone'].str.replace(r'\\D', '', regex=True)\ndf['city'] = df['city'].replace({'Bombay': 'Mumbai'})"}]}, {"h": "Types", "b": [{"k": "code", "l": "py", "c": "df['price'] = pd.to_numeric(df['price'], errors='coerce')  # bad → NaN\ndf['date'] = pd.to_datetime(df['date'], errors='coerce', dayfirst=True)\ndf['grade'] = df['grade'].astype('category')"}]}, {"h": "Outliers (IQR rule)", "b": [{"k": "code", "l": "py", "c": "q1, q3 = df['sal'].quantile([.25, .75])\niqr = q3 - q1\nok = df['sal'].between(q1 - 1.5*iqr, q3 + 1.5*iqr)\ndf = df[ok]                     # or clip: df['sal'].clip(lower, upper)"}]}, {"h": "Transform", "b": [{"k": "code", "l": "py", "c": "df['age_band'] = pd.cut(df.age, bins=[0, 25, 40, 60, 100], labels=['<25','25-40','40-60','60+'])\ndf['q'] = pd.qcut(df.sal, 4, labels=False)        # quartiles\npd.get_dummies(df, columns=['city'], drop_first=True)   # one-hot\n(df.x - df.x.min()) / (df
