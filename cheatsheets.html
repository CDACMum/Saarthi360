 sqrt, round, ceiling, floor, exp, log, max, min, sum, cumsum"], ["Character", "nchar, toupper, tolower, substr, paste, sprintf, gsub, grepl, strsplit, trimws"], ["Statistical", "mean, median, sd, var, quantile, range, cor, table, summary, scale"], ["Probability", "rnorm, runif, sample, set.seed, dnorm, pnorm"]]}]}, {"h": "Apply family", "b": [{"k": "code", "l": "r", "c": "sapply(1:5, function(i) i^2)        # → vector\nlapply(list(a = 1:3, b = 4:6), mean) # → list\napply(m, 2, max)                    # per column\ntapply(df$salary, df$dept, mean)    # per group\nsplit(ChickWeight, ChickWeight$Diet) # list of data frames by group"}]}, {"h": "ChickWeight case study", "b": [{"k": "code", "l": "r", "c": "cw <- ChickWeight\nc34 <- subset(cw, Chick == 34)\nplot(c34$Time, c34$weight, type = \"b\", main = \"Chick 34\")\ng4 <- subset(cw, Diet == 4)\nboxplot(weight ~ Time, data = g4)\nm4 <- tapply(g4$weight, g4$Time, mean)\nm2 <- tapply(cw$weight[cw$Diet == 2], cw$Time[cw$Diet == 2], mean)\nplot(as.numeric(names(m4)), m4, type = \"l\", col = \"red\", main = \"Mean weight\")\nlines(as.numeric(names(m2)), m2, col = \"blue\")\nlegend(\"topleft\", c(\"Diet 4\", \"Diet 2\"), col = c(\"red\", \"blue\"), lty = 1)"}]}, {"h": "R Markdown", "b": [{"k": "code", "l": "md", "c": "---\ntitle: \"Sales Report\"\noutput: html_document     # or pdf_document, word_document\n---\n## Summary\n```{r, echo=FALSE}\nsummary(df)\n```\nMean salary is `r mean(df$salary)`."}, {"k": "tbl", "h": null, "r": [["Knit (Ctrl+Shift+K)", "render the report"], ["echo=FALSE / eval=FALSE / message=FALSE", "hide code / don't run / hide messages"]]}]}]}, {"id": "dbms-concepts", "g": "Databases & SQL", "i": "🗄️", "t": "DBMS Concepts", "d": "Storage, data types, OLTP vs OLAP, data collection", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "nest", "ti": "Oracle storage: logical units inside each other", "c": ["🗄️ Database", "📚 Tablespace :: logical container → stored in data files", "🧩 Segment :: one table or index", "📏 Extent :: group of blocks", "🧱 Block"]}, {"k": "vis", "t": "tiles", "ti": "OLTP vs OLAP", "c": ["🏧 OLTP :: many small writes · current data · 3NF · ATM, booking", "📊 OLAP :: few big reads · history · star schema · dashboards, DW"]}, {"k": "mem", "c": ["Storage, small → big: **Block → Extent → Segment → Tablespace** = \"**B**ig **E**lephants **S**it **T**ogether\".", "Control file = the DB's **\"map\"**: where the data files and redo logs are.", "**OLTP = Transactions (write), OLAP = Analysis (read).**"]}], "w": 1}, {"h": "Data shapes", "b": [{"k": "vis", "t": "layers", "ti": "", "c": ["📋 Structured :: tables, fixed schema (SQL)", "🧾 Semi-structured :: JSON, XML, logs", "🖼️ Unstructured :: text, images, video"]}]}, {"h": "Core terms", "b": [{"k": "tbl", "h": null, "r": [["Database / DBMS / RDBMS", "organised data / software that manages it / DBMS storing data in related tables"], ["Table, row (tuple), column (attribute)", "relation, record, field"], ["Schema / instance", "structure / data at a moment"], ["Primary key / foreign key", "unique row id / reference to another table's key"], ["Candidate / super / composite key", "minimal unique set / any unique set / key of 2+ columns"]]}]}, {"h": "Storage structure (Oracle terms)", "b": [{"k": "tbl", "h": null, "r": [["Tablespace", "logical container for segments (tables, indexes)"], ["Data file", "physical OS file that stores a tablespace's data"], ["Control file", "small binary file: DB name, data-file & redo-log locations, checkpoints. Needed to mount the DB"], ["Redo log", "record of changes, used for recovery"], ["Block → extent → segment → tablespace", "smallest to largest storage unit"]]}]}, {"h": "Structured vs unstructured", "b": [{"k": "tbl", "h": null, "r": [["Structured", "fixed schema, rows & columns (SQL tables)"], ["Semi-structured", "self-describing tags/keys (JSON, XML, CSV logs)"], ["Unstructured", "no model (text, images, audio, video)"]]}]}, {"h": "OLTP vs OLAP", "b": [{"k": "tbl", "h": ["OLTP", "OLAP"], "r": [["Purpose", "day-to-day transactions", "analysis & reporting"], ["Queries", "short INSERT/UPDATE, few rows", "complex SELECT, aggregates over millions"], ["Design", "normalised (3NF)", "denormalised (star/snowflake)"], ["Data", "current", "historical"], ["Example", "banking, ticket booking", "sales dashboard, data warehouse"]]}]}, {"h": "Data collection", "b": [{"k": "tbl", "h": null, "r": [["Primary", "collected first-hand: surveys, forms, interviews, sensors/IoT, experiments"], ["Secondary", "already exists: databases, government open data, reports, APIs"], ["Tools", "Google/MS Forms, KoboToolbox, web scraping, APIs, log collectors (Fluentd, Kafka), ETL tools"]]}, {"k": "tip", "c": "Systematic collection = define the question → decide the fields and types → validate at entry → store with metadata (source, time)."}]}]}, {"id": "sql-basics", "g": "Databases & SQL", "i": "🧾", "t": "SQL: DDL, DML, DCL, TCL", "d": "Create, alter, insert, update, grant, commit", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "The 4 SQL families", "c": ["🏗️ DDL :: CREATE · ALTER · DROP · TRUNCATE (structure)", "✏️ DML :: SELECT · INSERT · UPDATE · DELETE (data)", "🔐 DCL :: GRANT · REVOKE (permissions)", "🔄 TCL :: COMMIT · ROLLBACK · SAVEPOINT (transactions)"]}, {"k": "vis", "t": "tiles", "ti": "ACID", "c": ["A — Atomicity :: all or nothing", "C — Consistency :: rules always hold", "I — Isolation :: no peeking at others' work", "D — Durability :: committed = permanent"]}, {"k": "mem", "c": ["DDL = **D**efine the table, DML = **M**anipulate the rows, DCL = **C**ontrol access, TCL = **T**ransaction control.", "**DELETE** = rows, can roll back · **TRUNCATE** = all rows, fast · **DROP** = the whole table."]}], "w": 1}, {"h": "Transaction timeline", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["🟢 START TRANSACTION", "💸 UPDATE A −500", "📌 SAVEPOINT s1", "💰 UPDATE B +500", "↩️ ROLLBACK TO s1 :: undoes B's +500 only", "✅ COMMIT :: saves A's −500 (B was undone)"]}, {"k": "vis", "t": "ladder", "ti": "Isolation levels (weak → strict)", "c": ["😵 READ UNCOMMITTED :: dirty reads", "📖 READ COMMITTED :: no dirty reads", "🔁 REPEATABLE READ :: MySQL default", "🔒 SERIALIZABLE :: one at a time"]}]}, {"h": "Command groups", "b": [{"k": "tbl", "h": null, "r": [["DDL", "CREATE, ALTER, DROP, TRUNCATE, RENAME (structure, auto-commit)"], ["DML", "SELECT, INSERT, UPDATE, DELETE (data)"], ["DCL", "GRANT, REVOKE (permissions)"], ["TCL", "COMMIT, ROLLBACK, SAVEPOINT (transactions)"]]}]}, {"h": "DDL", "b": [{"k": "code", "l": "sql", "c": "CREATE DATABASE company;  USE company;\nCREATE TABLE emp (\n  emp_id   INT PRIMARY KEY AUTO_INCREMENT,\n  name     VARCHAR(50) NOT NULL,\n  email    VARCHAR(100) UNIQUE,\n  salary   DECIMAL(10,2) CHECK (salary > 0),\n  dept_id  INT,\n  joined   DATE DEFAULT (CURRENT_DATE),\n  FOREIGN KEY (dept_id) REFERENCES dept(dept_id) ON DELETE SET NULL\n);\nALTER TABLE emp ADD phone VARCHAR(15);\nALTER TABLE emp MODIFY name VARCHAR(80);\nALTER TABLE emp DROP COLUMN phone;\nALTER TABLE emp RENAME COLUMN name TO full_name;\nRENAME TABLE emp TO employee;\nDROP TABLE IF EXISTS temp;"}]}, {"h": "DML", "b": [{"k": "code", "l": "sql", "c": "INSERT INTO emp (name, salary, dept_id) VALUES ('Asha', 50000, 1), ('Ravi', 42000, 2);\nUPDATE emp SET salary = salary * 1.10 WHERE dept_id = 1;\nDELETE FROM emp WHERE emp_id = 7;\nSELECT DISTINCT dept_id FROM emp;\nSELECT * FROM emp WHERE name LIKE 'A%' AND salary BETWEEN 30000 AND 60000;\nSELECT * FROM emp WHERE dept_id IN (1, 2) AND email IS NOT NULL LIMIT 10;"}, {"k": "tbl", "h": null, "r": [["LIKE 'A%' / '%a' / '_s%'", "starts with A / ends with a / s is 2nd char"]]}]}, {"h": "DELETE vs TRUNCATE vs DROP", "b": [{"k": "tbl", "h": null, "r": [["DELETE", "DML, removes chosen rows, WHERE allowed, can roll back"], ["TRUNCATE", "DDL, removes all rows, resets auto-increment, no WHERE"], ["DROP", "DDL, removes the table itself"]]}]}, {"h": "DCL", "b": [{"k": "code", "l": "sql", "c": "CREATE USER 'analyst'@'localhost' IDENTIFIED BY 'Str0ng#pw';\nGRANT SELECT, INSERT ON company.emp TO 'analyst'@'localhost';\nSHOW GRANTS FOR 'analyst'@'localhost';\nREVOKE INSERT ON company.emp FROM 'analyst'@'localhost';"}]}, {"h": "TCL & ACID", "b": [{"k": "code", "l": "sql", "c": "SET autocommit = 0;\nSTART TRANSACTION;\nUPDATE acct SET bal = bal - 500 WHERE id = 1;\nSAVEPOINT s1;\nUPDATE acct SET bal = bal + 500 WHERE id = 2;\nROLLBACK TO s1;     -- undoes only the work after s1 (B's +500)\nCOMMIT;             -- makes the rest (A's -500) permanent"}, {"k": "tbl", "h": null, "r": [["Atomicity", "all or nothing"], ["Consistency", "rules/constraints hold before and after"], ["Isolation", "concurrent transactions don't see each other's partial work"], ["Durability", "committed data survives crashes"], ["Isolation levels", "READ UNCOMMITTED < READ COMMITTED < REPEATABLE READ (MySQL default) < SERIALIZABLE"], ["Anomalies", "dirty read, non-repeatable read, phantom read"]]}]}]}, {"id": "sql-queries", "g": "Databases & SQL", "i": "🔍", "t": "Grouping, Joins & Subqueries", "d": "GROUP BY, HAVING, joins, correlated subqueries", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "The order SQL actually runs a SELECT", "c": ["📂 FROM / JOIN", "🔍 WHERE :: filter rows", "👥 GROUP BY", "🧮 HAVING :: filter groups", "🎯 SELECT", "↕️ ORDER BY", "✂️ LIMIT"]}, {"k": "vis", "t": "joins", "ti": "Joins as Venn diagrams (A = left table, B = right table)", "c": []}, {"k": "mem", "c": ["Run order: \"**F**rank **W**ent **G**rocery shopping, **H**e **S**aw **O**ranges **L**ast\" = FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.", "**WHERE filters rows, HAVING filters groups**. Aggregates (SUM, COUNT) only in HAVING, never WHERE.", "Anti join = LEFT JOIN … **WHERE right.key IS NULL**."]}], "w": 1}, {"h": "Logical order of execution", "b": [{"k": "tip", "c": "FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT. That is why a column alias from SELECT can't be used in WHERE."}]}, {"h": "Aggregates & grouping", "b": [{"k": "code", "l": "sql", "c": "SELECT dept_id, COUNT(*) AS n, AVG(salary) AS avg_sal, MAX(salary)\nFROM emp\nWHERE salary > 20000          -- filters rows\nGROUP BY dept_id\nHAVING COUNT(*) > 2           -- filters groups\nORDER BY avg_sal DESC;"}, {"k": "tbl", "h": null, "r": [["COUNT(*) vs COUNT(col)", "all rows vs non-NULL values"], ["SUM, AVG, MIN, MAX", "ignore NULLs"], ["GROUP_CONCAT(name)", "MySQL: list values in a group"]]}]}, {"h": "Joins", "b": [{"k": "code", "l": "sql", "c": "SELECT e.name, d.dname\nFROM emp e\nINNER JOIN dept d ON e.dept_id = d.dept_id;      -- matches only\n\nSELECT d.dname, e.name\nFROM dept d LEFT JOIN emp e ON e.dept_id = d.dept_id;  -- all depts, NULL if no emp\n\nSELECT d.dname FROM dept d\nLEFT JOIN emp e ON e.dept_id = d.dept_id\nWHERE e.emp_id IS NULL;                          -- depts with no employees"}, {"k": "tbl", "h": null, "r": [["INNER", "rows matching in both"], ["LEFT / RIGHT OUTER", "all from left / right + matches"], ["FULL OUTER", "all from both (MySQL: LEFT … UNION … RIGHT)"], ["CROSS", "every combination"], ["SELF", "table joined to itself (employee → manager)"]]}]}, {"h": "Subqueries", "b": [{"k": "code", "l": "sql", "c": "SELECT name FROM emp WHERE salary > (SELECT AVG(salary) FROM emp);   -- single value\nSELECT name FROM emp WHERE dept_id IN (SELECT dept_id FROM dept WHERE loc = 'Pune');\n\n-- correlated: runs once per outer row\nSELECT e.name, e.salary FROM emp e\nWHERE e.salary > (SELECT AVG(salary) FROM emp WHERE dept_id = e.dept_id);\n\nSELECT d.dname FROM dept d\nWHERE EXISTS (SELECT 1 FROM emp e WHERE e.dept_id = d.dept_id);"}]}, {"h": "Set operators", "b": [{"k": "tbl", "h": null, "r": [["UNION / UNION ALL", "combine, removing / keeping duplicates"], ["INTERSECT / EXCEPT", "common rows / rows in first only (MySQL 8.0.31+)"]]}]}]}, {"id": "sql-cte-window", "g": "Databases & SQL", "i": "🪜", "t": "CTEs, CASE & Window Functions", "d": "WITH, recursive CTE, RANK, LAG, running totals", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "mtable", "ti": "Window functions keep every row; PARTITION BY colours the groups", "c": ["dept | name | salary | ROW_NUMBER | RANK | DENSE_RANK", "~1 IT | Asha | 90 | 1 | 1 | 1", "~1 IT | Ravi | 80 | 2 | 2 | 2", "~1 IT | Neha | 80 | 3 | 2 | 2", "~1 IT | Om | 70 | 4 | 4 | 3", "~2 HR | Mira | 60 | 1 | 1 | 1", "~2 HR | Jay | 50 | 2 | 2 | 2"]}, {"k": "mem", "c": ["On a tie: **ROW_NUMBER 1-2-3-4** (no ties) · **RANK 1-2-2-4** (skips) · **DENSE_RANK 1-2-2-3** (no gap).", "**GROUP BY squashes rows; OVER() keeps them**.", "**LAG looks back, LEAD looks ahead**."]}], "w": 1}, {"h": "Recursive CTE, pictured", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["🌱 Anchor :: SELECT 1 (start row)", "🔁 Recursive part :: n + 1 FROM itself", "🛑 Stop :: WHERE n < 10", "📋 Result :: 1 … 10"]}]}, {"h": "CTE (WITH)", "b": [{"k": "code", "l": "sql", "c": "WITH dept_avg AS (\n  SELECT dept_id, AVG(salary) AS avg_sal FROM emp GROUP BY dept_id\n)\nSELECT e.name, e.salary, a.avg_sal\nFROM emp e JOIN dept_avg a ON e.dept_id = a.dept_id\nWHERE e.salary > a.avg_sal;"}]}, {"h": "Recursive CTE", "b": [{"k": "code", "l": "sql", "c": "WITH RECURSIVE nums AS (\n  SELECT 1 AS n\n  UNION ALL\n  SELECT n + 1 FROM nums WHERE n < 10\n)\nSELECT * FROM nums;\n\nWITH RECURSIVE chain AS (                    -- org hierarchy\n  SELECT emp_id, name, mgr_id, 1 AS lvl FROM emp WHERE mgr_id IS NULL\n  UNION ALL\n  SELECT e.emp_id, e.name, e.mgr_id, c.lvl + 1\n  FROM emp e JOIN chain c ON e.mgr_id = c.emp_id\n)\nSELECT * FROM chain ORDER BY lvl;"}]}, {"h": "CASE", "b": [{"k": "code", "l": "sql", "c": "SELECT name,\n  CASE WHEN salary >= 60000 THEN 'High'\n       WHEN salary >= 40000 THEN 'Mid'\n       ELSE 'Low' END AS band,\n  SUM(CASE WHEN gender = 'F' THEN 1 ELSE 0 END) OVER () AS women\nFROM emp;"}]}, {"h": "Window functions", "b": [{"k": "code", "l": "sql", "c": "SELECT name, dept_id, salary,\n  ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn,\n  RANK()       OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk,\n  DENSE_RANK() OVER (ORDER BY salary DESC) AS drnk,\n  SUM(salary)  OVER (PARTITION BY dept_id) AS dept_total,\n  SUM(salary)  OVER (ORDER BY joined ROWS UNBOUNDED PRECEDING) AS running,\n  LAG(salary)  OVER (ORDER BY joined) AS prev_sal,\n  NTILE(4)     OVER (ORDER BY salary) AS quartile\nFROM emp;"}, {"k": "tbl", "h": null, "r": [["ROW_NUMBER", "1,2,3,4 (always unique)"], ["RANK", "1,2,2,4 (gaps after ties)"], ["DENSE_RANK", "1,2,2,3 (no gaps)"], ["LAG / LEAD", "previous / next row's value"], ["FIRST_VALUE / LAST_VALUE", "first / last in the window frame"]]}]}, {"h": "Top-N per group", "b": [{"k": "code", "l": "sql", "c": "SELECT * FROM (\n  SELECT e.*, d.dname,\n         RANK() OVER (PARTITION BY e.dept_id ORDER BY salary DESC) r\n  FROM emp e JOIN dept d USING (dept_id)\n) t WHERE r = 1;"}, {"k": "tip", "c": "Window functions keep every row (unlike GROUP BY). They can't go in WHERE directly, so wrap them in a subquery or CTE."}]}]}, {"id": "sql-design", "g": "Databases & SQL", "i": "🧩", "t": "Schema Design, ER & Normal Forms", "d": "Entities, relationships, 1NF to BCNF", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "ladder", "ti": "Normal forms: each step removes one kind of repetition", "c": ["1️⃣ 1NF :: atomic values", "2️⃣ 2NF :: no partial dependency", "3️⃣ 3NF :: no transitive dependency", "🅱️ BCNF :: every determinant is a key"]}, {"k": "mem", "c": ["\"The key (1NF), the whole key (2NF), and nothing but the key (3NF), so help me Codd.\"", "**M:N relationship → junction table** with both foreign keys."]}], "w": 1}, {"h": "ER notation", "b": [{"k": "vis", "t": "tiles", "ti": "", "c": ["▭ Rectangle :: entity", "⬭ Ellipse :: attribute", "◇ Diamond :: relationship", "▭▭ Double rectangle :: weak entity", "⬭⬭ Double ellipse :: multivalued", "⇢ Dashed ellipse :: derived (age from DOB)"]}, {"k": "vis", "t": "flow", "ti": "M:N becomes 3 tables", "c": ["🎓 Student :: student_id PK", "🔗 Enrolment :: student_id FK + course_id FK", "📘 Course :: course_id PK"]}]}, {"h": "ER diagram", "b": [{"k": "tbl", "h": null, "r": [["Entity (rectangle)", "thing to store: Student, Course"], ["Attribute (ellipse)", "property; key attribute underlined; multivalued = double ellipse; derived = dashed"], ["Relationship (diamond)", "Student ENROLS in Course"], ["Weak entity (double rectangle)", "depends on owner for its key"], ["Cardinality", "1:1, 1:N, M:N"], ["Participation", "total (double line) / partial (single line)"]]}]}, {"h": "ER → tables", "b": [{"k": "tbl", "h": null, "r": [["1:N", "put the FK on the N side"], ["M:N", "new junction table with both FKs as a composite PK"], ["1:1", "FK on either side (usually the optional one)"], ["Multivalued attribute", "separate table"]]}]}, {"h": "Normal forms", "b": [{"k": "tbl", "h": null, "r": [["1NF", "atomic values, no repeating groups"], ["2NF", "1NF + no partial dependency on part of a composite key"], ["3NF", "2NF + no transitive dependency (non-key → non-key)"], ["BCNF", "every determinant is a candidate key"], ["4NF / 5NF", "no multivalued / join dependencies"]]}]}, {"h": "Example", "b": [{"k": "code", "l": "text", "c": "Unnormalised: Order(order_id, cust_name, cust_city, items=\"pen,book\")\n1NF: one item per row             → OrderItem(order_id, item, qty)\n2NF: item price depends on item   → Item(item, price)\n3NF: city depends on customer     → Customer(cust_id, name, city); Order(order_id, cust_id)"}]}, {"h": "Anomalies normalisation removes", "b": [{"k": "tbl", "h": null, "r": [["Insert", "can't add a course until a student enrols"], ["Update", "change a city in many rows, miss one"], ["Delete", "deleting the last student deletes the course info"]]}, {"k": "tip", "c": "Denormalise deliberately for read-heavy analytics (warehouses); keep OLTP in 3NF."}]}]}, {"id": "sql-objects", "g": "Databases & SQL", "i": "🏗️", "t": "Views, Triggers, PL/SQL & Indexes", "d": "Views, procedures, triggers, indexing, EXPLAIN", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "Database objects", "c": ["🪟 View :: saved query, a virtual table", "⚙️ Procedure :: saved code you CALL", "⚡ Trigger :: code that fires on INSERT/UPDATE/DELETE", "📇 Index :: book index for faster search"]}, {"k": "vis", "t": "tree", "ti": "B-tree index: find salary 72 in 3 hops, not a full scan", "c": ["🌳 root :: 50 | 80", "  🌿 < 50 :: 10 · 25 · 40", "  🌿 50–80 :: 60 · 72 · 75", "    🎯 72 → row pointer", "  🌿 > 80 :: 85 · 90 · 99"]}, {"k": "mem", "c": ["Trigger memory: **OLD = before, NEW = after**. INSERT has only NEW, DELETE has only OLD.", "Index = **faster reads, slower writes**. Composite index works **left to right**.", "`EXPLAIN` shows **ALL = full scan** (bad on big tables), **ref / range** = index used."]}], "w": 1}, {"h": "Views", "b": [{"k": "code", "l": "sql", "c": "CREATE OR REPLACE VIEW top_paid AS\nSELECT e.name, d.dname, e.salary\nFROM emp e JOIN dept d ON e.dept_id = d.dept_id\nWHERE e.salary > 50000;\n\nSELECT * FROM top_paid;\nDROP VIEW top_paid;"}, {"k": "tbl", "h": null, "r": [["Simple view", "one table, no aggregates: usually updatable"], ["Complex view", "joins / GROUP BY: read-only"], ["Materialized view", "stores the result (Oracle, PostgreSQL, Snowflake); needs refresh"]]}]}, {"h": "Stored procedure (MySQL)", "b": [{"k": "code", "l": "sql", "c": "DELIMITER //\nCREATE PROCEDURE raise_dept(IN p_dept INT, IN p_pct DECIMAL(5,2))\nBEGIN\n  UPDATE emp SET salary = salary * (1 + p_pct/100) WHERE dept_id = p_dept;\nEND //\nDELIMITER ;\nCALL raise_dept(1, 5);"}]}, {"h": "PL/SQL block (Oracle)", "b": [{"k": "code", "l": "sql", "c": "DECLARE\n  v_total NUMBER;\nBEGIN\n  SELECT SUM(salary) INTO v_total FROM emp;\n  DBMS_OUTPUT.PUT_LINE('Total: ' || v_total);\nEXCEPTION\n  WHEN NO_DATA_FOUND THEN DBMS_OUTPUT.PUT_LINE('none');\nEND;"}]}, {"h": "Triggers", "b": [{"k": "code", "l": "sql", "c": "DELIMITER //\nCREATE TRIGGER trg_sal_audit\nAFTER UPDATE ON emp\nFOR EACH ROW\nBEGIN\n  IF NEW.salary <> OLD.salary THEN\n    INSERT INTO sal_audit(emp_id, old_sal, new_sal, changed_at)\n    VALUES (OLD.emp_id, OLD.salary, NEW.salary, NOW());\n  END IF;\nEND //\nDELIMITER ;"}, {"k": "tbl", "h": null, "r": [["BEFORE / AFTER", "INSERT, UPDATE, DELETE"], ["NEW / OLD", "row after / before the change (OLD not in INSERT, NEW not in DELETE)"]]}]}, {"h": "Indexes", "b": [{"k": "code", "l": "sql", "c": "CREATE INDEX idx_emp_dept ON emp(dept_id);\nCREATE UNIQUE INDEX idx_email ON emp(email);\nCREATE INDEX idx_dept_sal ON emp(dept_id, salary);   -- composite\nSHOW INDEX FROM emp;  DROP INDEX idx_emp_dept ON emp;\nEXPLAIN SELECT * FROM emp WHERE dept_id = 2;          -- check the plan"}, {"k": "tbl", "h": null, "r": [["B-tree", "default; equality, range, ORDER BY"], ["Hash", "equality only"], ["Clustered", "table rows stored in key order (InnoDB primary key)"], ["Non-clustered / secondary", "separate structure pointing to rows"], ["Leftmost prefix", "(dept_id, salary) helps WHERE dept_id=… but not WHERE salary=… alone"]]}]}, {"h": "Query optimisation", "b": [{"k": "ul", "c": ["Select only needed columns, not SELECT *", "Index columns used in WHERE, JOIN and ORDER BY", "Avoid functions on indexed columns: WHERE YEAR(d)=2026 → WHERE d >= '2026-01-01' AND d < '2027-01-01'", "A leading wildcard (LIKE '%x') can't use a B-tree index", "Prefer EXISTS / joins over large IN lists; check EXPLAIN for \"ALL\" (full scan)"]}, {"k": "tip", "c": "Indexes speed reads but slow INSERT/UPDATE and use space."}]}]}, {"id": "nosql-intro", "g": "NoSQL", "i": "🧭", "t": "NoSQL Fundamentals", "d": "Types, CAP, BASE, schema evolution", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tiles", "ti": "The 4 NoSQL families", "c": ["🔑 Key-value :: Redis, DynamoDB · cache, sessions", "📄 Document :: MongoDB · JSON records", "🏛️ Column-family :: Cassandra, HBase · time series, IoT", "🕸️ Graph :: Neo4j · relationships"]}, {"k": "vis", "t": "ring", "ti": "CAP: in a network partition you keep only 2", "c": ["🎯 C :: Consistency, latest data", "✅ A :: Availability, always answers", "🌐 P :: Partition tolerance", "@ pick 2", "--", "CA · RDBMS", "AP · Cassandra", "CP · MongoDB"]}, {"k": "mem", "c": ["**ACID = strict accountant** (RDBMS). **BASE = relaxed friend**: Basically Available, Soft state, Eventually consistent.", "Partitions always happen in distributed systems, so the real choice is **CP or AP**.", "NoSQL design is **query-first**: shape data for how it will be read."]}], "w": 1}, {"h": "Row store vs column store", "b": [{"k": "vis", "t": "tiles", "ti": "", "c": ["➡️ Row store :: whole row together → fast single-record read/write (OLTP)", "⬇️ Column store :: whole column together → fast SUM/AVG scans, compresses well (OLAP)"]}]}, {"h": "RDBMS vs NoSQL", "b": [{"k": "tbl", "h": ["RDBMS", "NoSQL"], "r": [["Schema", "fixed, defined first", "flexible / schema-on-read"], ["Scaling", "mostly vertical (bigger server)", "horizontal (more nodes, sharding)"], ["Consistency", "ACID", "often BASE (eventual), tunable"], ["Joins", "yes", "rare; data denormalised / embedded"], ["Query", "SQL", "API / own query language"], ["Best for", "transactions, complex relations", "big volume, fast changing structure, high write rates"]]}]}, {"h": "Four types", "b": [{"k": "tbl", "h": null, "r": [["Key-value", "Redis, DynamoDB, Oracle NoSQL: cache, sessions, carts"], ["Document", "MongoDB, Couchbase: JSON-like records, catalogues, profiles"], ["Column-family (wide column)", "Cassandra, HBase: time series, IoT, huge write loads"], ["Graph", "Neo4j: relationships, social networks, fraud rings"]]}]}, {"h": "CAP theorem", "b": [{"k": "tbl", "h": null, "r": [["C – Consistency", "every read sees the latest write"], ["A – Availability", "every request gets a response"], ["P – Partition tolerance", "works despite network splits"], ["In a partition", "choose C or A → CP: HBase, MongoDB (default) · AP: Cassandra, CouchDB"]]}]}, {"h": "BASE", "b": [{"k": "tbl", "h": null, "r": [["Basically Available", "system answers even if some data is stale"], ["Soft state", "state may change without input (replication)"], ["Eventual consistency", "replicas converge over time"]]}]}, {"h": "Storage architecture", "b": [{"k": "tbl", "h": null, "r": [["Row store", "whole row together: fast single-record reads/writes (OLTP)"], ["Column store", "each column together: fast scans & compression for aggregates (OLAP)"], ["LSM tree", "writes go to memory (memtable) + commit log, flushed to immutable SSTables, merged by compaction (Cassandra, HBase)"], ["Document store internals", "BSON documents in collections; WiredTiger engine with B-tree indexes, compression, document-level locking"]]}]}, {"h": "Schema & data evolution", "b": [{"k": "tbl", "h": null, "r": [["Document DB", "add fields any time; old docs simply lack them. Use a schemaVersion field and migrate lazily or in batches"], ["Column-family DB", "add columns freely within a family; changing the row key means a new table + data copy"], ["Key-value", "the value is opaque: version the value format (v1/v2) and handle both in code"], ["Oracle NoSQL", "tables with a primary key (shard key + rest), JSON columns for flexible parts, ALTER TABLE to add fields"]]}, {"k": "tip", "c": "NoSQL design is query-first: list the queries, then shape the data so each query reads one place."}]}]}, {"id": "mongodb", "g": "NoSQL", "i": "🍃", "t": "MongoDB CRUD & Queries", "d": "insert, find, operators, update, delete", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "nest", "ti": "Hierarchy (SQL name in brackets)", "c": ["🗄️ Database :: (database)", "📁 Collection :: (table)", "📄 Document :: (row), JSON / BSON", "🏷️ Field :: (column)"]}, {"k": "vis", "t": "tree", "ti": "One document can hold nested data", "c": ["📄 { _id: ObjectId(…)", "  🏷️ name :: \"Pen\"", "  💰 price :: 10", "  🏷️ tags :: [\"office\", \"school\"]  ← array", "  📦 stock :: { qty: 50, wh: \"Pune\" }  ← embedded doc"]}, {"k": "mem", "c": ["CRUD = **insertOne/Many · find · updateOne/Many · deleteOne/Many**.", "Operators start with **$**: `$gt $lt $in $ne $set $inc`. Nested field needs quotes: `\"stock.qty\"`.", "`updateOne/updateMany` need `$` operators (`$set`, `$inc`); a plain document is rejected. To swap the whole document use **`replaceOne`**. Upsert = **up**date or in**sert**."]}], "w": 1}, {"h": "Comparison operators, pictured", "b": [{"k": "vis", "t": "tiles", "ti": "", "c": ["> — $gt :: greater than", "≥ $gte :: greater or equal", "< — $lt :: less than", "≤ $lte :: less or equal", "= — $eq :: equal", "≠ $ne :: not equal", "∈ $in :: in a list", "∉ $nin :: not in a list"]}]}, {"h": "Shell basics", "b": [{"k": "code", "l": "js", "c": "show dbs\nuse shop                      // creates on first insert\nshow collections\ndb.createCollection(\"products\")\ndb.products.drop(); db.dropDatabase()"}]}, {"h": "Create", "b": [{"k": "code", "l": "js", "c": "db.products.insertOne({ name: \"Pen\", price: 10, tags: [\"office\"], stock: { qty: 50 } })\ndb.products.insertMany([\n  { name: \"Book\", price: 250, category: \"edu\" },\n  { name: \"Bag\",  price: 900, category: \"travel\" }\n])"}]}, {"h": "Read", "b": [{"k": "code", "l": "js", "c": "db.products.find()                                   // all\ndb.products.find({ category: \"edu\" })                // equality\ndb.products.find({ price: { $gt: 100, $lte: 900 } }) // range\ndb.products.findOne({ name: \"Pen\" })\ndb.products.find({}, { name: 1, price: 1, _id: 0 })  // projection\ndb.products.find().sort({ price: -1 }).skip(10).limit(5)\ndb.products.countDocuments({ price: { $gt: 100 } })\ndb.products.distinct(\"category\")\ndb.products.find({ \"stock.qty\": { $lt: 10 } })       // nested field\ndb.products.find({ tags: \"office\" })                 // array contains"}]}, {"h": "Operators", "b": [{"k": "tbl", "h": null, "r": [["$eq $ne $gt $gte $lt $lte", "comparison"], ["$in / $nin", "in / not in a list"], ["$and $or $nor $not", "logical: { $or: [ {a:1}, {b:2} ] }"], ["$exists / $type", "field present / BSON type"], ["$regex", "{ name: { $regex: /^p/i } }"], ["$all $size $elemMatch", "array tests"]]}]}, {"h": "Combined example (lab style)", "b": [{"k": "code", "l": "js", "c": "db.products.find({\n  category: { $nin: [\"travel\", \"toys\"] },\n  brand: { $ne: \"Generic\" },\n  price: { $gte: 100, $lte: 1000 }\n}).sort({ price: -1 })"}]}, {"h": "Update", "b": [{"k": "code", "l": "js", "c": "db.products.updateOne({ name: \"Pen\" }, { $set: { price: 12 } })\ndb.products.updateMany({ category: \"edu\" }, { $inc: { price: 5 } })\ndb.products.updateOne({ name: \"Ink\" }, { $set: { price: 30 } }, { upsert: true })\ndb.products.replaceOne({ name: \"Bag\" }, { name: \"Bag\", price: 950 })"}, {"k": "tbl", "h": null, "r": [["$set / $unset", "set / remove field"], ["$inc / $mul", "add / multiply"], ["$rename", "rename field"], ["$push / $addToSet / $pull / $pop", "add / add-if-absent / remove / remove first or last in an array"]]}]}, {"h": "Delete", "b": [{"k": "code", "l": "js", "c": "db.products.deleteOne({ name: \"Pen\" })\ndb.products.deleteMany({ price: { $lt: 20 } })"}]}, {"h": "SQL ↔ MongoDB", "b": [{"k": "tbl", "h": null, "r": [["database / table / row / column", "database / collection / document / field"], ["SELECT … WHERE", "find({ … })"], ["INSERT / UPDATE / DELETE", "insertOne / updateMany / deleteMany"], ["ORDER BY / LIMIT", "sort() / limit()"], ["GROUP BY", "aggregate([{ $group }])"], ["JOIN", "$lookup (or embed)"], ["primary key", "_id (ObjectId by default)"]]}]}]}, {"id": "mongodb-advanced", "g": "NoSQL", "i": "🧬", "t": "MongoDB Aggregation, Indexes & Internals", "d": "Pipeline, $lookup, indexes, explain, replication, sharding", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "flow", "ti": "Aggregation pipeline: documents flow through stages", "c": ["🔍 $match :: filter (like WHERE)", "🧨 $unwind :: split arrays", "👥 $group :: like GROUP BY", "↕️ $sort", "✂️ $limit", "🎯 $project :: shape output"]}, {"k": "vis", "t": "hub", "ti": "Sharded cluster", "c": ["🧭 mongos router :: apps connect here", "🧩 Shard 1 :: replica set", "🧩 Shard 2 :: replica set", "🧩 Shard 3 :: replica set", "🗂️ Config servers :: metadata"]}, {"k": "mem", "c": ["Put **$match first**: fewer documents for every later stage, and it can use an index.", "explain(): **COLLSCAN = no index**, **IXSCAN = index used**.", "Compound index order **ESR**: Equality, Sort, Range."]}], "w": 1}, {"h": "Replica set", "b": [{"k": "vis", "t": "ring", "ti": "", "c": ["👑 Primary :: all writes", "📗 Secondary :: copy, can read", "📗 Secondary :: copy, can read", "@ election on failure"]}]}, {"h": "Aggregation pipeline", "b": [{"k": "code", "l": "js", "c": "db.orders.aggregate([\n  { $match: { status: \"paid\" } },\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.category\",\n              revenue: { $sum: { $multiply: [\"$items.qty\", \"$items.price\"] } },\n              orders:  { $sum: 1 } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 },\n  { $project: { _id: 0, category: \"$_id\", revenue: 1, orders: 1 } }\n])"}, {"k": "tbl", "h": null, "r": [["$match", "filter (put early, can use indexes)"], ["$group", "_id = group key; $sum $avg $min $max $push $addToSet $first"], ["$project / $addFields", "shape / add fields"], ["$unwind", "one doc per array element"], ["$lookup", "left outer join to another collection"], ["$sort $limit $skip $count", "order / paging / count"], ["$bucket / $facet", "ranges / several pipelines at once"]]}, {"k": "code", "l": "js", "c": "{ $lookup: { from: \"customers\", localField: \"cust_id\",\n             foreignField: \"_id\", as: \"customer\" } }"}]}, {"h": "Indexes", "b": [{"k": "code", "l": "js", "c": "db.products.createIndex({ price: 1 })                // ascending\ndb.products.createIndex({ category: 1, price: -1 })  // compound\ndb.users.createIndex({ email: 1 }, { unique: true })\ndb.posts.createIndex({ body: \"text\" })               // text search\ndb.sessions.createIndex({ at: 1 }, { expireAfterSeconds: 3600 }) // TTL\ndb.products.getIndexes(); db.products.dropIndex(\"price_1\")\ndb.products.find({ price: { $gt: 500 } }).explain(\"executionStats\")"}, {"k": "tbl", "h": null, "r": [["COLLSCAN vs IXSCAN", "full scan vs index used (compare totalDocsExamined & executionTimeMillis)"], ["ESR rule", "compound index order: Equality, Sort, Range fields"], ["Covered query", "all fields from the index: no document fetch"], ["Index types", "single, compound, multikey (arrays), text, geospatial (2dsphere), hashed, TTL, partial"]]}]}, {"h": "Internals", "b": [{"k": "tbl", "h": null, "r": [["BSON", "binary JSON; 16 MB max document"], ["WiredTiger", "default engine: document-level concurrency, compression, journal"], ["Replica set", "primary + secondaries; automatic failover by election"], ["Sharding", "split a collection across shards by a shard key; mongos routes queries; config servers hold metadata"], ["Write concern / read preference", "how many nodes must ack / which node to read from"]]}]}, {"h": "Modelling", "b": [{"k": "tbl", "h": null, "r": [["Embed", "data read together, 1:few (address in user)"], ["Reference", "large or shared data, 1:many / many:many (store _id)"]]}]}]}, {"id": "cassandra", "g": "NoSQL", "i": "👁️", "t": "Apache Cassandra & CQL", "d": "Ring, partition key, CQL, consistency, vs MongoDB", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "ring", "ti": "Masterless ring (token ranges simplified): the partition key's hash picks the node; RF = 3 → 3 copies", "c": ["🟢 Node A :: tokens 0–24", "🔵 Node B :: tokens 25–49", "🟠 Node C :: tokens 50–74", "🟣 Node D :: tokens 75–99", "@ no master · gossip"]}, {"k": "vis", "t": "flow", "ti": "Write path (why writes are so fast)", "c": ["📝 Commit log :: append to disk", "🧠 Memtable :: in memory", "💾 SSTable :: flushed, immutable", "🧹 Compaction :: merge SSTables"]}, {"k": "mem", "c": ["**Partition key = which node. Clustering key = sort order inside it.**", "**One table per query**: no joins; WHERE must use the partition key.", "Strong consistency when **R + W > RF** (e.g. QUORUM + QUORUM with RF 3)."]}], "w": 1}, {"h": "PRIMARY KEY ((cust_id), order_ts)", "b": [{"k": "vis", "t": "mtable", "ti": "Rows for one partition live together, sorted by order_ts DESC", "c": ["cust_id (partition) | order_ts (clustering) | amount", "~1 101 | 2026-11-18 | 499", "~1 101 | 2026-11-02 | 120", "~1 101 | 2026-10-21 | 860", "~2 205 | 2026-11-15 | 75"]}]}, {"h": "Architecture", "b": [{"k": "tbl", "h": null, "r": [["Masterless ring", "every node equal; peer-to-peer gossip, no single point of failure"], ["Partitioner", "hashes the partition key to a token → decides the node"], ["Replication factor", "copies of each row (RF = 3 typical)"], ["Strategy", "SimpleStrategy (one DC) / NetworkTopologyStrategy (multi-DC)"], ["Write path", "commit log → memtable → flushed to SSTable → compaction"], ["Tunable consistency", "ONE, QUORUM, ALL, LOCAL_QUORUM; strong when R + W > RF"]]}]}, {"h": "Keys", "b": [{"k": "tbl", "h": null, "r": [["Partition key", "which node; all rows with the same value live together"], ["Clustering key", "sort order inside a partition"], ["PRIMARY KEY ((a, b), c)", "(a,b) composite partition key, c clustering column"]]}]}, {"h": "CQL", "b": [{"k": "code", "l": "sql", "c": "CREATE KEYSPACE shop\n  WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};\nUSE shop;\nCREATE TABLE orders_by_customer (\n  cust_id   int,\n  order_ts  timestamp,\n  order_id  uuid,\n  amount    decimal,\n  PRIMARY KEY ((cust_id), order_ts)\n) WITH CLUSTERING ORDER BY (order_ts DESC);\n\nINSERT INTO orders_by_customer (cust_id, order_ts, order_id, amount)\nVALUES (101, toTimestamp(now()), uuid(), 499.0) USING TTL 86400;\n\nSELECT * FROM orders_by_customer WHERE cust_id = 101 LIMIT 10;\nUPDATE orders_by_customer SET amount = 520 WHERE cust_id = 101 AND order_ts = '2026-11-18 10:00:00';\nDELETE FROM orders_by_customer WHERE cust_id = 101;\nDESCRIBE TABLES;"}, {"k": "tip", "c": "WHERE must use the partition key; filtering on other columns needs a new table designed for that query (or ALLOW FILTERING, which scans and is slow). No joins, no subqueries: one table per query."}]}, {"h": "Collections & counters", "b": [{"k": "code", "l": "sql", "c": "ALTER TABLE users ADD emails set<text>;\nUPDATE users SET emails = emails + {'a@x.com'} WHERE id = 1;\nCREATE TABLE page_views (page text PRIMARY KEY, views counter);\nUPDATE page_views SET views = views + 1 WHERE page = 'home';"}]}, {"h": "Cassandra vs MongoDB", "b": [{"k": "tbl", "h": ["Cassandra", "MongoDB"], "r": [["Model", "wide-column", "document (BSON)"], ["Architecture", "masterless ring", "primary–secondary replica sets + sharding"], ["CAP lean", "AP (tunable)", "CP (default)"], ["Writes", "extremely high throughput", "high"], ["Queries", "by partition key, design per query", "rich ad-hoc queries, secondary indexes, aggregation"], ["Query language", "CQL (SQL-like)", "MQL (JSON)"], ["Good for", "IoT, time series, logs, messaging", "catalogues, content, user profiles, general apps"]]}]}]}, {"id": "hbase-redis", "g": "NoSQL", "i": "🔑", "t": "HBase & Redis", "d": "Column-family on HDFS, key-value in memory", "s": [{"h": "At a glance", "b": [{"k": "vis", "t": "tree", "ti": "HBase data model", "c": ["📊 Table", "  🔑 Row key :: sorted, the only index", "    👪 Column family :: personal", "      🏷️ name :: \"Asha\" @ t2, \"Asha S\" @ t1", "      🏷️ city :: \"Pune\"", "    👪 Column family :: pro", "      🏷️ salary :: 50000"]}, {"k": "vis", "t": "tiles", "ti": "Redis data types", "c": ["🔤 String :: SET / GET", "🗂️ Hash :: HSET / HGETALL", "📜 List :: LPUSH / RPOP (queue)", "🎲 Set :: SADD / SMEMBERS", "🏆 Sorted set :: ZADD (leaderboard)", "📣 Pub/Sub :: PUBLISH / SUBSCRIBE"]}, {"k": "mem", "c": ["HBase cell address = **row key + family:qualifier + timestamp**.", "**Redis = RAM-speed**. Use EX / TTL for things that should expire (OTP, sessions)."]}], "w": 1}, {"h": "HBase model", "b": [{"k": "tbl", "h": null, "r": [["Table → row key → column family → column qualifier → versioned cell (timestamp)"], ["Runs on HDFS; HMaster + RegionServers; ZooKeeper coordinates"], ["Rows sorted by row key; tables split into regions"], ["Strong consistency per row; good for random reads/writes on huge sparse tables"]]}]}, {"h": "HBase shell", "b": [{"k": "code", "l": "bash", "c": "create 'emp', 'personal', 'pro'\nput 'emp', 'r1', 'personal:name', 'Asha'\nput 'emp', 'r1', 'pro:salary', '50000'\nget 'emp', 'r1'\nscan 'emp', {COLUMNS => 'personal', LIMIT => 10}\nscan 'emp', {STARTROW => 'r1', STOPROW => 'r5'}\ndelete 'emp', 'r1', 'pro:salary'\ncount 'emp'\ndisable 'emp'; drop 'emp'\nlist; describe 'emp'"}, {"k": "tip", "c": "Row-key design is everything: avoid sequential keys (timestamps) that hot-spot one region. Salt or reverse them."}]}, {"h": "Redis", "b": [{"k": "tbl", "h": null, "r": [["In-memory key-value store; optional persistence (RDB snapshots, AOF log)"], ["Uses: cache, sessions, leaderboards, rate limits, queues, pub/sub"]]}, {"k": "code", "l": "bash", "c": "SET user:1:name \"Asha\"      GET user:1:name\nSET otp:99 \"4821\" EX 300    TTL otp:99        # expire in 5 min\nINCR page:views             DEL user:1:name   EXISTS user:1:name\nKEYS user:*                 # avoid in production; use SCAN\nHSET user:1 name Asha city Pune     HGETALL user:1     # hash\nLPUSH queue job1  RPOP queue        LRANGE queue 0 -1   # list\nSADD tags py sql  SMEMBERS tags     SISMEMBER tags py   # set\nZADD board 90 asha 75 ravi          ZREVRANGE board 0 2 WITHSCORES   # sorted set\nPUBLISH news \"hi\"  SUBSCRIBE news"}, {"k": "code", "l": "py", "c": "import redis\nr = redis.Redis(host=\"localhost\", port=6379, decode_responses=True)\nr.set(\"k\", \"v\", ex=60); r.get(\"k\"); r.zadd(\"board\", {\"asha\": 90})"}]}]}, {"id": "data-warehouse", "g": "Warehouse, Lake & Cloud", "i": "🏛️", "t": "Data Warehousing & SCD", "d": "Star schema, ETL, OLAP ops, slowly changing dimensions", "s": [{"h": "At a glance", "b     let center = null, clabel = null;
    nodes = nodes.filter(l => { if (l.startsWith('@ ')) { clabel = l.slice(2); return false; } return true; });
    if (!ring) { center = nodes[0]; nodes = nodes.slice(1); }
    const n = nodes.length, R = ring && n === 3 ? 40 : 38;
    const pos = nodes.map((_, k) => { const a = -Math.PI / 2 + 2 * Math.PI * k / n; return [50 + R * 1.05 * Math.cos(a), 50 + R * Math.sin(a) * (ring && n === 3 ? 1.08 : 1)]; });
    let svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
    if (ring) { if (n > 3) svg += `<ellipse cx="50" cy="50" rx="${R * 1.05}" ry="${R}" fill="none" stroke="var(--line)" stroke-width="0.6" stroke-dasharray="2 1.5" vector-effect="non-scaling-stroke"/>`;
      if (n === 3) pos.forEach((p, k) => { const q = pos[(k + 1) % n]; svg += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--accent2)" stroke-width="2.5" vector-effect="non-scaling-stroke" opacity=".7"/>`; }); }
    else pos.forEach(p => svg += `<line x1="50" y1="50" x2="${p[0]}" y2="${p[1]}" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke" opacity=".75"/>`);
    svg += '</svg>';
    let h = `<div class="v-hub">${svg}`;
    if (center) h += `<div class="hn ctr" style="left:50%;top:50%;--c:${PAL[0]}">${NI(node(center))}</div>`;
    if (clabel) h += `<div class="cl">${inline(clabel)}</div>`;
    nodes.forEach((l, k) => h += `<div class="hn" style="left:${pos[k][0]}%;top:${pos[k][1]}%;--c:${PAL[(k + 1) % 8]}">${NI(node(l))}</div>`);
    edges.forEach((e, k) => { const p = pos[k], q = pos[(k + 1) % n]; h += `<div class="el" style="left:${(p[0] + q[0]) / 2}%;top:${(p[1] + q[1]) / 2}%">${inline(e)}</div>`; });
    return h + '</div>';
  },
  ring(b){ return VR.hub(b, true); },
  joins(){
    const id = 'j' + (++VID);
    const J = [['INNER JOIN','matches in both','i'],['LEFT JOIN','all left + matches','l'],['RIGHT JOIN','all right + matches','r'],['FULL OUTER','everything','f'],['LEFT anti','left with no match','la'],['RIGHT anti','right with no match','ra']];
    const L = 'M38 33 m-22 0 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0', Rt = 'M62 33 m-22 0 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0';
    return '<div class="v-joins">' + J.map(([t, d, k], i) => {
      const cid = id + i; const fill = '#14b8a6';
      let body = `<defs><clipPath id="${cid}a"><path d="${L}"/></clipPath><clipPath id="${cid}b"><path d="${Rt}"/></clipPath><mask id="${cid}m"><rect width="100" height="66" fill="white"/><path d="${k === 'la' ? Rt : L}" fill="black"/></mask></defs>`;
      if (k === 'l' || k === 'f') body += `<path d="${L}" fill="${fill}" opacity=".85"/>`;
      if (k === 'r' || k === 'f') body += `<path d="${Rt}" fill="${fill}" opacity=".85"/>`;
      if (k === 'i') body += `<path d="${Rt}" fill="${fill}" clip-path="url(#${cid}a)"/>`;
      if (k === 'la') body += `<path d="${L}" fill="${fill}" mask="url(#${cid}m)"/>`;
      if (k === 'ra') body += `<path d="${Rt}" fill="${fill}" mask="url(#${cid}m)"/>`;
      body += `<path d="${L}" fill="none" stroke="var(--text2)" stroke-width="1.6"/><path d="${Rt}" fill="none" stroke="var(--text2)" stroke-width="1.6"/><text x="22" y="37" font-size="9" font-weight="700" fill="var(--text)">A</text><text x="72" y="37" font-size="9" font-weight="700" fill="var(--text)">B</text>`;
      return `<div class="v-join"><svg viewBox="0 0 100 66">${body}</svg><b>${t}</b><span>${d}</span></div>`; }).join('') + '</div>';
  },
  strip(b){
    const L = lines(b); const isList = L[0].trim().startsWith('[');
    const word = isList ? L[0].trim().slice(1, -1).split(',').map(x => x.trim()) : [...L[0].replace(/^["']|["']$/g, '')]; const n = word.length;
    let h = '<div class="v-strip"><table><tr><td></td>' + word.map((_, k) => `<td class="ix">${k}</td>`).join('') + '<td></td></tr>';
    h += '<tr><td class="ex">' + esc(L[0]) + '</td>' + word.map(c => `<td><div class="ch">${esc(c)}</div></td>`).join('') + '<td></td></tr>';
    h += '<tr><td></td>' + word.map((_, k) => `<td class="ix">${k - n}</td>`).join('') + '<td></td></tr>';
    L.slice(1).forEach((e, r) => { const sel = pySlice(n, e); const set = new Set(sel); const res = isList ? '[' + sel.map(k => word[k]).join(', ') + ']' : "'" + sel.map(k => word[k]).join('') + "'";
      h += `<tr><td class="ex">${esc(e)}</td>` + word.map((c, k) => `<td><div class="ch ${set.has(k) ? 'on' : ''}" style="--c:${PAL[(r + 1) % 8]}">${set.has(k) ? esc(c) : ''}</div></td>`).join('') + `<td class="rs">→ ${esc(res)}</td></tr>`; });
    return h + '</table></div>';
  },
  matrix(b){
    const R = lines(b).map(l => l.trim().split(/\s+/).map(Number)); const nr = R.length, nc = R[0].length;
    const rs = R.map(r => r.reduce((a, x) => a + x, 0)); const cs = R[0].map((_, j) => R.reduce((a, r) => a + r[j], 0));
    let h = `<div class="v-mxw"><div class="v-mx" style="grid-template-columns:28px repeat(${nc},40px) 18px 40px">`;
    h += '<div></div>' + R[0].map((_, j) => `<div class="lab">col ${j}</div>`).join('') + '<div></div><div class="lab">axis=1</div>';
    R.forEach((r, i) => { h += `<div class="lab">row ${i}</div>` + r.map(x => `<div class="c">${x}</div>`).join('') + '<div class="lab">→</div>' + `<div class="c r1">${rs[i]}</div>`; });
    h += '<div></div>' + R[0].map(() => '<div class="lab">↓</div>').join('') + '<div></div><div></div>';
    h += '<div class="lab">axis 0</div>' + cs.map(x => `<div class="c r0">${x}</div>`).join('') + '<div></div><div></div></div>';
    h += `<div class="v-mxk"><div><i style="background:#3b82f6"></i><b>a.sum(axis=0)</b> → [${cs.join(', ')}]<br>collapses rows, one value <b>per column</b></div><div><i style="background:#ec4899"></i><b>a.sum(axis=1)</b> → [${rs.join(', ')}]<br>collapses columns, one value <b>per row</b></div><div style="margin-top:6px;color:var(--text3)">shape = (${nr}, ${nc}) → (rows, cols)</div></div></div>`;
    return h;
  },
  ladder(b){ const L = lines(b); return '<div class="v-ladder">' + L.map((l, i) => `<div class="v-rung" style="--c:${PAL[i % 8]}"><div class="bar" style="height:${30 + 70 * i / Math.max(1, L.length - 1)}%">${NI(node(l))}</div></div>`).join('') + '</div>'; },
  mtable(b){
    const L = lines(b); const hd = L[0].split('|').map(x => x.trim());
    let h = '<div class="v-mt"><table><tr>' + hd.map(x => `<th>${inline(x)}</th>`).join('') + '</tr>';
    L.slice(1).forEach(l => { let cls = ''; const m = l.match(/^(\*|-|~\d)\s*/); if (m) { cls = m[1] === '*' ? 'hi' : m[1] === '-' ? 'lo' : 'g' + m[1][1]; l = l.slice(m[0].length); }
      h += `<tr class="${cls}">` + l.split('|').map(x => `<td>${inline(x.trim())}</td>`).join('') + '</tr>'; });
    return h + '</table></div>';
  }
};
function renderVis(b){
  const f = VR[b.t]; if (!f) return `<div class="tip">Unknown visual: ${esc(b.t)}</div>`;
  return `<div class="vis">${b.ti ? `<div class="vis-t">${esc(b.ti)}</div>` : ''}${f(b)}</div>`;
}

function block(b){
  if (b.k === 'vis') return renderVis(b);
  if (b.k === 'mem') return '<div class="mem"><div class="mh">🧠 Memory hook</div>' + b.c.map(x => `<div class="mi">${inline(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div>`).join('') + '</div>';
  if (b.k === 'code') return `<div class="code"><button class="copy" onclick="copyCode(this)">Copy</button><span class="lang">${esc(b.l)}</span><pre><code>${hl(b.c, b.l)}</code></pre></div>`;
  if (b.k === 'tip') return `<div class="tip">${inline(b.c)}</div>`;
  if (b.k === 'p') return `<p>${inline(b.c)}</p>`;
  if (b.k === 'ul') return '<ul>' + b.c.map(x => `<li>${inline(x)}</li>`).join('') + '</ul>';
  if (b.k === 'tbl') {
    let h = '<table>';
    if (b.h) h += '<tr><th></th>' + b.h.map(x => `<th>${esc(x)}</th>`).join('') + '</tr>';
    for (const r of b.r) {
      if (r.length === 1) { h += `<tr><td class="full">${inline(r[0])}</td></tr>`; continue; }
      h += '<tr><td>' + cellFirst(r[0]) + '</td>' + r.slice(1).map(x => `<td>${inline(x)}</td>`).join('') + '</tr>';
    }
    return h + '</table>';
  }
  return '';
}
function copyCode(btn){
  const t = btn.parentElement.querySelector('pre').innerText;
  const done = () => { btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = 'Copy', 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => fallback(t, done)); else fallback(t, done);
}
function fallback(t, done){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(e){} a.remove(); done(); }

function renderSide(active){
  let h = `<a class="nav home-link ${!active ? 'on' : ''}" href="#"><span class="ic">🏠</span>All cheat sheets</a>`;
  for (const g of DATA.groups) {
    h += `<h4>${esc(g)}</h4>`;
    for (const s of S.filter(x => x.g === g))
      h += `<a class="nav ${active === s.id ? 'on' : ''}" href="#${s.id}"><span class="ic">${s.i}</span>${esc(s.t)}</a>`;
  }
  document.getElementById('side').innerHTML = h;
  const on = document.querySelector('.nav.on'); if (on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}
function renderHome(){
  const nSec = S.reduce((a, s) => a + s.s.length, 0);
  const nCode = S.reduce((a, s) => a + s.s.reduce((b, x) => b + x.b.filter(y => y.k === 'code').length, 0), 0);
  let h = `<div class="hero"><h1>📋 Cheat Sheets</h1><p>Quick revision for PGCP-BDA: <b>Python & R Programming</b> and <b>Data Collection & DBMS</b>. One page per topic, with syntax, examples and exam tips. Search across everything from the bar above.</p>
    <div class="stats"><div><b>${S.length}</b>sheets</div><div><b>${nSec}</b>sections</div><div><b>${nCode}</b>code snippets</div></div></div>`;
  for (const g of DATA.groups) {
    const list = S.filter(x => x.g === g);
    h += `<div class="gh"><h2>${esc(g)}</h2><span class="ln"></span></div><div class="tiles">` +
      list.map(s => `<a class="tile" href="#${s.id}"><div class="ti">${s.i}</div><div><b>${esc(s.t)}</b><span>${esc(s.d)}</span></div></a>`).join('') + '</div>';
  }
  h += `<div class="foot">Saarthi 360 · C-DAC Mumbai · Based on the PGCP-BDA (Aug 2026) syllabus</div>`;
  return h;
}
function renderSheet(s){
  const i = S.indexOf(s), prev = S[i - 1], next = S[i + 1];
  let h = `<div class="chip">${esc(s.g)}</div><div class="sh-head"><div class="sh-ic">${s.i}</div><div><h1>${esc(s.t)}</h1><p>${esc(s.d)}</p></div></div>
  <div class="sh-tools"><button class="btn" onclick="window.print()">🖨️ Print / save as PDF</button><button class="btn" onclick="location.hash=''">← All sheets</button></div><div class="grid">`;
  for (const sec of s.s) h += `<section class="card${sec.w ? ' wide' : ''}">${sec.h ? `<h3>${esc(sec.h)}</h3>` : ''}${sec.b.map(block).join('')}</section>`;
  h += '</div><div class="pager">' +
    (prev ? `<a href="#${prev.id}">← Previous<b>${prev.i} ${esc(prev.t)}</b></a>` : '<span></span>') +
    (next ? `<a class="nx" href="#${next.id}">Next →<b>${next.i} ${esc(next.t)}</b></a>` : '') + '</div>';
  return h;
}
function textOf(b){ return b.k === 'vis' ? (b.ti + ' ' + b.c.join(' ')) : b.k === 'code' ? b.c : b.k === 'tbl' ? (b.h || []).concat(...b.r).join(' ') : Array.isArray(b.c) ? b.c.join(' ') : b.c; }
function renderSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = [];
  for (const s of S) for (const sec of s.s) {
    const txt = (s.t + ' ' + sec.h + ' ' + sec.b.map(textOf).join(' ')).toLowerCase();
    if (terms.every(t => txt.includes(t))) {
      const body = sec.b.map(textOf).join(' ');
      const pos = body.toLowerCase().indexOf(terms[0]);
      const snip = pos < 0 ? body.slice(0, 120) : body.slice(Math.max(0, pos - 50), pos + 90);
      hits.push({s, sec, snip});
    }
  }
  const mark = t => { let e = esc(t); for (const x of terms) e = e.replace(new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); return e; };
  return `<div class="results"><h2>${hits.length} result${hits.length === 1 ? '' : 's'} for “${esc(q)}”</h2>` +
    (hits.length ? hits.slice(0, 80).map(x => `<a class="hit" href="#${x.s.id}" data-sec="${esc(x.sec.h)}"><b>${x.s.i} ${esc(x.s.t)}</b> › ${esc(x.sec.h || 'Overview')}<small class="mono">${mark(x.snip.replace(/\s+/g, ' '))}…</small></a>`).join('')
      : '<p style="color:var(--text3)">Nothing matched. Try a shorter word, e.g. “join”, “merge”, “index”.</p>') + '</div>';
}
function route(){
  const id = decodeURIComponent(location.hash.slice(1)), q = document.getElementById('q').value.trim();
  const main = document.getElementById('main');
  document.body.classList.remove('menu');
  if (q && !route.fromHit) { main.innerHTML = renderSearch(q); renderSide(byId[id] ? id : null); return; }
  route.fromHit = false;
  const s = byId[id];
  main.innerHTML = s ? renderSheet(s) : renderHome();
  document.title = (s ? s.t + ' · ' : '') + 'Cheat Sheets · Saarthi 360';
  renderSide(s ? s.id : null);
  if (route.secName) {
    const want = route.secName; route.secName = null;
    const el = [...document.querySelectorAll('.card h3')].find(h => h.textContent === want);
    if (el) { el.parentElement.scrollIntoView({block:'start'}); window.scrollBy(0, -70); el.parentElement.style.outline = '2px solid var(--accent2)'; setTimeout(() => el.parentElement.style.outline = '', 1800); return; }
  }
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const hit = e.target.closest('.hit');
  if (hit) { route.fromHit = true; route.secName = hit.dataset.sec; document.getElementById('q').value = ''; if (location.hash === hit.getAttribute('href')) { e.preventDefault(); route(); } }
  else if (e.target.closest('.nav,.tile,.pager a,.brand')) document.getElementById('q').value = '';
});
let tmr; document.getElementById('q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(route, 160); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus(); } if (e.key === 'Escape') { const q = document.getElementById('q'); if (q.value) { q.value = ''; route(); } } });
window.addEventListener('hashchange', route);
function setThemeLabel(){ document.getElementById('themeBtn').textContent = document.documentElement.classList.contains('sp-dark') ? '☀️ Light' : '🌙 Dark'; }
function toggleTheme(){ const d = document.documentElement.classList.toggle('sp-dark'); try{localStorage.setItem('saarthi_theme', d ? 'dark' : 'light')}catch(e){} setThemeLabel(); }
setThemeLabel(); route();
</script>
