, {"h": "DDL", "b": [{"k": "code", "l": "sql", "c": "CREATE DATABASE company;  USE company;\nCREATE TABLE emp (\n  emp_id   INT PRIMARY KEY AUTO_INCREMENT,\n  name     VARCHAR(50) NOT NULL,\n  email    VARCHAR(100) UNIQUE,\n  salary   DECIMAL(10,2) CHECK (salary > 0),\n  dept_id  INT,\n  joined   DATE DEFAULT (CURRENT_DATE),\n  FOREIGN KEY (dept_id) REFERENCES dept(dept_id) ON DELETE SET NULL\n);\nALTER TABLE emp ADD phone VARCHAR(15);\nALTER TABLE emp MODIFY name VARCHAR(80);\nALTER TABLE emp DROP COLUMN phone;\nALTER TABLE emp RENAME COLUMN name TO full_name;\nRENAME TABLE emp TO employee;\nDROP TABLE IF EXISTS temp;"}]}, {"h": "DML", "b": [{"k": "code", "l": "sql", "c": "INSERT INTO emp (name, salary, dept_id) VALUES ('Asha', 50000, 1), ('Ravi', 42000, 2);\nUPDATE emp SET salary = salary * 1.10 WHERE dept_id = 1;\nDELETE FROM emp WHERE emp_id = 7;\nSELECT DISTINCT dept_id FROM emp;\nSELECT * FROM emp WHERE name LIKE 'A%' AND salary BETWEEN 30000 AND 60000;\nSELECT * FROM emp WHERE dept_id IN (1, 2) AND email IS NOT NULL LIMIT 10;"}, {"k": "tbl", "h": null, "r": [["LIKE 'A%' / '%a' / '_s%'", "starts with A / ends with a / s is 2nd char"]]}]}, {"h": "DELETE vs TRUNCATE vs DROP", "b": [{"k": "tbl", "h": null, "r": [["DELETE", "DML, removes chosen rows, WHERE allowed, can roll back"], ["TRUNCATE", "DDL, removes all rows, resets auto-increment, no WHERE"], ["DROP", "DDL, removes the table itself"]]}]}, {"h": "DCL", "b": [{"k": "code", "l": "sql", "c": "CREATE USER 'analyst'@'localhost' IDENTIFIED BY 'Str0ng#pw';\nGRANT SELECT, INSERT ON company.emp TO 'analyst'@'localhost';\nSHOW GRANTS FOR 'analyst'@'localhost';\nREVOKE INSERT ON company.emp FROM 'analyst'@'localhost';"}]}, {"h": "TCL & ACID", "b": [{"k": "code", "l": "sql", "c": "SET autocommit = 0;\nSTART TRANSACTION;\nUPDATE acct SET bal = bal - 500 WHERE id = 1;\nSAVEPOINT s1;\nUPDATE acct SET bal = bal + 500 WHERE id = 2;\nROLLBACK TO s1;     -- undoes only the work after s1 (B's +500)\nCOMMIT;             -- makes the rest (A's -500) permanent"}, {"k": "tbl", "h": null, "r": [["Atomicity", "all or nothing"], ["Consistency", "rules/constraints hold before and after"], ["Isolation", "concurrent transactions don't see each other's partial work"], ["Durability", "committed data survives crashes"], ["Isolation levels", "READ UNCOMMITTED < READ COMMITTED < REPEATABLE READ (MySQL default) < SERIALIZABLE"], ["Anomalies", "dirty read, non-repeatable read, phantom read"]]}]}]}, {"id": "sql-queries", "g": "Databases & SQL", "i": "🔍", "t": "Grouping, Joins & Subqueries", "d": "GROUP BY, HAVING, joins, correlated subqueries", "s": [{"h": "Joins on real rows", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### emp", "name | dept_id", "Asha | 10", "Ravi | 20", "Neha | 40", "### dept", "dept_id | dname", "10 | IT", "20 | HR", "30 | Ops", ">> INNER JOIN", "### matches only", "name | dname", "Asha | IT", "Ravi | HR", "% Neha (dept 40) and Ops (no employees) have no partner, so INNER JOIN drops both."]}, {"k": "vis", "t": "tables", "ti": "", "c": ["### emp LEFT JOIN dept", "name | dname", "Asha | IT", "Ravi | HR", "* Neha | NULL", "### emp RIGHT JOIN dept", "name | dname", "Asha | IT", "Ravi | HR", "* NULL | Ops", "### LEFT JOIN … WHERE d.dept_id IS NULL", "name | dname", "* Neha | NULL", "% LEFT keeps every left row and fills NULL where nothing matched. RIGHT does the same for the right table. Filtering for NULL after a LEFT JOIN finds \"rows with no match\" (an anti join)."]}, {"k": "vis", "t": "joins", "ti": "", "c": ["% The same results as Venn diagrams: A = emp (left), B = dept (right)."]}]}, {"h": "WHERE vs HAVING", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### emp", "name | dept | salary", "~1 Asha | IT | 50000", "~2 Ravi | HR | 42000", "~1 Neha | IT | 61000", "- Om | IT | 18000", "~3 Jay | Ops | 30000", ">> WHERE salary > 20000 · GROUP BY dept", "### groups", "dept | COUNT(*)", "~1 IT | 2", "~2 HR | 1", "~3 Ops | 1", ">> HAVING COUNT(*) > 1", "### result", "dept | COUNT(*)", "~1 IT | 2", "% WHERE removes rows before grouping (Om is struck out). HAVING removes whole groups after counting."]}]}, {"h": "The order SQL really runs", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["FROM / JOIN :: pick tables", "WHERE :: filter rows", "GROUP BY :: make groups", "HAVING :: filter groups", "* SELECT :: choose columns", "ORDER BY :: sort", "LIMIT :: cut", "% SELECT runs late, which is why an alias made in SELECT can't be used in WHERE. Mnemonic: Frank Went Grocery shopping, He Saw Oranges Last."]}]}, {"h": "Aggregates & grouping", "b": [{"k": "code", "l": "sql", "c": "SELECT dept_id, COUNT(*) AS n, AVG(salary) AS avg_sal, MAX(salary)\nFROM emp\nWHERE salary > 20000          -- filters rows\nGROUP BY dept_id\nHAVING COUNT(*) > 2           -- filters groups\nORDER BY avg_sal DESC;"}, {"k": "tbl", "h": null, "r": [["COUNT(*) vs COUNT(col)", "all rows vs non-NULL values"], ["SUM, AVG, MIN, MAX", "ignore NULLs"], ["GROUP_CONCAT(name)", "MySQL: list values in a group"]]}]}, {"h": "Joins", "b": [{"k": "code", "l": "sql", "c": "SELECT e.name, d.dname\nFROM emp e\nINNER JOIN dept d ON e.dept_id = d.dept_id;      -- matches only\n\nSELECT d.dname, e.name\nFROM dept d LEFT JOIN emp e ON e.dept_id = d.dept_id;  -- all depts, NULL if no emp\n\nSELECT d.dname FROM dept d\nLEFT JOIN emp e ON e.dept_id = d.dept_id\nWHERE e.emp_id IS NULL;                          -- depts with no employees"}, {"k": "tbl", "h": null, "r": [["INNER", "rows matching in both"], ["LEFT / RIGHT OUTER", "all from left / right + matches"], ["FULL OUTER", "all from both (MySQL: LEFT … UNION … RIGHT)"], ["CROSS", "every combination"], ["SELF", "table joined to itself (employee → manager)"]]}]}, {"h": "Subqueries", "b": [{"k": "code", "l": "sql", "c": "SELECT name FROM emp WHERE salary > (SELECT AVG(salary) FROM emp);   -- single value\nSELECT name FROM emp WHERE dept_id IN (SELECT dept_id FROM dept WHERE loc = 'Pune');\n\n-- correlated: runs once per outer row\nSELECT e.name, e.salary FROM emp e\nWHERE e.salary > (SELECT AVG(salary) FROM emp WHERE dept_id = e.dept_id);\n\nSELECT d.dname FROM dept d\nWHERE EXISTS (SELECT 1 FROM emp e WHERE e.dept_id = d.dept_id);"}]}, {"h": "Set operators", "b": [{"k": "tbl", "h": null, "r": [["UNION / UNION ALL", "combine, removing / keeping duplicates"], ["INTERSECT / EXCEPT", "common rows / rows in first only (MySQL 8.0.31+)"]]}]}]}, {"id": "sql-cte-window", "g": "Databases & SQL", "i": "🪜", "t": "CTEs, CASE & Window Functions", "d": "WITH, recursive CTE, RANK, LAG, running totals", "s": [{"h": "Ranking within each department", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### RANK / DENSE_RANK / ROW_NUMBER  OVER (PARTITION BY dept ORDER BY salary DESC)", "dept | name | salary | +ROW_NUMBER | +RANK | +DENSE_RANK", "~1 IT | Asha | 90 | 1 | 1 | 1", "~1 IT | Ravi | 80 | 2 | 2 | 2", "~1 IT | Neha | 80 | 3 | 2 | 2", "~1 IT | Om | 70 | 4 | 4 | 3", "~2 HR | Mira | 60 | 1 | 1 | 1", "~2 HR | Jay | 50 | 2 | 2 | 2", "% PARTITION BY restarts numbering for each colour. On the Ravi/Neha tie: ROW_NUMBER still gives 2, 3; RANK gives 2, 2 then skips to 4; DENSE_RANK gives 2, 2 then 3."]}]}, {"h": "Running totals and previous values", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### sales", "month | amount | +SUM(amount) OVER (ORDER BY month) | +LAG(amount) OVER (ORDER BY month)", "Jan | 100 | 100 | NULL", "Feb | 150 | 250 | 100", "Mar | 120 | 370 | 150", "Apr | 200 | 570 | 120", "% Unlike GROUP BY, window functions keep every row and add a column. LAG looks one row back; the first row has nothing before it, so NULL."]}]}, {"h": "How a recursive CTE builds rows", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["Anchor :: SELECT 1 AS n → row 1", "Recursive step :: SELECT n + 1 FROM nums → 2, 3, …", "Stop :: WHERE n < 10 fails at 10", "* Result :: 1, 2, … 10"]}]}, {"h": "CTE (WITH)", "b": [{"k": "code", "l": "sql", "c": "WITH dept_avg AS (\n  SELECT dept_id, AVG(salary) AS avg_sal FROM emp GROUP BY dept_id\n)\nSELECT e.name, e.salary, a.avg_sal\nFROM emp e JOIN dept_avg a ON e.dept_id = a.dept_id\nWHERE e.salary > a.avg_sal;"}]}, {"h": "Recursive CTE", "b": [{"k": "code", "l": "sql", "c": "WITH RECURSIVE nums AS (\n  SELECT 1 AS n\n  UNION ALL\n  SELECT n + 1 FROM nums WHERE n < 10\n)\nSELECT * FROM nums;\n\nWITH RECURSIVE chain AS (                    -- org hierarchy\n  SELECT emp_id, name, mgr_id, 1 AS lvl FROM emp WHERE mgr_id IS NULL\n  UNION ALL\n  SELECT e.emp_id, e.name, e.mgr_id, c.lvl + 1\n  FROM emp e JOIN chain c ON e.mgr_id = c.emp_id\n)\nSELECT * FROM chain ORDER BY lvl;"}]}, {"h": "CASE", "b": [{"k": "code", "l": "sql", "c": "SELECT name,\n  CASE WHEN salary >= 60000 THEN 'High'\n       WHEN salary >= 40000 THEN 'Mid'\n       ELSE 'Low' END AS band,\n  SUM(CASE WHEN gender = 'F' THEN 1 ELSE 0 END) OVER () AS women\nFROM emp;"}]}, {"h": "Window functions", "b": [{"k": "code", "l": "sql", "c": "SELECT name, dept_id, salary,\n  ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn,\n  RANK()       OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk,\n  DENSE_RANK() OVER (ORDER BY salary DESC) AS drnk,\n  SUM(salary)  OVER (PARTITION BY dept_id) AS dept_total,\n  SUM(salary)  OVER (ORDER BY joined ROWS UNBOUNDED PRECEDING) AS running,\n  LAG(salary)  OVER (ORDER BY joined) AS prev_sal,\n  NTILE(4)     OVER (ORDER BY salary) AS quartile\nFROM emp;"}, {"k": "tbl", "h": null, "r": [["ROW_NUMBER", "1,2,3,4 (always unique)"], ["RANK", "1,2,2,4 (gaps after ties)"], ["DENSE_RANK", "1,2,2,3 (no gaps)"], ["LAG / LEAD", "previous / next row's value"], ["FIRST_VALUE / LAST_VALUE", "first / last in the window frame"]]}]}, {"h": "Top-N per group", "b": [{"k": "code", "l": "sql", "c": "SELECT * FROM (\n  SELECT e.*, d.dname,\n         RANK() OVER (PARTITION BY e.dept_id ORDER BY salary DESC) r\n  FROM emp e JOIN dept d USING (dept_id)\n) t WHERE r = 1;"}, {"k": "tip", "c": "Window functions keep every row (unlike GROUP BY). They can't go in WHERE directly, so wrap them in a subquery or CTE."}]}]}, {"id": "sql-design", "g": "Databases & SQL", "i": "🧩", "t": "Schema Design, ER & Normal Forms", "d": "Entities, relationships, 1NF to BCNF", "s": [{"h": "Normalising one messy table", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### unnormalised orders", "order_id | customer | city | items", "101 | Asha | Pune | pen, book", "102 | Asha | Pune | bag", ">> 1NF: one value per cell", "### order_items", "order_id | customer | city | item", "101 | Asha | Pune | pen", "101 | Asha | Pune | book", "102 | Asha | Pune | bag", ">> 3NF: move facts to their own tables", "### customer", "cust_id | name | city", "1 | Asha | Pune", "### orders", "order_id | cust_id", "101 | 1", "102 | 1", "### order_item", "order_id | item", "101 | pen", "101 | book", "102 | bag", "% Before: Asha's city is stored three times, so changing it means three updates (an update anomaly). After: each fact lives in one place and tables link by keys."]}, {"k": "mem", "c": ["**1NF** atomic values · **2NF** no partial dependency · **3NF** no transitive dependency · **BCNF** every determinant is a key."]}]}, {"h": "A many-to-many relationship needs a middle table", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### student", "student_id | name", "1 | Asha", "2 | Ravi", ">> student_id", "### enrolment", "student_id | course_id", "1 | C1", "1 | C2", "2 | C1", ">> course_id", "### course", "course_id | title", "C1 | SQL", "C2 | Python", "% One student takes many courses, one course has many students. The enrolment table holds one row per pairing, with both foreign keys as its primary key."]}]}, {"h": "ER diagram", "b": [{"k": "tbl", "h": null, "r": [["Entity (rectangle)", "thing to store: Student, Course"], ["Attribute (ellipse)", "property; key attribute underlined; multivalued = double ellipse; derived = dashed"], ["Relationship (diamond)", "Student ENROLS in Course"], ["Weak entity (double rectangle)", "depends on owner for its key"], ["Cardinality", "1:1, 1:N, M:N"], ["Participation", "total (double line) / partial (single line)"]]}]}, {"h": "ER → tables", "b": [{"k": "tbl", "h": null, "r": [["1:N", "put the FK on the N side"], ["M:N", "new junction table with both FKs as a composite PK"], ["1:1", "FK on either side (usually the optional one)"], ["Multivalued attribute", "separate table"]]}]}, {"h": "Normal forms", "b": [{"k": "tbl", "h": null, "r": [["1NF", "atomic values, no repeating groups"], ["2NF", "1NF + no partial dependency on part of a composite key"], ["3NF", "2NF + no transitive dependency (non-key → non-key)"], ["BCNF", "every determinant is a candidate key"], ["4NF / 5NF", "no multivalued / join dependencies"]]}]}, {"h": "Example", "b": [{"k": "code", "l": "text", "c": "Unnormalised: Order(order_id, cust_name, cust_city, items=\"pen,book\")\n1NF: one item per row             → OrderItem(order_id, item, qty)\n2NF: item price depends on item   → Item(item, price)\n3NF: city depends on customer     → Customer(cust_id, name, city); Order(order_id, cust_id)"}]}, {"h": "Anomalies normalisation removes", "b": [{"k": "tbl", "h": null, "r": [["Insert", "can't add a course until a student enrols"], ["Update", "change a city in many rows, miss one"], ["Delete", "deleting the last student deletes the course info"]]}, {"k": "tip", "c": "Denormalise deliberately for read-heavy analytics (warehouses); keep OLTP in 3NF."}]}]}, {"id": "sql-objects", "g": "Databases & SQL", "i": "🏗️", "t": "Views, Triggers, PL/SQL & Indexes", "d": "Views, procedures, triggers, indexing, EXPLAIN", "s": [{"h": "Why an index is fast", "b": [{"k": "vis", "t": "svg", "ti": "Find salary = 72 in a B-tree", "c": ["<svg viewBox=\"0 0 760 210\">", "<rect x=\"300\" y=\"14\" width=\"160\" height=\"40\" rx=\"10\" class=\"sv-hl\"/><text x=\"380\" y=\"40\" text-anchor=\"middle\" class=\"sv-t sv-m\">50 | 80<\/text>", "<path d=\"M330 54 L130 100\" class=\"sv-a\"/><path d=\"M380 54 L380 100\" class=\"sv-aa\" stroke-width=\"3\"/><path d=\"M430 54 L630 100\" class=\"sv-a\"/>", "<text x=\"210\" y=\"80\" class=\"sv-s\">&lt; 50<\/text><text x=\"388\" y=\"82\" class=\"sv-lbl\">50–80<\/text><text x=\"520\" y=\"80\" class=\"sv-s\">&gt; 80<\/text>", "<rect x=\"50\" y=\"100\" width=\"160\" height=\"40\" rx=\"10\" class=\"sv-box\"/><text x=\"130\" y=\"126\" text-anchor=\"middle\" class=\"sv-t sv-m\">10 · 25 · 40<\/text>", "<rect x=\"300\" y=\"100\" width=\"160\" height=\"40\" rx=\"10\" class=\"sv-hl\"/><text x=\"380\" y=\"126\" text-anchor=\"middle\" class=\"sv-t sv-m\">60 · 72 · 75<\/text>", "<rect x=\"550\" y=\"100\" width=\"160\" height=\"40\" rx=\"10\" class=\"sv-box\"/><text x=\"630\" y=\"126\" text-anchor=\"middle\" class=\"sv-t sv-m\">85 · 90 · 99<\/text>", "<path d=\"M380 140 L380 168\" class=\"sv-aa\" stroke-width=\"3\"/>", "<rect x=\"290\" y=\"168\" width=\"180\" height=\"34\" rx=\"10\" class=\"sv-good\"/><text x=\"380\" y=\"190\" text-anchor=\"middle\" class=\"sv-t\">row with salary 72<\/text>", "<\/svg>", "% The search compares 72 with 50 and 80 and goes down the middle branch: two hops instead of reading every row. With millions of rows the tree is still only a few levels deep."]}, {"k": "vis", "t": "c2o", "ti": "", "c": ["EXPLAIN SELECT * FROM emp WHERE dept_id = 2  (no index) => type: ALL · rows: 100000   (full scan)", "CREATE INDEX idx_dept ON emp(dept_id) => index built", "EXPLAIN … (with index) => type: ref · rows: 12", "% \"ALL\" in EXPLAIN means a full table scan. After the index, MySQL reads only the matching rows."]}]}, {"h": "What a trigger sees", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### UPDATE emp SET salary = 60000 WHERE id = 1", "row | id | salary", "OLD | 1 | 50000", "* NEW | 1 | 60000", ">> AFTER UPDATE trigger", "### sal_audit (row added)", "emp_id | old_sal | new_sal", "1 | 50000 | 60000", "% Inside the trigger, OLD is the row before the change and NEW the row after. INSERT has only NEW; DELETE has only OLD."]}]}, {"h": "View vs procedure vs trigger", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## 🪟 View", "- a saved SELECT", "- used like a table: `SELECT * FROM top_paid`", "## ⚙️ Procedure", "- saved code you run on purpose", "- `CALL raise_dept(1, 5)`", "## ⚡ Trigger", "- runs by itself on INSERT / UPDATE / DELETE", "- you never call it"]}]}, {"h": "Views", "b": [{"k": "code", "l": "sql", "c": "CREATE OR REPLACE VIEW top_paid AS\nSELECT e.name, d.dname, e.salary\nFROM emp e JOIN dept d ON e.dept_id = d.dept_id\nWHERE e.salary > 50000;\n\nSELECT * FROM top_paid;\nDROP VIEW top_paid;"}, {"k": "tbl", "h": null, "r": [["Simple view", "one table, no aggregates: usually updatable"], ["Complex view", "joins / GROUP BY: read-only"], ["Materialized view", "stores the result (Oracle, PostgreSQL, Snowflake); needs refresh"]]}]}, {"h": "Stored procedure (MySQL)", "b": [{"k": "code", "l": "sql", "c": "DELIMITER //\nCREATE PROCEDURE raise_dept(IN p_dept INT, IN p_pct DECIMAL(5,2))\nBEGIN\n  UPDATE emp SET salary = salary * (1 + p_pct/100) WHERE dept_id = p_dept;\nEND //\nDELIMITER ;\nCALL raise_dept(1, 5);"}]}, {"h": "PL/SQL block (Oracle)", "b": [{"k": "code", "l": "sql", "c": "DECLARE\n  v_total NUMBER;\nBEGIN\n  SELECT SUM(salary) INTO v_total FROM emp;\n  DBMS_OUTPUT.PUT_LINE('Total: ' || v_total);\nEXCEPTION\n  WHEN NO_DATA_FOUND THEN DBMS_OUTPUT.PUT_LINE('none');\nEND;"}]}, {"h": "Triggers", "b": [{"k": "code", "l": "sql", "c": "DELIMITER //\nCREATE TRIGGER trg_sal_audit\nAFTER UPDATE ON emp\nFOR EACH ROW\nBEGIN\n  IF NEW.salary <> OLD.salary THEN\n    INSERT INTO sal_audit(emp_id, old_sal, new_sal, changed_at)\n    VALUES (OLD.emp_id, OLD.salary, NEW.salary, NOW());\n  END IF;\nEND //\nDELIMITER ;"}, {"k": "tbl", "h": null, "r": [["BEFORE / AFTER", "INSERT, UPDATE, DELETE"], ["NEW / OLD", "row after / before the change (OLD not in INSERT, NEW not in DELETE)"]]}]}, {"h": "Indexes", "b": [{"k": "code", "l": "sql", "c": "CREATE INDEX idx_emp_dept ON emp(dept_id);\nCREATE UNIQUE INDEX idx_email ON emp(email);\nCREATE INDEX idx_dept_sal ON emp(dept_id, salary);   -- composite\nSHOW INDEX FROM emp;  DROP INDEX idx_emp_dept ON emp;\nEXPLAIN SELECT * FROM emp WHERE dept_id = 2;          -- check the plan"}, {"k": "tbl", "h": null, "r": [["B-tree", "default; equality, range, ORDER BY"], ["Hash", "equality only"], ["Clustered", "table rows stored in key order (InnoDB primary key)"], ["Non-clustered / secondary", "separate structure pointing to rows"], ["Leftmost prefix", "(dept_id, salary) helps WHERE dept_id=… but not WHERE salary=… alone"]]}]}, {"h": "Query optimisation", "b": [{"k": "ul", "c": ["Select only needed columns, not SELECT *", "Index columns used in WHERE, JOIN and ORDER BY", "Avoid functions on indexed columns: WHERE YEAR(d)=2026 → WHERE d >= '2026-01-01' AND d < '2027-01-01'", "A leading wildcard (LIKE '%x') can't use a B-tree index", "Prefer EXISTS / joins over large IN lists; check EXPLAIN for \"ALL\" (full scan)"]}, {"k": "tip", "c": "Indexes speed reads but slow INSERT/UPDATE and use space."}]}]}, {"id": "nosql-intro", "g": "NoSQL", "i": "🧭", "t": "NoSQL Fundamentals", "d": "Types, CAP, BASE, schema evolution", "s": [{"h": "The same data, four shapes", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## 🔑 Key-value", "- `\"user:1\" → \"Asha\"`", "- lookup by key only", "- Redis, DynamoDB", "## 📄 Document", "- `{name: \"Asha\", skills: [\"sql\", \"py\"]}`", "- nested, flexible fields", "- MongoDB", "## 🏛️ Wide column", "- `row 101 → (18-Nov: 499) (02-Nov: 120) …`", "- many columns per row, sorted", "- Cassandra, HBase", "## 🕸️ Graph", "- `(Asha) -[FRIEND]-> (Ravi)`", "- relationships are first-class", "- Neo4j"]}]}, {"h": "CAP: in a network split you keep two", "b": [{"k": "vis", "t": "ring", "ti": "", "c": ["C :: Consistency · every read sees the latest write", "A :: Availability · every request gets an answer", "P :: Partition tolerance · survives a network split", "@ pick 2", "--", "CA · RDBMS", "AP · Cassandra", "CP · MongoDB", "% Each edge is a pair you can keep (HBase is CP too). Distributed systems must tolerate partitions, so the real choice is CP (refuse rather than answer stale) or AP (answer, maybe stale)."]}, {"k": "mem", "c": ["**ACID** = strict (RDBMS). **BASE** = Basically Available, Soft state, Eventually consistent."]}]}, {"h": "RDBMS vs NoSQL", "b": [{"k": "tbl", "h": ["RDBMS", "NoSQL"], "r": [["Schema", "fixed, defined first", "flexible / schema-on-read"], ["Scaling", "mostly vertical (bigger server)", "horizontal (more nodes, sharding)"], ["Consistency", "ACID", "often BASE (eventual), tunable"], ["Joins", "yes", "rare; data denormalised / embedded"], ["Query", "SQL", "API / own query language"], ["Best for", "transactions, complex relations", "big volume, fast changing structure, high write rates"]]}]}, {"h": "BASE", "b": [{"k": "tbl", "h": null, "r": [["Basically Available", "system answers even if some data is stale"], ["Soft state", "state may change without input (replication)"], ["Eventual consistency", "replicas converge over time"]]}]}, {"h": "Storage architecture", "b": [{"k": "tbl", "h": null, "r": [["Row store", "whole row together: fast single-record reads/writes (OLTP)"], ["Column store", "each column together: fast scans & compression for aggregates (OLAP)"], ["LSM tree", "writes go to memory (memtable) + commit log, flushed to immutable SSTables, merged by compaction (Cassandra, HBase)"], ["Document store internals", "BSON documents in collections; WiredTiger engine with B-tree indexes, compression, document-level locking"]]}]}, {"h": "Schema & data evolution", "b": [{"k": "tbl", "h": null, "r": [["Document DB", "add fields any time; old docs simply lack them. Use a schemaVersion field and migrate lazily or in batches"], ["Column-family DB", "add columns freely within a family; changing the row key means a new table + data copy"], ["Key-value", "the value is opaque: version the value format (v1/v2) and handle both in code"], ["Oracle NoSQL", "tables with a primary key (shard key + rest), JSON columns for flexible parts, ALTER TABLE to add fields"]]}, {"k": "tip", "c": "NoSQL design is query-first: list the queries, then shape the data so each query reads one place."}]}]}, {"id": "mongodb", "g": "NoSQL", "i": "🍃", "t": "MongoDB CRUD & Queries", "d": "insert, find, operators, update, delete", "s": [{"h": "A SQL row vs a MongoDB document", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### SQL: products", "id | name | price", "1 | Pen | 10", "### SQL: product_tags", "product_id | tag", "1 | office", "1 | school"]}, {"k": "code", "l": "js", "c": "// MongoDB: one document holds it all\n{ _id: ObjectId(\"…\"), name: \"Pen\", price: 10,\n  tags: [\"office\", \"school\"],            // array instead of a second table\n  stock: { qty: 50, wh: \"Pune\" } }       // embedded document"}]}, {"h": "Anatomy of find()", "b": [{"k": "vis", "t": "anat", "ti": "", "c": ["\"db.products\"", "\".find(\"", "\"{ price: { $gt: 100 } } :: filter = WHERE\"", "\", \"", "\"{ name: 1, _id: 0 } :: projection = SELECT columns\"", "\")\"", "\".sort({ price: -1 }) :: ORDER BY price DESC\"", "\".limit(5) :: LIMIT 5\""]}]}, {"h": "Update vs replace", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["## doc = { name: \"Pen\", price: 10, tags: [...] }", "updateOne({name: \"Pen\"}, {$set: {price: 12}}) => { name: \"Pen\", price: 12, tags: [...] }", "updateOne({name: \"Pen\"}, {price: 12}) =x Error: update document requires atomic operators", "replaceOne({name: \"Pen\"}, {name: \"Pen\", price: 12}) => { name: \"Pen\", price: 12 }   (tags gone)", "updateOne({name: \"Ink\"}, {$set: {price: 30}}, {upsert: true}) => no Ink found → inserted", "% $set changes only the fields you name. replaceOne swaps the whole document. Upsert = update, or insert if nothing matched."]}]}, {"h": "Shell basics", "b": [{"k": "code", "l": "js", "c": "show dbs\nuse shop                      // creates on first insert\nshow collections\ndb.createCollection(\"products\")\ndb.products.drop(); db.dropDatabase()"}]}, {"h": "Create", "b": [{"k": "code", "l": "js", "c": "db.products.insertOne({ name: \"Pen\", price: 10, tags: [\"office\"], stock: { qty: 50 } })\ndb.products.insertMany([\n  { name: \"Book\", price: 250, category: \"edu\" },\n  { name: \"Bag\",  price: 900, category: \"travel\" }\n])"}]}, {"h": "Read", "b": [{"k": "code", "l": "js", "c": "db.products.find()                                   // all\ndb.products.find({ category: \"edu\" })                // equality\ndb.products.find({ price: { $gt: 100, $lte: 900 } }) // range\ndb.products.findOne({ name: \"Pen\" })\ndb.products.find({}, { name: 1, price: 1, _id: 0 })  // projection\ndb.products.find().sort({ price: -1 }).skip(10).limit(5)\ndb.products.countDocuments({ price: { $gt: 100 } })\ndb.products.distinct(\"category\")\ndb.products.find({ \"stock.qty\": { $lt: 10 } })       // nested field\ndb.products.find({ tags: \"office\" })                 // array contains"}]}, {"h": "Operators", "b": [{"k": "tbl", "h": null, "r": [["$eq $ne $gt $gte $lt $lte", "comparison"], ["$in / $nin", "in / not in a list"], ["$and $or $nor $not", "logical: { $or: [ {a:1}, {b:2} ] }"], ["$exists / $type", "field present / BSON type"], ["$regex", "{ name: { $regex: /^p/i } }"], ["$all $size $elemMatch", "array tests"]]}]}, {"h": "Combined example (lab style)", "b": [{"k": "code", "l": "js", "c": "db.products.find({\n  category: { $nin: [\"travel\", \"toys\"] },\n  brand: { $ne: \"Generic\" },\n  price: { $gte: 100, $lte: 1000 }\n}).sort({ price: -1 })"}]}, {"h": "Update", "b": [{"k": "code", "l": "js", "c": "db.products.updateOne({ name: \"Pen\" }, { $set: { price: 12 } })\ndb.products.updateMany({ category: \"edu\" }, { $inc: { price: 5 } })\ndb.products.updateOne({ name: \"Ink\" }, { $set: { price: 30 } }, { upsert: true })\ndb.products.replaceOne({ name: \"Bag\" }, { name: \"Bag\", price: 950 })"}, {"k": "tbl", "h": null, "r": [["$set / $unset", "set / remove field"], ["$inc / $mul", "add / multiply"], ["$rename", "rename field"], ["$push / $addToSet / $pull / $pop", "add / add-if-absent / remove / remove first or last in an array"]]}]}, {"h": "Delete", "b": [{"k": "code", "l": "js", "c": "db.products.deleteOne({ name: \"Pen\" })\ndb.products.deleteMany({ price: { $lt: 20 } })"}]}]}, {"id": "mongodb-advanced", "g": "NoSQL", "i": "🧬", "t": "MongoDB Aggregation, Indexes & Internals", "d": "Pipeline, $lookup, indexes, explain, replication, sharding", "s": [{"h": "Documents flowing through a pipeline", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### orders", "cust | status | amount", "A | paid | 100", "B | paid | 300", "A | paid | 250", "- C | cancelled | 900", ">> $match: {status: \"paid\"}  →  $group: {_id: \"$cust\", total: {$sum: \"$amount\"}}", "### grouped", "_id | total", "A | 350", "B | 300", ">> $sort: {total: -1}  →  $limit: 1", "### top customer", "_id | total", "* A | 350", "% Each stage passes its output to the next. $match first throws away the cancelled order, so later stages do less work (and $match can use an index)."]}]}, {"h": "Did the query use an index?", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["find({price: {$gt: 500}}).explain(\"executionStats\") (no index) => COLLSCAN · totalDocsExamined: 100000", "createIndex({price: 1}) => \"price_1\"", "… explain again => IXSCAN · totalDocsExamined: 120"]}]}, {"h": "Sharded cluster", "b": [{"k": "vis", "t": "hub", "ti": "", "c": ["* mongos router :: apps connect here; it routes by shard key", "Shard 1 :: replica set", "Shard 2 :: replica set", "Shard 3 :: replica set", "Config servers :: which key range lives where"]}]}, {"h": "Aggregation pipeline", "b": [{"k": "code", "l": "js", "c": "db.orders.aggregate([\n  { $match: { status: \"paid\" } },\n  { $unwind: \"$items\" },\n  { $group: { _id: \"$items.category\",\n              revenue: { $sum: { $multiply: [\"$items.qty\", \"$items.price\"] } },\n              orders:  { $sum: 1 } } },\n  { $sort: { revenue: -1 } },\n  { $limit: 5 },\n  { $project: { _id: 0, category: \"$_id\", revenue: 1, orders: 1 } }\n])"}, {"k": "tbl", "h": null, "r": [["$match", "filter (put early, can use indexes)"], ["$group", "_id = group key; $sum $avg $min $max $push $addToSet $first"], ["$project / $addFields", "shape / add fields"], ["$unwind", "one doc per array element"], ["$lookup", "left outer join to another collection"], ["$sort $limit $skip $count", "order / paging / count"], ["$bucket / $facet", "ranges / several pipelines at once"]]}, {"k": "code", "l": "js", "c": "{ $lookup: { from: \"customers\", localField: \"cust_id\",\n             foreignField: \"_id\", as: \"customer\" } }"}]}, {"h": "Indexes", "b": [{"k": "code", "l": "js", "c": "db.products.createIndex({ price: 1 })                // ascending\ndb.products.createIndex({ category: 1, price: -1 })  // compound\ndb.users.createIndex({ email: 1 }, { unique: true })\ndb.posts.createIndex({ body: \"text\" })               // text search\ndb.sessions.createIndex({ at: 1 }, { expireAfterSeconds: 3600 }) // TTL\ndb.products.getIndexes(); db.products.dropIndex(\"price_1\")\ndb.products.find({ price: { $gt: 500 } }).explain(\"executionStats\")"}, {"k": "tbl", "h": null, "r": [["COLLSCAN vs IXSCAN", "full scan vs index used (compare totalDocsExamined & executionTimeMillis)"], ["ESR rule", "compound index order: Equality, Sort, Range fields"], ["Covered query", "all fields from the index: no document fetch"], ["Index types", "single, compound, multikey (arrays), text, geospatial (2dsphere), hashed, TTL, partial"]]}]}, {"h": "Internals", "b": [{"k": "tbl", "h": null, "r": [["BSON", "binary JSON; 16 MB max document"], ["WiredTiger", "default engine: document-level concurrency, compression, journal"], ["Replica set", "primary + secondaries; automatic failover by election"], ["Sharding", "split a collection across shards by a shard key; mongos routes queries; config servers hold metadata"], ["Write concern / read preference", "how many nodes must ack / which node to read from"]]}]}, {"h": "Modelling", "b": [{"k": "tbl", "h": null, "r": [["Embed", "data read together, 1:few (address in user)"], ["Reference", "large or shared data, 1:many / many:many (store _id)"]]}]}]}, {"id": "cassandra", "g": "NoSQL", "i": "👁️", "t": "Apache Cassandra & CQL", "d": "Ring, partition key, CQL, consistency, vs MongoDB", "s": [{"h": "Where does a row go?", "b": [{"k": "vis", "t": "ring", "ti": "Partition key 101 → hash → token 31 → Node B, plus 2 replicas (RF = 3)", "c": ["Node A :: tokens 0–24", "* Node B :: tokens 25–49 · primary for 101", "* Node C :: tokens 50–74 · replica", "* Node D :: tokens 75–99 · replica", "@ no master", "% Token ranges are simplified. The hash of the partition key picks the first node; the next nodes clockwise hold the other copies. Any node can take the request and forward it."]}]}, {"h": "One partition, sorted by the clustering key", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### PRIMARY KEY ((cust_id), order_ts) WITH CLUSTERING ORDER BY (order_ts DESC)", "cust_id | order_ts | amount", "~1 101 | 2026-11-18 | 499", "~1 101 | 2026-11-02 | 120", "~1 101 | 2026-10-21 | 860", "~2 205 | 2026-11-15 | 75", "% Rows of one customer (one colour) live together on the same nodes, newest first. Reading \"latest orders of customer 101\" is one fast read."]}, {"k": "vis", "t": "c2o", "ti": "", "c": ["SELECT * FROM orders WHERE cust_id = 101 => fast: one partition", "… WHERE cust_id = 101 AND order_ts > '2026-11-01' => fine: range on the clustering key", "… WHERE amount > 100 =x needs ALLOW FILTERING (scans every node)", "% Design one table per query. If you need orders by amount, create a second table keyed for that."]}]}, {"h": "Why writes are fast", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["Commit log :: append to disk (durability)", "Memtable :: sorted, in memory", "SSTable :: flushed to disk, never edited", "Compaction :: merges SSTables in the background"]}]}, {"h": "Architecture", "b": [{"k": "tbl", "h": null, "r": [["Masterless ring", "every node equal; peer-to-peer gossip, no single point of failure"], ["Partitioner", "hashes the partition key to a token → decides the node"], ["Replication factor", "copies of each row (RF = 3 typical)"], ["Strategy", "SimpleStrategy (one DC) / NetworkTopologyStrategy (multi-DC)"], ["Write path", "commit log → memtable → flushed to SSTable → compaction"], ["Tunable consistency", "ONE, QUORUM, ALL, LOCAL_QUORUM; strong when R + W > RF"]]}]}, {"h": "Keys", "b": [{"k": "tbl", "h": null, "r": [["Partition key", "which node; all rows with the same value live together"], ["Clustering key", "sort order inside a partition"], ["PRIMARY KEY ((a, b), c)", "(a,b) composite partition key, c clustering column"]]}]}, {"h": "CQL", "b": [{"k": "code", "l": "sql", "c": "CREATE KEYSPACE shop\n  WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};\nUSE shop;\nCREATE TABLE orders_by_customer (\n  cust_id   int,\n  order_ts  timestamp,\n  order_id  uuid,\n  amount    decimal,\n  PRIMARY KEY ((cust_id), order_ts)\n) WITH CLUSTERING ORDER BY (order_ts DESC);\n\nINSERT INTO orders_by_customer (cust_id, order_ts, order_id, amount)\nVALUES (101, toTimestamp(now()), uuid(), 499.0) USING TTL 86400;\n\nSELECT * FROM orders_by_customer WHERE cust_id = 101 LIMIT 10;\nUPDATE orders_by_customer SET amount = 520 WHERE cust_id = 101 AND order_ts = '2026-11-18 10:00:00';\nDELETE FROM orders_by_customer WHERE cust_id = 101;\nDESCRIBE TABLES;"}, {"k": "tip", "c": "WHERE must use the partition key; filtering on other columns needs a new table designed for that query (or ALLOW FILTERING, which scans and is slow). No joins, no subqueries: one table per query."}]}, {"h": "Collections & counters", "b": [{"k": "code", "l": "sql", "c": "ALTER TABLE users ADD emails set<text>;\nUPDATE users SET emails = emails + {'a@x.com'} WHERE id = 1;\nCREATE TABLE page_views (page text PRIMARY KEY, views counter);\nUPDATE page_views SET views = views + 1 WHERE page = 'home';"}]}, {"h": "Cassandra vs MongoDB", "b": [{"k": "tbl", "h": ["Cassandra", "MongoDB"], "r": [["Model", "wide-column", "document (BSON)"], ["Architecture", "masterless ring", "primary–secondary replica sets + sharding"], ["CAP lean", "AP (tunable)", "CP (default)"], ["Writes", "extremely high throughput", "high"], ["Queries", "by partition key, design per query", "rich ad-hoc queries, secondary indexes, aggregation"], ["Query language", "CQL (SQL-like)", "MQL (JSON)"], ["Good for", "IoT, time series, logs, messaging", "catalogues, content, user profiles, general apps"]]}]}]}, {"id": "hbase-redis", "g": "NoSQL", "i": "🔑", "t": "HBase & Redis", "d": "Column-family on HDFS, key-value in memory", "s": [{"h": "An HBase table as a grid", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### emp  (column families: personal, pro)", "row key | personal:name | personal:city | pro:salary", "r1 | Asha (t2), Asha S (t1) | Pune | 50000", "r2 | Ravi | NULL | 42000", "% A cell is found by row key + family:qualifier, and keeps old versions by timestamp (t1, t2). Empty cells cost nothing, so tables can be very wide and sparse."]}]}, {"h": "Redis commands and what they return", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["SET otp:99 \"4821\" EX 300 => OK            (expires in 5 min)", "TTL otp:99 => (integer) 297                (seconds left)", "INCR page:views => (integer) 1", "HSET user:1 name Asha city Pune => (integer) 2", "HGETALL user:1 => name Asha city Pune", "ZADD board 90 asha 75 ravi => (integer) 2", "ZREVRANGE board 0 1 WITHSCORES => asha 90, ravi 75   (leaderboard)", "GET missing => (nil)"]}]}, {"h": "HBase model", "b": [{"k": "tbl", "h": null, "r": [["Table → row key → column family → column qualifier → versioned cell (timestamp)"], ["Runs on HDFS; HMaster + RegionServers; ZooKeeper coordinates"], ["Rows sorted by row key; tables split into regions"], ["Strong consistency per row; good for random reads/writes on huge sparse tables"]]}]}, {"h": "HBase shell", "b": [{"k": "code", "l": "bash", "c": "create 'emp', 'personal', 'pro'\nput 'emp', 'r1', 'personal:name', 'Asha'\nput 'emp', 'r1', 'pro:salary', '50000'\nget 'emp', 'r1'\nscan 'emp', {COLUMNS => 'personal', LIMIT => 10}\nscan 'emp', {STARTROW => 'r1', STOPROW => 'r5'}\ndelete 'emp', 'r1', 'pro:salary'\ncount 'emp'\ndisable 'emp'; drop 'emp'\nlist; describe 'emp'"}, {"k": "tip", "c": "Row-key design is everything: avoid sequential keys (timestamps) that hot-spot one region. Salt or reverse them."}]}, {"h": "Redis", "b": [{"k": "tbl", "h": null, "r": [["In-memory key-value store; optional persistence (RDB snapshots, AOF log)"], ["Uses: cache, sessions, leaderboards, rate limits, queues, pub/sub"]]}, {"k": "code", "l": "bash", "c": "SET user:1:name \"Asha\"      GET user:1:name\nSET otp:99 \"4821\" EX 300    TTL otp:99        # expire in 5 min\nINCR page:views             DEL user:1:name   EXISTS user:1:name\nKEYS user:*                 # avoid in production; use SCAN\nHSET user:1 name Asha city Pune     HGETALL user:1     # hash\nLPUSH queue job1  RPOP queue        LRANGE queue 0 -1   # list\nSADD tags py sql  SMEMBERS tags     SISMEMBER tags py   # set\nZADD board 90 asha 75 ravi          ZREVRANGE board 0 2 WITHSCORES   # sorted set\nPUBLISH news \"hi\"  SUBSCRIBE news"}, {"k": "code", "l": "py", "c": "import redis\nr = redis.Redis(host=\"localhost\", port=6379, decode_responses=True)\nr.set(\"k\", \"v\", ex=60); r.get(\"k\"); r.zadd(\"board\", {\"asha\": 90})"}]}, {"h": "HBase architecture (Big Data Technologies, Session 10)", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["Client :: asks ZooKeeper where hbase:meta is", "ZooKeeper :: coordination, tracks live servers", "HMaster :: assigns regions, DDL (create/drop), balancing", "* RegionServer :: serves reads/writes for its regions", "Region :: a range of row keys; splits when it grows", "HDFS :: stores HFiles + write-ahead log (WAL)", "% A write goes to the WAL (for recovery) and the MemStore (in memory), later flushed to HFiles on HDFS — the same idea as Cassandra's commit log + memtable + SSTable."]}, {"k": "tbl", "h": null, "r": [["HBase vs RDBMS", "column-family vs fixed rows · row-key access only (no joins, no SQL by default) · billions of sparse rows · strong per-row consistency, no multi-row transactions"]]}]}]}, {"id": "data-warehouse", "g": "Warehouse, Lake & Cloud", "i": "🏛️", "t": "Data Warehousing & SCD", "d": "Star schema, ETL, OLAP ops, slowly changing dimensions", "s": [{"h": "Star schema", "b": [{"k": "vis", "t": "hub", "ti": "", "c": ["* fact_sales :: date_key · product_key · customer_key · store_key · qty · amount", "dim_date :: date_key · day · month · quarter · year", "dim_product :: product_key · name · category · brand", "dim_customer :: customer_key · name · city · segment", "dim_store :: store_key · city · region", "% The fact table in the middle holds the numbers (qty, amount) plus one key per dimension. Dimensions around it describe who, what, where and when. A report joins the fact to the dimensions it needs and sums the numbers."]}]}, {"h": "Roll-up in practice", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### fact (daily)", "date | product | amount", "01-Nov | Pen | 100", "02-Nov | Pen | 150", "01-Dec | Pen | 120", ">> roll-up: day → month", "### monthly", "month | product | amount", "Nov | Pen | 250", "Dec | Pen | 120", "% Roll-up climbs the date hierarchy and adds the numbers. Drill-down goes the other way, back to daily rows."]}]}, {"h": "SCD Type 2: a customer moves Pune → Mumbai", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### dim_customer", "cust_sk | cust_id | city | eff_from | eff_to | is_current", "- 1 | 101 | Pune | 2024-01-01 | 2026-11-17 | N", "* 7 | 101 | Mumbai | 2026-11-18 | 9999-12-31 | Y", "% The old row is closed (eff_to set, is_current = N) and a new row is added with a new surrogate key. Sales made before 18 Nov still point to the Pune row, so history stays correct."]}, {"k": "mem", "c": ["SCD **Type 1** overwrite · **Type 2** add a row · **Type 3** add a \"previous\" column."]}]}, {"h": "Key ideas", "b": [{"k": "tbl", "h": null, "r": [["Data warehouse", "subject-oriented, integrated, time-variant, non-volatile store for analysis (Inmon)"], ["Data mart", "subset for one department (sales mart)"], ["ETL vs ELT", "transform before loading / load raw then transform inside the warehouse"], ["Fact table", "measures (amount, qty) + foreign keys; very many rows"], ["Dimension table", "descriptive context (who, what, where, when)"], ["Grain", "what one fact row means: \"one line item per order\""]]}]}, {"h": "Fact types", "b": [{"k": "tbl", "h": null, "r": [["Additive", "can be summed over all dimensions (sales amount)"], ["Semi-additive", "not over time (account balance)"], ["Non-additive", "ratios, percentages"], ["Factless fact", "records events only (attendance)"]]}]}, {"h": "OLAP operations", "b": [{"k": "tbl", "h": null, "r": [["Roll-up", "summarise up a hierarchy (day → month)"], ["Drill-down", "go into detail (year → quarter)"], ["Slice", "fix one dimension (year = 2026)"], ["Dice", "filter on several dimensions"], ["Pivot", "rotate rows/columns"], ["MOLAP / ROLAP / HOLAP", "cube storage / relational / hybrid"]]}]}, {"h": "Approaches & tools", "b": [{"k": "tbl", "h": null, "r": [["Inmon", "top-down: normalised enterprise DW, then marts"], ["Kimball", "bottom-up: dimensional marts joined by conformed dimensions"], ["Tools", "Snowflake, Amazon Redshift, Google BigQuery, Azure Synapse, Teradata; ETL: Informatica, Talend, SSIS, Airflow, dbt; BI: Power BI, Tableau"], ["Algorithms used", "ETL/CDC, surrogate key generation, bitmap indexes, materialised aggregates, partitioning, columnar compression"]]}]}, {"h": "Slowly Changing Dimensions", "b": [{"k": "tbl", "h": null, "r": [["Type 0", "never change (date of birth)"], ["Type 1", "overwrite, no history"], ["Type 2", "new row per change, with dates + current flag (full history)"], ["Type 3", "extra \"previous value\" column (limited history)"], ["Type 4 / 6", "separate history table / hybrid of 1+2+3"]]}]}, {"h": "SCD Type 2 in SQL", "b": [{"k": "code", "l": "sql", "c": "CREATE TABLE dim_customer (\n  cust_sk      INT AUTO_INCREMENT PRIMARY KEY,   -- surrogate key\n  cust_id      INT,                              -- natural/business key\n  name         VARCHAR(50),\n  city         VARCHAR(30),\n  eff_from     DATE,\n  eff_to       DATE DEFAULT '9999-12-31',\n  is_current   CHAR(1) DEFAULT 'Y'\n);\n-- 1. expire the current row when the city changed\nUPDATE dim_customer d JOIN stg_customer s ON d.cust_id = s.cust_id\nSET d.eff_to = CURRENT_DATE - INTERVAL 1 DAY, d.is_current = 'N'\nWHERE d.is_current = 'Y' AND d.city <> s.city;\n-- 2. insert new version (changed or brand-new customers)\nINSERT INTO dim_customer (cust_id, name, city, eff_from)\nSELECT s.cust_id, s.name, s.city, CURRENT_DATE\nFROM stg_customer s\nLEFT JOIN dim_customer d ON d.cust_id = s.cust_id AND d.is_current = 'Y'\nWHERE d.cust_id IS NULL;"}]}]}, {"id": "data-lake", "g": "Warehouse, Lake & Cloud", "i": "🌊", "t": "Data Lake & Lakehouse", "d": "Zones, formats, lake vs warehouse vs lakehouse", "s": [{"h": "One record through the zones", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### bronze / raw", "id | city | amount | ts", "' 101' | pune | '499.0' | 2026-11-18T10:02", "' 101' | pune | '499.0' | 2026-11-18T10:02", "102 | Mumbai | 120 | 2026-11-18T11:40", ">> clean, de-duplicate, set types", "### silver / curated", "id | city | amount | date", "101 | Pune | 499.0 | 2026-11-18", "102 | Mumbai | 120.0 | 2026-11-18", ">> aggregate for the business", "### gold / refined", "city | revenue", "Mumbai | 120.0", "Pune | 499.0", "% Raw data is kept exactly as it arrived, duplicate and all, so you can always reprocess. Silver is trustworthy row data. Gold is shaped for one use, such as a dashboard."]}]}, {"h": "Lake vs warehouse vs lakehouse", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## 🌊 Data lake", "- any data, stored raw and cheap", "- schema on read", "- no ACID by itself", "- data scientists, ML", "## 🏛️ Data warehouse", "- cleaned, structured tables", "- schema on write", "- ACID, fast SQL", "- analysts, BI", "## 🏡 Lakehouse", "- lake storage + table format (Delta, Iceberg)", "- ACID, time travel, MERGE", "- one copy for BI and ML"]}]}, {"h": "Data lake", "b": [{"k": "tbl", "h": null, "r": [["What", "central store for raw data of any type at any scale, on cheap object storage (S3, ADLS, GCS, HDFS)"], ["Schema-on-read", "structure applied when queried, not when loaded"], ["Why", "keep everything cheaply, support ML and exploration, ingest fast"]]}]}, {"h": "Challenges", "b": [{"k": "tbl", "h": null, "r": [["Data swamp", "no catalogue or quality → nobody trusts or finds data"], ["Governance", "access control, lineage, PII masking, retention"], ["Fixes", "data catalog (Glue Catalog, Unity Catalog, Purview), metadata, quality checks, ownership"]]}]}, {"h": "File formats", "b": [{"k": "tbl", "h": null, "r": [["CSV / JSON", "row text formats: easy, large, slow"], ["Parquet / ORC", "columnar, compressed, splittable: best for analytics"], ["Avro", "row-based binary with schema: good for streaming/ingest"]]}]}, {"h": "Open table formats", "b": [{"k": "tbl", "h": null, "r": [["Delta Lake / Apache Iceberg / Apache Hudi", "add a transaction log over Parquet files"], ["Gives", "ACID transactions, time travel, schema evolution, MERGE / upserts, partition pruning"]]}, {"k": "code", "l": "sql", "c": "-- Spark SQL / Databricks (Delta)\nCREATE TABLE sales USING DELTA AS SELECT * FROM parquet.`/lake/raw/sales`;\nMERGE INTO sales t USING updates s ON t.id = s.id\nWHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *;\nSELECT * FROM sales VERSION AS OF 3;      -- time travel\nDESCRIBE HISTORY sales;"}, {"k": "tip", "c": "Medallion architecture = bronze → silver → gold on one lakehouse."}]}]}, {"id": "snowflake", "g": "Warehouse, Lake & Cloud", "i": "❄️", "t": "Snowflake", "d": "Architecture, warehouses, stages, COPY, cost", "s": [{"h": "Architecture: storage and compute are separate", "b": [{"k": "vis", "t": "svg", "ti": "", "c": ["<svg viewBox=\"0 0 760 270\">", "<rect x=\"20\" y=\"14\" width=\"720\" height=\"50\" rx=\"12\" class=\"sv-hl\"/>", "<text x=\"380\" y=\"36\" text-anchor=\"middle\" class=\"sv-t\">Cloud services<\/text><text x=\"380\" y=\"54\" text-anchor=\"middle\" class=\"sv-s\">login · metadata · query optimiser · access control · result cache<\/text>", "<g>", "<rect x=\"40\" y=\"96\" width=\"200\" height=\"66\" rx=\"12\" class=\"sv-box\"/><text x=\"140\" y=\"122\" text-anchor=\"middle\" class=\"sv-t\">ETL_WH  (X-Small)<\/text><text x=\"140\" y=\"142\" text-anchor=\"middle\" class=\"sv-s\">nightly loads<\/text>", "<rect x=\"280\" y=\"96\" width=\"200\" height=\"66\" rx=\"12\" class=\"sv-box\"/><text x=\"380\" y=\"122\" text-anchor=\"middle\" class=\"sv-t\">BI_WH  (Medium)<\/text><text x=\"380\" y=\"142\" text-anchor=\"middle\" class=\"sv-s\">dashboards<\/text>", "<rect x=\"520\" y=\"96\" width=\"200\" height=\"66\" rx=\"12\" class=\"sv-box\"/><text x=\"620\" y=\"122\" text-anchor=\"middle\" class=\"sv-t\">DS_WH  (Large)<\/text><text x=\"620\" y=\"142\" text-anchor=\"middle\" class=\"sv-s\">data science<\/text>", "<\/g>", "<text x=\"20\" y=\"88\" class=\"sv-lbl\">virtual warehouses (compute) · start, stop and resize independently<\/text>", "<path d=\"M140 162 V200\" class=\"sv-aa\"/><path d=\"M380 162 V200\" class=\"sv-aa\"/><path d=\"M620 162 V200\" class=\"sv-aa\"/>", "<rect x=\"20\" y=\"200\" width=\"720\" height=\"56\" rx=\"12\" class=\"sv-good\"/>", "<text x=\"380\" y=\"224\" text-anchor=\"middle\" class=\"sv-t\">Storage: one shared copy of the data<\/text><text x=\"380\" y=\"243\" text-anchor=\"middle\" class=\"sv-s\">compressed columnar micro-partitions on S3 / Azure Blob / GCS<\/text>", "<\/svg>", "% Three warehouses read the same tables at the same time without slowing each other down. You pay for each warehouse only while it runs, and for storage separately."]}]}, {"h": "Warehouse size and cost", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### credits per hour (each size doubles)", "size | credits / hour", "X-Small | 1", "Small | 2", "Medium | 4", "Large | 8", "% A bigger warehouse costs more per hour but finishes large queries faster. AUTO_SUSPEND stops billing when it sits idle."]}]}, {"h": "Loading a file", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["File :: orders.csv on your PC", "PUT :: upload into @my_stage", "COPY INTO orders :: parse rows into the table", "* Query :: SQL on the loaded data"]}]}, {"h": "vs traditional DW", "b": [{"k": "tbl", "h": null, "r": [["Fully managed SaaS (no hardware, indexes or vacuuming)"], ["Per-second compute billing, auto-suspend / auto-resume"], ["Zero-copy cloning, Time Travel, Secure Data Sharing, native semi-structured data (VARIANT)"]]}]}, {"h": "Setup", "b": [{"k": "code", "l": "sql", "c": "CREATE WAREHOUSE lab_wh WAREHOUSE_SIZE = 'XSMALL'\n  AUTO_SUSPEND = 60 AUTO_RESUME = TRUE;\nCREATE DATABASE lab_db;\nCREATE SCHEMA lab_db.sales;\nUSE WAREHOUSE lab_wh; USE SCHEMA lab_db.sales;\nCREATE TABLE orders (id INT, cust STRING, amount NUMBER(10,2), dt DATE);"}]}, {"h": "Load data", "b": [{"k": "code", "l": "sql", "c": "CREATE FILE FORMAT csv_ff TYPE = CSV SKIP_HEADER = 1 FIELD_OPTIONALLY_ENCLOSED_BY = '\"';\nCREATE STAGE my_stage FILE_FORMAT = csv_ff;      -- internal stage\n-- from SnowSQL:  PUT file://C:/data/orders.csv @my_stage;\nLIST @my_stage;\nCOPY INTO orders FROM @my_stage ON_ERROR = 'CONTINUE';\n-- external stage: CREATE STAGE s3_stage URL='s3://bucket/path' STORAGE_INTEGRATION = my_int;"}, {"k": "tbl", "h": null, "r": [["Stage types", "user (@~), table (@%orders), named internal, external (S3/Azure/GCS)"], ["Snowpipe", "continuous auto-loading from a stage"]]}]}, {"h": "Query", "b": [{"k": "code", "l": "sql", "c": "WITH monthly AS (\n  SELECT DATE_TRUNC('month', dt) AS m, SUM(amount) AS total FROM orders GROUP BY 1\n)\nSELECT m, total, total - LAG(total) OVER (ORDER BY m) AS change FROM monthly;\nSELECT * FROM orders AT(OFFSET => -3600);   -- Time Travel: 1 hour ago\nCREATE TABLE orders_dev CLONE orders;        -- zero-copy clone\nSELECT v:customer.name::STRING FROM raw_json; -- VARIANT path"}]}, {"h": "Cost & performance", "b": [{"k": "tbl", "h": null, "r": [["Size", "XS → S → M → L … each size doubles credits per hour and roughly halves time for large queries"], ["ALTER WAREHOUSE lab_wh SET WAREHOUSE_SIZE = 'SMALL';", "resize"], ["AUTO_SUSPEND", "stop paying when idle (60 s is common)"], ["Multi-cluster", "scale out for many concurrent users"], ["Result cache", "identical query within 24 h returns instantly with no compute"], ["Clustering keys", "help pruning on very large tables"]]}]}]}, {"id": "data-engineering", "g": "Warehouse, Lake & Cloud", "i": "🧭", "t": "Data Engineering & Data Management", "d": "Pipelines, quality, governance, data-driven decisions", "s": [{"h": "A data pipeline", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["Ingest :: batch files, APIs, streams", "Store :: lake (raw) / warehouse", "Transform :: SQL, dbt, Spark", "Serve :: dashboards, ML, APIs", "Monitor :: freshness, quality, failures"]}]}, {"h": "From data to a decision", "b": [{"k": "vis", "t": "ladder", "ti": "", "c": ["Descriptive :: what happened?", "Diagnostic :: why did it happen?", "Predictive :: what will happen?", "* Prescriptive :: what should we do?", "% Each step needs the one before it and adds more value."]}, {"k": "mem", "c": ["Data quality: **Accuracy, Completeness, Consistency, Timeliness, Validity, Uniqueness**."]}]}, {"h": "Data engineering", "b": [{"k": "tbl", "h": null, "r": [["Role", "build reliable pipelines that move data from sources to where it's used"], ["Batch vs streaming", "scheduled chunks (Airflow, Spark) / continuous events (Kafka, Spark Streaming, Flink)"], ["Pipeline stages", "ingest → store → process/transform → serve → monitor"], ["Orchestration", "Airflow, Azure Data Factory, AWS Glue, Databricks Workflows"], ["Transformation", "SQL, dbt, Spark (PySpark)"]]}]}, {"h": "Data quality dimensions", "b": [{"k": "tbl", "h": null, "r": [["Accuracy", "correct values"], ["Completeness", "no missing required values"], ["Consistency", "same value across systems"], ["Timeliness", "fresh enough"], ["Validity", "right format/range"], ["Uniqueness", "no duplicates"]]}]}, {"h": "Enterprise data management", "b": [{"k": "tbl", "h": null, "r": [["Data governance", "policies, ownership (data owners / stewards), standards"], ["Master data management (MDM)", "single golden record for customers, products"], ["Metadata & catalog", "what data exists, meaning, lineage"], ["Security & privacy", "access control, masking, encryption; India's DPDP Act 2023"], ["Lifecycle", "create → store → use → archive → delete (retention rules)"]]}]}, {"h": "Data-driven decisions", "b": [{"k": "ul", "c": ["Define the business question and the KPI first", "Collect and clean the data, and state its limits", "Analyse: descriptive (what happened) → diagnostic (why) → predictive (what will happen) → prescriptive (what to do)", "Present clearly (dashboards), decide, then measure the outcome"]}, {"k": "tip", "c": "Prepare a raw dataset: profile it → fix types, duplicates, missing values → document the steps → save a clean copy for analysis."}]}]}, {"id": "bd-hadoop-intro", "g": "Big Data Technologies", "i": "🐘", "t": "Big Data & Hadoop Intro", "d": "5 Vs, sources, data life cycle, Hadoop history, ecosystem, distributions", "s": [{"h": "What makes data \"big\": the 5 Vs", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## 📦 Volume", "- terabytes → petabytes", "- too big for one machine", "## ⚡ Velocity", "- arrives fast: clicks, sensors, UPI payments", "- needs streaming", "## 🧩 Variety", "- tables, JSON logs, images, video", "- structured to unstructured", "## ❓ Veracity", "- noisy, missing, duplicated", "- can you trust it?", "## 💰 Value", "- the reason to store it", "- insight that changes a decision"]}, {"k": "tbl", "h": null, "r": [["Sources", "social media, web/app logs, IoT sensors, transactions, mobile, satellite & scientific instruments, public open data"], ["Skills", "Linux, SQL, Java/Python, distributed processing (Hadoop/Spark), data modelling, cloud, statistics"], ["Adoption steps", "business question → pilot on one use case → data platform → governance → scale across teams"]]}]}, {"h": "The data life cycle and curation", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["Create / collect :: instruments, apps, surveys", "Store :: repository with metadata", "Curate :: clean, describe, document, give a DOI", "Share & reuse :: open formats, licence, access rules", "Preserve / rescue :: migrate formats, save data at risk", "* Exit :: archive or delete at end of life", "% Curation = the work that keeps data findable, understandable and reusable after the original project ends. Meta-repositories (e.g. re3data) list repositories so researchers can find where data lives."]}, {"k": "tbl", "h": null, "r": [["Data sharing problems", "no metadata, unclear licence, privacy, effort not rewarded (\"overlooked\"); dumping raw files without context (\"overrated\")"], ["FAIR principles", "Findable, Accessible, Interoperable, Reusable"], ["Data rescue", "digitise and migrate old or at-risk data (paper records, obsolete media) before it is lost"]]}]}, {"h": "Hadoop in one picture", "b": [{"k": "vis", "t": "layers", "ti": "", "c": ["Hive · Pig · HBase · Spark · Sqoop · Kafka :: tools on top: SQL, NoSQL, fast processing, import/export, streaming", "MapReduce / Spark :: processing: move the code to where the data is", "YARN :: resource manager: who gets how much CPU/memory", "HDFS :: storage: files split into blocks, copied across machines", "Commodity servers :: cheap machines; failures are expected and handled", "% Each layer uses the one below. Hadoop's core = HDFS (storage) + YARN (resources) + MapReduce (processing) + Hadoop Common (shared libraries)."]}]}, {"h": "A short history", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["2003–04 :: Google papers: GFS, MapReduce", "2006 :: Hadoop starts at Yahoo! (Doug Cutting)", "2008 :: Apache top-level project", "2013 :: Hadoop 2: YARN added", "2017 :: Hadoop 3: erasure coding, multiple standby NameNodes", "* Today :: often run in the cloud with Spark"]}, {"k": "tbl", "h": null, "r": [["Distributions / vendors", "Apache Hadoop (open source), Cloudera CDP (merged with Hortonworks), AWS EMR, Azure HDInsight, Google Dataproc"], ["Hadoop vs RDBMS", "schema on read vs on write · petabytes vs gigabytes–terabytes · batch vs interactive · scale out vs scale up · write once vs update in place"]]}]}]}, {"id": "hdfs", "g": "Big Data Technologies", "i": "🗂️", "t": "HDFS", "d": "NameNode/DataNode, blocks, replication, rack awareness, read/write, HA, commands", "s": [{"h": "How a file is stored", "b": [{"k": "vis", "t": "svg", "ti": "sales.csv (300 MB) with block size 128 MB and replication 3", "c": ["<svg viewBox=\"0 0 760 300\">", "<rect x=\"205\" y=\"10\" width=\"350\" height=\"62\" rx=\"12\" class=\"sv-hl\"/><text x=\"380\" y=\"34\" text-anchor=\"middle\" class=\"sv-t\">NameNode (master)<\/text><text x=\"380\" y=\"54\" text-anchor=\"middle\" class=\"sv-s sv-m\">sales.csv → B1, B2, B3 + their locations<\/text>", "<text x=\"20\" y=\"34\" class=\"sv-s\">metadata only,<\/text><text x=\"20\" y=\"50\" class=\"sv-s\">kept in memory<\/text>", "<text x=\"575\" y=\"34\" class=\"sv-s\">Secondary NameNode:<\/text><text x=\"575\" y=\"50\" class=\"sv-s\">merges fsimage + edits<\/text>", "<g class=\"sv-m\">", "<text x=\"20\" y=\"104\" class=\"sv-lbl\">File split into blocks<\/text>", "<rect x=\"20\" y=\"112\" width=\"128\" height=\"30\" rx=\"7\" class=\"sv-box\"/><text x=\"84\" y=\"132\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">B1 128 MB<\/text>", "<rect x=\"152\" y=\"112\" width=\"128\" height=\"30\" rx=\"7\" class=\"sv-box\"/><text x=\"216\" y=\"132\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">B2 128 MB<\/text>", "<rect x=\"284\" y=\"112\" width=\"44\" height=\"30\" rx=\"7\" class=\"sv-box\"/><text x=\"306\" y=\"132\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"11\">B3 44<\/text>", "<\/g>", "<rect x=\"20\" y=\"168\" width=\"350\" height=\"122\" rx=\"12\" fill=\"none\" stroke=\"var(--line2)\" stroke-dasharray=\"5 4\"/><text x=\"32\" y=\"186\" class=\"sv-s\" font-weight=\"700\">Rack 1<\/text>", "<rect x=\"390\" y=\"168\" width=\"350\" height=\"122\" rx=\"12\" fill=\"none\" stroke=\"var(--line2)\" stroke-dasharray=\"5 4\"/><text x=\"402\" y=\"186\" class=\"sv-s\" font-weight=\"700\">Rack 2<\/text>", "<g class=\"sv-m\" font-size=\"12\">", "<rect x=\"34\" y=\"196\" width=\"155\" height=\"84\" rx=\"10\" class=\"sv-box\"/><text x=\"111\" y=\"216\" text-anchor=\"middle\" class=\"sv-t\">DataNode 1<\/text><text x=\"111\" y=\"240\" text-anchor=\"middle\" class=\"sv-lbl\">B1  B3<\/text>", "<rect x=\"200\" y=\"196\" width=\"155\" height=\"84\" rx=\"10\" class=\"sv-box\"/><text x=\"277\" y=\"216\" text-anchor=\"middle\" class=\"sv-t\">DataNode 2<\/text><text x=\"277\" y=\"240\" text-anchor=\"middle\" class=\"sv-lbl\">B2<\/text>", "<rect x=\"404\" y=\"196\" width=\"155\" height=\"84\" rx=\"10\" class=\"sv-box\"/><text x=\"481\" y=\"216\" text-anchor=\"middle\" class=\"sv-t\">DataNode 3<\/text><text x=\"481\" y=\"240\" text-anchor=\"middle\" class=\"sv-lbl\">B1  B2  B3<\/text>", "<rect x=\"570\" y=\"196\" width=\"155\" height=\"84\" rx=\"10\" class=\"sv-box\"/><text x=\"647\" y=\"216\" text-anchor=\"middle\" class=\"sv-t\">DataNode 4<\/text><text x=\"647\" y=\"240\" text-anchor=\"middle\" class=\"sv-lbl\">B1  B2  B3<\/text>", "<\/g>", "<text x=\"111\" y=\"268\" text-anchor=\"middle\" class=\"sv-s\">heartbeat every 3 s<\/text><text x=\"647\" y=\"268\" text-anchor=\"middle\" class=\"sv-s\">block report<\/text>", "<path d=\"M380 72 V100\" stroke=\"var(--accent)\" stroke-dasharray=\"4 3\" fill=\"none\"/>", "<\/svg>", "% 300 MB becomes 3 blocks (the last one only uses 44 MB of disk). Each block has 3 copies: one rack keeps one copy, the other rack keeps two, so losing a whole rack still leaves a copy. The NameNode stores only the map; the data lives on DataNodes."]}]}, {"h": "Writing a file: the replication pipeline", "b": [{"k": "vis", "t": "seq", "ti": "", "c": ["participants: Client, NameNode, DN1, DN3, DN4", "Client -> NameNode : create(\"/data/sales.csv\")", "NameNode --> Client : write B1 to DN1, DN3, DN4", "Client -> DN1 : packets of B1", "DN1 -> DN3 : forward copy", "DN3 -> DN4 : forward copy", "DN4 --> DN3 : ack", "DN3 --> DN1 : ack", "DN1 --> Client : ack (block done)", "Client -> NameNode : close() → file complete", "% The client writes each block only once; DataNodes pass it along a chain (pipeline) and acks flow back. These are the same three DataNodes that hold B1 in the picture above (one on Rack 1, two on Rack 2). If a node fails mid-write, it is dropped from the pipeline and the NameNode re-replicates later."]}]}, {"h": "Reading a file", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["open() :: client asks the NameNode", "Block locations :: sorted nearest first", "Read B1, B2, B3 :: directly from DataNodes, in order", "* Checksum check :: bad copy? read another replica and report it"]}]}, {"h": "Failure handling and HA", "b": [{"k": "tbl", "h": null, "r": [["DataNode dies", "no heartbeat for ~10 min → marked dead → its blocks re-copied from other replicas"], ["Corrupt block", "checksum mismatch → read another replica → NameNode schedules a fresh copy"], ["Rebalancing", "`hdfs balancer` moves blocks so new nodes get a fair share"], ["NameNode HA", "Active + Standby NameNode share edits via JournalNodes; ZooKeeper (ZKFC) fails over automatically"], ["Secondary NameNode", "NOT a hot backup: only checkpoints fsimage + edit log"]]}]}, {"h": "Commands", "b": [{"k": "code", "l": "bash", "c": "hdfs dfs -ls /                         # list\nhdfs dfs -mkdir -p /user/asha/input\nhdfs dfs -put sales.csv /user/asha/input    # local → HDFS  (also -copyFromLocal)\nhdfs dfs -get /user/asha/out/part-r-00000 . # HDFS → local  (also -copyToLocal)\nhdfs dfs -cat /user/asha/input/sales.csv | head\nhdfs dfs -du -h /user/asha             # sizes\nhdfs dfs -rm -r /user/asha/out         # delete folder\nhdfs dfs -setrep -w 2 /user/asha/input/sales.csv   # change replication\nhdfs fsck /user/asha -files -blocks -locations     # health + where blocks are\nhdfs dfsadmin -report                  # cluster capacity, live/dead DataNodes\nhdfs dfsadmin -safemode get            # read-only start-up mode?"}, {"k": "tbl", "h": null, "r": [["Web UI", "NameNode http://namenode:9870 (Hadoop 3; 50070 in Hadoop 2) · DataNode :9864"], ["Java API", "`FileSystem fs = FileSystem.get(conf); fs.create(path); fs.open(path); fs.listStatus(dir)`"]]}, {"k": "mem", "c": ["Default block **128 MB**, default replication **3**. HDFS is **write once, read many**: you can append but not edit in the middle."]}]}]}, {"id": "hadoop-cluster", "g": "Big Data Technologies", "i": "🖥️", "t": "Hadoop Cluster & YARN", "d": "Run modes, config files, daemons, YARN, admin and monitoring", "s": [{"h": "Three ways to run Hadoop", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## 1 · Standalone (local)", "- one JVM, no daemons", "- uses the local file system", "- for testing MapReduce code", "## 2 · Pseudo-distributed", "- all daemons on ONE machine", "- real HDFS + YARN, replication 1", "- labs and practice", "## 3 · Fully distributed", "- master and worker machines", "- replication 3, rack awareness", "- production"]}]}, {"h": "Daemons and where they run", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### jps on each machine", "machine | HDFS daemon | YARN daemon", "master | NameNode, SecondaryNameNode | ResourceManager", "worker 1 | DataNode | NodeManager", "worker 2 | DataNode | NodeManager", "% Run jps after start-dfs.sh and start-yarn.sh. A missing name in the list tells you which daemon failed to start (check its log in $HADOOP_HOME/logs)."]}]}, {"h": "How YARN runs a job", "b": [{"k": "vis", "t": "seq", "ti": "", "c": ["participants: Client, ResourceManager, NodeManager, AppMaster", "Client -> ResourceManager : submit job", "ResourceManager -> NodeManager : start a container for the AppMaster", "NodeManager -> AppMaster : launch", "AppMaster -> ResourceManager : ask for containers (CPU, memory)", "ResourceManager --> AppMaster : containers on nodes A, B", "AppMaster -> NodeManager : run map / reduce tasks in containers", "AppMaster --> Client : progress, then done", "% YARN separates \"who decides resources\" (ResourceManager, one per cluster) from \"who runs tasks\" (NodeManager, one per worker). Each job gets its own ApplicationMaster."]}]}, {"h": "Configuration files ($HADOOP_HOME/etc/hadoop)", "b": [{"k": "tbl", "h": null, "r": [["core-site.xml", "`fs.defaultFS = hdfs://master:9000` (where HDFS lives)"], ["hdfs-site.xml", "`dfs.replication`, `dfs.namenode.name.dir`, `dfs.datanode.data.dir`"], ["mapred-site.xml", "`mapreduce.framework.name = yarn`"], ["yarn-site.xml", "`yarn.resourcemanager.hostname`, `yarn.nodemanager.aux-services = mapreduce_shuffle`"], ["workers (slaves in Hadoop 2)", "list of worker hostnames"], ["hadoop-env.sh", "`JAVA_HOME`"]]}]}, {"h": "Setting up a single-node cluster", "b": [{"k": "code", "l": "bash", "c": "ssh-keygen -t rsa -P \"\" && cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys   # passwordless ssh\nhdfs namenode -format          # ONCE, on a new cluster (wipes metadata)\nstart-dfs.sh && start-yarn.sh\njps                            # NameNode DataNode SecondaryNameNode ResourceManager NodeManager\nhadoop version\nyarn node -list                # live NodeManagers\nyarn application -list         # running jobs   (-kill <appId> to stop one)\nmapred job -list\nstop-yarn.sh && stop-dfs.sh\nssh user@master                # remote login (PuTTY on Windows)"}, {"k": "tbl", "h": null, "r": [["Web UIs", "NameNode :9870 · ResourceManager :8088 · JobHistory :19888"], ["Security", "Kerberos authentication, HDFS permissions/ACLs, Apache Ranger for policies, encryption zones"], ["Benchmarks", "TeraGen / TeraSort / TeraValidate, TestDFSIO (HDFS read/write speed)"], ["Hadoop in the cloud", "EMR / Dataproc / HDInsight: clusters in minutes, data kept in S3/GCS/ADLS instead of HDFS, shut down when idle"]]}, {"k": "mem", "c": ["**Never re-run `hdfs namenode -format` on a working cluster**: it erases the file-system metadata."]}]}]}, {"id": "mapreduce", "g": "Big Data Technologies", "i": "🗺️", "t": "MapReduce", "d": "Map, shuffle & sort, reduce, word count, combiner, partitioner", "s": [{"h": "Word count, stage by stage", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### input (2 splits)", "line", "the cat sat", "the cat ran", ">> map: emit (word, 1)", "### map output", "key | value", "the | 1", "cat | 1", "sat | 1", "the | 1", "cat | 1", "ran | 1", ">> shuffle & sort: group by key", "### reducer input", "key | values", "~1 cat | [1, 1]", "~2 ran | [1]", "~3 sat | [1]", "~1 the | [1, 1]", ">> reduce: sum the list", "### output (part-r-00000)", "key | value", "cat | 2", "ran | 1", "sat | 1", "the | 2", "% Each mapper works on its own split in parallel. Shuffle moves all values of one key to the same reducer and sorts keys. The reducer sees each key once with all its values."]}]}, {"h": "Where the work happens", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["Input split :: usually one HDFS block", "Map task :: runs on the node holding the block (data locality)", "Combiner (optional) :: mini-reduce on the map side: (the,1),(the,1) → (the,2)", "Partitioner :: hash(key) % reducers picks the reducer", "Shuffle & sort :: copy over the network, merge, sort by key", "* Reduce task :: writes part-r-0000N to HDFS"]}]}, {"h": "The Java code", "b": [{"k": "code", "l": "java", "c": "public class WordCount {\n  public static class TokenMapper extends Mapper<LongWritable, Text, Text, IntWritable> {\n    private final static IntWritable ONE = new IntWritable(1);\n    private final Text word = new Text();\n    public void map(LongWritable key, Text value, Context ctx) throws IOException, InterruptedException {\n      for (String w : value.toString().split(\"\\\\s+\")) { word.set(w); ctx.write(word, ONE); }\n    }\n  }\n  public static class SumReducer extends Reducer<Text, IntWritable, Text, IntWritable> {\n    public void reduce(Text key, Iterable<IntWritable> values, Context ctx) throws IOException, InterruptedException {\n      int sum = 0;\n      for (IntWritable v : values) sum += v.get();\n      ctx.write(key, new IntWritable(sum));\n    }\n  }\n  public static void main(String[] args) throws Exception {\n    Job job = Job.getInstance(new Configuration(), \"word count\");\n    job.setJarByClass(WordCount.class);\n    job.setMapperClass(TokenMapper.class);\n    job.setCombinerClass(SumReducer.class);      // safe because sum is associative\n    job.setReducerClass(SumReducer.class);\n    job.setOutputKeyClass(Text.class);\n    job.setOutputValueClass(IntWritable.class);\n    FileInputFormat.addInputPath(job, new Path(args[0]));\n    FileOutputFormat.setOutputPath(job, new Path(args[1]));   // must NOT exist yet\n    System.exit(job.waitForCompletion(true) ? 0 : 1);\n  }\n}"}, {"k": "code", "l": "bash", "c": "hadoop jar wc.jar WordCount /user/asha/input /user/asha/out\nhdfs dfs -cat /user/asha/out/part-r-00000\nhadoop jar $HADOOP_HOME/share/hadoop/mapreduce/hadoop-mapreduce-examples-*.jar wordcount in out"}, {"k": "tbl", "h": null, "r": [["Writable types", "Text (String), IntWritable, LongWritable, DoubleWritable, NullWritable"], ["Features", "data locality, speculative execution (re-run slow tasks), counters, fault tolerance (failed tasks retried), Hadoop Streaming (mapper/reducer in Python)"]]}, {"k": "mem", "c": ["Output folder must **not exist** before the job runs, or it fails with FileAlreadyExistsException."]}]}]}, {"id": "hive", "g": "Big Data Technologies", "i": "🐝", "t": "Hive & HiveQL", "d": "Architecture, managed vs external, partitions, bucketing, formats, joins, UDFs", "s": [{"h": "How a HiveQL query runs", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["CLI / Beeline / JDBC :: you type SQL", "Driver + Compiler :: parse, plan, optimise", "Metastore :: table schemas & locations (MySQL/Derby)", "* Execution engine :: MapReduce, Tez or Spark jobs", "HDFS :: reads and writes the table's files", "% Hive is not a database engine: it turns SQL into distributed jobs over files in HDFS. That is why it is slower per query than MySQL but scales to huge data."]}]}, {"h": "Managed vs external tables", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## Managed (internal)", "- `CREATE TABLE sales (…)`", "- data in /user/hive/warehouse/sales", "- `DROP TABLE` deletes metadata **and data**", "- Hive owns the files", "## External", "- `CREATE EXTERNAL TABLE … LOCATION '/data/sales'`", "- data stays where it is", "- `DROP TABLE` deletes **metadata only**", "- shared with Spark, other tools"]}]}, {"h": "Partitions and buckets on disk", "b": [{"k": "vis", "t": "tree", "ti": "", "c": ["/user/hive/warehouse/sales/", "  year=2025/", "    month=12/ :: files for Dec 2025", "  * year=2026/", "    * month=11/ :: WHERE year=2026 AND month=11 reads ONLY this folder", "      000000_0 :: bucket 0 = hash(cust_id) % 4 == 0", "      000001_0 :: bucket 1", "      000002_0 :: bucket 2", "      000003_0 :: bucket 3", "% A partition is a folder per value: filters on the partition column skip whole folders (partition pruning). Buckets split each partition into a fixed number of files by hash, which speeds up joins and sampling on that column."]}]}, {"h": "HiveQL you will write", "b": [{"k": "code", "l": "hql", "c": "CREATE DATABASE IF NOT EXISTS retail;  USE retail;\nCREATE TABLE sales (id INT, cust_id INT, amount DOUBLE, dt STRING)\n  PARTITIONED BY (year INT, month INT)\n  CLUSTERED BY (cust_id) INTO 4 BUCKETS\n  ROW FORMAT DELIMITED FIELDS TERMINATED BY ','\n  STORED AS ORC;\n\nCREATE EXTERNAL TABLE raw_sales (id INT, cust_id INT, amount DOUBLE, dt STRING)\n  ROW FORMAT DELIMITED FIELDS TERMINATED BY ',' LOCATION '/data/raw_sales';\n\nLOAD DATA LOCAL INPATH '/home/asha/sales.csv' INTO TABLE raw_sales;   -- copies from local disk\nLOAD DATA INPATH '/user/asha/sales.csv' INTO TABLE raw_sales;         -- MOVES within HDFS\n\nSET hive.exec.dynamic.partition.mode = nonstrict;\nINSERT INTO TABLE sales PARTITION (year, month)                       -- append (OVERWRITE replaces)\nSELECT id, cust_id, amount, dt, year(dt), month(dt) FROM raw_sales;\n\nSELECT cust_id, SUM(amount) AS total FROM sales\nWHERE year = 2026 GROUP BY cust_id ORDER BY total DESC LIMIT 10;\nALTER TABLE sales ADD COLUMNS (channel STRING);\nDROP TABLE IF EXISTS raw_sales;\nDESCRIBE FORMATTED sales;  SHOW PARTITIONS sales;\nCREATE VIEW top_cust AS SELECT cust_id, SUM(amount) t FROM sales GROUP BY cust_id;"}, {"k": "tbl", "h": null, "r": [["Data types", "INT, BIGINT, DOUBLE, DECIMAL, STRING, VARCHAR, BOOLEAN, DATE, TIMESTAMP + complex ARRAY, MAP, STRUCT"], ["Sorting", "ORDER BY (one reducer, total order) · SORT BY (per reducer) · DISTRIBUTE BY (which reducer) · CLUSTER BY = DISTRIBUTE + SORT"], ["Storage formats", "TEXTFILE, SEQUENCEFILE, AVRO, ORC (best for Hive), PARQUET"]]}]}, {"h": "Map-side vs reduce-side join", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## Reduce-side (common) join", "- both tables shuffled by the join key", "- works for any size", "- slow: heavy network shuffle", "## Map-side join (MAPJOIN)", "- small table copied to every mapper's memory", "- no shuffle, much faster", "- `SET hive.auto.convert.join = true;`", "- or `/*+ MAPJOIN(d) */` hint"]}]}, {"h": "A simple UDF (Java)", "b": [{"k": "code", "l": "java", "c": "public class ToUpper extends UDF {                  // org.apache.hadoop.hive.ql.exec.UDF\n    public Text evaluate(Text s) { return s == null ? null : new Text(s.toString().toUpperCase()); }\n}"}, {"k": "code", "l": "hql", "c": "ADD JAR /home/asha/udfs.jar;\nCREATE TEMPORARY FUNCTION to_upper AS 'com.cdac.ToUpper';\nSELECT to_upper(name) FROM customers;\n-- custom map/reduce script:  SELECT TRANSFORM(line) USING 'python3 clean.py' AS (word) FROM docs;"}, {"k": "tbl", "h": null, "r": [["Hive vs RDBMS", "schema on read · batch, high latency · append-oriented (ACID only on ORC transactional tables) · scales to petabytes"]]}]}]}, {"id": "airflow", "g": "Big Data Technologies", "i": "🌬️", "t": "Airflow & ETL Pipelines", "d": "DAGs, operators, sensors, hooks, scheduler, ETL vs ELT, managed Airflow", "s": [{"h": "A DAG is a graph of tasks", "b": [{"k": "vis", "t": "svg", "ti": "daily_sales_etl: runs every day at 02:00", "c": ["<svg viewBox=\"0 0 760 170\">", "<defs><marker id=\"afA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--accent)\"/><\/marker><\/defs>", "<rect x=\"10\" y=\"62\" width=\"130\" height=\"46\" rx=\"10\" class=\"sv-box\"/><text x=\"75\" y=\"83\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12.5\">wait_for_file<\/text><text x=\"75\" y=\"99\" text-anchor=\"middle\" class=\"sv-s\">FileSensor<\/text>", "<path d=\"M140 85 H172\" class=\"sv-aa\" marker-end=\"url(#afA)\"/>", "<rect x=\"174\" y=\"62\" width=\"120\" height=\"46\" rx=\"10\" class=\"sv-hl\"/><text x=\"234\" y=\"83\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12.5\">extract<\/text><text x=\"234\" y=\"99\" text-anchor=\"middle\" class=\"sv-s\">BashOperator<\/text>", "<path d=\"M294 78 L330 40\" class=\"sv-aa\" marker-end=\"url(#afA)\"/><path d=\"M294 92 L330 128\" class=\"sv-aa\" marker-end=\"url(#afA)\"/>", "<rect x=\"332\" y=\"14\" width=\"140\" height=\"46\" rx=\"10\" class=\"sv-hl\"/><text x=\"402\" y=\"35\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12.5\">clean_orders<\/text><text x=\"402\" y=\"51\" text-anchor=\"middle\" class=\"sv-s\">PythonOperator<\/text>", "<rect x=\"332\" y=\"110\" width=\"140\" height=\"46\" rx=\"10\" class=\"sv-hl\"/><text x=\"402\" y=\"131\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12.5\">clean_customers<\/text><text x=\"402\" y=\"147\" text-anchor=\"middle\" class=\"sv-s\">PythonOperator<\/text>", "<path d=\"M472 37 L508 76\" class=\"sv-aa\" marker-end=\"url(#afA)\"/><path d=\"M472 133 L508 94\" class=\"sv-aa\" marker-end=\"url(#afA)\"/>", "<rect x=\"510\" y=\"62\" width=\"110\" height=\"46\" rx=\"10\" class=\"sv-hl\"/><text x=\"565\" y=\"83\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12.5\">load<\/text><text x=\"565\" y=\"99\" text-anchor=\"middle\" class=\"sv-s\">Hive / Spark<\/text>", "<path d=\"M620 85 H652\" class=\"sv-aa\" marker-end=\"url(#afA)\"/>", "<rect x=\"654\" y=\"62\" width=\"96\" height=\"46\" rx=\"10\" class=\"sv-good\"/><text x=\"702\" y=\"83\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12.5\">notify<\/text><text x=\"702\" y=\"99\" text-anchor=\"middle\" class=\"sv-s\">email<\/text>", "<\/svg>", "% Arrows are dependencies: a task starts only when everything pointing into it has succeeded. The two clean tasks run in parallel. Directed + Acyclic = arrows go one way and never loop back."]}]}, {"h": "The vocabulary", "b": [{"k": "tbl", "h": null, "r": [["DAG", "the workflow: tasks + dependencies + schedule (a .py file in the dags/ folder)"], ["Operator", "template for one task: BashOperator, PythonOperator, SQL operators, SparkSubmitOperator, EmailOperator"], ["Task / task instance", "an operator in a DAG / one run of it for one date"], ["Sensor", "waits for something: FileSensor, ExternalTaskSensor, S3KeySensor (poke or reschedule mode)"], ["Hook", "reusable client for a system (MySqlHook, S3Hook, HiveServer2Hook); operators use hooks"], ["Connection", "stored host/login/password, referenced by conn_id (Admin → Connections), so no secrets in code"], ["Scheduler / executor / webserver", "decides what runs when / runs it (Local, Celery, Kubernetes) / the UI on :8080"], ["XCom", "pass small values between tasks"]]}]}, {"h": "The DAG code", "b": [{"k": "code", "l": "py", "c": "from datetime import datetime, timedelta\nfrom airflow.sdk import DAG                                              # Airflow 2: from airflow import DAG\nfrom airflow.providers.standard.operators.bash import BashOperator       # Airflow 2: airflow.operators.bash\nfrom airflow.providers.standard.operators.python import PythonOperator  # Airflow 2: airflow.operators.python\nfrom airflow.providers.standard.sensors.filesystem import FileSensor    # Airflow 2: airflow.sensors.filesystem\n\ndef clean(table, **ctx):\n    print(f\"cleaning {table} for {ctx['ds']}\")       # ds = run date, e.g. 2026-11-19\n\nwith DAG(\n    dag_id=\"daily_sales_etl\",\n    start_date=datetime(2026, 11, 1),\n    schedule=\"0 2 * * *\",                # cron: 02:00 daily  (schedule_interval in Airflow < 2.4)\n    catchup=False,                       # don't back-fill old dates\n    default_args={\"retries\": 2, \"retry_delay\": timedelta(minutes=5)},\n) as dag:\n    wait = FileSensor(task_id=\"wait_for_file\", filepath=\"/data/in/sales.csv\",\n                      fs_conn_id=\"fs_default\", poke_interval=60, timeout=3600)\n    extract = BashOperator(task_id=\"extract\", bash_command=\"hdfs dfs -put -f /data/in/sales.csv /raw/\")\n    c1 = PythonOperator(task_id=\"clean_orders\", python_callable=clean, op_kwargs={\"table\": \"orders\"})\n    c2 = PythonOperator(task_id=\"clean_customers\", python_callable=clean, op_kwargs={\"table\": \"customers\"})\n    load = BashOperator(task_id=\"load\", bash_command=\"spark-submit /jobs/load.py {{ ds }}\")\n    notify = BashOperator(task_id=\"notify\", bash_command=\"echo done\")\n\n    wait >> extract >> [c1, c2] >> load >> notify"}, {"k": "code", "l": "bash", "c": "airflow db migrate            # (airflow db init in older versions)\nairflow dags list\nairflow tasks test daily_sales_etl extract 2026-11-19   # run one task, no scheduler\nairflow dags trigger daily_sales_etl"}]}, {"h": "ETL vs ELT", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## ETL", "- Extract → **Transform**
