 on a separate engine → Load clean data", "- classic warehouses, limited target compute", "- Informatica, Talend, SSIS", "## ELT", "- Extract → **Load raw** → Transform inside the target", "- cloud warehouses / lakehouses with cheap compute", "- dbt, Spark SQL, Snowflake SQL"]}, {"k": "tbl", "h": null, "r": [["Managed Airflow", "AWS MWAA, Google Cloud Composer, Astronomer: you upload DAG files; the provider runs scheduler, workers, database"], ["Informatica (PowerCenter)", "Mapping (source → transformations → target) → Session (how to run it) → Workflow (sessions + order, scheduled in Workflow Manager, watched in Workflow Monitor)"]]}]}]}, {"id": "spark-core", "g": "Big Data Technologies", "i": "⚡", "t": "Spark Core & RDDs", "d": "Architecture, lazy evaluation, transformations vs actions, narrow vs wide, caching, broadcast", "s": [{"h": "Spark architecture", "b": [{"k": "vis", "t": "svg", "ti": "", "c": ["<svg viewBox=\"0 0 760 250\">", "<defs><marker id=\"spA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--mut)\"/><\/marker><\/defs>", "<rect x=\"20\" y=\"70\" width=\"190\" height=\"100\" rx=\"12\" class=\"sv-hl\"/><text x=\"115\" y=\"96\" text-anchor=\"middle\" class=\"sv-t\">Driver program<\/text><text x=\"115\" y=\"118\" text-anchor=\"middle\" class=\"sv-s\">SparkSession / SparkContext<\/text><text x=\"115\" y=\"136\" text-anchor=\"middle\" class=\"sv-s\">builds the DAG, splits it<\/text><text x=\"115\" y=\"154\" text-anchor=\"middle\" class=\"sv-s\">into stages and tasks<\/text>", "<path d=\"M210 120 H248\" class=\"sv-a\" marker-end=\"url(#spA)\"/>", "<rect x=\"250\" y=\"90\" width=\"200\" height=\"60\" rx=\"12\" class=\"sv-box\"/><text x=\"350\" y=\"115\" text-anchor=\"middle\" class=\"sv-t\">Cluster manager<\/text><text x=\"350\" y=\"134\" text-anchor=\"middle\" class=\"sv-s\">YARN · Kubernetes · Standalone<\/text>", "<path d=\"M450 110 L500 60\" class=\"sv-a\" marker-end=\"url(#spA)\"/><path d=\"M450 130 L500 182\" class=\"sv-a\" marker-end=\"url(#spA)\"/>", "<rect x=\"502\" y=\"10\" width=\"238\" height=\"96\" rx=\"12\" class=\"sv-good\"/><text x=\"621\" y=\"32\" text-anchor=\"middle\" class=\"sv-t\">Executor (worker 1)<\/text>", "<g class=\"sv-m\" font-size=\"11\"><rect x=\"516\" y=\"44\" width=\"62\" height=\"26\" rx=\"6\" class=\"sv-box\"/><text x=\"547\" y=\"62\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"11\">task<\/text><rect x=\"584\" y=\"44\" width=\"62\" height=\"26\" rx=\"6\" class=\"sv-box\"/><text x=\"615\" y=\"62\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"11\">task<\/text><rect x=\"652\" y=\"44\" width=\"76\" height=\"26\" rx=\"6\" class=\"sv-box\"/><text x=\"690\" y=\"62\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"11\">cache<\/text><\/g>", "<text x=\"621\" y=\"92\" text-anchor=\"middle\" class=\"sv-s\">one task per partition, runs on a core<\/text>", "<rect x=\"502\" y=\"140\" width=\"238\" height=\"96\" rx=\"12\" class=\"sv-good\"/><text x=\"621\" y=\"162\" text-anchor=\"middle\" class=\"sv-t\">Executor (worker 2)<\/text>", "<g class=\"sv-m\"><rect x=\"516\" y=\"174\" width=\"62\" height=\"26\" rx=\"6\" class=\"sv-box\"/><text x=\"547\" y=\"192\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"11\">task<\/text><rect x=\"584\" y=\"174\" width=\"62\" height=\"26\" rx=\"6\" class=\"sv-box\"/><text x=\"615\" y=\"192\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"11\">task<\/text><rect x=\"652\" y=\"174\" width=\"76\" height=\"26\" rx=\"6\" class=\"sv-box\"/><text x=\"690\" y=\"192\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"11\">cache<\/text><\/g>", "<path d=\"M180 70 C220 18 420 14 500 24\" stroke=\"var(--accent)\" stroke-dasharray=\"4 4\" fill=\"none\"/><text x=\"250\" y=\"16\" class=\"sv-lbl\">sends tasks directly, gets results<\/text>", "<\/svg>", "% Your code runs in the driver. The cluster manager hands out executors; each executor runs tasks (one per data partition) and can keep data in memory between steps — that in-memory reuse is why Spark beats MapReduce on iterative work."]}]}, {"h": "Lazy evaluation: nothing runs until an action", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["rdd = sc.textFile(\"logs.txt\") => just a plan (no data read yet)", "errors = rdd.filter(lambda l: \"ERROR\" in l) => still a plan", "words = errors.map(lambda l: l.split()[0]) => still a plan", "words.count() => runs ALL of it now → 42", "words.take(3) => runs it AGAIN (unless cached)", "% Transformations (filter, map …) build a lineage graph. Actions (count, collect, save …) trigger a job. Spark can optimise the whole chain because it sees it before running."]}]}, {"h": "Narrow vs wide transformations", "b": [{"k": "vis", "t": "svg", "ti": "", "c": ["<svg viewBox=\"0 0 760 200\">", "<text x=\"20\" y=\"20\" class=\"sv-lbl\">Narrow: map, filter (no shuffle)<\/text>", "<g class=\"sv-m\">", "<rect x=\"20\" y=\"34\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-box\"/><text x=\"65\" y=\"56\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P1<\/text>", "<rect x=\"20\" y=\"78\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-box\"/><text x=\"65\" y=\"100\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P2<\/text>", "<rect x=\"20\" y=\"122\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-box\"/><text x=\"65\" y=\"144\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P3<\/text>", "<rect x=\"230\" y=\"34\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-hl\"/><text x=\"275\" y=\"56\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P1'<\/text>", "<rect x=\"230\" y=\"78\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-hl\"/><text x=\"275\" y=\"100\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P2'<\/text>", "<rect x=\"230\" y=\"122\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-hl\"/><text x=\"275\" y=\"144\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P3'<\/text>", "<\/g>", "<path d=\"M110 51 H228 M110 95 H228 M110 139 H228\" class=\"sv-aa\"/>", "<text x=\"20\" y=\"182\" class=\"sv-s\">each output partition needs ONE input partition<\/text>", "<text x=\"410\" y=\"20\" class=\"sv-lbl\" style=\"fill:var(--red)\">Wide: groupByKey, reduceByKey, join (shuffle)<\/text>", "<g class=\"sv-m\">", "<rect x=\"410\" y=\"34\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-box\"/><text x=\"455\" y=\"56\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P1<\/text>", "<rect x=\"410\" y=\"78\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-box\"/><text x=\"455\" y=\"100\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P2<\/text>", "<rect x=\"410\" y=\"122\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-box\"/><text x=\"455\" y=\"144\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">P3<\/text>", "<rect x=\"640\" y=\"56\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-bad\"/><text x=\"685\" y=\"78\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">key a-m<\/text>", "<rect x=\"640\" y=\"102\" width=\"90\" height=\"34\" rx=\"7\" class=\"sv-bad\"/><text x=\"685\" y=\"124\" text-anchor=\"middle\" class=\"sv-t\" font-size=\"12\">key n-z<\/text>", "<\/g>", "<path d=\"M500 51 L638 73 M500 51 L638 119 M500 95 L638 73 M500 95 L638 119 M500 139 L638 73 M500 139 L638 119\" stroke=\"var(--red)\" stroke-opacity=\".55\" stroke-width=\"1.5\" fill=\"none\"/>", "<text x=\"410\" y=\"182\" class=\"sv-s\">data crosses the network → a new stage begins<\/text>", "<\/svg>", "% Shuffles are the expensive part of a Spark job. Prefer reduceByKey (combines on each partition first) over groupByKey, and broadcast small tables to avoid shuffling joins."]}]}, {"h": "RDD word count (PySpark)", "b": [{"k": "code", "l": "py", "c": "from pyspark.sql import SparkSession\nspark = SparkSession.builder.appName(\"wc\").master(\"local[*]\").getOrCreate()\nsc = spark.sparkContext\n\nlines = sc.parallelize([\"the cat sat\", \"the cat ran\"])     # or sc.textFile(\"hdfs:///user/asha/in\")\ncounts = (lines.flatMap(lambda l: l.split())                # ['the','cat','sat','the','cat','ran']\n               .map(lambda w: (w, 1))                       # pair RDD\n               .reduceByKey(lambda a, b: a + b))            # wide: shuffle by key\nprint(sorted(counts.collect()))   # [('cat', 2), ('ran', 1), ('sat', 1), ('the', 2)]\ncounts.saveAsTextFile(\"out\")      # one file per partition"}, {"k": "tbl", "h": null, "r": [["map vs flatMap", "one output per input vs zero-or-more (flattens lists)"], ["Pair RDD ops", "reduceByKey, groupByKey, sortByKey, join, mapValues, countByKey"], ["Actions", "collect, count, take(n), first, reduce, saveAsTextFile, foreach"]]}]}, {"h": "Persistence, shared variables, deployment", "b": [{"k": "code", "l": "py", "c": "rdd.cache()                                   # = persist(MEMORY_ONLY) for RDDs\nrdd.persist(StorageLevel.MEMORY_AND_DISK)     # spill to disk if memory is short\nrdd.unpersist()                               # remove from memory\nlookup = sc.broadcast({\"IN\": \"India\"})        # read-only copy on every executor\nbad = sc.accumulator(0)                       # executors add, driver reads bad.value"}, {"k": "code", "l": "bash", "c": "spark-submit --master yarn --deploy-mode cluster --num-executors 4 \\\n  --executor-memory 4g --executor-cores 2 job.py"}, {"k": "tbl", "h": null, "r": [["client vs cluster mode", "driver runs on your machine (interactive) vs inside the cluster (production)"], ["Spark with Hadoop", "YARN for resources, HDFS for data, Hive metastore for tables"], ["Spark without Hadoop", "standalone or Kubernetes cluster manager, data in local files / S3 / databases"], ["MapReduce vs Spark", "disk between every step vs memory · Java-only boilerplate vs Python/Scala/SQL APIs · batch only vs batch + streaming + ML"]]}]}]}, {"id": "spark-sql", "g": "Big Data Technologies", "i": "📊", "t": "Spark DataFrames, SQL & EDA", "d": "RDD vs DataFrame vs Dataset, operations, Spark SQL, window functions, JDBC, EDA", "s": [{"h": "RDD vs DataFrame vs Dataset", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## RDD", "- low-level distributed collection", "- any Python/Java objects", "- no schema, no optimiser", "- use for unstructured data, fine control", "## DataFrame", "- rows with named, typed columns", "- Catalyst optimiser + Tungsten engine", "- Python, Scala, Java, R, SQL", "- the default choice", "## Dataset (Scala/Java)", "- DataFrame + compile-time types", "- `Dataset<Person>`", "- not in Python (DataFrame = Dataset<Row>)"]}]}, {"h": "DataFrame operations", "b": [{"k": "code", "l": "py", "c": "from pyspark.sql import functions as F\ndf = spark.read.csv(\"emp.csv\", header=True, inferSchema=True)   # also .json, .parquet, .jdbc\ndf.printSchema(); df.show(5); df.count(); df.columns\n(df.filter(F.col(\"salary\") > 40000)\n   .withColumn(\"bonus\", F.col(\"salary\") * 0.1)\n   .groupBy(\"dept\").agg(F.avg(\"salary\").alias(\"avg\"), F.count(\"*\").alias(\"n\"))\n   .orderBy(F.desc(\"avg\"))\n   .show())\ndf.select(\"name\", \"dept\").distinct()\ndf.join(dept, on=\"dept_id\", how=\"left\")\ndf.join(F.broadcast(dept), \"dept_id\")          # broadcast join: small table to every executor\ndf.write.mode(\"overwrite\").partitionBy(\"dept\").parquet(\"out/emp\")"}]}, {"h": "Spark SQL and window functions", "b": [{"k": "code", "l": "py", "c": "df.createOrReplaceTempView(\"emp\")\nspark.sql(\"\"\"\n  SELECT dept, name, salary,\n         RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk,\n         SUM(salary) OVER (PARTITION BY dept) AS dept_total\n  FROM emp\n\"\"\").show()\n\nfrom pyspark.sql.window import Window\nw = Window.partitionBy(\"dept\").orderBy(F.desc(\"salary\"))\ndf.withColumn(\"rnk\", F.rank().over(w)).withColumn(\"prev\", F.lag(\"salary\").over(w))"}, {"k": "vis", "t": "tables", "ti": "", "c": ["### result of the RANK query", "dept | name | salary | +rnk | +dept_total", "~1 HR | Mira | 47000 | 1 | 89000", "~1 HR | Ravi | 42000 | 2 | 89000", "~2 IT | Neha | 61000 | 1 | 150000", "~2 IT | Asha | 50000 | 2 | 150000", "~2 IT | Om | 39000 | 3 | 150000", "% Same rules as SQL window functions: every row stays, the numbering restarts for each dept."]}]}, {"h": "EDA and preprocessing in PySpark", "b": [{"k": "vis", "t": "c2o", "ti": "", "c": ["df.describe(\"salary\").show() => count, mean, stddev, min, max", "df.select([F.count(F.when(F.col(c).isNull(), c)).alias(c) for c in df.columns]) => nulls per column", "df.na.drop(subset=[\"email\"]) => drop rows missing email", "df.na.fill({\"age\": 29, \"city\": \"Unknown\"}) => fill per column", "df.withColumn(\"salary\", F.expr(\"try_cast(salary AS DOUBLE)\")) => fix a type: \"abc\" → null", "F.col(\"salary\").cast(\"double\") on \"abc\" =x Spark 4 (ANSI mode): CAST_INVALID_INPUT error · Spark 3: null", "df.dropDuplicates([\"email\"]) => remove duplicates", "df.groupBy(\"city\").count().orderBy(F.desc(\"count\")) => top categories", "df.stat.corr(\"age\", \"salary\") => Pearson correlation", "df.approxQuantile(\"salary\", [0.25, 0.5, 0.75], 0.01) => quartiles for IQR outliers"]}]}, {"h": "Read from a database (JDBC)", "b": [{"k": "code", "l": "py", "c": "emp = (spark.read.format(\"jdbc\")\n       .option(\"url\", \"jdbc:mysql://localhost:3306/company\")\n       .option(\"dbtable\", \"emp\").option(\"user\", \"root\").option(\"password\", \"***\")\n       .option(\"driver\", \"com.mysql.cj.jdbc.Driver\")\n       .load())                    # needs the MySQL connector jar: spark-submit --jars mysql-connector-j.jar"}, {"k": "tbl", "h": null, "r": [["repartition(n) vs coalesce(n)", "full shuffle, can increase partitions vs merge partitions without shuffle (decrease only)"], ["cache() on a DataFrame", "default level MEMORY_AND_DISK; worth it when the same DataFrame is used more than once"], ["explain()", "shows the physical plan: look for BroadcastHashJoin vs SortMergeJoin, and Exchange (= shuffle)"]]}]}]}, {"id": "kafka-streaming", "g": "Big Data Technologies", "i": "📨", "t": "Kafka & Spark Streaming", 632\" y=\"82\" class=\"sv-s\">P0, P1<\/text><text x=\"632\" y=\"176\" class=\"sv-s\">P2<\/text>", "<\/svg>", "% A topic is split into partitions; each partition is an ordered, append-only log where every message has an offset. Inside one consumer group each partition goes to exactly one consumer, so 3 partitions allow at most 3 busy consumers. Another group reads the same messages independently."]}, {"k": "tbl", "h": null, "r": [["Broker / cluster", "a Kafka server / several brokers; each partition has a leader + follower replicas"], ["Offset", "position in a partition; consumers commit offsets so they resume after a restart"], ["Retention", "messages are kept for a time (e.g. 7 days) whether or not they were read"], ["ZooKeeper vs KRaft", "older clusters use ZooKeeper for metadata; Kafka 3.3+ can run without it (KRaft)"]]}]}, {"h": "CLI: producer and consumer", "b": [{"k": "code", "l": "bash", "c": "kafka-topics.sh --bootstrap-server localhost:9092 --create --topic orders --partitions 3 --replication-factor 1\nkafka-topics.sh --bootstrap-server localhost:9092 --describe --topic orders\nkafka-console-producer.sh --bootstrap-server localhost:9092 --topic orders\n> {\"id\": 1, \"amount\": 499}\nkafka-console-consumer.sh --bootstrap-server localhost:9092 --topic orders --from-beginning --group billing\nkafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group billing   # lag per partition"}, {"k": "code", "l": "py", "c": "from kafka import KafkaProducer, KafkaConsumer        # pip install kafka-python\np = KafkaProducer(bootstrap_servers=\"localhost:9092\", value_serializer=lambda v: json.dumps(v).encode())\np.send(\"orders\", key=b\"cust-101\", value={\"id\": 1, \"amount\": 499}); p.flush()\nfor msg in KafkaConsumer(\"orders\", group_id=\"billing\", bootstrap_servers=\"localhost:9092\"):\n    print(msg.partition, msg.offset, msg.value)"}]}, {"h": "Kafka Connect: move data without code", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["MySQL table :: source system", "JDBC source connector :: polls new rows", "* Kafka topic :: mysql-orders", "S3 / HDFS sink connector :: writes files", "Data lake :: target", "% Connectors are configured with JSON (name, connector.class, connection URL, topics) and posted to the Connect REST API on :8083."]}]}, {"h": "Structured Streaming: a table that keeps growing", "b": [{"k": "vis", "t": "tables", "ti": "", "c": ["### input table (new rows arrive)", "time | word", "10:00 | cat", "10:00 | dog", "* 10:01 | cat", ">> groupBy(\"word\").count()", "### result table (output mode \"complete\")", "word | count", "* cat | 2", "dog | 1", "% You write the query as if on a static table; Spark runs it again on each micro-batch and updates the result. \"append\" emits only new rows, \"update\" only changed rows, \"complete\" the whole result."]}, {"k": "code", "l": "py", "c": "events = (spark.readStream.format(\"kafka\")\n          .option(\"kafka.bootstrap.servers\", \"localhost:9092\")\n          .option(\"subscribe\", \"orders\").option(\"startingOffsets\", \"latest\").load())\norders = (events.selectExpr(\"CAST(value AS STRING) AS json\")\n          .select(F.from_json(\"json\", \"id INT, amount DOUBLE, ts TIMESTAMP\").alias(\"o\")).select(\"o.*\"))\nper_min = (orders.withWatermark(\"ts\", \"10 minutes\")            # accept data up to 10 min late\n           .groupBy(F.window(\"ts\", \"1 minute\")).agg(F.sum(\"amount\").alias(\"revenue\")))\nq = (per_min.writeStream.outputMode(\"update\").format(\"console\")\n     .option(\"checkpointLocation\", \"/tmp/chk\").trigger(processingTime=\"30 seconds\").start())\nq.awaitTermination()"}, {"k": "tbl", "h": null, "r": [["Spark Streaming (DStreams) vs Structured Streaming", "old RDD micro-batch API vs DataFrame API with event time, watermarks, exactly-once sinks (use this)"], ["Managed Kafka", "Amazon MSK, Confluent Cloud, Azure Event Hubs (Kafka-compatible)"]]}]}]}, {"id": "spark-mllib-cloud", "g": "Big Data Technologies", "i": "🤖", "t": "Spark MLlib & Spark on Cloud", "d": "ML pipeline, train/evaluate, Databricks/EMR, autoscaling, cost", "s": [{"h": "An ML pipeline", "b": [{"k": "vis", "t": "flow", "ti": "", "c": ["Raw DataFrame :: city, age, salary, left", "StringIndexer :: city → cityIdx (0, 1, 2 …)", "VectorAssembler :: [cityIdx, age, salary] → features", "* LogisticRegression :: learns from features → label", "Model.transform :: adds prediction, probability", "Evaluator :: AUC / accuracy on the test set", "% Every step is a stage. Fitting the Pipeline fits each stage in order and returns one PipelineModel you can save and reuse on new data."]}, {"k": "code", "l": "py", "c": "from pyspark.ml import Pipeline\nfrom pyspark.ml.feature import StringIndexer, VectorAssembler\nfrom pyspark.ml.classification import LogisticRegression\nfrom pyspark.ml.evaluation import BinaryClassificationEvaluator\n\ntrain, test = df.randomSplit([0.8, 0.2], seed=42)\npipe = Pipeline(stages=[\n    StringIndexer(inputCol=\"city\", outputCol=\"cityIdx\", handleInvalid=\"keep\"),\n    VectorAssembler(inputCols=[\"cityIdx\", \"age\", \"salary\"], outputCol=\"features\"),\n    LogisticRegression(featuresCol=\"features\", labelCol=\"left\"),\n])\nmodel = pipe.fit(train)\npred = model.transform(test)\npred.select(\"left\", \"prediction\", \"probability\").show(5)\nauc = BinaryClassificationEvaluator(labelCol=\"left\").evaluate(pred)    # area under ROC\nmodel.write().overwrite().save(\"models/attrition\")"}, {"k": "tbl", "h": null, "r": [["Transformer vs Estimator", "has transform() (VectorAssembler, a fitted model) vs has fit() that returns a Transformer (StringIndexer, LogisticRegression)"], ["Algorithms", "classification (LogisticRegression, RandomForestClassifier), regression (LinearRegression), clustering (KMeans), recommendation (ALS)"], ["Tuning", "`CrossValidator` / `TrainValidationSplit` with a `ParamGridBuilder`"], ["Deep learning", "MLlib has a simple MultilayerPerceptronClassifier; bigger models use TorchDistributor or Horovod on Spark"]]}]}, {"h": "Spark on the cloud", "b": [{"k": "vis", "t": "cmp", "ti": "", "c": ["## Databricks", "- managed Spark + notebooks + Delta Lake", "- on AWS, Azure, GCP; free Community / trial editions", "- job clusters for production", "## AWS EMR", "- Spark/Hadoop clusters on EC2 or EMR Serverless", "- data in S3", "- pay per instance-second", "## Google Dataproc / Azure", "- Dataproc: clusters in ~90 s, data in GCS", "- Azure: HDInsight, Synapse Spark, Databricks"]}, {"k": "tbl", "h": null, "r": [["Autoscaling", "add/remove workers with load (min/max nodes); Spark dynamic allocation adds/removes executors"], ["Cost levers", "auto-terminate idle clusters · spot / preemptible workers for batch · right-size instances · store data as Parquet/Delta to read less"]]}, {"k": "mem", "c": ["**Fit on train, evaluate on test.** Fitting the pipeline on all data leaks the test set into the model."]}]}]}]};
const S = DATA.sheets, byId = Object.fromEntries(S.map(s => [s.id, s]));
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const CODEISH = /[()\[\].=_$@'"{}<>%#:\/\\*+]|^[a-z]/;
function cellFirst(t){ return (CODEISH.test(t) && !/^[A-Z][a-z]+[ \-–,]/.test(t) && !/^[A-Z][a-z]+$/.test(t)) ? '<code>' + esc(t) + '</code>' : esc(t); }

/* ---------- syntax colouring ---------- */
const KW = {
  py: 'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case',
  sql: 'SELECT FROM WHERE GROUP BY HAVING ORDER INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE VIEW INDEX UNIQUE ALTER DROP ADD COLUMN MODIFY RENAME TO PRIMARY KEY FOREIGN REFERENCES ON JOIN INNER LEFT RIGHT FULL OUTER CROSS AS AND OR NOT NULL IS IN EXISTS BETWEEN LIKE DISTINCT LIMIT OFFSET UNION ALL CASE WHEN THEN ELSE END WITH RECURSIVE OVER PARTITION ROWS UNBOUNDED PRECEDING DESC ASC GRANT REVOKE COMMIT ROLLBACK SAVEPOINT START TRANSACTION TRIGGER BEFORE AFTER FOR EACH ROW BEGIN IF DECLARE EXCEPTION PROCEDURE CALL DELIMITER REPLACE DEFAULT CHECK AUTO_INCREMENT DATABASE USE USER IDENTIFIED KEYSPACE CLUSTERING MERGE MATCHED USING WAREHOUSE SCHEMA STAGE COPY CLONE TRUNCATE INT VARCHAR DECIMAL DATE CHAR NUMBER STRING TTL DESCRIBE SHOW EXPLAIN',
  js: 'db use show var let const function return true false null new',
  java: 'abstract assert boolean break byte case catch char class continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws transient try void volatile while true false null var',
  r: 'function if else for while repeat break next return TRUE FALSE NULL NA in library',
  bash: 'pip python source deactivate uvicorn create put get scan delete count disable drop list describe SET GET DEL INCR HSET HGETALL LPUSH RPOP LRANGE SADD SMEMBERS SISMEMBER ZADD ZREVRANGE PUBLISH SUBSCRIBE TTL EXISTS KEYS'
};
const KWSET = {}; for (const k in KW) KWSET[k] = new Set(KW[k].split(' '));
function hl(code, lang){
  const L = {python:'py', py:'py', sql:'sql', hql:'sql', js:'js', java:'java', r:'r', bash:'bash'}[lang] || 'text';
  if (L === 'text') return esc(code);
  const com = L === 'sql' ? '--[^\\n]*' : (L === 'js' || L === 'java') ? '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/' : '#[^\\n]*';
  const re = new RegExp('(' + com + ')|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|`[^`\\n]*`)|(\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-z_$][\\w$]*)(?=\\s*\\()|([A-Za-z_$][\\w$]*)', 'g');
  let out = '', last = 0, m; const set = KWSET[L], ci = L === 'sql';
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="n">' + m[3] + '</span>';
    else { const w = m[4] || m[5];
      if (set.has(ci ? w.toUpperCase() : w)) out += '<span class="k">' + w + '</span>';
      else if (m[4]) out += '<span class="f">' + w + '</span>'; else out += esc(w); }
  }
  return out + esc(code.slice(last));
}

let VID = 0;
const lines = b => b.c.filter(l => l.trim() && !l.startsWith('% '));
const caption = b => b.c.filter(l => l.startsWith('% ')).map(l => l.slice(2)).join(' ');
function node(line){
  let t = line.trim(), hlt = false;
  if (t.startsWith('* ')) { hlt = true; t = t.slice(2); }
  const i = t.indexOf(' :: ');
  return {hl: hlt, title: i < 0 ? t : t.slice(0, i), sub: i < 0 ? '' : t.slice(i + 4)};
}
function pySlice(len, expr){
  const m = expr.match(/\[([^\]]*)\]/); if (!m) return [];
  const p = m[1].split(':').map(x => x.trim()); const norm = v => v < 0 ? v + len : v;
  if (p.length === 1) return [norm(parseInt(p[0]))];
  const step = p[2] ? parseInt(p[2]) : 1, out = []; let a, z;
  if (step > 0) { a = p[0] === '' ? 0 : Math.max(0, Math.min(len, norm(parseInt(p[0])))); z = p[1] === '' ? len : Math.max(0, Math.min(len, norm(parseInt(p[1])))); for (let k = a; k < z; k += step) out.push(k); }
  else { a = p[0] === '' ? len - 1 : Math.min(len - 1, norm(parseInt(p[0]))); z = p[1] === '' ? -1 : norm(parseInt(p[1])); for (let k = a; k > z; k += step) out.push(k); }
  return out;
}
const FIG = {
  flow(b){ return '<div class="flow">' + lines(b).map((l, i) => { const n = node(l);

  for (const g of DATA.groups) { h += `<h4>${esc(g)}</h4>`;
    for (const s of S.filter(x => x.g === g)) h += `<a class="ri ${active === s.id ? 'on' : ''}" href="#${s.id}"><span class="ic">${s.i}</span>${esc(s.t)}</a>`; }
  const r = document.getElementById('rail'); r.innerHTML = h;
  const on = r.querySelector('.ri.on'); if (on && active) { const rr = r.getBoundingClientRect(), o = on.getBoundingClientRect(); if (o.top < rr.top || o.bottom > rr.bottom) r.scrollTop += o.top - rr.top - 120; }
}
function renderHome(){
  const nFig = S.reduce((a, s) => a + s.s.reduce((b, x) => b + x.b.filter(y => y.k === 'vis').length, 0), 0);
  let h = `<div class="page solo"><div><div class="hero"><span class="kick">PGCP-BDA · Revision</span><h1>Cheat Sheets</h1><p>Python &amp; R Programming and Data Collection &amp; DBMS, one page per topic. Each page starts with a picture of the idea, then the syntax you need, with examples you can copy.</p>
    <div class="stats"><div><b>${S.length}</b>topics</div><div><b>${nFig}</b>diagrams</div><div><b>${DATA.groups.length}</b>subjects</div></div></div>`;
  for (const g of DATA.groups) { const list = S.filter(x => x.g === g);
    h += `<div class="gh"><h2>${esc(g)}</h2><small>${list.length} topics</small><span class="ln"></span></div><div class="tiles">` +
      list.map(s => `<a class="tile" href="#${s.id}"><div class="ti">${s.i}</div><div><b>${esc(s.t)}</b><span>${esc(s.d)}</span></div></a>`).join('') + '</div>'; }
  return h + `<div class="foot">Saarthi 360 · C-DAC Mumbai · PGCP-BDA (Aug 2026) syllabus</div></div></div>`;
}
function renderSheet(s){
  const i = S.indexOf(s), prev = S[i - 1], next = S[i + 1];
  let body = '', toc = '';
  s.s.forEach((sec, k) => { const id = 's-' + (k + 1) + '-' + slug(sec.h || 'overview'); const pic = sec.b.some(b => b.k === 'vis');
    body += `<section class="sec${pic ? ' pic' : ''}" id="${id}">${sec.h ? `<h2><span class="no">${String(k + 1).padStart(2, '0')}</span>${esc(sec.h)}</h2>` : ''}${sec.b.map(block).join('')}</section>`;
    toc += `<a href="#${s.id}" data-t="${id}">${esc(sec.h || 'Overview')}</a>`; });
  const hero = `<div class="hero"><span class="kick">${esc(s.g)}</span><h1><span class="hi">${s.i}</span>${esc(s.t)}</h1><p>${esc(s.d)}</p>
    <div class="acts">${prev ? `<a class="gbtn" href="#${prev.id}">← ${esc(prev.t)}</a>` : ''}${next ? `<a class="gbtn" href="#${next.id}">${esc(next.t)} →</a>` : ''}<button class="gbtn" onclick="window.print()">Print / PDF</button></div></div>`;
  const pager = '<div class="pager">' + (prev ? `<a href="#${prev.id}">← Previous<b>${esc(prev.t)}</b></a>` : '') + (next ? `<a class="nx" href="#${next.id}">Next →<b>${esc(next.t)}</b></a>` : '') + '</div>';
  return `<div class="page"><div>${hero}${body}${pager}</div><aside class="toc"><h5>On this page</h5>${toc}</aside></div>`;
}
function textOf(b){ return b.k === 'vis' ? (b.ti + ' ' + b.c.join(' ').replace(/<[^>]+>/g, ' ')) : b.k === 'code' ? b.c : b.k === 'tbl' ? (b.h || []).concat(...b.r).join(' ') : Array.isArray(b.c) ? b.c.join(' ') : b.c; }
function renderSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean), hits = [];
  for (const s of S) s.s.forEach((sec, k) => {
    const txt = (s.t + ' ' + sec.h + ' ' + sec.b.map(textOf).join(' ')).toLowerCase();
    if (terms.every(t => txt.includes(t))) { const body = sec.b.map(textOf).join(' '); const pos = body.toLowerCase().indexOf(terms[0]);
      hits.push({s, sec, k, snip: pos < 0 ? body.slice(0, 120) : body.slice(Math.max(0, pos - 50), pos + 90)}); } });
  const mark = t => { let e = esc(t); for (const x of terms) e = e.replace(new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); return e; };
  return `<div class="page solo"><div><h2 style="font:700 20px var(--disp);margin:4px 0 14px">${hits.length} result${hits.length === 1 ? '' : 's'} for “${esc(q)}”</h2>` +
    (hits.length ? hits.slice(0, 80).map(x => `<a class="hit" href="#${x.s.id}" data-sec="${'s-' + (x.k + 1) + '-' + slug(x.sec.h || 'overview')}"><b>${x.s.i} ${esc(x.s.t)}</b> › ${esc(x.sec.h || 'Overview')}<small>${mark(x.snip.replace(/\s+/g, ' '))}…</small></a>`).join('')
      : '<p style="color:var(--mut)">Nothing matched. Try a shorter word, e.g. “join”, “merge”, “index”.</p>') + '</div></div>';
}
let obs;
function watchToc(){
  if (obs) obs.disconnect(); const links = [...document.querySelectorAll('.toc a')]; if (!links.length || !window.IntersectionObserver) return;
  obs = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { links.forEach(a => a.classList.toggle('on', a.dataset.t === e.target.id)); } }); }, {rootMargin: '-80px 0px -65% 0px'});
  document.querySelectorAll('.sec').forEach(x => obs.observe(x));
}
function go(id){ const el = document.getElementById(id); if (el) { el.scrollIntoView({block: 'start'}); el.style.outline = '2px solid var(--accent)'; el.style.outlineOffset = '3px'; setTimeout(() => el.style.outline = '', 1600); } }
function route(){
  const id = decodeURIComponent(location.hash.slice(1)), q = document.getElementById('q').value.trim(), main = document.getElementById('main');
  document.body.classList.remove('menu');
  if (q && !route.fromHit) { main.innerHTML = renderSearch(q); renderRail(byId[id] ? id : null); return; }
  route.fromHit = false; const s = byId[id];
  main.innerHTML = s ? renderSheet(s) : renderHome();
  document.title = (s ? s.t + ' · ' : '') + 'Cheat Sheets · Saarthi 360';
  renderRail(s ? s.id : null); watchToc();
  if (route.sec) { const t = route.sec; route.sec = null; requestAnimationFrame(() => go(t)); } else window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('.toc a'); if (t) { e.preventDefault(); go(t.dataset.t); return; }
  const hit = e.target.closest('.hit');
  if (hit) { route.fromHit = true; route.sec = hit.dataset.sec; document.getElementById('q').value = ''; if (location.hash === hit.getAttribute('href')) { e.preventDefault(); route(); } }
  else if (e.target.closest('.ri,.tile,.pager a,.brand,.gbtn')) document.getElementById('q').value = '';
});
let tmr; document.getElementById('q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(route, 160); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus(); } if (e.key === 'Escape') { const q = document.getElementById('q'); if (q.value) { q.value = ''; route(); } } });
window.addEventListener('hashchange', route);
function setThemeLabel(){ const d = document.documentElement.classList.contains('sp-dark'); document.getElementById('themeBtn').innerHTML = (d ? '☀️' : '🌙') + ' <span class="lbl">' + (d ? 'Light' : 'Dark') + '</span>'; }
function toggleTheme(){ const d = document.documentElement.classList.toggle('sp-dark'); try{localStorage.setItem('saarthi_theme', d ? 'dark' : 'light')}catch(e){} setThemeLabel(); }
setThemeLabel(); route();
</script>
</body>
